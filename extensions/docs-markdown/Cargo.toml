[package]
name = "hara-docs-markdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Pure standards-conformant hara:markdown Component"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
comrak = { version = "=0.54.0", default-features = false }
wit-bindgen-rt = { version = "=0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "hara:markdown"

[package.metadata.component.dependencies]
