name: Guarded LiveSession borrow repair

on:
  push:
    branches: [instrumentation-live-code-vm-883]
    paths:
      - 'core/rust/src/live_session/instrumented_interpreter.rs'
      - '.github/workflows/instrumentation-live-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instrumentation-live-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrumentation-live-code-vm-883
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Split immutable context and hub handles from the mutable target borrow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/rust/src/live_session/instrumented_interpreter.rs')
          text = path.read_text()

          if '#[derive(Clone)]\nstruct InterpreterRuntimeContext {' not in text:
              old = 'struct InterpreterRuntimeContext {'
              if old not in text:
                  raise SystemExit('InterpreterRuntimeContext declaration not found')
              text = text.replace(old, '#[derive(Clone)]\n' + old, 1)

          text = text.replace(
              'let context = &self.context;',
              'let context = self.context.clone();',
          )
          text = text.replace(
              'let hub = self.hub.borrow();\n            self.target_mut()?\n                .continue_execution(&hub, &lease)',
              'let hub = self.hub.clone();\n            self.target_mut()?\n                .continue_execution(&hub.borrow(), &lease)',
          )
          path.write_text(text)
          PY

          rustfmt --edition 2021 core/rust/src/live_session/instrumented_interpreter.rs

      - name: Compile before publishing the repair
        run: cargo test --locked --manifest-path core/rust/Cargo.toml --lib --no-run

      - name: Commit only a compile-valid repair
        run: |
          if git diff --quiet; then
            echo "Borrow repair already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/src/live_session/instrumented_interpreter.rs
          git commit -m "Separate LiveSession context from mutable target borrows"
          git push origin HEAD:instrumentation-live-code-vm-883
