name: Apply fiber mutable field set parity fix

on:
  push:
    branches:
      - agent/fiber-mutable-field-set

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Hara specification fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry

      - name: Expose fixtures at the VM test include path
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Apply focused runtime and regression-test patch
        run: python .github/scripts/agent_fiber_mutable_field_set.py

      - name: Format Rust changes
        run: cargo fmt --manifest-path core/rust/Cargo.toml

      - name: Run focused fiber regressions
        run: cargo test --manifest-path core/rust/Cargo.toml --lib mutable_field_set_place -- --nocapture

      - name: Run complete fiber test module
        run: cargo test --manifest-path core/rust/Cargo.toml --lib fiber::tests -- --nocapture

      - name: Commit validated source changes and remove branch-only tooling
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -v '^core/rust/src/fiber.rs$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatted files:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/rust/src/fiber.rs
          git rm .github/workflows/agent-fiber-mutable-field-set.yml
          git rm .github/scripts/agent_fiber_mutable_field_set.py
          git commit -m "fix(rust): support mutable field places in fiber set!"
          git push origin HEAD:${GITHUB_REF_NAME}
