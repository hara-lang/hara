name: Apply fiber mutable field set parity fix

on:
  push:
    branches:
      - agent/fiber-mutable-field-set

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Hara specification fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry

      - name: Apply focused runtime and regression-test patch
        run: python .github/scripts/agent_fiber_mutable_field_set.py

      - name: Format Rust changes
        run: cargo fmt --manifest-path core/rust/Cargo.toml

      - name: Run focused fiber regressions
        run: cargo test --manifest-path core/rust/Cargo.toml --lib mutable_field_set_place -- --nocapture

      - name: Run complete fiber test module
        run: cargo test --manifest-path core/rust/Cargo.toml --lib fiber::tests -- --nocapture

      - name: Commit validated source changes and remove branch-only tooling
        shell: bash
        run: |
          rm .github/workflows/agent-fiber-mutable-field-set.yml
          rm .github/scripts/agent_fiber_mutable_field_set.py
          rm -rf hara-specs-registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rust): support mutable field places in fiber set!"
          git push origin HEAD:${GITHUB_REF_NAME}
