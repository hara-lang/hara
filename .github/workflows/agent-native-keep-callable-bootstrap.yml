name: Bootstrap native keep callable parity patch

on:
  push:
    branches:
      - agent/native-keep-callable-parity-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-keep-callable-parity-bootstrap
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply the callable parity correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "core/rust/src/core/value.rs",
              "    Keep(Rc<Function>, Value),",
              "    Keep(Value, Value),",
          )
          replace_once(
              "core/rust/src/core/value.rs",
              """                IteratorGenerator::Keep(function, source) => loop {
                    let Some(value) = iterator_try_next(source)? else {
                        close_iterator_source(source);
                        self.closed = true;
                        break Ok(None);
                    };
                    let mapped = call_function(function, vec![value])?;
                    if !matches!(mapped, Value::Nil) {
                        break Ok(Some(mapped));
                    }
                },""",
              """                IteratorGenerator::Keep(function, source) => loop {
                    let Some(value) = iterator_try_next(source)? else {
                        close_iterator_source(source);
                        self.closed = true;
                        break Ok(None);
                    };
                    let mapped = call_value(function.clone(), vec![value])?;
                    if !matches!(mapped, Value::Nil) {
                        break Ok(Some(mapped));
                    }
                },""",
          )
          replace_once(
              "core/rust/src/core/operation.rs",
              "fn iterator_keep(function: Rc<Function>, value: Value) -> Result<Value, String> {",
              "fn iterator_keep(function: Value, value: Value) -> Result<Value, String> {",
          )

          callable_helper = """pub(crate) fn is_callable_value(value: &Value) -> bool {
    matches!(
        value,
        Value::Function(_)
            | Value::StructType(_)
            | Value::MutableType(_)
            | Value::Struct(_)
            | Value::Mutable(_)
            | Value::Pointer(_)
            | Value::Keyword(_)
            | Value::Map(_)
            | Value::OrderedMap(_)
            | Value::SortedMap(_)
            | Value::Trie(_)
            | Value::PriorityMap(_)
            | Value::Set(_)
            | Value::OrderedSet(_)
            | Value::SortedSet(_)
    )
}

"""
          replace_once(
              "core/rust/src/core/form.rs",
              "pub(crate) fn call_value(callable: Value, arguments: Vec<Value>) -> Result<Value, String> {",
              callable_helper
              + "pub(crate) fn call_value(callable: Value, arguments: Vec<Value>) -> Result<Value, String> {",
          )
          replace_once(
              "core/rust/src/core/evaluator.rs",
              """                        \"iter-keep\" => match parameter {
                            Value::Function(function) => {
                                let result = iterator_keep(function, source.clone())?;
                                transform_like(&source, result)
                            }
                            _ => Err(\"keep expects a function\".into()),
                        },""",
              """                        \"iter-keep\" => {
                            if !is_callable_value(&parameter) {
                                Err(\"keep expects a callable value\".into())
                            } else {
                                let result = iterator_keep(parameter, source.clone())?;
                                transform_like(&source, result)
                            }
                        }""",
          )
          PY

      - name: Format and compile the Rust library
        run: |
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          cargo check --locked --manifest-path core/rust/Cargo.toml --lib

      - name: Commit the generated product patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/src/core/value.rs \
                  core/rust/src/core/operation.rs \
                  core/rust/src/core/form.rs \
                  core/rust/src/core/evaluator.rs
          git diff --cached --check
          git commit -m "Accept Hara callables in native keep"
          git push origin HEAD:agent/native-keep-callable-parity-bootstrap
