name: Work ABI one-time formatter

on:
  push:
    branches: ['agent/work-executor-store-abis']
    paths:
      - '.github/workflows/work-abi-format-once.yml'
      - 'core/rust/src/core/inventory.rs'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work-executor-store-abis

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format the Work protocol inventory
        run: rustfmt --edition 2021 core/rust/src/core/inventory.rs

      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/rust/src/core/inventory.rs
          git commit -m 'Format Work capability protocol inventory'
          git push origin HEAD:agent/work-executor-store-abis
