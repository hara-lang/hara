name: std.typed dependency boundary

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/lib/src/std/typed.hal'
      - 'core/lib/src/std/typed/**'
      - 'core/lib/test/std/typed/**'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/lib/src/tool/lint.hal'
      - 'core/lib/src/tool/lint/**'
      - 'core/spec/std/typed*'
      - 'core/spec/std/typed/**'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/standard-library.namespaces'
      - 'scripts/audit-std-typed-boundary.sh'
      - '.github/workflows/std-typed-boundary.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/std/typed.hal'
      - 'core/lib/src/std/typed/**'
      - 'core/lib/test/std/typed/**'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/lib/src/tool/lint.hal'
      - 'core/lib/src/tool/lint/**'
      - 'core/spec/std/typed*'
      - 'core/spec/std/typed/**'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/standard-library.namespaces'
      - 'scripts/audit-std-typed-boundary.sh'
      - '.github/workflows/std-typed-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-typed-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit std.typed dependencies
        run: bash scripts/audit-std-typed-boundary.sh
