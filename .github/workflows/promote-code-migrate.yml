name: Promote code.migrate hard cut

on:
  push:
    branches:
      - 'agent/524-code-migrate-substrate'
    paths:
      - 'scripts/runtime/promote_code_migrate.py'
      - '.github/workflows/promote-code-migrate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/runtime/promote_code_migrate.py'
      - '.github/workflows/promote-code-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-code-migrate-substrate
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/524-code-migrate-substrate

      - name: Prepare exact Foundation objects without a checkout
        run: |
          set -euo pipefail
          git init --bare .foundation.git
          git --git-dir=.foundation.git remote add origin \
            https://github.com/zcaudate-xyz/foundation-base.git
          git --git-dir=.foundation.git fetch --depth=1 origin \
            baa75aabd6a879753d7d5cb07271b1448271e7cb
          test "$(git --git-dir=.foundation.git rev-parse \
            'baa75aabd6a879753d7d5cb07271b1448271e7cb^{commit}')" = \
            baa75aabd6a879753d7d5cb07271b1448271e7cb
          test "$(git --git-dir=.foundation.git rev-parse \
            'baa75aabd6a879753d7d5cb07271b1448271e7cb^{tree}')" = \
            26d494f60c4970df56eba8ac40f92affeee4e159

      - name: Promote the canonical source layout and evidence
        env:
          FOUNDATION_GIT: ${{ github.workspace }}/.foundation.git
        run: |
          set -euo pipefail
          python -m py_compile scripts/runtime/promote_code_migrate.py
          python scripts/runtime/promote_code_migrate.py
          test ! -e scripts/runtime/promote_code_migrate.py
          test ! -e .github/workflows/promote-code-migrate.yml

      - name: Commit the product-only hard cut
        run: |
          set -euo pipefail
          rm -rf .foundation.git
          git add -A
          git reset HEAD -- .github/workflows
          git checkout HEAD -- .github/workflows
          rm -f .github/workflows/foundation-migrate.yml
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          ).split(b"\0")
          for raw in changed:
              if not raw:
                  continue
              path = Path(raw.decode())
              if not path.is_file():
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              path.write_text(source.rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m 'refactor(code.migrate): canonicalize Foundation porting'
          git push origin HEAD:agent/524-code-migrate-substrate
