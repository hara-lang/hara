name: std.typed catalog registry read-back

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/lib/src/std/typed/catalog/document.hal'
      - '.github/workflows/std-typed-catalog-readback.yml'

permissions:
  contents: write

concurrency:
  group: std-typed-catalog-portable-string-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/903-std-typed-registry-readback
          fetch-depth: 0

      - name: Replace nil-based string search assumptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/lib/src/std/typed/catalog/document.hal")
          source = path.read_text()

          old_hex = '''       (let [character (str (str/char-at value index))]
         (if (nil? (str/index-of +hex-digits+ character))
           false
           (recur (inc index))))))))
'''
          new_hex = '''       (let [character (str (str/char-at value index))]
         (if (str/includes? +hex-digits+ character)
           (recur (inc index))
           false))))))
'''
          old_path = '''(defn- source-path?
  [value]
  (and
   (string? value)
   (not (str/blank? value))
   (not (str/starts-with? value "/"))
   (nil? (str/index-of value "\\\\"))
   (not (= value ".."))
   (not (str/starts-with? value "../"))
   (nil? (str/index-of value "/../"))))
'''
          new_path = '''(defn- source-path?
  [value]
  (and
   (string? value)
   (not (str/blank? value))
   (not (str/starts-with? value "/"))
   (not (str/includes? value "\\\\"))
   (not (= value ".."))
   (not (str/starts-with? value "../"))
   (not (str/includes? value "/../"))))
'''
          old_owner = '''(defn- owner-name?
  [value]
  (if (not (string? value))
    false
    (let [separator (str/index-of value "/")
          length (str/length value)]
      (and
       separator
       (> separator 0)
       (< separator (dec length))
       (nil?
        (str/index-of
         (str/slice value (inc separator))
         "/"))
       (not (str/starts-with? value ":"))
       (nil? (str/index-of value " "))))))
'''
          new_owner = '''(defn- owner-name?
  [value]
  (if (not (string? value))
    false
    (let [parts (str/split value "/")]
      (and
       (= 2 (count parts))
       (not (str/blank? (first parts)))
       (not (str/blank? (second parts)))
       (not (str/starts-with? value ":"))
       (not (str/includes? value " "))))))
'''

          for old, new, label in [
              (old_hex, new_hex, "lowercase hex predicate"),
              (old_path, new_path, "source path predicate"),
              (old_owner, new_owner, "owner/name predicate"),
          ]:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Validate and publish the focused edit
        shell: bash
        run: |
          set -euo pipefail
          grep -q '(str/includes? +hex-digits+ character)' core/lib/src/std/typed/catalog/document.hal
          ! grep -q 'nil? (str/index-of' core/lib/src/std/typed/catalog/document.hal
          git diff --check -- core/lib/src/std/typed/catalog/document.hal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core/lib/src/std/typed/catalog/document.hal
          git commit -m "Use portable string predicates in catalog read-back"
          git push origin HEAD:agent/903-std-typed-registry-readback
