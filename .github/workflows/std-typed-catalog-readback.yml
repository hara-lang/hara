name: std.typed catalog registry read-back

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/lib/src/std/typed.hal'
      - 'core/lib/src/std/typed/catalog/**'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/standard-library.namespaces'
      - 'core/rust/tests/std_typed_catalog_document.rs'
      - 'core/java/src/test/java/hara/truffle/StdTypedCatalogDocumentTest.java'
      - 'core/spec/std/typed-schema-registry-readback.md'
      - 'scripts/audit-std-typed-boundary.sh'
      - '.github/workflows/std-typed-catalog-readback.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/std/typed.hal'
      - 'core/lib/src/std/typed/catalog/**'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/standard-library.namespaces'
      - 'core/rust/tests/std_typed_catalog_document.rs'
      - 'core/java/src/test/java/hara/truffle/StdTypedCatalogDocumentTest.java'
      - 'core/spec/std/typed-schema-registry-readback.md'
      - 'scripts/audit-std-typed-boundary.sh'
      - '.github/workflows/std-typed-catalog-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-typed-catalog-readback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/audit-std-typed-boundary.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Expose the registry at the canonical sibling path
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: dtolnay/rust-toolchain@stable
      - name: Read back the exact published catalog through native Hara
        run: cargo test --manifest-path core/rust/Cargo.toml --test std_typed_catalog_document -- --nocapture

  hal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Build the Hara CLI
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml
      - name: Verify the exact published bytes through source-authoritative Hara
        run: |
          mkdir -p core/target
          python - <<'PY' > core/target/std-typed-catalog-readback-probe.hal
          import json
          from pathlib import Path

          fixture = Path(
              "hara-specs-registry/01-lang/011-typed-catalog/"
              "draft/conformance/catalog-v1.json"
          ).read_text()
          print("(ns std.typed.catalog.readback-ci)")
          print(f"(let [verified (std.typed/catalog-document-verify-json {json.dumps(fixture)})")
          print("      report (:verification verified)]")
          print("  (if (= [:verified 5 5 true]")
          print("         [(:status report)")
          print("          (:catalog/entry-count report)")
          print("          (:catalog/component-count report)")
          print("          (:catalog/latest-tooling-only? report)])")
          print("    (pr-str report)")
          print("    (throw (ex :state {:verification report}")
          print('               :ex/message "std.typed catalog read-back failed"))))')
          PY
          cat \
            core/lib/src/std/typed/registry.hal \
            core/lib/src/std/typed/schema.hal \
            core/lib/src/std/typed/catalog.hal \
            core/lib/src/std/typed/catalog/document.hal \
            core/lib/src/std/typed/infer.hal \
            core/lib/src/std/typed/explain.hal \
            core/lib/src/std/typed.hal \
            core/target/std-typed-catalog-readback-probe.hal \
            | core/hara --offline stdin

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Read back the exact published catalog through Truffle
        run: mvn -B -Ptruffle -Dtest=hara.truffle.StdTypedCatalogDocumentTest test --file core/java/pom.xml
