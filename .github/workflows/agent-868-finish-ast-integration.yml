name: Finish schema catalog AST integration

on:
  push:
    branches:
      - agent/868-schema-catalog-identity
    paths:
      - .github/workflows/agent-868-finish-ast-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/868-schema-catalog-identity
          fetch-depth: 0
      - name: Integrate catalog AST module and remove one-shot workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, before: str, after: str, expected: int = 1):
              text = path.read_text()
              count = text.count(before)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {before!r}")
              path.write_text(text.replace(before, after))

          standard = Path("core/rust/standard-library.namespaces")
          lines = standard.read_text().splitlines()
          if "std.typed.catalog.ast" not in lines:
              index = lines.index("std.typed.catalog") + 1
              lines.insert(index, "std.typed.catalog.ast")
              standard.write_text("\n".join(lines) + "\n")

          workflow = Path(".github/workflows/std-typed-schema.yml")
          replace_exact(
              workflow,
              "            core/lib/src/std/typed/catalog/codec.hal \\\n            core/lib/src/std/typed/catalog/base.hal \\\n",
              "            core/lib/src/std/typed/catalog/codec.hal \\\n            core/lib/src/std/typed/catalog/ast.hal \\\n            core/lib/src/std/typed/catalog/base.hal \\\n")

          audit = Path("scripts/audit-std-typed-boundary.sh")
          text = audit.read_text()
          text = text.replace(
              "  'core/lib/src/std/typed/catalog.hal'\n  'core/lib/src/std/typed/catalog/base.hal'\n",
              "  'core/lib/src/std/typed/catalog.hal'\n  'core/lib/src/std/typed/catalog/ast.hal'\n  'core/lib/src/std/typed/catalog/base.hal'\n")
          text = text.replace(
              "  std.typed.catalog\n  std.typed.catalog.base\n",
              "  std.typed.catalog\n  std.typed.catalog.ast\n  std.typed.catalog.base\n")
          text = text.replace(
              "  std.typed.catalog.codec\n  std.typed.catalog.base\n",
              "  std.typed.catalog.codec\n  std.typed.catalog.ast\n  std.typed.catalog.base\n")
          text = text.replace(
              "codec_line=$(inventory_line core/rust/bootstrap.namespaces std.typed.catalog.codec)\nbase_line=",
              "codec_line=$(inventory_line core/rust/bootstrap.namespaces std.typed.catalog.codec)\nast_line=$(inventory_line core/rust/bootstrap.namespaces std.typed.catalog.ast)\nbase_line=")
          text = text.replace(
              "if [[ -n \"$codec_line\" && -n \"$base_line\" && \"$codec_line\" -ge \"$base_line\" ]]; then\n  echo 'std.typed.catalog.codec must bootstrap before std.typed.catalog.base.' >&2\n  failed=1\nfi\n",
              "if [[ -n \"$codec_line\" && -n \"$ast_line\" && \"$codec_line\" -ge \"$ast_line\" ]]; then\n  echo 'std.typed.catalog.codec must bootstrap before std.typed.catalog.ast.' >&2\n  failed=1\nfi\nif [[ -n \"$ast_line\" && -n \"$base_line\" && \"$ast_line\" -ge \"$base_line\" ]]; then\n  echo 'std.typed.catalog.ast must bootstrap before std.typed.catalog.base.' >&2\n  failed=1\nfi\n")
          if "std.typed.catalog.ast" not in text:
              raise SystemExit("audit did not gain catalog AST coverage")
          audit.write_text(text)

          for stale in [
              Path(".github/workflows/agent-868-route-catalog-ast.yml"),
              Path(".github/workflows/agent-868-finish-ast-integration.yml"),
          ]:
              if stale.exists():
                  stale.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            core/rust/standard-library.namespaces \
            scripts/audit-std-typed-boundary.sh \
            .github/workflows/std-typed-schema.yml \
            .github/workflows/agent-868-route-catalog-ast.yml \
            .github/workflows/agent-868-finish-ast-integration.yml
          git diff --cached --check
          git commit -m "Integrate normalized schema catalog AST module"
          git push origin HEAD:agent/868-schema-catalog-identity
