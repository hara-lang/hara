name: Agent work source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-work-source-snapshot.yml'
      - 'core/java/src/main/java/hara/truffle/HaraWorkHost.java'
      - 'core/java/src/main/java/hara/truffle/WorkProtocolLibraryProvider.java'
      - 'core/java/src/test/java/hara/truffle/HaraWorkScopeTest.java'
      - 'core/rust/src/work.rs'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: agent-work-source-snapshot
          path: |
            core/java/src/main/java/hara/truffle/HaraWorkHost.java
            core/java/src/main/java/hara/truffle/WorkProtocolLibraryProvider.java
            core/java/src/test/java/hara/truffle/HaraWorkScopeTest.java
            core/rust/src/work.rs
