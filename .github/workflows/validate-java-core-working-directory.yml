name: Validate Java core working directory

on:
  push:
    branches:
      - agent/fix-java-core-working-directory

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Build and test from core
        working-directory: core
        run: mvn -B -Ptruffle package --file java/pom.xml
