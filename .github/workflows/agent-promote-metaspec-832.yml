# Temporary validation harness for #832; remove before review.
name: Stage metaspec schema promotion candidate

on:
  push:
    branches:
      - agent/promote-metaspec-schema-extensions

permissions:
  contents: write

concurrency:
  group: stage-metaspec-832-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-metaspec-schema-extensions
          fetch-depth: 0
      - name: Check out the CLI specification registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Apply native schema parity promotion
        run: python .github/agent-patches/832-promote-metaspec.py
      - name: Run focused Rust schema parity
        run: cargo test --manifest-path core/rust/Cargo.toml --test std_typed_schema
      - name: Run focused Truffle schema parity
        run: mvn -B -Ptruffle -Dtest=hara.truffle.StdTypedSchemaTest test --file core/java/pom.xml
      - name: Commit validated native candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            core/rust/src/kernel/schema.rs \
            core/rust/src/core/protocol.rs \
            core/rust/tests/std_typed_schema.rs \
            core/java/src/main/java/hara/truffle/HalcSchema.java \
            core/java/src/main/java/hara/truffle/HaraContext.java \
            core/java/src/test/java/hara/truffle/StdTypedSchemaTest.java
          git diff --cached --quiet && exit 0
          git commit -m "Add native parity for std.typed properties"
          git push origin HEAD:agent/promote-metaspec-schema-extensions
