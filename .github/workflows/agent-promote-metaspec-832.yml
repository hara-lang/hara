# Temporary validation harness for #832; remove before review.
name: Stage metaspec schema promotion candidate

on:
  push:
    branches:
      - agent/promote-metaspec-schema-extensions
    paths:
      - '.github/agent-patches/832-promote-metaspec.py'
      - '.github/agent-patches/832-native-artifact.py'
      - '.github/agent-patches/832-java-hbc.py'
      - '.github/agent-patches/832-finalize.py'
      - '.github/workflows/agent-promote-metaspec-832.yml'

permissions:
  contents: write

concurrency:
  group: stage-metaspec-832-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-metaspec-schema-extensions
          fetch-depth: 0
      - name: Check out the CLI specification registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Mirror registry at Rust include path
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Apply native schema parity promotion
        run: |
          python .github/agent-patches/832-promote-metaspec.py
          python .github/agent-patches/832-native-artifact.py
          python .github/agent-patches/832-java-hbc.py
          python .github/agent-patches/832-finalize.py
      - name: Run focused Rust schema parity
        run: RUSTFLAGS=-Awarnings cargo test --manifest-path core/rust/Cargo.toml --test std_typed_schema
      - name: Run focused Rust HBC parity
        run: RUSTFLAGS=-Awarnings cargo test --manifest-path core/rust/Cargo.toml --lib programs_round_trip_and_execute
      - name: Run focused Truffle schema parity
        run: mvn -B -Ptruffle -Dtest=hara.truffle.StdTypedSchemaTest test --file core/java/pom.xml
      - name: Run focused Truffle HBC parity
        run: mvn -B -Ptruffle -Dtest=hara.truffle.bytecode.HbcCodecTest#alphaTypedProgramsRoundTripCanonically test --file core/java/pom.xml
      - name: Reject malformed generated diffs
        run: git diff --check
      - name: Commit validated native implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            core/rust/src/kernel/schema.rs \
            core/rust/src/core/protocol.rs \
            core/rust/src/vm/artifact.rs \
            core/rust/src/vm/artifact/tests.rs \
            core/rust/tests/std_typed_schema.rs \
            core/java/src/main/java/hara/truffle/HalcSchema.java \
            core/java/src/main/java/hara/truffle/HaraContext.java \
            core/java/src/main/java/hara/truffle/bytecode/HbcCodec.java \
            core/java/src/test/java/hara/truffle/StdTypedSchemaTest.java \
            core/java/src/test/java/hara/truffle/bytecode/HbcCodecTest.java
          git diff --cached --quiet && exit 0
          git commit -m "feat(schema): complete native set and properties parity"
          git push origin HEAD:agent/promote-metaspec-schema-extensions
