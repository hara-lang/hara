name: Promote metaspec schema extensions

on:
  push:
    branches:
      - agent/promote-metaspec-schema-extensions

permissions:
  contents: write

concurrency:
  group: promote-metaspec-832-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-metaspec-schema-extensions
          fetch-depth: 0

      - name: Apply product patch
        run: python .github/agent-patches/832-promote-metaspec.py

      - name: Reject remaining generic metaspec schema engines
        run: |
          ! grep -R "defmethod std.typed.schema/normalize :tool.metaspec/\(map\|set\|items\|refine\)" core/lib/src/tool/metaspec/schema.hal
          ! grep -R "defmethod std.typed.schema/validate-normal :tool.metaspec/\(map\|set\|items\|refine\)" core/lib/src/tool/metaspec/schema.hal

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native Hara
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml

      - name: Evaluate written typed property namespace
        run: core/hara --offline run core/lib/src/std/typed/properties.hal

      - name: Run portable typed property facts
        run: |
          scripts/runtime/run-lib-tests \
            core/lib/test/std/typed/schema_test.hal \
            core/lib/test/std/typed/properties_test.hal \
            core/lib/test/std/typed/explain_test.hal

      - name: Run metaspec adapter facts
        run: |
          scripts/runtime/run-lib-tests \
            core/lib/test/tool/metaspec/schema_test.hal \
            core/lib/test/tool/metaspec/conforms_test.hal \
            core/lib/test/tool/metaspec/verify_test.hal \
            core/lib/test/tool/metaspec/lint_test.hal \
            core/lib/test/tool/metaspec/logic_test.hal \
            core/lib/test/tool/metaspec/model_test.hal

      - name: Run typed boundary and native parity
        run: |
          bash scripts/audit-std-typed-boundary.sh
          cargo test --manifest-path core/rust/Cargo.toml --test std_typed_schema
          mvn -B -Ptruffle -Dtest=hara.truffle.StdTypedSchemaTest test --file core/java/pom.xml

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            core/lib/src/std/typed.hal \
            core/lib/src/std/typed/properties.hal \
            core/lib/src/tool/metaspec/schema.hal \
            core/lib/test/std/typed/properties_test.hal \
            core/lib/test/tool/metaspec/schema_test.hal \
            core/rust/standard-library.namespaces \
            .github/workflows/std-typed-schema.yml
          git diff --cached --quiet && exit 0
          git commit -m "Promote metaspec schema properties into std.typed"
          git push origin HEAD:agent/promote-metaspec-schema-extensions
