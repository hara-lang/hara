name: Stage metaspec schema promotion candidate

on:
  push:
    branches:
      - agent/promote-metaspec-schema-extensions

permissions:
  contents: write

concurrency:
  group: stage-metaspec-832-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-metaspec-schema-extensions
          fetch-depth: 0
      - name: Apply canonical property promotion
        run: python .github/agent-patches/832-promote-metaspec.py
      - name: Reject generic metaspec schema engines
        run: |
          ! grep -E "defmethod std\.typed\.schema/(normalize|validate-normal) :tool\.metaspec/(map|set|items|refine)" core/lib/src/tool/metaspec/schema.hal
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            core/lib/src/std/typed/schema.hal \
            core/lib/src/std/typed.hal \
            core/lib/src/std/typed/properties.hal \
            core/lib/src/tool/metaspec/schema.hal \
            core/lib/test/std/typed/properties_test.hal \
            core/lib/test/tool/metaspec/schema_test.hal \
            .github/workflows/std-typed-schema.yml
          git diff --cached --quiet && exit 0
          git commit -m "Stage std.typed property promotion candidate"
          git push origin HEAD:agent/promote-metaspec-schema-extensions
