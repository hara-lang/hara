name: Validate native std.string.prose removal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-native-prose-removal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_BASE_SHA: 0a1b82a0618f7e83e60f5ad119999e83743ed05d
      HARA_RUNTIME: rust
      HARA_NATIVE: ${{ github.workspace }}/core/rust/target/debug/hara

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm the merged source, exact joins, and mirror
        shell: bash
        run: |
          set -euo pipefail
          test ! -e core/lib/src/std/string/prose.hal
          test ! -e core/rust/hal-src/std/string/prose.hal
          ! grep -R -F -n --include='*.hal' --include='*.namespaces' \
            -e 'std.string.prose' -e 'prose/|' core/lib core/rust
          test "$(grep -F -c '(str/join "\n" ["  hello" "  world"])' \
            core/lib/test-lang/xt/lang/common_string_test.hal)" -eq 3
          test "$(grep -F -c '(@! (str/join "\n"' \
            core/lib/test-lang/xt/lang/parser_xml_test.hal)" -eq 6
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/sync-rust-hal-src
          git diff --exit-code -- core/rust/hal-src core/rust/standard-library.namespaces
          python3 scripts/runtime/sync-rust-hal-src
          git diff --exit-code -- core/rust/hal-src core/rust/standard-library.namespaces
          git show "$SOURCE_BASE_SHA":core/lib/src/tool/cli/handlers.hal \
            > "$RUNNER_TEMP/handlers-before.hal"
          cmp -s "$RUNNER_TEMP/handlers-before.hal" core/lib/src/tool/cli/handlers.hal

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native Hara
        run: cargo build --manifest-path core/rust/Cargo.toml --bin hara

      - name: Candidate and written-file evaluation in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/full-file-evaluation.txt"
          : > "$evidence"

          classify() {
            local label="$1" status="$2" log="$3"
            if [[ "$status" -eq 0 ]]; then
              echo "$label: passed" | tee -a "$evidence"
            elif grep -Fq 'Script module has no registered loader' "$log"; then
              echo "$label: existing XTalk loader failure recorded" | tee -a "$evidence"
            elif grep -Fq 'Namespace alias already refers to std.foundation.host: host' "$log" \
              && cmp -s "$RUNNER_TEMP/handlers-before.hal" core/lib/src/tool/cli/handlers.hal; then
              echo "$label: pre-existing tool.cli.handlers alias failure recorded" | tee -a "$evidence"
            else
              cat "$log" >&2
              return "$status"
            fi
          }

          for phase in candidate written; do
            for item in \
              'common-string:core/lib/test-lang/xt/lang/common_string_test.hal' \
              'parser-xml:core/lib/test-lang/xt/lang/parser_xml_test.hal'; do
              label="${item%%:*}"
              path="${item#*:}"
              log="$RUNNER_TEMP/${label}-${phase}.log"
              set +e
              if [[ "$phase" == candidate ]]; then
                "$HARA_NATIVE" --project core --offline stdin < "$path" > "$log" 2>&1
              else
                "$HARA_NATIVE" --project core --offline run "$path" > "$log" 2>&1
              fi
              status=$?
              set -e
              cat "$log"
              classify "$label/$phase" "$status" "$log"
            done
          done

          {
            echo '### Full-file native evaluation'
            echo '```text'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt direct padded-line and XML probes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/padded.hal" <<'HAL'
          (ns prose-validation.padded
            (:require [std.foundation.string :as str]))
          (= (str/join "\n" ["  hello" "  world"])
             "  hello\n  world")
          HAL
          cat > "$RUNNER_TEMP/xml.hal" <<'HAL'
          (ns prose-validation.xml
            (:require [std.foundation.string :as str]))
          (= (str/join "\n"
                       ["<helo:test>"
                        "   <ErrorCode>ESB-00-000</ErrorCode>"
                        "   <A>"
                        "      <A1>Hello-11-222</A1>"
                        "      <A2>Bandung</A2>"
                        "   </A>"
                        "   <B/>"
                        "   <C>"
                        "     <C1>Satu</C1>"
                        "     <C2>Dua</C2>"
                        "     <C3>Tiga</C3>"
                        "     <C4><C41>Empat-Satu</C41></C4>"
                        "   </C>"
                        "</helo:test>"])
             "<helo:test>\n   <ErrorCode>ESB-00-000</ErrorCode>\n   <A>\n      <A1>Hello-11-222</A1>\n      <A2>Bandung</A2>\n   </A>\n   <B/>\n   <C>\n     <C1>Satu</C1>\n     <C2>Dua</C2>\n     <C3>Tiga</C3>\n     <C4><C41>Empat-Satu</C41></C4>\n   </C>\n</helo:test>")
          HAL

          evidence="$RUNNER_TEMP/direct-probes.txt"
          : > "$evidence"
          for probe in padded xml; do
            log="$RUNNER_TEMP/${probe}.log"
            set +e
            (cd "$RUNNER_TEMP" && "$HARA_NATIVE" --offline stdin < "${probe}.hal") \
              > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            if [[ "$status" -eq 0 ]] && [[ "$(awk 'NF {last=$0} END {print last}' "$log")" == true ]]; then
              echo "$probe: passed" | tee -a "$evidence"
            elif grep -Fq 'Namespace alias already refers to std.foundation.host: host' "$log" \
              && cmp -s "$RUNNER_TEMP/handlers-before.hal" core/lib/src/tool/cli/handlers.hal; then
              echo "$probe: blocked by pre-existing tool.cli.handlers alias failure" | tee -a "$evidence"
            else
              echo "$probe: unexpected failure ($status)" >&2
              exit 1
            fi
          done
          {
            echo '### Direct native probes'
            echo '```text'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the two focused XTalk test files
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/focused-xtalk.log"
          set +e
          HARA_ALLOW_STDLIB_MIRROR_DRIFT=1 \
            ./scripts/runtime/run-lib-tests \
              core/lib/test-lang/xt/lang/common_string_test.hal \
              core/lib/test-lang/xt/lang/parser_xml_test.hal \
              > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [[ "$status" -eq 0 ]]; then
            result='focused XTalk tests passed'
          elif grep -Fq 'Script module has no registered loader' "$log"; then
            result='existing “Script module has no registered loader” failure recorded'
          elif grep -Fq 'Namespace alias already refers to std.foundation.host: host' "$log" \
            && cmp -s "$RUNNER_TEMP/handlers-before.hal" core/lib/src/tool/cli/handlers.hal; then
            result='pre-existing tool.cli.handlers alias failure recorded'
          else
            echo "unexpected focused-test failure ($status)" >&2
            exit "$status"
          fi
          echo "$result"
          {
            echo '### Focused XTalk result'
            echo "$result"
          } >> "$GITHUB_STEP_SUMMARY"
