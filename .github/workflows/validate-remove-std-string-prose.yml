name: Validate removal of std.string.prose

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-remove-std-string-prose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BASE_SHA: 0a1b82a0618f7e83e60f5ad119999e83743ed05d
      IMPLEMENTATION_SHA: 4cd0c2dab6fe9155e545bd0e4d42e11d16ca3050
      HARA_RUNTIME: rust
      HARA_NATIVE: ${{ github.workspace }}/core/rust/target/debug/hara

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the exact five-file transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ["SOURCE_BASE_SHA"]
          implementation = os.environ["IMPLEMENTATION_SHA"]
          literal = re.compile(r'"(?:\\.|[^"\\])*"')

          def show(commit: str, path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{commit}:{path}"], text=True
              )

          def matching_paren(source: str, start: int) -> int:
              depth = 0
              in_string = False
              escaped = False
              for index in range(start, len(source)):
                  char = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          return index
              raise RuntimeError("unclosed prose form")

          def replace_prose(source: str) -> tuple[str, int]:
              marker = "(prose/|"
              cursor = 0
              output: list[str] = []
              count = 0
              while True:
                  start = source.find(marker, cursor)
                  if start < 0:
                      output.append(source[cursor:])
                      break
                  end = matching_paren(source, start)
                  body = source[start + len(marker):end]
                  payload = body.strip()
                  if "\n" not in payload:
                      replacement = f'(str/join "\\n" [{payload}])'
                  else:
                      lines = [line for line in body.splitlines() if line.strip()]
                      indent = re.match(r"[ \t]*", lines[0]).group(0)
                      arguments = [line.strip() for line in lines]
                      rendered = ['(str/join "\\n"', f"{indent}[{arguments[0]}"]
                      rendered.extend(f"{indent} {value}" for value in arguments[1:])
                      rendered[-1] += "])"
                      replacement = "\n".join(rendered)
                  if literal.findall(body) != literal.findall(replacement)[1:]:
                      raise RuntimeError("replacement changed a string argument")
                  output.extend((source[cursor:start], replacement))
                  cursor = end + 1
                  count += 1
              return "".join(output), count

          specs = [
              (
                  "core/lib/test-lang/xt/lang/common_string_test.hal",
                  "  (:require [lang.core :as l]\n"
                  "            [std.string.prose :as prose]))",
                  "  (:require [lang.core :as l]))",
                  3,
              ),
              (
                  "core/lib/test-lang/xt/lang/parser_xml_test.hal",
                  "  (:require [lang.core :as l]\n"
                  "            [std.string.prose :as prose])\n"
                  "  (:use code.test))",
                  "  (:require [lang.core :as l])\n"
                  "  (:use code.test))",
                  6,
              ),
          ]

          for path, old_require, new_require, expected_count in specs:
              original = show(base, path)
              merged = show(implementation, path)
              assert original.count(old_require) == 1
              expected, count = replace_prose(
                  original.replace(old_require, new_require, 1)
              )
              assert count == expected_count
              assert merged == expected
              assert original.count("@!") == merged.count("@!")
              assert Path(path).read_text() == merged
              print(f"{path}: exact ({count} joins; @! preserved)")

          base_inventory = show(
              base, "core/rust/standard-library.namespaces"
          ).splitlines()
          merged_inventory = show(
              implementation, "core/rust/standard-library.namespaces"
          ).splitlines()
          assert base_inventory.count("std.string.prose") == 1
          assert merged_inventory == [
              value for value in base_inventory if value != "std.string.prose"
          ]

          for path in (
              "core/lib/src/std/string/prose.hal",
              "core/rust/hal-src/std/string/prose.hal",
          ):
              result = subprocess.run(
                  ["git", "cat-file", "-e", f"{implementation}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              assert result.returncode != 0, f"{path} still exists"

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, implementation], text=True
          ).splitlines()
          assert changed == sorted([
              "core/lib/src/std/string/prose.hal",
              "core/lib/test-lang/xt/lang/common_string_test.hal",
              "core/lib/test-lang/xt/lang/parser_xml_test.hal",
              "core/rust/hal-src/std/string/prose.hal",
              "core/rust/standard-library.namespaces",
          ])

          for root in (Path("core/lib"), Path("core/rust")):
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".hal", ".namespaces"}:
                      continue
                  text = path.read_text(errors="replace")
                  assert "std.string.prose" not in text, path
                  assert "prose/|" not in text, path

          assert "\n".join(["  hello", "  world"]) == "  hello\n  world"
          print("inventory, deletions, references, and host joins: exact")
          PY
          git diff --check "$SOURCE_BASE_SHA" "$IMPLEMENTATION_SHA"

      - name: Verify mirror generation is clean and idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/sync-rust-hal-src
          git diff --exit-code -- core/rust/hal-src core/rust/standard-library.namespaces
          python3 scripts/runtime/sync-rust-hal-src
          git diff --exit-code -- core/rust/hal-src core/rust/standard-library.namespaces

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the native Hara runtime
        run: cargo build --manifest-path core/rust/Cargo.toml --bin hara

      - name: Candidate and written-file evaluation in fresh native processes
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-evaluation.txt"
          : > "$evidence"

          classify() {
            local label="$1" status="$2" log="$3"
            if [[ "$status" -eq 0 ]]; then
              echo "$label: passed" | tee -a "$evidence"
            elif grep -Fq 'Script module has no registered loader' "$log"; then
              echo "$label: existing XTalk loader failure recorded" | tee -a "$evidence"
            else
              cat "$log" >&2
              echo "$label: unexpected failure ($status)" >&2
              return "$status"
            fi
          }

          evaluate() {
            local phase="$1" label="$2" path="$3"
            local log="$RUNNER_TEMP/${label}-${phase}.log" status
            set +e
            if [[ "$phase" == candidate ]]; then
              ./core/hara --project core --offline stdin < "$path" > "$log" 2>&1
            else
              ./core/hara --project core --offline run "$path" > "$log" 2>&1
            fi
            status=$?
            set -e
            cat "$log"
            classify "$label/$phase" "$status" "$log"
          }

          for phase in candidate written; do
            evaluate "$phase" common-string core/lib/test-lang/xt/lang/common_string_test.hal
            evaluate "$phase" parser-xml core/lib/test-lang/xt/lang/parser_xml_test.hal
          done

          {
            echo '### Native Hara evaluation'
            echo '```text'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe padded lines and multiline XML through Hara
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/padded.hal" <<'HAL'
          (= (str/join "\n" ["  hello" "  world"])
             "  hello\n  world")
          HAL
          cat > "$RUNNER_TEMP/xml.hal" <<'HAL'
          (= (str/join "\n"
                       ["<helo:test>"
                        "   <ErrorCode>ESB-00-000</ErrorCode>"
                        "   <A>"
                        "      <A1>Hello-11-222</A1>"
                        "      <A2>Bandung</A2>"
                        "   </A>"
                        "   <B/>"
                        "   <C>"
                        "     <C1>Satu</C1>"
                        "     <C2>Dua</C2>"
                        "     <C3>Tiga</C3>"
                        "     <C4><C41>Empat-Satu</C41></C4>"
                        "   </C>"
                        "</helo:test>"])
             "<helo:test>\n   <ErrorCode>ESB-00-000</ErrorCode>\n   <A>\n      <A1>Hello-11-222</A1>\n      <A2>Bandung</A2>\n   </A>\n   <B/>\n   <C>\n     <C1>Satu</C1>\n     <C2>Dua</C2>\n     <C3>Tiga</C3>\n     <C4><C41>Empat-Satu</C41></C4>\n   </C>\n</helo:test>")
          HAL

          for probe in padded xml; do
            log="$RUNNER_TEMP/${probe}.log"
            ./core/hara --project core --offline stdin < "$RUNNER_TEMP/${probe}.hal" | tee "$log"
            python3 - "$log" <<'PY'
          import sys
          from pathlib import Path
          lines = [line.strip() for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          assert lines and lines[-1] == "true", lines
          PY
          done

      - name: Run the two focused XTalk tests
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/focused-xtalk.log"
          set +e
          HARA_ALLOW_STDLIB_MIRROR_DRIFT=1 \
            ./scripts/runtime/run-lib-tests \
              core/lib/test-lang/xt/lang/common_string_test.hal \
              core/lib/test-lang/xt/lang/parser_xml_test.hal \
              > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [[ "$status" -eq 0 ]]; then
            result='focused XTalk tests passed'
          elif grep -Fq 'Script module has no registered loader' "$log"; then
            result='existing “Script module has no registered loader” failure recorded'
          else
            echo "unexpected focused-test failure ($status)" >&2
            exit "$status"
          fi
          echo "$result"
          {
            echo '### Focused XTalk result'
            echo "$result"
          } >> "$GITHUB_STEP_SUMMARY"
