name: Refresh Foundation script target inventory

on:
  push:
    branches:
      - agent/524-code-migrate-substrate
    paths:
      - '.github/workflows/refresh-foundation-script-inventory.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-foundation-script-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/524-code-migrate-substrate
          fetch-depth: 0

      - name: Fetch the exact Foundation script reference into a bare repository
        run: |
          set -euo pipefail
          git init --bare .foundation-script.git
          git --git-dir=.foundation-script.git remote add origin \
            https://github.com/zcaudate-xyz/foundation-base.git
          git --git-dir=.foundation-script.git fetch --depth=1 origin \
            baa75aabd6a879753d7d5cb07271b1448271e7cb
          test "$(git --git-dir=.foundation-script.git rev-parse \
            'baa75aabd6a879753d7d5cb07271b1448271e7cb^{commit}')" = \
            baa75aabd6a879753d7d5cb07271b1448271e7cb

      - name: Pin the current Hara target and regenerate exact target blobs
        run: |
          set -euo pipefail
          target_commit="$(git rev-parse HEAD)"
          python3 - "$target_commit" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path('core/spec/foundation-script-policy.json')
          policy = json.loads(path.read_text(encoding='utf-8'))
          policy['target']['base_commit'] = sys.argv[1]
          path.write_text(
              json.dumps(policy, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python3 scripts/runtime/foundation_script_inventory.py \
            --reference .foundation-script.git \
            --target-root . \
            --policy core/spec/foundation-script-policy.json \
            --output core/spec/foundation-script-inventory.json \
            --write
          python3 scripts/runtime/foundation_script_inventory.py \
            --reference .foundation-script.git \
            --target-root . \
            --policy core/spec/foundation-script-policy.json \
            --output core/spec/foundation-script-inventory.json \
            --check
          python3 scripts/runtime/foundation_target_snapshot_test.py
          python3 scripts/runtime/foundation_target_snapshot.py
          git diff --check -- \
            core/spec/foundation-script-policy.json \
            core/spec/foundation-script-inventory.json

      - name: Commit reviewed target evidence only
        run: |
          set -euo pipefail
          rm -rf .foundation-script.git
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            core/spec/foundation-script-policy.json \
            core/spec/foundation-script-inventory.json
          git diff --cached --check
          git commit -m 'docs(code.migrate): refresh retained Foundation target evidence'
          git fetch origin agent/524-code-migrate-substrate
          git rebase origin/agent/524-code-migrate-substrate
          git push origin HEAD:agent/524-code-migrate-substrate
