name: Synchronize Rust HAL inventory

on:
  push:
    branches:
      - agent/524-code-migrate-substrate
    paths:
      - '.github/workflows/fix-code-manage-hard-cut.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/fix-code-manage-hard-cut.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/524-code-migrate-substrate
          fetch-depth: 0

      - name: Regenerate the inventory from canonical HAL sources
        run: |
          set -euo pipefail
          scripts/runtime/sync-rust-hal-src
          scripts/runtime/sync-rust-hal-src --check
          git diff --check -- core/rust/standard-library.namespaces

      - name: Commit the tracked inventory only
        run: |
          set -euo pipefail
          if git diff --quiet -- core/rust/standard-library.namespaces; then
            echo 'Rust namespace inventory is already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/standard-library.namespaces
          git commit -m 'chore(rust): synchronize canonical HAL namespace inventory'
          git push origin HEAD:agent/524-code-migrate-substrate
