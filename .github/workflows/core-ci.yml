name: Core CI — corrective issue 838 top-level repair

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/838-bootstrap-callables-corrective-v3

permissions:
  contents: write

concurrency:
  group: issue-838-corrective-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_MIN_STACK: 33554432
    steps:
      - name: Checkout the exact corrective branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0

      - name: Checkout the coordinated specs fixture
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: aae63f735b312e29f18e041de6925ec0ae6baaa5
          path: hara-specs-registry
          fetch-depth: 1

      - name: Require and expose authoritative specs
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/hara-specs-registry/01-lang/004-foundation/draft/conformance/fixtures/direct_callable_bootstrap.hal"
          test -f "$fixture"
          ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" \
            "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout benchmark fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - name: Rebase the scoped workflow host onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          test "$(git diff --name-only "$base"...HEAD)" = '.github/workflows/core-ci.yml'
          git rebase origin/main
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/core-ci.yml'
          printf '%s  %s\n' \
            '31945d3a7ef8e923adb4a0906a03dc85e2e912699b1d3ad844998b2da3459153' \
            '.github/agent-patches/838-bootstrap-callables.patch' \
            | sha256sum --check --strict

      - name: Apply the repair at the original top-level scope
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-patches/838-bootstrap-callables.patch
          git apply .github/agent-patches/838-bootstrap-callables.patch
          git diff --check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Format the bounded Rust edits
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true \
            core/rust/src/core/inventory.rs \
            core/rust/src/core/direct_callable_catalog.rs \
            core/rust/src/core/direct_callable_operations.rs \
            core/rust/src/core/direct_callable_tests.rs
          git diff --check

      - name: Run catalog closure, zero re-entry, behavior, and specs tests
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            direct_callable_catalog_closes_the_runtime_inventory --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            complete_ordinary_callable_catalog_never_reenters_the_evaluator --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            representative_direct_callables_preserve_value_behavior --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            specs_owned_direct_callable_bootstrap_fixture_runs_before_foundation_source_loading --lib

      - name: Re-run the fiber suite that exposed the omissions
        run: cargo test --manifest-path core/rust/Cargo.toml fiber:: --lib

      - name: Run focused bytecode VM parity
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm vm::machine:: --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm vm::execution_tests --lib

      - name: Run specs-owned Foundation and protocol corpora
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            specs_owned_foundation_behavioral_corpus_runs_in_the_native_runtime --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            shared_foundation_protocol_conformance_fixture_runs_in_the_native_runtime --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            shared_foundation_protocol_functionality_fixture_runs_in_the_native_runtime --lib

      - name: Run Work protocol, evaluator, and compiler suites
        run: |
          cargo test --manifest-path core/rust/Cargo.toml work:: --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm work --lib

      - name: Check default, minimal, raw, and browser targets
        run: |
          cargo check --manifest-path core/rust/Cargo.toml --all-targets
          cargo check --manifest-path core/rust/Cargo.toml \
            --no-default-features --lib
          cargo test --manifest-path core/rust/raw/Cargo.toml
          cargo check --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown --lib
          cargo check --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown --no-default-features --lib

      - name: Run the production-stack Rust release baseline
        run: cargo test --release --manifest-path core/rust/Cargo.toml --lib

      - name: Restore trusted CI, remove transport, and publish clean code
        shell: bash
        run: |
          set -euo pipefail
          git checkout e48e93d7eed95b5ce2bbbf3b150980105c5a7d36 -- \
            .github/workflows/core-ci.yml
          git rm -- \
            .github/workflows/issue-838-bootstrap-materialize.yml \
            .github/agent-patches/838-bootstrap-callables.patch
          git add -- \
            .github/workflows/core-ci.yml \
            .github/workflows/issue-838-direct-callables.yml \
            core/rust/src/core/inventory.rs \
            core/rust/src/core/direct_callable_catalog.rs \
            core/rust/src/core/direct_callable_operations.rs \
            core/rust/src/core/direct_callable_tests.rs
          git diff --cached --check
          expected="$(git diff --cached --name-only | sort)"
          actual="$(printf '%s\n' \
            .github/agent-patches/838-bootstrap-callables.patch \
            .github/workflows/core-ci.yml \
            .github/workflows/issue-838-bootstrap-materialize.yml \
            .github/workflows/issue-838-direct-callables.yml \
            core/rust/src/core/direct_callable_catalog.rs \
            core/rust/src/core/direct_callable_operations.rs \
            core/rust/src/core/direct_callable_tests.rs \
            core/rust/src/core/inventory.rs | sort)"
          test "$expected" = "$actual"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Correct #838 with the direct bootstrap callables'
          git push --force-with-lease origin HEAD:${HEAD_BRANCH}
