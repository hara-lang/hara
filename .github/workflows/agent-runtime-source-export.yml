name: Runtime closeout validation

on:
  push:
    branches:
      - agent/runtime-closeout-575-493
    paths:
      - .github/workflows/agent-runtime-source-export.yml
      - scripts/runtime/runtime-closeout.patch

permissions:
  contents: write

concurrency:
  group: runtime-closeout-validation
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-closeout-575-493
          fetch-depth: 0

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at fixture paths
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply guarded closeout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("scripts/runtime/runtime-closeout.patch").read_text()
          start_marker = "diff --git a/core/lib/src/std/dom/common.hal b/core/lib/src/std/dom/common.hal\n"
          end_marker = "diff --git a/core/lib/src/tool/cli/template.hal b/core/lib/src/tool/cli/template.hal\n"
          start = source.find(start_marker)
          end = source.find(end_marker)
          if start != 0 or end <= start:
              raise SystemExit("unexpected std.dom closeout patch layout")

          dom = Path("core/lib/src/std/dom/common.hal").read_text()
          canonical = """(defn dom-field-set!
            [dom key value]
            (case key
          """
          if canonical not in dom:
              raise SystemExit("current main does not contain the canonical native std.dom dispatcher")

          Path("/tmp/runtime-closeout-current.patch").write_text(source[end:])
          PY

          git apply --check /tmp/runtime-closeout-current.patch
          git apply /tmp/runtime-closeout-current.patch
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          rustfmt --edition 2021 \
            core/rust/src/vm/bundle.rs \
            core/rust/src/vm/compiler/functions.rs \
            core/rust/src/vm/execution_tests.rs
          git diff --check
          git diff --stat

      - name: Run mutable-field closure regression
        run: cargo test --manifest-path core/rust/Cargo.toml 'vm::execution_tests::defmutable_forms_use_reference_identity_and_settable_fields' --lib -- --nocapture

      - name: Run complete bytecode bundle suite
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --manifest-path core/rust/Cargo.toml 'vm::bundle::tests::' --lib -- --nocapture

      - name: Regenerate and verify canonical Foundation HBX
        shell: bash
        run: |
          cp core/rust/assets/std.foundation.hbx "$RUNNER_TEMP/std.foundation.hbx.before"
          cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- generate
          if cmp -s "$RUNNER_TEMP/std.foundation.hbx.before" core/rust/assets/std.foundation.hbx; then
            echo 'Canonical HBX bytes are unchanged.'
          else
            echo 'Canonical HBX bytes changed.'
          fi
          cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- check

      - name: Run hard-cut audits
        run: |
          python3 scripts/runtime/retired_stdlib_hard_cut_test.py
          python3 scripts/runtime/retired_stdlib_hard_cut.py
          bash scripts/audit-std-substrate-hard-cut.sh

      - name: Run focused direct-source validation
        run: |
          ./scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal \
            core/lib/test/tool/cli/template_test.hal \
            core/lib/test/code/deploy/cli_test.hal

      - name: Run focused embedded project validation
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal
          do
            cargo run --quiet --manifest-path core/rust/Cargo.toml --bin hara -- \
              --project core --offline project test "$test_file"
          done

      - name: Commit validated closeout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            core/rust/src/vm/compiler/functions.rs \
            core/rust/src/vm/execution_tests.rs \
            core/lib/src/tool/cli/template.hal \
            core/lib/test/tool/cli/template_test.hal
          git commit -m 'fix(vm): make embedded definitions bytecode-portable'

          git add core/rust/hal-src core/rust/standard-library.namespaces
          git commit -m 'chore(runtime): synchronize packaged HAL inventory'

          git add core/rust/src/vm/bundle.rs core/rust/assets/std.foundation.hbx
          git commit -m 'fix(runtime): load dependency-complete source-free bundles'

          git rm .github/workflows/agent-runtime-source-export.yml scripts/runtime/runtime-closeout.patch
          git add .github/workflows/agent-source-export.yml
          git commit -m 'chore(ci): remove runtime closeout scaffolding'
          git push origin HEAD:agent/runtime-closeout-575-493
