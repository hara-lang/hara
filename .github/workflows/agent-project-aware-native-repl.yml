name: Apply project-aware native REPL patch

on:
  push:
    branches:
      - agent/project-aware-native-repl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-aware-native-repl
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply the generic project resource bootstrap
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              path.write_text(source.replace(old, new, 1))

          project = Path("core/rust/src/project.rs")
          replace_once(
              project,
              '''/// Registers namespaces from the automatically selected native Rust profile.
          pub fn register_sources(project: &Project, runtime: &mut Runtime) -> Result<(), String> {''',
              '''/// Returns namespace resources from the automatically selected native Rust profile.
          pub fn source_resources(project: &Project) -> Result<Vec<(String, String)>, String> {''',
          )
          replace_once(
              project,
              '''        resources.push((namespace, source));
              }
              for (namespace, source) in resources {''',
              '''        resources.push((namespace, source));
              }
              Ok(resources)
          }

          /// Registers namespaces from the automatically selected native Rust profile.
          pub fn register_sources(project: &Project, runtime: &mut Runtime) -> Result<(), String> {
              let resources = source_resources(project)?;
              for (namespace, source) in resources {''',
          )

          repl = Path("core/rust/src/bin/hara/repl.rs")
          replace_once(
              repl,
              '''use hara_wasm::native_cli::RuntimeBroker;
          use hara_wasm::resp::{RespConnection, RespServer, RespValue};''',
              '''use hara_wasm::native_cli::RuntimeBroker;
          use hara_wasm::project;
          use hara_wasm::resp::{RespConnection, RespServer, RespValue};''',
          )
          replace_once(
              repl,
              '''pub(crate) fn run_repl(options: &Options, offline: bool) -> Result<(), String> {''',
              '''fn register_project_resources(
              options: &Options,
              broker: &RuntimeBroker,
          ) -> Result<(), String> {
              let Some(path) = options.project.as_deref() else {
                  return Ok(());
              };
              let project = project::discover(path)?;
              for (namespace, source) in project::source_resources(&project)? {
                  broker.register_resource(&namespace, &source)?;
              }
              Ok(())
          }

          pub(crate) fn run_repl(options: &Options, offline: bool) -> Result<(), String> {''',
          )
          replace_once(
              repl,
              '''        options.allow_postgres,
              )?;
              let mut resp = RespController::new(options.host.clone(), options.port, broker.clone());''',
              '''        options.allow_postgres,
              )?;
              register_project_resources(options, &broker)?;
              let mut resp = RespController::new(options.host.clone(), options.port, broker.clone());''',
          )
          replace_once(
              repl,
              '''    use super::{command_hint, fuzzy_score, gradient, incomplete, rendered_splash, DEFAULT_SPLASH};''',
              '''    use super::{
                  command_hint, fuzzy_score, gradient, incomplete, register_project_resources,
                  rendered_splash, DEFAULT_SPLASH,
              };
              use crate::cli::Options;
              use hara_wasm::native_cli::RuntimeBroker;
              use std::fs;
              use std::path::PathBuf;
              use std::time::{SystemTime, UNIX_EPOCH};

              fn temp(name: &str) -> PathBuf {
                  std::env::temp_dir().join(format!(
                      "hara-repl-{name}-{}",
                      SystemTime::now()
                          .duration_since(UNIX_EPOCH)
                          .unwrap()
                          .as_nanos()
                  ))
              }''',
          )
          replace_once(
              repl,
              '''    #[test]
              fn completion_scoring_and_hints_match_java_behavior() {
                  assert!(fuzzy_score("mp", "map").is_some());
                  assert!(fuzzy_score("zzz", "map").is_none());
                  assert_eq!(command_hint("/re"), Some("sp".into()));
                  assert!(command_hint("/docs").unwrap().contains("language"));
              }
          }''',
              '''    #[test]
              fn completion_scoring_and_hints_match_java_behavior() {
                  assert!(fuzzy_score("mp", "map").is_some());
                  assert!(fuzzy_score("zzz", "map").is_none());
                  assert_eq!(command_hint("/re"), Some("sp".into()));
                  assert!(command_hint("/docs").unwrap().contains("language"));
              }

              #[test]
              fn project_resources_reach_root_and_future_sessions() {
                  let root = temp("project-resources");
                  fs::create_dir_all(root.join("packages/core/src/demo")).unwrap();
                  fs::create_dir_all(root.join("src/demo")).unwrap();
                  let manifest = r#"{:hara/type :project
           :hara/version "1.0.0"
           :project/id demo/repl
           :project/version "1.0.0"
           :project/source-paths ["packages/core/src" "src"]
           :project/test-paths []
           :project/extension-paths []
           :project/main demo.app
           :project/capabilities #{}}
          "#;
                  fs::write(root.join("project.edn"), manifest).unwrap();
                  fs::write(
                      root.join("packages/core/src/demo/core.hal"),
                      "(ns demo.core) (defn answer [] 40)",
                  )
                  .unwrap();
                  fs::write(
                      root.join("src/demo/app.hal"),
                      "(ns demo.app (:require [demo.core :as core])) (defn answer [] (+ 2 (core/answer)))",
                  )
                  .unwrap();

                  let project = project::discover(&root).unwrap();
                  let resources = project::source_resources(&project).unwrap();
                  assert_eq!(
                      resources.iter().map(|(name, _)| name.clone()).collect::<Vec<_>>(),
                      vec!["demo.core".to_owned(), "demo.app".to_owned()]
                  );

                  let mut options = Options::default();
                  options.project = Some(root.clone());
                  options.root = Some(root.clone());
                  let broker =
                      RuntimeBroker::start_with(Some(root.clone()), false, false, false).unwrap();
                  register_project_resources(&options, &broker).unwrap();
                  assert_eq!(broker.resources().unwrap(), vec!["demo.app", "demo.core"]);
                  assert_eq!(
                      broker
                          .eval("ROOT", "(ns repl.probe (:require [demo.app :as app])) (app/answer)")
                          .unwrap(),
                      "42"
                  );
                  broker.create("SECOND").unwrap();
                  assert_eq!(
                      broker
                          .eval("SECOND", "(ns repl.second (:require [demo.app :as app])) (app/answer)")
                          .unwrap(),
                      "42"
                  );
                  fs::remove_dir_all(root).unwrap();
              }
          }''',
          )
          PY

          cargo fmt --manifest-path core/rust/Cargo.toml

      - name: Validate the native REPL resource path
        run: |
          cargo test --manifest-path core/rust/Cargo.toml --bin hara repl::tests::project_resources_reach_root_and_future_sessions
          cargo test --manifest-path core/rust/Cargo.toml project::tests::registers_project_sources_for_cross_file_requires

      - name: Publish the patched branch and remove the bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/agent-project-aware-native-repl.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/src/project.rs core/rust/src/bin/hara/repl.rs .github/workflows/agent-project-aware-native-repl.yml
          git commit -m "Register project sources in the native REPL (#691)"
          git push origin HEAD:agent/project-aware-native-repl
