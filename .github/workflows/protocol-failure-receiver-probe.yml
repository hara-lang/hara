name: Protocol failure receiver probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/protocol-failure-receiver-probe.yml'
      - 'core/rust/tests/protocol_failure_receiver_probe.rs'
      - 'core/rust/hal-test-fixtures/std/foundation/protocol_functionality.hal'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
      - uses: dtolnay/rust-toolchain@stable
      - name: Discover explicit unsupported receivers
        working-directory: core/rust
        run: cargo test --test protocol_failure_receiver_probe -- --nocapture || true
      - name: Archive implementation workspace
        run: |
          tar -czf hara-846-workspace.tar.gz \
            --exclude='./.git' \
            --exclude='./core/rust/target' \
            --exclude='./hara-846-workspace.tar.gz' \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: hara-846-workspace
          path: hara-846-workspace.tar.gz
          if-no-files-found: error
