name: Protocol failure receiver probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/protocol-failure-receiver-probe.yml'
      - 'core/rust/tests/protocol_failure_receiver_probe.rs'
      - 'core/rust/hal-test-fixtures/std/foundation/protocol_functionality.hal'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
      - uses: dtolnay/rust-toolchain@stable
      - name: Discover explicit unsupported receivers
        working-directory: core/rust
        run: cargo test --test protocol_failure_receiver_probe -- --nocapture || true
      - name: Archive protocol conformance workspace
        run: |
          tar -czf protocol-conformance-workspace.tar.gz \
            core/rust/src/runtime/tests.rs \
            core/rust/src/runtime/tests/bytecode.rs \
            core/rust/tests \
            core/java/src/test/java/hara/truffle/HaraLanguageTest.java \
            core/lib/test-fixtures/std/foundation/protocol_functionality.hal \
            core/rust/hal-test-fixtures/std/foundation/protocol_functionality.hal \
            core/rust/Cargo.toml \
            core/java/pom.xml \
            hara-specs-registry/01-lang/001-language/draft/conformance/protocols.edn \
            hara-specs-registry/01-lang/001-language/draft/conformance/protocol-method-cases.edn
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-conformance-workspace
          path: protocol-conformance-workspace.tar.gz
          if-no-files-found: error
