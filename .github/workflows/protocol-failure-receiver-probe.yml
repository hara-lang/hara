name: Protocol failure receiver probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/protocol-failure-receiver-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
      - name: Archive implementation workspace
        run: |
          tar -czf "$RUNNER_TEMP/hara-846-workspace.tar.gz" \
            --exclude='./.git' \
            --exclude='./core/rust/target' \
            .
      - uses: actions/upload-artifact@v4
        with:
          name: hara-846-workspace
          path: ${{ runner.temp }}/hara-846-workspace.tar.gz
          if-no-files-found: error
