name: Clojure to HAL corpus

on:
  push:
    paths:
      - 'core/spec/clj-hal-corpus.json'
      - 'core/spec/clj-hal-routes.json'
      - 'scripts/runtime/clj_hal_corpus.py'
      - 'scripts/runtime/clj_hal_corpus_test.py'
      - '.github/workflows/clj-hal-corpus.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/spec/clj-hal-corpus.json'
      - 'core/spec/clj-hal-routes.json'
      - 'scripts/runtime/clj_hal_corpus.py'
      - 'scripts/runtime/clj_hal_corpus_test.py'
      - '.github/workflows/clj-hal-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clj-hal-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the pinned Foundation reference
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/zcaudate-xyz/foundation-base .foundation-reference
          git -C .foundation-reference fetch --depth=1 origin baa75aabd6a879753d7d5cb07271b1448271e7cb
          git -C .foundation-reference checkout --detach baa75aabd6a879753d7d5cb07271b1448271e7cb
      - name: Test and verify the Foundation-led corpus
        run: |
          python3 -m unittest discover -s scripts/runtime -p 'clj_hal_corpus_test.py'
          python3 scripts/runtime/clj_hal_corpus.py \
            --check-generated \
            --verify-reference \
            --reference .foundation-reference
