name: Clojure to HAL corpus

on:
  push:
    paths:
      - 'core/spec/clj-hal-corpus.json'
      - 'core/spec/clj-hal-routes.json'
      - 'core/spec/foundation-script-inventory.json'
      - 'core/spec/foundation-script-policy.json'
      - 'scripts/runtime/clj_hal_corpus.py'
      - 'scripts/runtime/clj_hal_corpus_test.py'
      - 'scripts/runtime/foundation_script_inventory.py'
      - 'scripts/runtime/foundation_script_inventory_test.py'
      - 'scripts/runtime/foundation_script_result.py'
      - 'scripts/runtime/foundation_script_result_test.py'
      - '.github/workflows/clj-hal-corpus.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/spec/clj-hal-corpus.json'
      - 'core/spec/clj-hal-routes.json'
      - 'core/spec/foundation-script-inventory.json'
      - 'core/spec/foundation-script-policy.json'
      - 'scripts/runtime/clj_hal_corpus.py'
      - 'scripts/runtime/clj_hal_corpus_test.py'
      - 'scripts/runtime/foundation_script_inventory.py'
      - 'scripts/runtime/foundation_script_inventory_test.py'
      - 'scripts/runtime/foundation_script_result.py'
      - 'scripts/runtime/foundation_script_result_test.py'
      - '.github/workflows/clj-hal-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clj-hal-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Read the pinned Foundation script revision
        id: foundation-script
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          policy = json.loads(Path("core/spec/foundation-script-policy.json").read_text())
          print(f"commit={policy['reference']['commit']}")
          PY
      - name: Check out the pinned Foundation reference
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: ${{ steps.foundation-script.outputs.commit }}
          path: .foundation-reference
          fetch-depth: 1
      - name: Validate the Foundation script inventory
        run: |
          test "$(git -C .foundation-reference rev-parse HEAD)" = "${{ steps.foundation-script.outputs.commit }}"
          python3 scripts/runtime/foundation_script_inventory_test.py
          python3 scripts/runtime/foundation_script_result_test.py
          python3 scripts/runtime/foundation_script_inventory.py \
            --reference .foundation-reference \
            --check
      - name: Test and verify the Foundation-led corpus
        run: |
          python3 -m unittest discover -s scripts/runtime -p 'clj_hal_corpus_test.py'
          python3 scripts/runtime/clj_hal_corpus.py \
            --check-generated \
            --verify-reference \
            --reference .foundation-reference
