name: Verify combined strings and format layers

on:
  push:
    branches:
      - agent/complete-combined-str-format-current-main

permissions:
  contents: write

concurrency:
  group: verify-combined-str-format-current-main
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.head_commit.message != 'Complete portable strings and format layers'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build products
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Run verified completion driver
        shell: bash
        run: bash scripts/runtime/complete-combined-str-format

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-str-format-current-main-${{ github.run_id }}
          path: /tmp/combined-str-format-v2.log
          if-no-files-found: error
