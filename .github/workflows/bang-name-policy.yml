name: Bang-name source policy

on:
  pull_request:
    paths:
      - '.github/workflows/bang-name-policy.yml'
      - 'core/lib/src/**/*.hal'
      - 'core/lib/src-lang/**/*.hal'
      - 'core/lib/test/code/migrate_bang_test.hal'
      - 'core/lib/test/tool/lint_test.hal'
      - 'core/rust/hal-src/**/*.hal'
      - 'core/spec/code-migrate/bang-vars.edn'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bang-name-policy.yml'
      - 'core/lib/src/**/*.hal'
      - 'core/lib/src-lang/**/*.hal'
      - 'core/lib/test/code/migrate_bang_test.hal'
      - 'core/lib/test/tool/lint_test.hal'
      - 'core/rust/hal-src/**/*.hal'
      - 'core/spec/code-migrate/bang-vars.edn'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bang-name-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build fresh native Hara development tools
        run: cargo build --manifest-path core/rust/Cargo.toml --bin hara --bin hara-test

      - name: Materialize the complete unwritten Hara test candidate
        shell: bash
        run: |
          cat > /tmp/migrate_bang_test.hal <<'HAL'
          (ns code.migrate-bang-test
            (:use code.test)
            (:require [code.migrate.bang :as bang]
                      [tool.project :as project]))

          (def +sample-units+
            [{:path "a.hal"
              :source "(ns sample.a)\n(defn run [x] x)\n(defn run! [x] (run x))\n"}
             {:path "b.hal"
              :source "(ns sample.b (:require [sample.a :as a :refer [run!]]))\n(defn use-it [x] [(a/run! x) (run! x)])\n"}])

          (def results
            [(fact "canonical reference mutations are excluded by qualified identity"
               (let [ledger
                     (bang/rename-ledger
                      [{:path "foundation.hal"
                        :source
                        "(ns std.foundation)\n(defn reset! [r v] v)\n(defn swap! [r f] (f r))\n(defn swap-return! [r f] (f r))\n(defn cas! [r a b] true)\n(defn reset-cache! [] nil)\n(set! target 1)\n"}])]
                 (mapv :source/refer ledger))
               => ['std.foundation/reset-cache!])

             (fact "a parsed unit reports exact disallowed definition identities"
               (let [analyzed
                     (bang/unit-analysis
                      {:path "foundation.hal"
                       :source
                       "(ns std.foundation)\n(defn reset! [r v] v)\n(defn reset-cache! [] nil)\n"})]
                 [(get-in analyzed [:analysis :reader-findings])
                  (mapv :source/refer
                        (bang/bang-definition-records [analyzed]))])
               => [[] ['std.foundation/reset-cache!]])

             (fact "a rename plan updates definitions aliases refers and calls"
               (let [migration
                     (bang/plan +sample-units+ {'sample.a/run! 'sample.a/run-effect})
                     outputs
                     (reduce (fn [out unit] (assoc out (:path unit) (:after unit)))
                             {}
                             (:edits migration))]
                 [(:valid migration)
                  (:records migration)
                  (get outputs "a.hal")
                  (get outputs "b.hal")])
               => [true
                   1
                   "(ns sample.a)\n(defn run [x] x)\n(defn run-effect [x] (run x))\n"
                   "(ns sample.b (:require [sample.a :as a :refer [run-effect]]))\n(defn use-it [x] [(a/run-effect x) (run-effect x)])\n"])

             (fact "suffix removal fails closed when the target already exists"
               (let [migration
                     (bang/plan
                      [{:path "collision.hal"
                        :source "(ns sample.collision)\n(defn run [] nil)\n(defn run! [] nil)\n"}]
                      {})]
                 [(:valid migration)
                  (mapv :migration/error (:diagnostics migration))])
               => [false [:bang-rename/existing-target]])])

          (fact "embedded Rust Hara sources equal deterministic code.migrate materialization"
            (let [current-project (project/read-project "project.edn")
                  snapshot (bang/embedded-snapshot-plan current-project)]
              [(:valid snapshot)
               (:records snapshot)
               (:changed/files snapshot)
               (:diagnostics snapshot)])
            => [true 3 0 []])

          (pr-str (run '[code.migrate-bang-test]))
          HAL

      - name: Evaluate the complete candidate through native stdin
        shell: bash
        run: |
          set -euo pipefail
          core/rust/target/debug/hara --project core --offline stdin \
            < /tmp/migrate_bang_test.hal \
            | tee /tmp/bang-candidate-evaluation.txt
          grep -F ':status :passed' /tmp/bang-candidate-evaluation.txt

      - name: Run the focused test against the unwritten candidate
        run: core/rust/target/debug/hara-test --root core /tmp/migrate_bang_test.hal

      - name: Audit each bang-bearing production source in a fresh Hara process
        shell: bash
        run: |
          set -euo pipefail

          find core/lib/src core/lib/src-lang core/rust/hal-src \
            -type f -name '*.hal' -print0 \
            | sort -z \
            | while IFS= read -r -d '' path; do
                if grep -q '!' "$path"; then
                  printf '%s\0' "$path"
                fi
              done > /tmp/bang-source-paths

          audited="$(tr -cd '\0' < /tmp/bang-source-paths | wc -c)"
          test "$audited" -gt 0
          echo "Auditing $audited bang-bearing production sources"

          cat > /tmp/audit-bang-source <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          full_path="$1"
          relative_path="${full_path#core/}"
          escaped_path="$(printf '%s' "$relative_path" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          candidate="$(mktemp --suffix=.hal)"
          output="$(mktemp)"
          trap 'rm -f "$candidate" "$output"' EXIT

          cat > "$candidate" <<HAL
          (ns code.migrate-bang-source-audit
            (:require [code.migrate.bang :as bang]
                      [tool.project :as project]))

          (let [path "$escaped_path"
                analyzed
                (bang/unit-analysis
                 {:path path
                  :source (project/read-text path)})
                reader-findings
                (get-in analyzed [:analysis :reader-findings])
                records
                (bang/bang-definition-records [analyzed])]
            (if (and (empty? reader-findings) (empty? records))
              (pr-str {:status :passed :path path :records 0})
              (throw
               (ex-info "Bang-name production source policy failed"
                        {:path path
                         :reader-findings reader-findings
                         :records records}))))
          HAL

          echo "AUDIT $relative_path"
          if ! timeout 180 core/rust/target/debug/hara --project core --offline stdin \
                 < "$candidate" > "$output" 2>&1; then
            cat "$output"
            echo "FAILED $relative_path" >&2
            exit 1
          fi
          cat "$output"
          grep -Fq ':status :passed' "$output"
          SCRIPT
          chmod +x /tmp/audit-bang-source

          xargs -0 -r -n1 -P2 /tmp/audit-bang-source < /tmp/bang-source-paths

      - name: Run the permanent bang-definition lint contract
        run: core/rust/target/debug/hara-test --root core core/lib/test/tool/lint_test.hal

      - name: Reject retained migration scratch artifacts
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .apply-bang.txt \
            .candidate-bang-v2.txt \
            .plan-bang.txt \
            core/.apply-bang-snapshots.hal \
            core/.candidate-followup.txt \
            core/.candidate-framework.hal \
            core/.candidate-lint-analyze.hal \
            core/.candidate-lint-test.hal \
            core/.candidate-migrate-bang-test-v2.hal \
            core/.candidate-migrate-bang-test.hal \
            core/.candidate-migrate-bang-v2.hal \
            core/.candidate-migrate-bang.hal
          do
            test ! -e "$path"
          done
