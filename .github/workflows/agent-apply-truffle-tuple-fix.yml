name: Apply compact tuple lazy-startup repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/agent/truffle-tuple-fix.patch.b64'
      - '.github/workflows/agent-apply-truffle-tuple-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Git and rebase onto current main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Apply focused repair
        run: |
          base64 -d .github/agent/truffle-tuple-fix.patch.b64 | gzip -d > /tmp/truffle-tuple-fix.patch
          git apply --check /tmp/truffle-tuple-fix.patch
          git apply /tmp/truffle-tuple-fix.patch
          rm .github/agent/truffle-tuple-fix.patch.b64
          rm .github/workflows/agent-apply-truffle-tuple-fix.yml

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run focused Truffle regression slice
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -DfailIfNoTests=true
          -Dtest=hara.kernel.builtin.BuiltinStructTest,hara.truffle.FoundationFallbackDemandTest,hara.truffle.HaraLanguageTest
          test

      - name: Commit verified repair
        run: |
          git add -A
          git commit -m "truffle: restore compact tuple protocol semantics"
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
