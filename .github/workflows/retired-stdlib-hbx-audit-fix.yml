name: Retired stdlib structural HBX audit

on:
  push:
    branches:
      - codex/remove-retired-stdlib-modules
    paths:
      - .github/workflows/retired-stdlib-hbx-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: retired-stdlib-hbx-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/remove-retired-stdlib-modules
          fetch-depth: 0

      - name: Replace raw-byte HBX scan with module-table audit
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path("scripts/runtime/retired_stdlib_hard_cut.py")
          source = path.read_text()

          old_import = "from collections.abc import Iterable, Iterator\n"
          new_import = (
              old_import
              + "\nfrom retired_stdlib_hbx import HbxFormatError, retired_module_references\n"
          )
          if source.count(old_import) != 1:
              raise SystemExit("unexpected hard-cut import layout")
          source = source.replace(old_import, new_import, 1)

          old_loop = '''    for full in tracked:
              relative = full.relative_to(ROOT).as_posix()
              try:
                  data = full.read_bytes()
              except OSError as error:
                  failures.append(f"cannot read {relative}: {error}")
                  continue
              if not any(namespace.encode() in data for namespace in RETIRED):
                  continue
              if relative == HBX.as_posix():
                  failures.append(f"retired namespace remains embedded in HBX: {relative}")
              elif relative not in LEGACY_ALLOWLIST:
                  names = [name for name in RETIRED if name.encode() in data]
                  failures.append(f"live retired namespace reference in {relative}: {', '.join(names)}")
          '''
          old_loop = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in old_loop.splitlines()
          ) + "\n"

          new_loop = '''    for full in tracked:
              relative = full.relative_to(ROOT).as_posix()
              if relative == HBX.as_posix():
                  try:
                      references = retired_module_references(full, RETIRED)
                  except HbxFormatError as error:
                      failures.append(f"cannot inspect HBX module table in {relative}: {error}")
                  else:
                      failures.extend(
                          f"retired namespace remains embedded in HBX module table: {reference}"
                          for reference in references
                      )
                  continue
              try:
                  data = full.read_bytes()
              except OSError as error:
                  failures.append(f"cannot read {relative}: {error}")
                  continue
              if not any(namespace.encode() in data for namespace in RETIRED):
                  continue
              if relative not in LEGACY_ALLOWLIST:
                  names = [name for name in RETIRED if name.encode() in data]
                  failures.append(f"live retired namespace reference in {relative}: {', '.join(names)}")
          '''
          new_loop = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in new_loop.splitlines()
          ) + "\n"

          if source.count(old_loop) != 1:
              raise SystemExit("unexpected hard-cut audit loop layout")
          path.write_text(source.replace(old_loop, new_loop, 1))
          Path(".github/workflows/retired-stdlib-hbx-audit-fix.yml").unlink()
          PYCODE

      - name: Test hard-cut transformer and HBX parser
        run: python3 scripts/runtime/retired_stdlib_hard_cut_test.py

      - name: Audit retired modules structurally
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py

      - name: Check Rust HAL mirror
        run: python3 scripts/runtime/sync-rust-hal-src --check

      - name: Commit structural HBX audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit retired modules through the HBX descriptor table"
          git push origin HEAD:codex/remove-retired-stdlib-modules

      - name: Test Rust result compatibility
        run: >-
          cargo test --manifest-path core/rust/Cargo.toml
          test_result_compatibility_tests -- --nocapture

      - name: Run focused HAL tests
        run: |
          bash scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal
