name: Apply single code.test work runtime

on:
  push:
    branches:
      - agent/code-test-single-work-runtime-498

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the single-runtime migration
        run: |
          if [[ -f scripts/runtime/apply-code-test-single-work-runtime ]]; then
            python3 -m py_compile scripts/runtime/apply-code-test-single-work-runtime
            python3 scripts/runtime/apply-code-test-single-work-runtime
          else
            echo "Single code.test runtime migration already applied."
          fi

      - name: Validate the generated source shape
        run: |
          git diff --check
          python3 scripts/runtime/check-code-test-work-events
          python3 scripts/runtime/sync-rust-hal-src --check
          diff -u core/lib/src/code/test.hal core/rust/hal-src/code/test.hal
          diff -u core/lib/src/code/test/work.hal core/rust/hal-src/code/test/work.hal
          ! grep -R --include='*.hal' -n \
            -e 'ITestClock' \
            -e 'ITestTimer' \
            -e 'ITestReporter' \
            -e 'ITestRegistry' \
            -e 'ITestSession' \
            -e 'ITestControl' \
            core/lib/src core/rust/hal-src

      - name: Commit the canonical runtime cut
        run: |
          if git diff --quiet; then
            echo "No migration changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make the fact-batch graph the sole code.test runtime"
          git push
