name: Continue native Result implementation

on:
  push:
    branches:
      - agent/640-native-result-bootstrap

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/640-native-result-bootstrap
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fetch external conformance fixtures
        run: |
          if [ ! -d ../hara-specs-registry/.git ]; then
            git clone --depth 1 https://github.com/hara-lang/hara-specs-registry.git ../hara-specs-registry
          fi

      - name: Record the untouched focused HAL baseline
        id: baseline_hal
        run: |
          set +e
          ./scripts/runtime/run-lib-tests core/lib/test/std/foundation_test.hal
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "untouched foundation_test.hal exit status: $status"
          exit 0

      - name: Validate patch scripts
        run: python3 -m py_compile .github/scripts/patch_result_runtime.py .github/scripts/patch_result_tests_hal.py

      - name: Adapt patch anchors to current source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/patch_result_runtime.py')
          text = path.read_text()
          old = '''    count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)'''
          new = r'''    count = text.count(old)
              if label == "Rust Result synchronize operation" and count == 0:
                  import re

                  matches = list(
                      re.finditer(
                          r'(?m)^[ \t]*"result\?"\s*\|\s*"success\?"\s*\|\s*"error\?"',
                          text,
                      )
                  )
                  if len(matches) != 1:
                      raise RuntimeError(
                          f"{label}: expected one Result predicate-dispatch arm, found {len(matches)}"
                      )
                  addition = (
                      '        "synchronize" => {\n'
                      '            if !(1..=2).contains(&forms.len()) {\n'
                      '                return Err(\n'
                      '                    "std.native.Result/synchronize expects a value and optional options map"\n'
                      '                        .into(),\n'
                      '                );\n'
                      '            }\n'
                      '            let value = eval(&forms[0], env)?;\n'
                      '            let options = forms\n'
                      '                .get(1)\n'
                      '                .map(|form| eval(form, env))\n'
                      '                .transpose()?;\n'
                      '            let (timeout, context) = result_synchronize_options(options)?;\n'
                      '            native_result::synchronize_value(value, timeout, context)\n'
                      '        }\n'
                  )
                  insertion = matches[0].start()
                  return text[:insertion] + addition + text[insertion:]
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one replace_once implementation, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile .github/scripts/patch_result_runtime.py

      - name: Apply native synchronization runtime patch
        run: python3 .github/scripts/patch_result_runtime.py

      - name: Format and compile patched runtimes
        run: |
          rustfmt --edition 2021 core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs
          rustfmt --edition 2021 --check core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs
          cargo check --manifest-path core/rust/Cargo.toml --lib
          mvn -B -f core/java/pom.xml -Ptruffle -DskipTests package

      - name: Re-run the focused HAL baseline before writing source
        id: patched_hal
        run: |
          set +e
          ./scripts/runtime/run-lib-tests core/lib/test/std/foundation_test.hal
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "runtime-patched foundation_test.hal exit status: $status"
          exit 0

      - name: Reject a new focused HAL regression
        env:
          BASELINE_STATUS: ${{ steps.baseline_hal.outputs.status }}
          PATCHED_STATUS: ${{ steps.patched_hal.outputs.status }}
        run: |
          if [ "$BASELINE_STATUS" = 0 ] && [ "$PATCHED_STATUS" != 0 ]; then
            echo "Result runtime patch introduced a new foundation_test.hal failure"
            exit 1
          fi
          if [ "$BASELINE_STATUS" != 0 ]; then
            echo "foundation_test.hal already fails on the untouched branch (status $BASELINE_STATUS); continuing with isolated Result proofs"
          fi

      - name: Evaluate the complete candidate and focused res-* proof in a fresh native Hara process
        run: |
          python3 .github/scripts/patch_result_tests_hal.py candidate
          candidate="$(cat core/target/foundation-result-candidate.hal)"
          ./core/hara eval "$candidate"
          output="$(./core/hara eval "$candidate
          (let [success (res-success 42 {:source :candidate})
                nested (res-success 7)
                synchronized (res-synchronize (atom nested))]
            (and (res? success)
                 (res-success? success)
                 (= :success (res-status success))
                 (= 42 (res-data success))
                 (= :candidate (get (res-context success) :source))
                 (res-success? synchronized)
                 (res? (res-data synchronized))))")"
          test "$output" = true

      - name: Apply res-* facade and focused tests
        run: python3 .github/scripts/patch_result_tests_hal.py apply

      - name: Validate written HAL source and res-* proof in another fresh native Hara process
        run: |
          source="$(cat core/lib/src/std/foundation.hal)"
          ./core/hara eval "$source"
          output="$(./core/hara eval "$source
          (let [success (res-success 42 {:source :written})
                updated (res-with-context success {:source :updated})
                nested (res-success 7)
                synchronized (res-synchronize (atom nested))]
            (and (res? success)
                 (res-success? success)
                 (not (res-error? success))
                 (= :success (res-status success))
                 (= 42 (res-data success))
                 (= :updated (get (res-context updated) :source))
                 (res-success? synchronized)
                 (res? (res-data synchronized))))")"
          test "$output" = true

      - name: Validate canonical and mirrored HAL parity
        run: cmp core/lib/src/std/foundation.hal core/rust/hal-src/std/foundation.hal

      - name: Run focused Rust Result tests
        run: |
          rustfmt --edition 2021 core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs
          rustfmt --edition 2021 --check core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs
          cargo test --manifest-path core/rust/Cargo.toml 'core::native_result::tests::' --lib

      - name: Run focused Java Result tests
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest=hara.truffle.HaraResultTest test

      - name: Repeat the broad focused HAL harness after writing
        id: final_hal
        run: |
          set +e
          ./scripts/runtime/run-lib-tests core/lib/test/std/foundation_test.hal
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "written foundation_test.hal exit status: $status"
          exit 0

      - name: Check broad HAL harness against its untouched baseline
        env:
          BASELINE_STATUS: ${{ steps.baseline_hal.outputs.status }}
          FINAL_STATUS: ${{ steps.final_hal.outputs.status }}
        run: |
          if [ "$BASELINE_STATUS" = 0 ]; then
            test "$FINAL_STATUS" = 0
          else
            echo "untouched branch status=$BASELINE_STATUS; written branch status=$FINAL_STATUS"
          fi

      - name: Check patch and commit implementation
        run: |
          git diff --check
          rm .github/scripts/patch_result_runtime.py
          rm .github/scripts/patch_result_tests_hal.py
          rm .github/workflows/agent-native-result-continuation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add Result synchronization and res-* facade"
          git push origin HEAD:agent/640-native-result-bootstrap
