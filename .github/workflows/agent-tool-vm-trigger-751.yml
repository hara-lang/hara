name: Trigger read-only tool.vm provider materialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.head.ref == 'agent/tool-vm-readonly-751'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tool-vm-readonly-751
          fetch-depth: 0
      - name: Remove this one-shot trigger and start the branch workflow
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          rm .github/workflows/agent-tool-vm-trigger-751.yml
          git add -A
          git commit -m "Trigger tool.vm provider materialization (#751)"
          git push origin HEAD:agent/tool-vm-readonly-751
