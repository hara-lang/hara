name: Refresh Foundation inventory for PR 606

on:
  push:
    branches:
      - agent/remove-std-lib-walk-499
    paths:
      - '.github/workflows/refresh-foundation-inventory-606.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/remove-std-lib-walk-499
      - name: Read the pinned Foundation revision
        id: foundation
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path("core/spec/foundation-script-policy.json").read_text())
          print(f"commit={policy['reference']['commit']}")
          PY
      - name: Check out the pinned Foundation reference
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: ${{ steps.foundation.outputs.commit }}
          path: foundation-base
          fetch-depth: 1
      - name: Refresh target snapshot and generated inventory
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("core/spec/foundation-script-policy.json")
          policy = json.loads(path.read_text())
          policy["target"]["base_commit"] = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          path.write_text(json.dumps(policy, indent=2, sort_keys=True) + "\n")
          PY
          python3 scripts/runtime/foundation_script_inventory.py \
            --reference foundation-base \
            --write
          python3 scripts/runtime/foundation_script_inventory.py \
            --reference foundation-base \
            --check
          python3 scripts/runtime/foundation_target_snapshot.py --ledger script
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/spec/foundation-script-policy.json \
                  core/spec/foundation-script-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory already current"
          else
            git commit -m "Refresh Foundation script target evidence"
            git push origin HEAD:agent/remove-std-lib-walk-499
          fi
