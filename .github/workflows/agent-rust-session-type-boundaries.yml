name: Validate Rust session type boundaries

on:
  push:
    branches:
      - agent/rust-session-type-boundaries

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/rust-session-type-boundaries
          fetch-depth: 0
      - name: Checkout Hara specifications
        uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Expose specification fixtures
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path core/rust/Cargo.toml
      - name: Check the Rust runtime
        run: cargo check --manifest-path core/rust/Cargo.toml
      - name: Run focused Session tests
        run: |
          RUST_BACKTRACE=1 cargo test \
            --manifest-path core/rust/Cargo.toml \
            --lib session \
            -- --nocapture --test-threads=1
      - name: Run full Rust tests
        run: cargo test --manifest-path core/rust/Cargo.toml
      - name: Commit formatted Session product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/rust/src/bin/hara-test.rs \
            core/rust/src/runtime/session.rs \
            core/rust/src/runtime/session_model.rs \
            core/rust/src/runtime/tests.rs
          if ! git diff --cached --quiet; then
            git commit -m "Format Rust Session boundaries"
            git push origin HEAD:agent/rust-session-type-boundaries
          fi
