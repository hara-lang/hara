name: Materialize tool.vm transformations 752

on:
  push:
    branches:
      - agent/tool-vm-transform-staging-752
    paths:
      - .github/workflows/agent-tool-vm-transform-752.yml
      - scripts/runtime/apply-tool-vm-transform-752.py

permissions:
  contents: write

concurrency:
  group: agent-tool-vm-transform-752
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize bounded product branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/runtime/apply-tool-vm-transform-752.py /tmp/apply-tool-vm-transform-752.py
          git fetch origin main
          git checkout -B agent/tool-vm-transform-752 origin/main
          python3 /tmp/apply-tool-vm-transform-752.py
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          git diff --check

      - name: Verify Rust transformation provider
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml vm_tool_tests -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml \
            --no-default-features --features bytecode-vm \
            vm_tool_tests::provider_reports_exact_profile_capabilities -- --nocapture
          cargo check --manifest-path core/rust/Cargo.toml \
            --no-default-features --features bytecode-vm
          cargo test --manifest-path core/rust/vm-runtime/Cargo.toml

      - name: Verify Truffle transformation provider
        shell: bash
        run: |
          set -euo pipefail
          mvn -f core/java/pom.xml -Ptruffle \
            -Dtest=hara.truffle.ToolVmLibraryTest test

      - name: Verify public Hara facade
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path core/rust/Cargo.toml --bin hara-test -- \
            --root . \
            core/lib/test/tool/vm_test.hal \
            core/lib/test/tool/vm_provider_test.hal

      - name: Verify layout and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          bash core/rust/scripts/check-layout.sh
          git diff --name-only origin/main...HEAD | sort
          python3 - <<'PY'
          import subprocess
          allowed = {
              'core/rust/Cargo.toml',
              'core/rust/src/core/vm_tool.rs',
              'core/java/src/main/java/hara/truffle/ToolVmLibrary.java',
              'core/java/src/test/java/hara/truffle/ToolVmLibraryTest.java',
              'core/lib/src/tool/vm.hal',
              'core/lib/src/tool/vm/halc.hal',
              'core/lib/src/tool/vm/hbc.hal',
              'core/lib/test/tool/vm_provider_test.hal',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'unexpected product paths: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'missing product paths: {sorted(missing)}')
          PY

      - name: Publish verified product branch
        shell: bash
        env:
          PRODUCT_BRANCH: agent/tool-vm-transform-752
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/rust/Cargo.toml \
            core/rust/src/core/vm_tool.rs \
            core/java/src/main/java/hara/truffle/ToolVmLibrary.java \
            core/java/src/test/java/hara/truffle/ToolVmLibraryTest.java \
            core/lib/src/tool/vm.hal \
            core/lib/src/tool/vm/halc.hal \
            core/lib/src/tool/vm/hbc.hal \
            core/lib/test/tool/vm_provider_test.hal
          git commit -m 'Expose HAL and HALC transformations through tool.vm (#752)'
          git push --force origin HEAD:refs/heads/${PRODUCT_BRANCH}
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report product commit
        run: |
          echo "Published ${PRODUCT_SHA} to agent/tool-vm-transform-752"
