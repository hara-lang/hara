name: Bootstrap project-aware native REPL v5

on:
  push:
    branches:
      - agent/project-aware-native-repl-v5

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-aware-native-repl-v5
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply project-aware REPL support
        run: python3 .github/scripts/apply-project-aware-native-repl.py

      - name: Format
        run: cargo fmt --manifest-path core/rust/Cargo.toml

      - name: Validate project resources
        run: cargo test --manifest-path core/rust/Cargo.toml project::tests::registers_project_sources_for_cross_file_requires

      - name: Validate native REPL
        run: cargo test --manifest-path core/rust/Cargo.toml --bin hara repl::tests::project_resources_reach_root_and_future_sessions

      - name: Validate complete Hara CLI binary
        run: cargo test --manifest-path core/rust/Cargo.toml --bin hara

      - name: Publish clean branch
        shell: bash
        run: |
          rm .github/workflows/agent-project-aware-native-repl-v5.yml
          rm .github/scripts/apply-project-aware-native-repl.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/src/project.rs core/rust/src/project/tests.rs core/rust/src/bin/hara/repl.rs .github
          git commit -m "Register project sources in the native REPL (#691)"
          git push origin HEAD:agent/project-aware-native-repl-v5
