name: Wasm binding Hara diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/lib/src/tool/cli/extension.hal'
      - 'core/lib/test/tool/cli/extension_test.hal'
      - '.github/workflows/wasm-binding-hara-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact Hara collection fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/lib/src/tool/cli/extension.hal')
          source = path.read_text()
          replacements = {
              '(if (not (contains? allowed key))': '(if (not (get allowed key))',
              'arguments #{:out :namespace})': 'arguments {:out true :namespace true})',
              'arguments #{:out :module})': 'arguments {:out true :module true})',
              '            targets)))))': '            (seq targets))))))',
          }
          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f'expected source expression not found: {old}')
          path.write_text(source)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/lib/src/tool/cli/extension.hal
            git commit -m "Fix Hara binding command collection boundaries"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Capture exact Hara command failure
        run: |
          set +e
          ./scripts/runtime/run-lib-tests core/lib/test/tool/cli/extension_test.hal > /tmp/hara-test.log 2>&1
          status=$?
          cat /tmp/hara-test.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/hara-test.log .github/wasm-binding-hara-test.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/wasm-binding-hara-test.log
            git commit -m "Record Wasm binding Hara test diagnostic"
            git push origin HEAD:${{ github.head_ref }}
          fi
          exit "$status"
