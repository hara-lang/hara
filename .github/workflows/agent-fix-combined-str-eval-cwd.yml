name: Fix combined string evaluation working directory

on:
  push:
    branches:
      - agent/complete-combined-str-format

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix isolated HAL evaluation working directory'
    runs-on: ubuntu-latest

    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch completion workflow and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-complete-combined-str-format.yml')
          text = path.read_text()

          old = '''          HARA="$PWD/core/rust/target/debug/hara"
          HARA_TEST="$PWD/core/rust/target/debug/hara-test"
          COMMON=core/lib/src/std/format/common.hal'''
          new = '''          ROOT="$PWD"
          HARA="$ROOT/core/rust/target/debug/hara"
          HARA_TEST="$ROOT/core/rust/target/debug/hara-test"
          COMMON=core/lib/src/std/format/common.hal'''
          if old not in text:
              raise SystemExit('candidate tool marker not found')
          text = text.replace(old, new, 1)

          old = '''          evaluate() {
            cat "$@" | "$HARA" --offline stdin
          }'''
          new = '''          evaluate() {
            cat "$@" | (cd /tmp && "$HARA" --offline stdin)
          }'''
          if old not in text:
              raise SystemExit('candidate evaluate marker not found')
          text = text.replace(old, new, 1)

          old = '''          "$HARA_TEST" \\
            --root "$PWD/core" \\
            "$PWD/core/lib/test/std/foundation/string_test.hal"
          "$HARA_TEST" \\
            --root "$PWD/core" \\
            "$PWD/core/lib/test/std/work_report_renderer_test.hal"'''
          new = '''          (cd /tmp && "$HARA_TEST" \\
            --root "$ROOT/core" \\
            "$ROOT/core/lib/test/std/foundation/string_test.hal")
          (cd /tmp && "$HARA_TEST" \\
            --root "$ROOT/core" \\
            "$ROOT/core/lib/test/std/work_report_renderer_test.hal")'''
          if old not in text:
              raise SystemExit('candidate test marker not found')
          text = text.replace(old, new, 1)

          old = '''          HARA="$PWD/core/rust/target/debug/hara"
          HARA_TEST="$PWD/core/rust/target/debug/hara-test"

          "$HARA" --offline run core/lib/src/std/foundation/string.hal
          "$HARA_TEST" \\
            --root "$PWD/core" \\
            "$PWD/core/lib/test/std/foundation/string_test.hal"'''
          new = '''          ROOT="$PWD"
          HARA="$ROOT/core/rust/target/debug/hara"
          HARA_TEST="$ROOT/core/rust/target/debug/hara-test"

          (cd /tmp && "$HARA" --offline run \\
            "$ROOT/core/lib/src/std/foundation/string.hal")
          (cd /tmp && "$HARA_TEST" \\
            --root "$ROOT/core" \\
            "$ROOT/core/lib/test/std/foundation/string_test.hal")'''
          if old not in text:
              raise SystemExit('fresh string marker not found')
          text = text.replace(old, new, 1)

          old = '''          do
            "$HARA" --offline run "$source"
          done
          "$HARA_TEST" \\
            --root "$PWD/core" \\
            "$PWD/core/lib/test/std/work_report_renderer_test.hal"'''
          new = '''          do
            (cd /tmp && "$HARA" --offline run "$ROOT/$source")
          done
          (cd /tmp && "$HARA_TEST" \\
            --root "$ROOT/core" \\
            "$ROOT/core/lib/test/std/work_report_renderer_test.hal")'''
          if old not in text:
              raise SystemExit('fresh format marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm -f .github/workflows/agent-fix-combined-str-eval-cwd.yml
          git config user.name "hara-agent"
          git config user.email "hara-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Run format validation outside project discovery"
          git push origin HEAD:agent/complete-combined-str-format
