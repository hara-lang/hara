name: Validate extracted project resource module

on:
  push:
    branches:
      - agent/project-aware-native-repl-v5

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/project-aware-native-repl-v5
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Extract resource module
        run: python3 .github/scripts/extract-project-resources.py

      - name: Format
        run: cargo fmt --manifest-path core/rust/Cargo.toml

      - name: Validate layout tests
        run: bash core/rust/scripts/check-layout.test.sh

      - name: Validate project resources
        run: cargo test --manifest-path core/rust/Cargo.toml project::tests::registers_project_sources_for_cross_file_requires

      - name: Validate native REPL
        run: cargo test --manifest-path core/rust/Cargo.toml --bin hara repl::tests::project_resources_reach_root_and_future_sessions

      - name: Publish clean branch
        shell: bash
        run: |
          rm .github/workflows/agent-project-resource-module.yml
          rm .github/scripts/extract-project-resources.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/src/project.rs core/rust/src/project/resources.rs .github
          git commit -m "Extract project source resource collection (#691)"
          git push origin HEAD:agent/project-aware-native-repl-v5
