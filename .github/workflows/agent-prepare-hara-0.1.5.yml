name: Prepare Hara 0.1.5 release

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/hara-0.1.5-observation-release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the current stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh the Core Rust lock
        run: cargo generate-lockfile --manifest-path core/rust/Cargo.toml

      - name: Validate the release surfaces and observation runtime
        run: |
          git diff --check
          test "$(git diff --name-only)" = "core/rust/Cargo.lock"
          node packaging/scripts/check-release-version.mjs 0.1.5
          cargo build --locked --release --manifest-path core/rust/Cargo.toml --bin hara
          cargo test --manifest-path core/rust/observation-raw/Cargo.toml
          node --test core/rust/web/bytecode-observation.test.mjs

      - name: Commit the validated Core lock
        run: |
          if git diff --quiet -- core/rust/Cargo.lock; then
            echo 'The Core Rust lock already matches Hara 0.1.5.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/rust/Cargo.lock
          git commit -m 'Refresh the Core Rust lock for 0.1.5'
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
