name: std.typed schema parity

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/lib/src/std/typed/**'
      - 'core/lib/test/std/typed/**'
      - 'core/spec/std/foundation-base-runtime-schema.md'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/standard-library.namespaces'
      - 'core/rust/src/core/protocol.rs'
      - 'core/rust/src/kernel/schema.rs'
      - 'core/rust/tests/std_typed_schema.rs'
      - 'core/java/src/main/java/hara/truffle/HalcSchema.java'
      - 'core/java/src/main/java/hara/truffle/HaraContext.java'
      - 'core/java/src/test/java/hara/truffle/StdTypedSchemaTest.java'
      - 'scripts/audit-std-typed-boundary.sh'
      - '.github/workflows/std-typed-schema.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/std/typed/**'
      - 'core/lib/test/std/typed/**'
      - 'core/spec/std/foundation-base-runtime-schema.md'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/standard-library.namespaces'
      - 'core/rust/src/core/protocol.rs'
      - 'core/rust/src/kernel/schema.rs'
      - 'core/rust/tests/std_typed_schema.rs'
      - 'core/java/src/main/java/hara/truffle/HalcSchema.java'
      - 'core/java/src/main/java/hara/truffle/HaraContext.java'
      - 'core/java/src/test/java/hara/truffle/StdTypedSchemaTest.java'
      - 'scripts/audit-std-typed-boundary.sh'
      - '.github/workflows/std-typed-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: std-typed-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the std.typed dependency boundary
        run: bash scripts/audit-std-typed-boundary.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused Rust schema parity
        run: cargo test --manifest-path core/rust/Cargo.toml --test std_typed_schema

  hal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the CLI specification registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Build the native Hara runtime
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml
      - name: Run focused portable registry probe
        run: |
          cat \
            core/lib/src/std/typed/registry.hal \
            core/lib/src/std/typed/schema.hal \
            core/lib/test/std/typed/registry_probe.hal \
            | core/hara --offline stdin

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the CLI specification registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Run focused Truffle schema parity
        run: mvn -B -Ptruffle -Dtest=hara.truffle.StdTypedSchemaTest test --file core/java/pom.xml
