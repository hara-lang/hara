name: Diagnose native V1 grammar fingerprint divergence v2

on:
  push:
    branches:
      - agent/789-v1-grammar-fingerprint-parity

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/789-v1-grammar-fingerprint-parity
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native Hara test runner
        run: cargo build --locked --manifest-path core/rust/Cargo.toml --bin hara-test

      - name: Capture reference and canonicalization diagnostics
        shell: bash
        run: |
          mkdir -p core/lib/test/code target .agent
          cat > core/lib/test/code/agent_v1_fingerprint_diagnostic_test.hal <<'HAL'
          (ns code.agent-v1-fingerprint-diagnostic-test
            (:use code.test)
            (:require [code.migrate :as migrate]
                      [lang.common.grammar-api :as grammar-api]
                      [lang.common.grammar-macro :as grammar-macro]))

          (defn unresolved-reference-fields
            [features]
            (vec
             (mapcat
              (fn [entry]
                (keep
                 (fn [field]
                   (let [value (get entry field)
                         normalized
                         (migrate/v1-grammar-reference-symbol value)]
                     (if (and value (not (symbol? normalized)))
                       {:op (get entry :op)
                        :field field
                        :raw (pr-str value)
                        :normalized (pr-str normalized)}
                       nil)))
                 migrate/+v1-grammar-reference-fields+))
              (vals features))))

          (fact "native V1 grammar reference diagnostics"
            (let [macro-entry (first grammar-macro/+op-macro+)
                  raw-reference (get macro-entry :macro)
                  normalized-reference
                  (migrate/v1-grammar-reference-symbol raw-reference)
                  snapshot-entry
                  (migrate/v1-grammar-entry-snapshot-data macro-entry)
                  input (migrate/current-v1-grammar-snapshot-input)
                  materialized
                  (migrate/materialize-current-v1-grammar-snapshot)
                  unresolved
                  (unresolved-reference-fields (get input :features))]
              (println "V1-DIAG raw-reference=" (pr-str raw-reference))
              (println "V1-DIAG normalized-reference="
                       (pr-str normalized-reference))
              (println "V1-DIAG raw-entry=" (pr-str macro-entry))
              (println "V1-DIAG snapshot-entry=" (pr-str snapshot-entry))
              (println "V1-DIAG canonical-entry="
                       (pr-str
                        (grammar-api/canonical-fingerprint-value snapshot-entry)))
              (println "V1-DIAG unresolved-count=" (count unresolved))
              (println "V1-DIAG unresolved-first="
                       (pr-str (vec (take 20 unresolved))))
              (println "V1-DIAG input-fingerprints="
                       (pr-str (mapv (fn [item] (get item :fingerprint))
                                    (get input :inputs))))
              (println "V1-DIAG grouped-fingerprint="
                       (get materialized :fingerprint))
              true)
            => true)

          (pr-str
           (run {:namespace "code.agent-v1-fingerprint-diagnostic-test"}))
          HAL

          set +e
          core/rust/target/debug/hara-test \
            --root "$GITHUB_WORKSPACE/core" \
            "$GITHUB_WORKSPACE/core/lib/test/code/agent_v1_fingerprint_diagnostic_test.hal" \
            > target/v1-grammar-native-diagnostic.log 2>&1
          status=$?
          set -e

          {
            echo "status=$status"
            grep 'V1-DIAG' target/v1-grammar-native-diagnostic.log || true
            echo "--- runner summary ---"
            tail -n 20 target/v1-grammar-native-diagnostic.log
          } > .agent/v1-grammar-native-diagnostic.txt

      - name: Publish the diagnostic report and remove the temporary workflow
        shell: bash
        run: |
          rm -f core/lib/test/code/agent_v1_fingerprint_diagnostic_test.hal
          rm -f .github/workflows/agent-789-diagnose-v2.yml
          git add -A .agent/v1-grammar-native-diagnostic.txt \
            .github/workflows/agent-789-diagnose-v2.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine native V1 grammar fingerprint diagnostics"
          git push origin HEAD:agent/789-v1-grammar-fingerprint-parity
