name: Promote schema normalize-with boundary

on:
  push:
    branches:
      - agent/868-schema-catalog-identity
    paths:
      - .github/workflows/agent-868-promote-normalize-with.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/868-schema-catalog-identity
          fetch-depth: 0
      - name: Promote normalize-with and remove the one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path("core/lib/src/std/typed/schema.hal")
          schema = schema_path.read_text()
          anchor = "(defmulti normalize normalize-dispatch)\n\n"
          block = '''(defn ^{:schema [:fn [:any :any] :map]}
            normalize-with
            "Normalizes schema using an explicit portable schema registry."
            [schema registry-value]
            (binding [*registry* (registry/ensure registry-value)]
              (normalize schema)))

          '''
          if schema.count(anchor) != 1:
              raise SystemExit("normalize anchor is not unique")
          if schema.count(block) != 1:
              raise SystemExit("normalize-with block is not unique")
          schema = schema.replace(block, "", 1)
          schema = schema.replace(anchor, anchor + block, 1)
          schema_path.write_text(schema)

          replacements = {
              Path("core/lib/src/std/typed/catalog/codec.hal"): (
                  '''(defn- normalize-schema
            [schema-form registry-value]
            (binding
             [std.typed.schema/*registry*
              (std.typed.registry/ensure registry-value)]
             (std.typed.schema/normalize schema-form)))''',
                  '''(defn- normalize-schema
            [schema-form registry-value]
            (std.typed.schema/normalize-with
             schema-form
             (std.typed.registry/ensure registry-value)))'''),
              Path("core/lib/src/std/typed/catalog/base.hal"): (
                  '''(defn- normalize-schema
            [schema-form registry-value]
            (binding
             [std.typed.schema/*registry*
              (std.typed.registry/ensure registry-value)]
             (std.typed.schema/normalize schema-form)))''',
                  '''(defn- normalize-schema
            [schema-form registry-value]
            (std.typed.schema/normalize-with
             schema-form
             (std.typed.registry/ensure registry-value)))'''),
          }
          for path, (before, after) in replacements.items():
              text = path.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f"expected one normalize helper in {path}")
              path.write_text(text.replace(before, after, 1))

          Path(".github/workflows/agent-868-promote-normalize-with.yml").unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            core/lib/src/std/typed/schema.hal \
            core/lib/src/std/typed/catalog/base.hal \
            core/lib/src/std/typed/catalog/codec.hal \
            .github/workflows/agent-868-promote-normalize-with.yml
          git diff --cached --check
          git commit -m "Promote explicit schema normalization boundary"
          git push origin HEAD:agent/868-schema-catalog-identity
