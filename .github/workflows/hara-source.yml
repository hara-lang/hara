name: Hara source preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Install exact Hara Native release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the declared Hara Native release
        shell: bash
        run: |
          set -euo pipefail
          native_version="$(sed -nE 's/^[[:space:]]*:project\/native \{:version "([^"]+)"\}.*/\1/p' project.edn)"
          test -n "$native_version"
          cargo install --locked --version "$native_version" --bin hara-native hara-native
          test "$(hara-native --version)" = "hara-native ${native_version}"
      - name: Save the native host for parallel source lanes
        run: cp "$(command -v hara-native)" hara-native
      - uses: actions/upload-artifact@v4
        with:
          name: hara-native
          path: hara-native

  source:
    name: Hara source suite (${{ matrix.name }})
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            roots: test
          - name: hara
            roots: test/hara
          - name: std-block
            roots: test/std/block
          - name: std-lib
            roots: test/std/lib
          - name: std-support
            roots: test/std-root test/std/foundation test/std/config test/std/fs test/std/stream test/std/typed
          - name: std-package
            roots: test/std/package
          - name: lang-base
            roots: test/lang-root test/lang/base
          - name: lang-core
            roots: test/lang/core
          - name: lang-model
            roots: test/lang/model
          - name: lang-runtime
            roots: test/lang/runtime
          - name: lang-support
            roots: test/lang/protocol test/lang/seedgen test/lang/typed
          - name: code-root
            roots: test/code-root
          - name: code-manage
            roots: test/code/manage
          - name: code-doc
            roots: test/code/doc
          - name: code-test
            roots: test/code/test
          - name: code-deploy
            roots: test/code/deploy test/code/framework
          - name: tool
            roots: test/tool
          - name: work
            roots: test/work
          - name: db
            roots: test/db
          - name: play
            roots: test/play
          - name: xt
            roots: test-lang/xt
          - name: js
            roots: test-lang/js
          - name: lua
            roots: test-lang/lua
          - name: postgres
            roots: test-lang/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hara-native
          path: native
      - name: Run the Hara source shard
        shell: bash
        env:
          TEST_ROOTS: ${{ matrix.roots }}
        run: |
          set -euo pipefail
          chmod +x native/hara-native
          mapfile -t files < <(
            for root in $TEST_ROOTS; do
              case "$root" in
                test)
                  find test -mindepth 1 -maxdepth 1 -type f -name '*.hal'
                  ;;
                test/std-root)
                  find test/std -mindepth 1 -maxdepth 1 -type f -name '*.hal'
                  ;;
                test/lang-root)
                  find test/lang -mindepth 1 -maxdepth 1 -type f -name '*.hal'
                  ;;
                test/code-root)
                  find test/code -mindepth 1 -maxdepth 1 -type f -name '*.hal'
                  ;;
                *)
                  find "$root" -type f -name '*.hal'
                  ;;
              esac
            done | sort -u
          )
          test "${#files[@]}" -gt 0
          args=()
          for file in "${files[@]}"; do
            args+=(--file "$file")
          done
          echo "Running ${#files[@]} Hara test files from ${TEST_ROOTS}"
          ./native/hara-native test --project . "${args[@]}"

  packages:
    name: Hara package graph
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      HARA_DIST_HOME: ${{ github.workspace }}/.hara-dist-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hara-native
          path: native
      - name: Stage the declared host path for the Hara distribution test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x native/hara-native
          mkdir -p ../hara-native/core/rust/target/release
          cp native/hara-native ../hara-native/core/rust/target/release/hara-native
      - name: Build and exercise the Hara distribution boundary
        run: ./native/hara-native test --project . --file test/std/package/distribution_build_acceptance_test.hal
      - name: Plan and build every catalogue package
        shell: bash
        run: |
          set -euo pipefail
          target/hara/bin/hara deploy plan --root "$GITHUB_WORKSPACE"
          target/hara/bin/hara deploy build --root "$GITHUB_WORKSPACE"
      - name: Verify every generated HARP
        shell: bash
        run: |
          set -euo pipefail
          test -s target/deploy/index.edn
          archive_count="$(find target/deploy -type f -path '*/target/package.harp' | wc -l | tr -d ' ')"
          test "$archive_count" -gt 0
          while IFS= read -r archive; do
            ./native/hara-native bundle verify "$archive"
          done < <(find target/deploy -type f -path '*/target/package.harp' | sort)
          printf 'verified %s semantic HARP archives\n' "$archive_count"
