name: Make install

on:
  push:
    paths:
      - Makefile
      - scripts/runtime/test-make-install.sh
      - .github/workflows/make-install.yml
  pull_request:
    paths:
      - Makefile
      - scripts/runtime/test-make-install.sh
      - .github/workflows/make-install.yml

permissions:
  contents: read

jobs:
  staged-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise install and uninstall targets
        run: make check-install
