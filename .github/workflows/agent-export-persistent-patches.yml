name: Agent export persistent named-value patches

on:
  push:
    branches:
      - agent/persistent-defstruct-defmutable
    paths:
      - .github/workflows/agent-export-persistent-patches.yml
      - .github/agent/full2-00
      - .github/agent/full2-01
      - .github/agent/full2-02a
      - .github/agent/full2-02b
      - .github/agent/full2-03
      - .github/agent/full2-04
      - .github/agent/full2-05a0
      - .github/agent/full2-05a1
      - .github/agent/full2-05a2
      - .github/agent/full2-05b
      - .github/agent/java-fix-1.patch.gz.b64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patches
        run: |
          cat \
            .github/agent/full2-00 \
            .github/agent/full2-01 \
            .github/agent/full2-02a \
            .github/agent/full2-02b \
            .github/agent/full2-03 \
            .github/agent/full2-04 \
            .github/agent/full2-05a0 \
            .github/agent/full2-05a1 \
            .github/agent/full2-05a2 \
            .github/agent/full2-05b \
            | base64 --decode | gzip --decompress > full2.patch
          echo '5ae8bfe82c6bb4ea27c441aa01ffddf3c0c062e20068c3b057223f6d51ad1a49  full2.patch' | sha256sum --check
          base64 --decode .github/agent/java-fix-1.patch.gz.b64 | gzip --decompress > java-fix-1.patch
          echo '72776a5c5349af694e9a7f770d492176756716036eec47e666fd877cdc67eff7  java-fix-1.patch' | sha256sum --check
          tar -czf persistent-patches.tar.gz full2.patch java-fix-1.patch
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-patches
          path: persistent-patches.tar.gz
          if-no-files-found: error
          retention-days: 1
