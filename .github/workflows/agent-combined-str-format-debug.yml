name: Agent combined strings and format debug

on:
  push:
    branches:
      - codex/combined-str-std-format

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build products
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Build candidate tools
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet \
            --manifest-path core/rust/Cargo.toml \
            --bin hara \
            --bin hara-test

      - name: Run candidate validation with diagnostics
        shell: bash
        run: |
          set -uo pipefail
          HARA="$PWD/core/rust/target/debug/hara"
          HARA_TEST="$PWD/core/rust/target/debug/hara-test"
          LOG=/tmp/combined-str-format-candidate.log

          (
            set -e
            echo '=== evaluate std.foundation.string ==='
            "$HARA" --project core --offline stdin \
              < core/lib/src/std/foundation/string.hal

            echo '=== test std.foundation.string ==='
            "$HARA_TEST" \
              --root "$PWD/core" \
              "$PWD/core/lib/test/std/foundation/string_test.hal"

            for source in \
              core/lib/src/std/format/common.hal \
              core/lib/src/std/format/table.hal \
              core/lib/src/std/format/report.hal \
              core/lib/src/std/format/terminal.hal \
              core/lib/src/std/format.hal \
              core/lib/src/std/work/report.hal
            do
              echo "=== evaluate $source ==="
              "$HARA" --project core --offline stdin < "$source"
            done

            echo '=== test report formatting ==='
            "$HARA_TEST" \
              --root "$PWD/core" \
              "$PWD/core/lib/test/std/work_report_renderer_test.hal"
          ) 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-str-format-candidate-log
          path: /tmp/combined-str-format-candidate.log
          if-no-files-found: error
