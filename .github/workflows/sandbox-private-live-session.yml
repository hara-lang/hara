name: Sandbox private live sessions

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sandbox-private-live-session.yml
      - core/rust/Cargo.lock
      - core/rust/Cargo.toml
      - core/rust/src/lib.rs
      - core/rust/src/live_session.rs
      - core/rust/src/live_session/**
      - core/rust/src/runtime/session.rs
      - core/rust/src/runtime/session_live.rs
      - core/rust/tests/sandbox_private_live_session.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-private-live-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check focused formatting
        run: |
          rustfmt --edition 2021 --check \
            core/rust/src/runtime/session_live.rs \
            core/rust/tests/sandbox_private_live_session.rs

      - name: Test private interpreter live-session ownership
        run: >-
          cargo test --locked
          --manifest-path core/rust/Cargo.toml
          --test sandbox_private_live_session

      - name: Test private HBC live-session ownership
        run: >-
          cargo test --locked
          --manifest-path core/rust/Cargo.toml
          --features bytecode-observation
          --test sandbox_private_live_session
