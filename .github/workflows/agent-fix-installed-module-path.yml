name: Validate installed-package module path

on:
  push:
    branches:
      - agent/fix-installed-package-module-path

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-installed-package-module-path
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable

      - name: Test installed package activation
        run: cargo test --manifest-path core/rust/Cargo.toml --test installed_package_dependencies

      - name: Test project resource registration
        run: cargo test --manifest-path core/rust/Cargo.toml project::tests::registers_project_sources_for_cross_file_requires

      - name: Test native REPL resource inheritance
        run: cargo test --manifest-path core/rust/Cargo.toml --bin hara repl::tests::project_resources_reach_root_and_future_sessions

      - name: Check all targets
        run: cargo check --manifest-path core/rust/Cargo.toml --all-targets

      - name: Publish the validated clean branch
        shell: bash
        run: |
          rm .github/workflows/agent-fix-installed-module-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/agent-fix-installed-module-path.yml
          git commit -m "Record installed-package module-path validation (#702)"
          git push origin HEAD:agent/fix-installed-package-module-path
