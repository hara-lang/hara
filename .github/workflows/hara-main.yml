name: Hara main preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hara-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/hara-source.yml
    with:
      # Native 0.1.33; keep this pin aligned with :project/native.
      # Release preflight omits this input and still requires crates.io.
      native_source_ref: '02caaa6bba27db2e43a373126e35ff01ed197fa6'
