name: Materialize #849 portable exception contract

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - agent/849-validation-base

permissions:
  contents: write

concurrency:
  group: materialize-hara-849-portable-exception
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.ref == 'agent/849-portable-exception-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out isolated Hara implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out validated exception specifications
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: agent/849-portable-exception-contract-product
          path: hara-specs-registry
          fetch-depth: 0

      - name: Verify source and specification ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 42651208850c49a21b61e55ec760ac69e54689c8 HEAD
          test -f hara-specs-registry/00-unsorted/platform-language/draft/conformance/exceptions.edn
          test ! -f hara-specs-registry/.github/workflows/agent-849-exception-specs.yml
          ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Materialize JVM and Rust runtime changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agents/apply-849.py runtime
          cargo fmt --manifest-path core/rust/Cargo.toml
          cargo fmt --manifest-path core/rust/raw/Cargo.toml

      - name: Build fresh native Hara tools
        run: cargo build --manifest-path core/rust/Cargo.toml --bin hara --bin hara-test

      - name: Construct and validate every unwritten HAL candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/exception-candidates /tmp/hara-849-candidate-core
          python3 scripts/agents/apply-849.py candidates --output /tmp/exception-candidates
          cp -a core /tmp/hara-849-candidate-core
          python3 scripts/agents/apply-849.py install \
            --root /tmp/hara-849-candidate-core \
            --output /tmp/exception-candidates

          python3 - <<'PY' > /tmp/hara-849-candidate-paths
          import json
          from pathlib import Path
          for path in json.loads(Path("/tmp/exception-candidates/manifest.json").read_text()):
              print(path)
          PY

          while IFS= read -r relative; do
            candidate="/tmp/exception-candidates/$relative"
            test -f "$candidate"
            core/rust/target/debug/hara \
              --project /tmp/hara-849-candidate-core \
              --offline stdin < "$candidate"
          done < /tmp/hara-849-candidate-paths

          while IFS= read -r relative; do
            case "$relative" in
              core/lib/test/*.hal|core/lib/test/**/*.hal|core/lib/test-lang/*.hal|core/lib/test-lang/**/*.hal)
                core/rust/target/debug/hara-test \
                  --root /tmp/hara-849-candidate-core \
                  "/tmp/hara-849-candidate-core/${relative#core/}"
                ;;
            esac
          done < /tmp/hara-849-candidate-paths

      - name: Install candidates, regenerate owned mirrors, and rerun fresh
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agents/apply-849.py install --output /tmp/exception-candidates
          python3 scripts/runtime/sync-rust-hal-src

          while IFS= read -r relative; do
            core/rust/target/debug/hara --project core --offline stdin < "$relative"
          done < /tmp/hara-849-candidate-paths

          while IFS= read -r relative; do
            case "$relative" in
              core/lib/test/*.hal|core/lib/test/**/*.hal|core/lib/test-lang/*.hal|core/lib/test-lang/**/*.hal)
                core/rust/target/debug/hara-test --root core "$relative"
                ;;
            esac
          done < /tmp/hara-849-candidate-paths

      - name: Run focused Rust exception, fiber, HTA, and bytecode tests
        env:
          HARA_SPECS_REGISTRY: ${{ github.workspace }}/hara-specs-registry
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml --lib \
            portable_exception_classes_and_native_diagnostics_are_distinct
          cargo test --manifest-path core/rust/Cargo.toml --lib \
            semantic_exception_class_survives_hta_round_trip
          cargo test --manifest-path core/rust/Cargo.toml --lib \
            shared_exception_corpus_matches_portable_runtime
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm \
            structured_error_code_catches_match_in_evaluator_and_bytecode
          cargo test --manifest-path core/rust/Cargo.toml --lib \
            catch_selectors_match_structured_error_codes
          cargo test --manifest-path core/rust/Cargo.toml --lib \
            throw_and_try_catch_finally_are_host_neutral

      - name: Run focused JVM exception and shared-corpus tests
        env:
          HARA_SPECS_REGISTRY: ${{ github.workspace }}/hara-specs-registry
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -DfailIfNoTests=true
          -Dtest=hara.truffle.HaraExceptionContractTest,hara.truffle.HaraExceptionCorpusTest,hara.truffle.HaraCoreLanguageConformanceTest
          test

      - name: Run complete Rust runtime, bytecode, raw-Wasm, and layout suites
        env:
          HARA_SPECS_REGISTRY: ${{ github.workspace }}/hara-specs-registry
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml --lib
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm
          cargo test --manifest-path core/rust/raw/Cargo.toml
          bash core/rust/scripts/check-layout.sh

      - name: Run complete JVM and Hara library suites
        env:
          HARA_SPECS_REGISTRY: ${{ github.workspace }}/hara-specs-registry
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f core/java/pom.xml -Ptruffle package
          ./scripts/runtime/run-lib-tests

      - name: Run language, Foundation, and source-layout gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/check-language-source-layout
          python3 scripts/check_foundation_surface.py \
            --report generated/foundation-surface-conformance.json
          git diff --check
          python3 scripts/agents/apply-849.py audit

      - name: Enforce exception migration invariants
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'error/code' -- \
              'core/lib/src/**/*.hal' \
              'core/lib/src-lang/**/*.hal' \
              'core/rust/src/**/*.rs' \
              'core/rust/raw/src/**/*.rs' \
              'core/java/src/main/**/*.java'; then
            echo "active :error/code contract remains" >&2
            exit 1
          fi
          ! git grep -nE 'catch[[:space:]]+:ex\.class/' -- \
              'core/lib/src/**/*.hal' \
              'core/lib/src-lang/**/*.hal'
          ! git grep -nE '(:ex/native-type|:native-type)' -- \
              'hara-specs-registry/00-unsorted/platform-language/draft/conformance/l0.edn'

      - name: Publish only the validated #849 product branch
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/agents/apply-849.py
          rm -rf scripts/agents/.apply-849
          rm -f .github/agent-849-trigger
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "Implement portable semantic exception classes (#849)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
