name: Agent 1022 validation

on:
  push:
    branches:
      - agent/1022-remove-native-decimal-bootstrap

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize reviewed insertions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("core/java/src/main/java/hara/lang/base/NumOps.java")
          text = path.read_text()
          pattern = re.compile(
              r"    private static int compareIntegerToDouble\(BigInteger integer, double floating\) \{.*?"
              r"    private static boolean ordered\(Number x, Number y\) \{\n"
              r"      return !Double\.isNaN\(x\.doubleValue\(\)\) && !Double\.isNaN\(y\.doubleValue\(\)\);\n"
              r"    \}",
              re.S,
          )
          replacement = """    private static int compareIntegerToDouble(BigInteger integer, double floating) {
              if (Double.isNaN(floating)) return -1;
              if (floating == Double.POSITIVE_INFINITY) return -1;
              if (floating == Double.NEGATIVE_INFINITY) return 1;
              return new BigDecimal(integer).compareTo(BigDecimal.valueOf(floating));
            }

            private static boolean isFloating(Number value) {
              return value instanceof Double || value instanceof Float;
            }

            private static int compareExactly(Number x, Number y) {
              boolean xFloat = isFloating(x);
              boolean yFloat = isFloating(y);
              if (xFloat && yFloat) {
                double left = x.doubleValue();
                double right = y.doubleValue();
                if (left == 0.0d && right == 0.0d) return 0;
                return Double.compare(left, right);
              }
              if (xFloat) {
                return -compareIntegerToDouble(NumUtils.toBigInteger(y), x.doubleValue());
              }
              if (yFloat) {
                return compareIntegerToDouble(NumUtils.toBigInteger(x), y.doubleValue());
              }
              return NumUtils.toBigInteger(x).compareTo(NumUtils.toBigInteger(y));
            }

            private static boolean ordered(Number x, Number y) {
              return !Double.isNaN(x.doubleValue()) && !Double.isNaN(y.doubleValue());
            }"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"NumOps normalization expected one match, found {count}")
          path.write_text(text)

          test = Path("core/java/src/test/java/hara/lang/base/NumTest.java")
          text = test.read_text()
          if not text.endswith("\n\n}\n"):
              raise RuntimeError("NumTest ending did not match the generated form")
          test.write_text(text[:-3] + "}\n")
          PY

          cargo fmt --manifest-path core/rust/Cargo.toml -- --check
          git diff --check

      - name: Run focused Rust tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml compares_large_integers_to_floats_without_rounding
          cargo test --manifest-path core/rust/hta-codec/Cargo.toml retired_decimal_tag_fails_closed

      - name: Run focused Java tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -f core/java/pom.xml -Ptruffle \
            -Dtest=NumTest,HaraNumericInteropTest,ParserTest test

      - name: Commit validated normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/java/src/main/java/hara/lang/base/NumOps.java \
                  core/java/src/test/java/hara/lang/base/NumTest.java
          git commit -m 'test(runtime): validate native Decimal removal (#1022)'
          git push origin HEAD:agent/1022-remove-native-decimal-bootstrap
