name: Agent 1022 validation

on:
  push:
    branches:
      - agent/1022-remove-native-decimal-bootstrap
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/agent-1022-bootstrap.yml"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout hara-benchmarks
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark corpus at the differential fixture path
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn \
            "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Complete the reviewed Decimal-free delivery slice
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          path = Path("core/java/src/main/java/hara/lang/base/NumOps.java")
          text = path.read_text()
          start_marker = "    private static int compareIntegerToDouble(BigInteger integer, double floating) {"
          end_marker = "\n\n    @Override\n    public final Number add(Number x, Number y) {"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise RuntimeError("NumOps comparison block was not found")
          replacement = """    private static int compareIntegerToDouble(BigInteger integer, double floating) {
              if (Double.isNaN(floating)) return -1;
              if (floating == Double.POSITIVE_INFINITY) return -1;
              if (floating == Double.NEGATIVE_INFINITY) return 1;
              return new BigDecimal(integer).compareTo(BigDecimal.valueOf(floating));
            }

            private static boolean isFloating(Number value) {
              return value instanceof Double || value instanceof Float;
            }

            private static int compareExactly(Number x, Number y) {
              boolean xFloat = isFloating(x);
              boolean yFloat = isFloating(y);
              if (xFloat && yFloat) {
                double left = x.doubleValue();
                double right = y.doubleValue();
                if (left == 0.0d && right == 0.0d) return 0;
                return Double.compare(left, right);
              }
              if (xFloat) {
                return -compareIntegerToDouble(NumUtils.toBigInteger(y), x.doubleValue());
              }
              if (yFloat) {
                return compareIntegerToDouble(NumUtils.toBigInteger(x), y.doubleValue());
              }
              return NumUtils.toBigInteger(x).compareTo(NumUtils.toBigInteger(y));
            }

            private static boolean ordered(Number x, Number y) {
              return !Double.isNaN(x.doubleValue()) && !Double.isNaN(y.doubleValue());
            }"""
          path.write_text(text[:start] + replacement + text[end:])

          test = Path("core/java/src/test/java/hara/lang/base/NumTest.java")
          text = test.read_text()
          if text.endswith("\n\n}\n"):
              test.write_text(text[:-3] + "}\n")
          elif not text.endswith("\n}\n"):
              raise RuntimeError("NumTest ending was not recognized")

          replace_once(
              "core/rust/Cargo.toml",
              "9418d5f5bf49b618f374aa663832f11b16f01815",
              "c781d30c8c8dbbdc26cf91ad1f7e74152056cba0",
          )
          replace_once(
              "core/rust/scripts/layout-baseline.txt",
              "lines src/numeric.rs 857\n",
              "",
          )
          replace_once(
              "core/rust/src/package_manifest/parse.rs",
              "        Form::Decimal(value) => Form::Decimal(value.clone()),\n",
              "",
          )
          replace_once(
              "core/rust/src/bin/hara/cli/project.rs",
              "        Form::BigInteger(value) | Form::Decimal(value) => JsonValue::String(value.clone()),\n",
              "        Form::BigInteger(value) => JsonValue::String(value.clone()),\n",
          )
          PY

          ! git grep -n ':std.native.Decimal' -- core
          ! git grep -n 'Value::Decimal' -- core
          ! git grep -n 'Form::Decimal' -- core
          ! git grep -n 'MetadataValue::Decimal' -- core
          ! git grep -n 'HaraDecimal' -- core

          cargo update --manifest-path core/rust/Cargo.toml -p hara-db-postgres

          mapfile -t changed_rust < <(
            git diff --name-only 306b98de7ef036182c1af4e0c9bdbd2b4b67720b -- '*.rs'
          )
          if ((${#changed_rust[@]})); then
            rustfmt --edition 2021 --config skip_children=true "${changed_rust[@]}"
          fi

          cargo run --quiet --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm \
            --bin hara-foundation-artifact -- generate
          cargo run --quiet --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm \
            --bin hara-foundation-artifact -- check

          ! grep -Fx 'lines src/numeric.rs 857' core/rust/scripts/layout-baseline.txt
          git diff --check

      - name: Run focused Rust validation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_rust < <(
            git diff --name-only 306b98de7ef036182c1af4e0c9bdbd2b4b67720b -- '*.rs'
          )
          if ((${#changed_rust[@]})); then
            rustfmt --edition 2021 --config skip_children=true --check "${changed_rust[@]}"
          fi
          cargo check --manifest-path core/rust/Cargo.toml
          cargo test --manifest-path core/rust/Cargo.toml compares_large_integers_to_floats_without_rounding
          cargo test --manifest-path core/rust/hta-codec/Cargo.toml retired_decimal_tag_fails_closed

      - name: Run focused JVM and library validation
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -f core/java/pom.xml -Ptruffle \
            -Dtest=NumTest,HaraNumericInteropTest,ParserTest,SessionKernelTest test
          ./scripts/runtime/run-lib-tests
          test "$(./core/hara eval '(type 1.5)')" = ':std.native.Float'

      - name: Commit the verified implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -t staged_paths < <(git diff --name-only)
          if ((${#staged_paths[@]})); then
            git add -- "${staged_paths[@]}"
          fi
          git reset -- .github/workflows/agent-1022-bootstrap.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(runtime): complete native Decimal removal (#1022)'
          git push origin HEAD:agent/1022-remove-native-decimal-bootstrap
