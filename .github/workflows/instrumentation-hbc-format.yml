name: Guarded HBC controller formatter

on:
  push:
    branches: [instrumentation-live-code-vm-883]
    paths:
      - 'core/rust/src/live_session.rs'
      - 'core/rust/src/live_session/instrumented_hbc.rs'
      - 'core/rust/src/runtime/session_live.rs'
      - '.github/workflows/instrumentation-hbc-format.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instrumentation-hbc-format
  cancel-in-progress: true

jobs:
  format-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instrumentation-live-code-vm-883
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format the HBC controller slice
        run: |
          rustfmt --edition 2021 \
            core/rust/src/live_session.rs \
            core/rust/src/live_session/instrumented_hbc.rs \
            core/rust/src/runtime/session_live.rs

      - name: Enforce bounded controller module
        run: |
          lines=$(wc -l < core/rust/src/live_session/instrumented_hbc.rs)
          echo "instrumented_hbc.rs: $lines"
          test "$lines" -lt 700

      - name: Compile the actual instrumented HBC feature slice
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --features bytecode-observation --lib --no-run

      - name: Commit only formatted compile-valid sources
        run: |
          if git diff --quiet -- \
            core/rust/src/live_session.rs \
            core/rust/src/live_session/instrumented_hbc.rs \
            core/rust/src/runtime/session_live.rs; then
            echo "HBC controller sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/rust/src/live_session.rs \
            core/rust/src/live_session/instrumented_hbc.rs \
            core/rust/src/runtime/session_live.rs
          git commit -m "Format instrumented HBC LiveSession sources"
          git push origin HEAD:instrumentation-live-code-vm-883
