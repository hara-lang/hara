name: Bootstrap runtime-aware JVM CLI integration

on:
  push:
    branches:
      - agent/runtime-aware-projects

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/runtime-aware-projects

      - name: Check out specification corpus
        run: |
          git clone --depth 1 https://github.com/hara-lang/hara-specs-registry.git ../hara-specs-registry
          ln -s ../hara-specs-registry hara-specs-registry

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Apply JVM CLI integration
        run: python3 .github/agent/runtime-aware-project-cli.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Test project loader and CLI integration
        run: mvn -B -Ptruffle -Dtest=HaraProjectTest,MainTest test --file core/java/pom.xml

      - name: Commit validated integration
        run: |
          rm hara-specs-registry
          rm -rf ../hara-specs-registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-runtime-aware-project-cli.yml
          git rm -f .github/agent/runtime-aware-project-cli.py
          git add -A
          git commit -m "Use runtime profiles in JVM project commands"
          git push origin HEAD:agent/runtime-aware-projects
