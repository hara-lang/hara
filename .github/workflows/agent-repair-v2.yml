name: Apply Truffle tuple regression repair v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-repair-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Git and rebase onto main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Extract and apply the focused repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-source-snapshot.yml').read_text()
          marker = "          cat > /tmp/truffle-tuple-repair.patch <<'PATCH'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\nPATCH\n", start)
          Path('/tmp/truffle-tuple-repair.patch').write_text(source[start:end] + '\n')
          PY
          git apply --check /tmp/truffle-tuple-repair.patch
          git apply /tmp/truffle-tuple-repair.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/java/src/main/java/hara/truffle/HaraJavaAdapters.java')
          source = path.read_text()
          old = '''  private static Integer assocIndex(Object key) {
    return HaraNumericConversions.toInt(key, "assoc index");
  }
'''
          new = '''  private static Integer assocIndex(Object key) {
    if (!HaraNumericConversions.isNumeric(key)) {
      throw new HaraException("assoc index must be a number");
    }
    return HaraNumericConversions.toInt(key, "assoc index");
  }
'''
          if old not in source:
              raise SystemExit('assocIndex helper changed unexpectedly')
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/agent-source-snapshot.yml
          rm .github/workflows/agent-repair-v2.yml

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run focused Truffle regression slice
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -DfailIfNoTests=true
          -Dtest=hara.kernel.builtin.BuiltinStructTest,hara.truffle.FoundationFallbackDemandTest,hara.truffle.HaraLanguageTest
          test

      - name: Commit verified repair
        run: |
          git add -A
          git commit -m "truffle: restore compact tuple protocol semantics"
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
