name: Apply live code.vm semantic boundaries

# Semantic evaluator visibility verification trigger.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-repair-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Git and rebase onto main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Apply semantic continuation instrumentation
        run: |
          python3 scripts/runtime/prepare-code-vm-semantic-boundaries.py
          python3 scripts/runtime/apply-code-vm-semantic-boundaries.py
          python3 scripts/runtime/finalize-code-vm-semantic-boundaries.py
          rm scripts/runtime/prepare-code-vm-semantic-boundaries.py
          rm scripts/runtime/apply-code-vm-semantic-boundaries.py
          rm scripts/runtime/finalize-code-vm-semantic-boundaries.py
          rm .github/workflows/agent-code-vm-semantic-repair.yml
          git checkout origin/main -- .github/workflows/agent-repair-v2.yml

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Format touched Rust
        run: |
          rustfmt --edition 2021 \
            core/rust/src/fiber.rs \
            core/rust/src/fiber/coroutine.rs \
            core/rust/src/fiber/coroutine/observation.rs \
            core/rust/src/fiber/coroutine/semantic.rs \
            core/rust/src/fiber/coroutine/snapshot.rs

      - name: Test all live evaluator slices
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            core::fiber::coroutine --lib

      - name: Compile live evaluator for browser Wasm
        run: |
          cargo check --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown --lib

      - name: Commit verified semantic boundaries
        run: |
          git add -A
          git commit -m "code.vm: attach semantic source and frame evidence"
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
