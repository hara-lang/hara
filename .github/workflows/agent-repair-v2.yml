name: Verify live interpreter observation session

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-repair-v2.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure Git and rebase onto main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Restore shared repair workflow before the verified commit
        run: git checkout origin/main -- .github/workflows/agent-repair-v2.yml

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Format interpreter observation sources
        run: |
          rustfmt --edition 2021 \
            core/rust/src/fiber/coroutine/observation.rs \
            core/rust/interpreter-observation-raw/src/lib.rs

      - name: Test the complete live evaluator slice
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            core::fiber::coroutine --lib

      - name: Test the native raw interpreter session ABI
        run: |
          cargo test --manifest-path \
            core/rust/interpreter-observation-raw/Cargo.toml

      - name: Compile the raw interpreter session for browser Wasm
        run: |
          cargo check --manifest-path \
            core/rust/interpreter-observation-raw/Cargo.toml \
            --target wasm32-unknown-unknown

      - name: Build the browser release payload
        run: bash scripts/runtime/build-interpreter-observation-wasm

      - name: Commit verified interpreter observation session
        run: |
          git add -A
          git commit -m "code.vm: own isolated interpreter observation sessions"
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
