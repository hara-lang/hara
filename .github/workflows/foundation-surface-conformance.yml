name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Foundation surface checker
        run: |
          python scripts/test_check_foundation_surface.py
          python -m py_compile scripts/check_foundation_surface.py scripts/test_check_foundation_surface.py

      - name: Validate source, tests, and retired-name evidence
        run: python scripts/check_foundation_surface.py --report generated/foundation-surface-conformance.json

  complete-script-port:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/823-script-port-completion' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/823-script-port-completion
          fetch-depth: 0

      - name: Checkout pinned Foundation source authority
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: fe54cc866473a888bfbd4ce2d3de6d8011f09f72
          path: foundation-base
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Normalize portable script materializer guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.agent/complete-script-port.py')
          source = path.read_text()
          join_old = 'mrep (symbol (str/join "." (conj base msym)))]'
          join_new = 'mrep (symbol (str/join "." (map str (conj base msym))))]'
          if source.count(join_old) != 2:
              raise SystemExit(f'expected two template join sites, found {source.count(join_old)}')
          source = source.replace(join_old, join_new)
          guard_old = 'if source.count("84") != 4:'
          guard_new = 'if source.count("84") != 6:'
          if source.count(guard_old) != 1:
              raise SystemExit('script inventory count guard changed')
          source = source.replace(guard_old, guard_new, 1)
          source = source.replace('expected four pinned-count literals',
                                  'expected six pinned-count literals', 1)
          path.write_text(source)
          PY

      - name: Materialize pre-write candidate
        run: |
          python -m py_compile .agent/complete-script-port.py .agent/patch-script-port.py
          python .agent/complete-script-port.py candidate
          git diff --check -- core/private/tmp/script_port_candidate_test.hal

      - name: Evaluate and test before product write
        env:
          RUST_BACKTRACE: full
        run: |
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/private/tmp/script_port_candidate_test.hal
          rm core/private/tmp/script_port_candidate_test.hal

      - name: Write validated product candidate
        run: |
          python .agent/complete-script-port.py write
          python .agent/patch-script-port.py
          python -m py_compile scripts/runtime/materialize-code-migrate-script-ledger
          python scripts/runtime/materialize-code-migrate-script-ledger \
            --repo-root . --foundation-root foundation-base --write
          python scripts/runtime/materialize-code-migrate-script-ledger \
            --repo-root . --foundation-root foundation-base --check
          git diff --check

      - name: Run native Hara acceptance
        env:
          RUST_BACKTRACE: full
        run: |
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test-lang/lang/core/script_port_test.hal
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test-lang/lang/core/script_contract_test.hal
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test/code/migrate_script_test.hal
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test/code/migrate_test.hal

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run JVM Truffle acceptance
        run: |
          cat > core/java/src/test/java/hara/truffle/AgentScriptPortCompletionTest.java <<'JAVA'
          package hara.truffle;

          import org.junit.runner.RunWith;

          @RunWith(HaraJUnitRunner.class)
          @HaraTestSource({
              "lib/test-lang/lang/core/script_port_test.hal",
              "lib/test-lang/lang/core/script_contract_test.hal",
              "lib/test/code/migrate_script_test.hal",
              "lib/test/code/migrate_test.hal"
          })
          public final class AgentScriptPortCompletionTest {}
          JAVA
          mvn -B -f core/java/pom.xml -Ptruffle \
            -Dtest=hara.truffle.AgentScriptPortCompletionTest test
          rm core/java/src/test/java/hara/truffle/AgentScriptPortCompletionTest.java

      - name: Publish only validated product files
        run: |
          rm -rf foundation-base .agent
          rm -f .github/workflows/agent-840-script-port.yml
          git fetch origin main
          git show origin/main:.github/workflows/foundation-surface-conformance.yml \
            > .github/workflows/foundation-surface-conformance.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete portable script family port"
          git push origin HEAD:agent/823-script-port-completion
