name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/test_check_foundation_surface.py
          python scripts/check_foundation_surface.py --report generated/foundation-surface-conformance.json

  complete-script-port:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/823-script-port-completion' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/823-script-port-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Hara once
        run: cargo build --manifest-path core/rust/Cargo.toml --bin hara
      - name: Isolate namespace and require shape
        shell: bash
        run: |
          set -u
          HARA=core/rust/target/debug/hara

          probe() {
            local label="$1"
            local file="$2"
            echo "=== $label ==="
            timeout --signal=TERM --kill-after=5s 20s \
              "$HARA" --project core --offline stdin < "$file"
            local status=$?
            if [[ $status -eq 0 ]]; then
              echo "PROBE PASS: $label"
            elif [[ $status -eq 124 || $status -eq 137 || $status -eq 143 ]]; then
              echo "PROBE HANG: $label (status=$status)"
            else
              echo "PROBE FAIL: $label (status=$status)"
            fi
            return 0
          }

          cat > /tmp/a0.hal <<'HAL'
          (ns demo.script-annex)
          HAL
          probe 'A0 unrelated sibling namespace' /tmp/a0.hal

          cat > /tmp/a1.hal <<'HAL'
          (ns lang.core.script.annex)
          HAL
          probe 'A1 nested namespace only' /tmp/a1.hal

          cat > /tmp/a2.hal <<'HAL'
          (ns lang.core.script-annex)
          HAL
          probe 'A2 sibling namespace only' /tmp/a2.hal

          cat > /tmp/a3.hal <<'HAL'
          (ns lang.core.script-annex
            (:require [lang.core.runtime :as runtime]))
          HAL
          probe 'A3 sibling plus runtime require' /tmp/a3.hal

          cat > /tmp/a4.hal <<'HAL'
          (ns lang.core.script-annex
            (:require [lang.core.script :as script]))
          HAL
          probe 'A4 sibling plus script require' /tmp/a4.hal

          cat > /tmp/a5.hal <<'HAL'
          (ns lang.core.script-annex
            (:require [lang.core.runtime :as runtime]
                      [lang.core.script :as script]))
          HAL
          probe 'A5 sibling plus both requires' /tmp/a5.hal

          cat > /tmp/a6.hal <<'HAL'
          (ns lang.core.script-annex
            (:require [lang.core.runtime :as runtime]
                      [lang.core.script :as script]))
          (def +registry+ (atom {}))
          (def +runtimes+ (atom {}))
          (defn current-namespace-symbol [] (symbol (str (current-namespace))))
          (defn coordinate [namespace tag] [namespace tag])
          HAL
          probe 'A6 sibling plus state and basic helpers' /tmp/a6.hal
