name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Foundation surface checker
        run: |
          python scripts/test_check_foundation_surface.py
          python -m py_compile \
            scripts/check_foundation_surface.py \
            scripts/test_check_foundation_surface.py

      - name: Validate source, tests, and retired-name evidence
        run: |
          python scripts/check_foundation_surface.py \
            --report generated/foundation-surface-conformance.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-surface-conformance
          path: generated/foundation-surface-conformance.json
          if-no-files-found: warn
          retention-days: 30

  inventory-script-authorities:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/823-script-migration-ledger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/823-script-migration-ledger
          fetch-depth: 0

      - name: Checkout the pinned Foundation source authority
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: fe54cc866473a888bfbd4ce2d3de6d8011f09f72
          path: foundation-base
          fetch-depth: 1

      - name: Derive public source and current target inventories
        shell: bash
        run: |
          mkdir -p .agent
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          SOURCE_REVISION = "fe54cc866473a888bfbd4ce2d3de6d8011f09f72"
          SOURCE_FILES = [
              "src/tahto/core/script.clj",
              "src/tahto/core/script_annex.clj",
              "src/tahto/core/script_control.clj",
              "src/tahto/core/script_def.clj",
              "src/tahto/core/script_lint.clj",
              "src/tahto/core/script_macro.clj",
          ]
          TARGET_FILES = [
              "core/lib/src/lang/core.hal",
              "core/lib/src/lang/core/script.hal",
          ]
          DEFINE_HEADS = {
              "def", "defn", "defmacro", "defrecord", "deftype",
              "defprotocol", "defmulti", "defstruct", "defmutable",
          }

          def top_level_forms(text: str) -> list[str]:
              forms: list[str] = []
              start: int | None = None
              depth = 0
              in_string = False
              escaped = False
              in_comment = False
              for index, char in enumerate(text):
                  if in_comment:
                      if char == "\n":
                          in_comment = False
                      continue
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == ";":
                      in_comment = True
                      continue
                  if char == '"':
                      in_string = True
                      continue
                  if char == "(":
                      if depth == 0:
                          start = index
                      depth += 1
                  elif char == ")" and depth:
                      depth -= 1
                      if depth == 0 and start is not None:
                          forms.append(text[start:index + 1])
                          start = None
              if depth != 0:
                  raise RuntimeError("unbalanced top-level form")
              return forms

          def form_head(form: str) -> str | None:
              match = re.match(r"\(\s*([^\s\[\](){}]+)", form)
              return match.group(1) if match else None

          def skip_metadata(source: str, offset: int) -> int:
              length = len(source)
              while True:
                  while offset < length and source[offset].isspace():
                      offset += 1
                  if offset >= length or source[offset] != "^":
                      return offset
                  offset += 1
                  while offset < length and source[offset].isspace():
                      offset += 1
                  if offset < length and source[offset] in "{[":
                      opener = source[offset]
                      closer = "}" if opener == "{" else "]"
                      depth = 0
                      in_string = False
                      escaped = False
                      while offset < length:
                          char = source[offset]
                          if in_string:
                              if escaped:
                                  escaped = False
                              elif char == "\\":
                                  escaped = True
                              elif char == '"':
                                  in_string = False
                          elif char == '"':
                              in_string = True
                          elif char == opener:
                              depth += 1
                          elif char == closer:
                              depth -= 1
                              if depth == 0:
                                  offset += 1
                                  break
                          offset += 1
                  else:
                      while offset < length and not source[offset].isspace():
                          offset += 1

          def definition(form: str) -> dict[str, str] | None:
              head = form_head(form)
              if head not in DEFINE_HEADS:
                  return None
              cursor = form.find(head) + len(head)
              cursor = skip_metadata(form, cursor)
              match = re.match(r"([^\s\[\](){}]+)", form[cursor:])
              if not match:
                  raise RuntimeError(f"cannot read definition name from {form[:100]!r}")
              name = match.group(1)
              prefix = form[:cursor]
              if head == "defn-" or "^:private" in prefix or ":private true" in prefix:
                  return None
              return {"head": head, "name": name}

          def namespace_name(forms: list[str]) -> str:
              for form in forms:
                  if form_head(form) == "ns":
                      match = re.match(r"\(\s*ns\s+([^\s\[\](){}]+)", form)
                      if match:
                          return match.group(1)
              raise RuntimeError("namespace form not found")

          def inventory(path: Path, display_path: str) -> dict[str, object]:
              forms = top_level_forms(path.read_text(encoding="utf-8"))
              namespace = namespace_name(forms)
              definitions = [item for form in forms if (item := definition(form))]
              references = [f"{namespace}/{item['name']}" for item in definitions]
              duplicates = sorted({ref for ref in references if references.count(ref) > 1})
              if duplicates:
                  raise RuntimeError(f"duplicate definitions in {display_path}: {duplicates}")
              return {
                  "namespace": namespace,
                  "path": display_path,
                  "definitions": definitions,
                  "references": references,
              }

          source_units = [
              inventory(Path("foundation-base") / path, path)
              for path in SOURCE_FILES
          ]
          target_units = [inventory(Path(path), path) for path in TARGET_FILES]

          source_references = [
              reference
              for unit in source_units
              for reference in unit["references"]
          ]
          target_references = [
              reference
              for unit in target_units
              for reference in unit["references"]
          ]
          source_names = {reference.split("/", 1)[1] for reference in source_references}
          target_by_namespace = {
              unit["namespace"]: {
                  reference.split("/", 1)[1] for reference in unit["references"]
              }
              for unit in target_units
          }
          lang_core_overlap = sorted(
              target_by_namespace.get("lang.core", set())
              & target_by_namespace.get("lang.core.script", set())
          )
          source_target_name_overlap = sorted(
              source_names
              & set().union(*target_by_namespace.values())
          )

          report = {
              "source": {
                  "repository": "zcaudate-xyz/foundation-base",
                  "revision": SOURCE_REVISION,
                  "units": source_units,
                  "reference_count": len(source_references),
                  "references": source_references,
              },
              "target": {
                  "repository": "hara-lang/hara",
                  "units": target_units,
                  "reference_count": len(target_references),
                  "references": target_references,
              },
              "overlap": {
                  "lang.core--lang.core.script": lang_core_overlap,
                  "foundation-name--hara-name": source_target_name_overlap,
              },
          }
          Path(".agent/foundation-script-inventory.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "source_reference_count": len(source_references),
              "target_reference_count": len(target_references),
              "lang_core_overlap": lang_core_overlap,
          }, indent=2))
          PY

      - name: Publish the diagnostic inventory and restore the workflow
        shell: bash
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:.github/workflows/foundation-surface-conformance.yml" \
            > .github/workflows/foundation-surface-conformance.yml
          git add .agent/foundation-script-inventory.json \
            .github/workflows/foundation-surface-conformance.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record portable script migration inventory"
          git push origin HEAD:agent/823-script-migration-ledger
