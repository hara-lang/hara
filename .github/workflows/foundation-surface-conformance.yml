name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Foundation surface checker
        run: |
          python scripts/test_check_foundation_surface.py
          python -m py_compile \
            scripts/check_foundation_surface.py \
            scripts/test_check_foundation_surface.py

      - name: Validate source, tests, and retired-name evidence
        run: |
          python scripts/check_foundation_surface.py \
            --report generated/foundation-surface-conformance.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-surface-conformance
          path: generated/foundation-surface-conformance.json
          if-no-files-found: warn
          retention-days: 30

  implement-v1-grammar-reference-parity:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/789-v1-grammar-fingerprint-parity' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/789-v1-grammar-fingerprint-parity
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Add the raw Var reference extractor and regression fact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          source_path = Path("core/lib/src/code/migrate.hal")
          source = source_path.read_text(encoding="utf-8")

          helper_anchor = dedent("""\
          (defn v1-grammar-reference-symbol
            [value]
            (if (or (nil? value) (symbol? value))
              value
              (let [text (pr-str value)]
                (if (str/starts-with? text "#'")
                  (symbol (subs text 2))
                  value))))

          (defn v1-grammar-snapshot-data
          """)
          helper_replacement = dedent("""\
          (defn v1-grammar-reference-symbol
            [value]
            (if (or (nil? value) (symbol? value))
              value
              (let [text (pr-str value)]
                (if (str/starts-with? text "#'")
                  (symbol (subs text 2))
                  value))))

          (defn v1-grammar-reference-at
            "Extracts executable grammar identity before runtime call dereferencing."
            [entry field]
            (let [value (get entry field)]
              (if (or (nil? value) (symbol? value))
                value
                (or (try
                      (var-sym (get entry field))
                      (catch Exception _ nil))
                    (v1-grammar-reference-symbol value)))))

          (defn v1-grammar-snapshot-data
          """)
          if source.count(helper_anchor) != 1:
              raise SystemExit(
                  f"expected one V1 reference helper anchor, found {source.count(helper_anchor)}"
              )
          source = source.replace(helper_anchor, helper_replacement)

          source, feature_count = re.subn(
              r"\(v1-grammar-reference-symbol\n\s+\(get record field\)\)",
              "(v1-grammar-reference-at record field)",
              source,
              count=1,
          )
          if feature_count != 1:
              raise SystemExit(
                  f"expected one multiline feature extraction site, found {feature_count}"
              )

          entry_anchor = "(v1-grammar-reference-symbol (get record field))"
          entry_replacement = "(v1-grammar-reference-at record field)"
          if source.count(entry_anchor) != 1:
              raise SystemExit(
                  f"expected one grouped extraction site, found {source.count(entry_anchor)}"
              )
          source = source.replace(entry_anchor, entry_replacement)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("core/lib/test/code/migrate_test.hal")
          test = test_path.read_text(encoding="utf-8")
          fact_anchor = '(fact "the checked-in V1 grammar equals current code.migrate materialization"'
          regression = dedent("""\
          (fact "V1 snapshot extraction preserves qualified grammar reference identity"
            (let [entry (first (first migrate/+v1-grammar-macro-categories+))
                  snapshot (migrate/v1-grammar-entry-snapshot-data entry)
                  reference (:macro snapshot)]
              [(symbol? reference) (str reference)])
            => [true "lang.common.grammar-macro/tf-macroexpand"])

          """)
          if test.count(fact_anchor) != 1:
              raise SystemExit(
                  f"expected one checked-in snapshot fact, found {test.count(fact_anchor)}"
              )
          if "V1 snapshot extraction preserves qualified grammar reference identity" not in test:
              test = test.replace(fact_anchor, regression + fact_anchor)
          test_path.write_text(test, encoding="utf-8")
          PY

          git diff --check -- \
            core/lib/src/code/migrate.hal \
            core/lib/test/code/migrate_test.hal

      - uses: dtolnay/rust-toolchain@stable

      - name: Run native code.migrate acceptance
        env:
          RUST_BACKTRACE: full
        run: |
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test/code/migrate_test.hal

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run the same code.migrate suite on JVM Truffle
        shell: bash
        run: |
          cat > core/java/src/test/java/hara/truffle/AgentV1GrammarFingerprintTest.java <<'JAVA'
          package hara.truffle;

          import org.junit.runner.RunWith;

          @RunWith(HaraJUnitRunner.class)
          @HaraTestSource({"lib/test/code/migrate_test.hal"})
          public final class AgentV1GrammarFingerprintTest {}
          JAVA

          mvn -B -f core/java/pom.xml -Ptruffle \
            -Dtest=hara.truffle.AgentV1GrammarFingerprintTest test
          rm core/java/src/test/java/hara/truffle/AgentV1GrammarFingerprintTest.java

      - name: Publish only the validated product change
        shell: bash
        run: |
          rm -rf .agent
          rm -f .github/workflows/agent-789-diagnose.yml
          rm -f .github/workflows/agent-789-diagnose-v2.yml
          rm -f .github/workflows/agent-789-diagnose-v3.yml
          rm -f .github/workflows/agent-789-implement.yml
          git fetch origin "$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:.github/workflows/foundation-surface-conformance.yml" \
            > .github/workflows/foundation-surface-conformance.yml

          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Canonicalize V1 grammar references before dereference"
          git push origin HEAD:agent/789-v1-grammar-fingerprint-parity
