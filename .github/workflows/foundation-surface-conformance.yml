name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Foundation surface checker
        run: |
          python scripts/test_check_foundation_surface.py
          python -m py_compile \
            scripts/check_foundation_surface.py \
            scripts/test_check_foundation_surface.py

      - name: Validate source, tests, and retired-name evidence
        run: |
          python scripts/check_foundation_surface.py \
            --report generated/foundation-surface-conformance.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-surface-conformance
          path: generated/foundation-surface-conformance.json
          if-no-files-found: warn
          retention-days: 30

  implement-script-migration-ledger:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/823-script-migration-ledger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/823-script-migration-ledger
          fetch-depth: 0

      - name: Checkout the pinned Foundation source authority
        uses: actions/checkout@v4
        with:
          repository: zcaudate-xyz/foundation-base
          ref: fe54cc866473a888bfbd4ce2d3de6d8011f09f72
          path: foundation-base
          fetch-depth: 1

      - name: Materialize the source-owned ledger and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import Counter
          from pathlib import Path

          REVISION = "fe54cc866473a888bfbd4ce2d3de6d8011f09f72"
          SCRIPT_VALIDATION = "lang.core.script-contract-test/run"
          COMPILER_VALIDATION = "lang.common.compiler-test/run"
          LEDGER_VALIDATION = "code.migrate-script-test/run"

          report = json.loads(
              Path(".agent/foundation-script-inventory.json").read_text(encoding="utf-8")
          )
          source = report["source"]
          units = source["units"]
          source_refs = source["references"]
          if source["revision"] != REVISION or len(source_refs) != 84:
              raise SystemExit("the diagnostic source inventory is not the pinned 84-reference authority")
          if len(source_refs) != len(set(source_refs)):
              raise SystemExit("the source inventory contains duplicate references")

          paths = {
              ref: unit["path"]
              for unit in units
              for ref in unit["references"]
          }
          records: dict[str, dict[str, str | None]] = {}

          def adapted(ref: str, target: str, stage_from: str, stage_to: str,
                      reason: str, validation: str = SCRIPT_VALIDATION,
                      disposition: str = "adapted") -> None:
              if ref in records:
                  raise RuntimeError(f"duplicate disposition for {ref}")
              records[ref] = {
                  "target": target,
                  "disposition": disposition,
                  "stage_from": stage_from,
                  "stage_to": stage_to,
                  "reason": reason,
                  "validation": validation,
              }

          def obsolete(ref: str, stage_from: str, stage_to: str, reason: str) -> None:
              if ref in records:
                  raise RuntimeError(f"duplicate disposition for {ref}")
              records[ref] = {
                  "target": None,
                  "disposition": "obsolete",
                  "stage_from": stage_from,
                  "stage_to": stage_to,
                  "reason": reason,
                  "validation": None,
              }

          script_targets = {
              "install": ("lang.core/install-lang!", "language-registration"),
              "+module-keys+": ("lang.core.script/+module-metadata-keys+", "module-config"),
              "+runtime-keys+": ("lang.core/runtime-spec", "runtime-config"),
              "script-ns-import": ("lang.core.script/load-module!", "module-loader"),
              "script-macro-import": ("lang.core/script-import-symbols", "grammar-publication"),
              "script-require-target-id": ("lang.core.script/load-module!", "module-loader"),
              "script-specialize-merge-contracts": ("lang.core.script/configure-module!", "module-config"),
              "script-specialize-require": ("lang.core.script/load-module!", "module-loader"),
              "script-specialize-config": ("lang.core.script/configure-module!", "module-config"),
              "resolve-runtime-config": ("lang.core/runtime-spec", "runtime-config"),
              "script-fn-base": ("lang.core/script-expansion", "grammar-publication"),
              "script-fn": ("lang.core/script-expansion", "grammar-publication"),
              "script": ("lang.core/script", "grammar-publication"),
              "script-test-prep": ("lang.core.script/script-test-form", "test-publication"),
              "script-test": ("lang.core/script-", "test-publication"),
              "script-": ("lang.core/script-", "test-publication"),
              "script-ext": ("lang.core.script/compile-form", "target-compile"),
              "script+": ("lang.core.script/compile-form", "target-compile"),
              "script-ext-run": ("lang.core.script/eval-form!", "target-eval"),
              "!": ("lang.core/script-eval-macro-form", "grammar-publication"),
              "annex:start": ("lang.core.script/restart!", "runtime-lifecycle"),
              "annex:get": ("lang.core.script/+scripts+", "runtime-registry"),
              "annex:stop": ("lang.core.script/stop!", "runtime-lifecycle"),
              "annex:start-all": ("lang.core.script/restart!", "runtime-lifecycle"),
              "annex:stop-all": ("lang.core.script/stop!", "runtime-lifecycle"),
              "annex:restart-all": ("lang.core.script/restart!", "runtime-lifecycle"),
              "annex:list": ("lang.core.script/+scripts+", "runtime-registry"),
          }
          for name, (target, stage_to) in script_targets.items():
              adapted(
                  f"tahto.core.script/{name}", target, "script", stage_to,
                  "script-registration-is-owned-by-explicit-language-and-runtime-registries",
              )
          obsolete(
              "tahto.core.script/script-test-mode?", "script", "test-publication",
              "explicit-script-test-forms-replace-dynamic-test-mode",
          )

          annex_targets = {
              "rt-annex:create": "lang.core.script/register-script!",
              "annex-current": "lang.core.script/+scripts+",
              "annex-reset": "lang.core.script/stop!",
              "get-annex": "lang.core.script/+scripts+",
              "clear-annex": "lang.core.script/stop!",
              "get-annex-library": "lang.core/registry-book",
              "get-annex-book": "lang.core/registry-book",
              "add-annex-runtime": "lang.core.script/register-script!",
              "get-annex-runtime": "lang.core.script/+scripts+",
              "remove-annex-runtime": "lang.core.script/stop!",
              "register-annex-tag": "lang.core.script/register-module-loader!",
              "deregister-annex-tag": "lang.core.script/remove-module-loader!",
              "start-runtime": "lang.core/rt-start",
          }
          for name, target in annex_targets.items():
              adapted(
                  f"tahto.core.script-annex/{name}", target,
                  "runtime-annex", "runtime-registry",
                  "explicit-script-runtime-registry-replaces-global-annex-state",
              )
          for name in ["rt-annex?", "+init-annex+", "same-runtime?"]:
              obsolete(
                  f"tahto.core.script-annex/{name}",
                  "runtime-annex", "runtime-registry",
                  "global-annex-identity-is-not-part-of-the-explicit-runtime-contract",
              )

          control_targets = {
              "script-rt-prep": "lang.core/rt-create",
              "script-rt-get": "lang.core/rt-start",
              "script-rt-stop": "lang.core/rt-stop",
              "script-rt-restart": "lang.core.script/restart!",
              "script-rt-oneshot-eval": "lang.core.script/eval-form!",
              "script-rt-oneshot": "lang.core/rt-oneshot",
          }
          for name, target in control_targets.items():
              adapted(
                  f"tahto.core.script-control/{name}", target,
                  "script-control", "runtime-lifecycle",
                  "runtime-lifecycle-is-owned-by-lang-core-runtime-and-script",
              )
          obsolete(
              "tahto.core.script-control/+watch-keys+",
              "script-control", "runtime-lifecycle",
              "explicit-runtime-state-replaces-library-watch-key-coordination",
          )

          adapted(
              "tahto.core.script-def/tmpl-entry",
              "lang.core/script-definition-macro-form",
              "script-template", "grammar-publication",
              "grammar-derived-definition-families-replace-static-template-expansion",
          )
          adapted(
              "tahto.core.script-def/tmpl-macro",
              "lang.core/script-defmacro-macro-form",
              "script-template", "grammar-publication",
              "grammar-derived-macro-families-replace-static-template-expansion",
          )

          for name in ["get-reserved-raw", "get-reserved"]:
              adapted(
                  f"tahto.core.script-lint/{name}",
                  "lang.core/grammar-to-reserved",
                  "script-lint", "grammar-analysis",
                  "reserved-symbols-are-derived-from-the-selected-grammar",
              )
          for name in ["collect-vars", "collect-sym-vars", "sym-check-linter", "lint-entry"]:
              adapted(
                  f"tahto.core.script-lint/{name}",
                  "lang.common.compiler/compile-entry",
                  "script-lint", "compiler-lint",
                  "compiler-stage-vectors-preserve-lint-behavior-and-provenance",
                  COMPILER_VALIDATION,
                  "test-vector",
              )
          for name in ["+settings+", "lint-set", "lint-clear", "lint-needed?"]:
              obsolete(
                  f"tahto.core.script-lint/{name}",
                  "script-lint", "compiler-lint",
                  "compiler-invocation-options-replace-global-mutable-lint-settings",
              )

          macro_targets = {
              "body-arglists": "lang.core/script-definition-macro-form",
              "intern-in": "std.foundation/intern-all",
              "intern-prep": "lang.core/script-context",
              "intern-def$-fn": "lang.core/register-fragment-pointer!",
              "intern-def$": "lang.core/script-fragment-macro-form",
              "intern-defmacro-fn": "lang.core/register-macro-fragment!",
              "intern-defmacro": "lang.core/script-defmacro-macro-form",
              "call-thunk": "lang.core.script/eval-form!",
              "intern-!-fn": "lang.core/script-eval-macro-form",
              "intern-!": "lang.core/script-eval-macro-form",
              "intern-free-fn": "lang.core/register-code-pointer!",
              "intern-free": "lang.core/script-definition-macro-form",
              "hydrate-top-level-entry": "lang.core/register-language-code!",
              "intern-top-level-fn": "lang.core/register-code-pointer!",
              "intern-top-level": "lang.core/script-definition-macro-form",
              "intern-macros": "lang.core/script-macro-forms",
              "intern-highlights": "lang.core/script-highlight-macro-form",
              "intern-grammar": "lang.core/sync-language-definitions!",
              "intern-defmacro-rt-fn": "lang.core/register-macro-fragment!",
              "defmacro.!": "lang.core/script-defmacro-macro-form",
          }
          for name, target in macro_targets.items():
              validation = LEDGER_VALIDATION if name == "intern-in" else SCRIPT_VALIDATION
              adapted(
                  f"tahto.core.script-macro/{name}", target,
                  "script-macro", "grammar-publication",
                  "grammar-derived-publication-replaces-imperative-macro-interning",
                  validation,
              )
          obsolete(
              "tahto.core.script-macro/+form-allow+",
              "script-macro", "grammar-publication",
              "grammar-entry-metadata-replaces-a-separate-form-allowlist",
          )

          missing = [ref for ref in source_refs if ref not in records]
          extra = [ref for ref in records if ref not in set(source_refs)]
          if missing or extra:
              raise SystemExit(f"ledger mapping mismatch: missing={missing}, extra={extra}")

          active_targets = []
          validations = []
          for ref in source_refs:
              record = records[ref]
              if record["target"] and record["target"] not in active_targets:
                  active_targets.append(record["target"])
              if record["validation"] and record["validation"] not in validations:
                  validations.append(record["validation"])

          target_files = [
              Path("core/lib/src/lang/core.hal"),
              Path("core/lib/src/lang/core/script.hal"),
              Path("core/lib/src/lang/common/compiler.hal"),
              Path("core/lib/src/std/foundation.hal"),
          ]
          target_text = "\n".join(path.read_text(encoding="utf-8") for path in target_files)
          absent_targets = [
              target for target in active_targets
              if not re.search(
                  rf"\((?:def|defn|defmacro)\s+(?:\^\{{.*?\}}\s+)?{re.escape(target.split('/', 1)[1])}(?:\s|\n)",
                  target_text,
                  flags=re.S,
              )
          ]
          if absent_targets:
              raise SystemExit(f"active targets are absent from product source: {absent_targets}")

          def q(value: str) -> str:
              return "'" + value

          def kw(value: str) -> str:
              return ":" + value

          def quoted_vector(values: list[str], indent: str = "    ") -> str:
              if not values:
                  return "'[]"
              lines = ["'["]
              lines.extend(indent + value for value in values)
              lines.append(indent[:-2] + "]")
              return "\n".join(lines)

          source_unit_forms = []
          for unit in units:
              refs = "\n".join("     " + q(ref) for ref in unit["references"])
              source_unit_forms.append(
                  "  {:namespace " + q(unit["namespace"]) + "\n"
                  "   :path " + json.dumps(unit["path"]) + "\n"
                  "   :references\n"
                  "   [\n" + refs + "\n   ]}"
              )

          ledger_forms = []
          for ref in source_refs:
              record = records[ref]
              lines = [
                  "  {:source/refer " + q(ref),
              ]
              if record["target"]:
                  lines.append("   :target/refer " + q(str(record["target"])))
              lines.extend([
                  "   :disposition " + kw(str(record["disposition"])),
                  "   :stage/from " + kw(str(record["stage_from"])),
                  "   :stage/to " + kw(str(record["stage_to"])),
                  "   :reason " + kw(str(record["reason"])),
                  "   :provenance",\n                  "   {:repository \"zcaudate-xyz/foundation-base\"",
                  "    :revision \"" + REVISION + "\"",
                  "    :path " + json.dumps(paths[ref]) + "}",
              ])
              if record["validation"]:
                  lines.append("   :validation " + q(str(record["validation"])))
              lines[-1] = lines[-1] + "}"
              ledger_forms.append("\n".join(lines))

          compatibility = [
              ("defspec.xt", "lang.core/defspec.xt", "lang.core.script/defspec.xt", "retire-copy-after-contract-parity"),
              ("defn.xt", "lang.core/defn.xt", "lang.core.script/defn.xt", "retire-copy-after-loader-parity"),
              ("defmacro.xt", "lang.core/defmacro.xt", "lang.core.script/defmacro.xt", "retire-copy-after-loader-parity"),
              ("script", "lang.core/script", "lang.core.script/script", "retire-copy-after-contract-parity"),
              ("script-", "lang.core/script-", "lang.core.script/script-", "retire-copy-after-contract-parity"),
              ("!.js", "lang.core/!.js", "lang.core.script/!.js", "retire-copy-after-runtime-parity"),
              ("!.lua", "lang.core/!.lua", "lang.core.script/!.lua", "retire-copy-after-runtime-parity"),
              ("!.py", "lang.core/!.py", "lang.core.script/!.py", "retire-copy-after-runtime-parity"),
              ("!.pg", "lang.core/!.pg", "lang.core.script/!.pg", "retire-copy-after-runtime-parity"),
          ]
          compatibility_forms = [
              "  {:surface " + q(surface) + "\n"
              "   :authority " + q(authority) + "\n"
              "   :compatibility " + q(copy) + "\n"
              "   :disposition :" + disposition + "\n"
              "   :reason :grammar-derived-lang-core-publication-is-authoritative}"
              for surface, authority, copy, disposition in compatibility
          ]

          child_source = f'''(ns code.migrate.script)

(def +foundation-script-source+
  {{:repository "zcaudate-xyz/foundation-base"
   :revision "{REVISION}"}})

(def +foundation-script-source-units+
 [
{chr(10).join(source_unit_forms)}
 ])

(def +foundation-script-source-references+
  (vec
   (mapcat (fn [unit]
             (get unit :references))
           +foundation-script-source-units+)))

(def +foundation-script-target-references+
 [
{chr(10).join('  ' + q(target) for target in active_targets)}
 ])

(def +foundation-script-validation-references+
 [
{chr(10).join('  ' + q(validation) for validation in validations)}
 ])

(def +foundation-script-ledger+
 [
{chr(10).join(ledger_forms)}
 ])

(def +foundation-script-compatibility-ledger+
 [
{chr(10).join(compatibility_forms)}
 ])

(defn foundation-script-inventory
  []
  {{:source/references +foundation-script-source-references+
   :target/references +foundation-script-target-references+
   :validation/references +foundation-script-validation-references+}})
'''
          child_path = Path("core/lib/src/code/migrate/script.hal")
          child_path.parent.mkdir(parents=True, exist_ok=True)
          child_path.write_text(child_source, encoding="utf-8")

          migrate_path = Path("core/lib/src/code/migrate.hal")
          migrate = migrate_path.read_text(encoding="utf-8")
          require_anchor = "  (:require [code.framework :as framework]\n            [code.manage.unit.structure :as structure]"
          require_replacement = "  (:require [code.framework :as framework]\n            [code.manage.unit.structure :as structure]\n            [code.migrate.script]\n            [std.foundation :as f]"
          if migrate.count(require_anchor) != 1:
              raise SystemExit("code.migrate require anchor changed")
          migrate = migrate.replace(require_anchor, require_replacement)
          publish_anchor = "))\n\n(def rule-id :std.task/def-work)"
          publish_replacement = "))\n\n(f/intern-all code.migrate.script)\n\n(def rule-id :std.task/def-work)"
          if migrate.count(publish_anchor) != 1:
              raise SystemExit("code.migrate publication anchor changed")
          migrate = migrate.replace(publish_anchor, publish_replacement)
          migrate_path.write_text(migrate, encoding="utf-8")

          counts = Counter(str(records[ref]["disposition"]) for ref in source_refs)
          expected_counts = "{" + " ".join(
              f":{name} {counts[name]}" for name in sorted(counts)
          ) + "}"
          surfaces = "[" + " ".join(q(item[0]) for item in compatibility) + "]"
          paths_expected = "[" + " ".join(json.dumps(unit["path"]) for unit in units) + "]"

          test_source = f'''(ns code.migrate-script-test
  (:use code.test)
  (:require [code.migrate :as migrate]
            [code.migrate.script :as script]))

(defn disposition-counts
  [records]
  (reduce (fn [counts record]
            (update counts
                    (get record :disposition)
                    (fn [current]
                      (inc (or current 0)))))
          {{}}
          records))

(def results
  [(fact "the script migration source authority is pinned and complete"
     [(get script/+foundation-script-source+ :repository)
      (get script/+foundation-script-source+ :revision)
      (mapv (fn [unit] (get unit :path))
            script/+foundation-script-source-units+)
      (count script/+foundation-script-source-references+)
      (= (count script/+foundation-script-source-references+)
         (count (set script/+foundation-script-source-references+)))]
     => ["zcaudate-xyz/foundation-base"
         "{REVISION}"
         {paths_expected}
         84
         true])

   (fact "code.migrate publishes the child ledger through intern-all"
     [(= migrate/+foundation-script-source-units+
         script/+foundation-script-source-units+)
      (= migrate/+foundation-script-ledger+
         script/+foundation-script-ledger+)
      (= (migrate/foundation-script-inventory)
         (script/foundation-script-inventory))]
     => [true true true])

   (fact "every portable script source has one valid disposition"
     [(migrate/migration-ledger-valid? migrate/+foundation-script-ledger+)
      (disposition-counts migrate/+foundation-script-ledger+)]
     => [true {expected_counts}])

   (fact "the script ledger audit has no gaps, duplicates, or stale references"
     (let [audit
           (migrate/migration-ledger-audit
            migrate/+foundation-script-ledger+
            (migrate/foundation-script-inventory))]
       [(get audit :valid)
        (get audit :records)
        (get audit :source/references)
        (get audit :diagnostics)])
     => [true 84 84 []])

   (fact "the migration plan is deterministic and non-writing"
     (let [plan
           (migrate/migration-ledger-plan
            migrate/+foundation-script-ledger+
            (migrate/foundation-script-inventory))]
       [(get plan :write)
        (get plan :valid)
        (count (get plan :queue))
        (every? (fn [item]
                  (= :ready (get item :status)))
                (get plan :queue))])
     => [false true 84 true])

   (fact "all current script compatibility copies have explicit retirement gates"
     [(mapv (fn [record] (get record :surface))
            migrate/+foundation-script-compatibility-ledger+)
      (= 9
         (count
          (set
           (map (fn [record] (get record :surface))
                migrate/+foundation-script-compatibility-ledger+))))]
     => [{surfaces} true])])

(pr-str (run '[code.migrate-script-test]))
'''
          test_path = Path("core/lib/test/code/migrate_script_test.hal")
          test_path.write_text(test_source, encoding="utf-8")
          PY

          git diff --check -- \
            core/lib/src/code/migrate.hal \
            core/lib/src/code/migrate/script.hal \
            core/lib/test/code/migrate_script_test.hal

      - uses: dtolnay/rust-toolchain@stable

      - name: Run native migration and script contract tests
        env:
          RUST_BACKTRACE: full
        run: |
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test/code/migrate_script_test.hal
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test/code/migrate_test.hal
          timeout --signal=TERM --kill-after=10s 300s \
            ./scripts/runtime/run-lib-tests core/lib/test-lang/lang/core/script_contract_test.hal

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run the same migration and script contracts on JVM Truffle
        shell: bash
        run: |
          cat > core/java/src/test/java/hara/truffle/AgentScriptMigrationLedgerTest.java <<'JAVA'
          package hara.truffle;

          import org.junit.runner.RunWith;

          @RunWith(HaraJUnitRunner.class)
          @HaraTestSource({
              "lib/test/code/migrate_script_test.hal",
              "lib/test/code/migrate_test.hal",
              "lib/test-lang/lang/core/script_contract_test.hal"
          })
          public final class AgentScriptMigrationLedgerTest {}
          JAVA

          mvn -B -f core/java/pom.xml -Ptruffle \
            -Dtest=hara.truffle.AgentScriptMigrationLedgerTest test
          rm core/java/src/test/java/hara/truffle/AgentScriptMigrationLedgerTest.java

      - name: Publish only the validated product change
        shell: bash
        run: |
          rm -rf .agent
          git fetch origin "$GITHUB_BASE_REF"
          git show "origin/$GITHUB_BASE_REF:.github/workflows/foundation-surface-conformance.yml" \
            > .github/workflows/foundation-surface-conformance.yml

          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Govern portable script migration through code.migrate"
          git push origin HEAD:agent/823-script-migration-ledger
