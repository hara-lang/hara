name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/test_check_foundation_surface.py
          python scripts/check_foundation_surface.py --report generated/foundation-surface-conformance.json

  complete-script-port:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/823-script-port-completion' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/823-script-port-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Hara once
        run: cargo build --manifest-path core/rust/Cargo.toml --bin hara
      - name: Verify terminating native evaluation paths
        shell: bash
        env:
          HARA_RUNTIME: rust
          HARA_NATIVE: ${{ github.workspace }}/core/rust/target/debug/hara
        run: |
          set -euo pipefail
          test "$(timeout 20s core/hara --project core eval '(+ 19 23)')" = "42"

          cat > /tmp/hara-script-port-probe.hal <<'HAL'
          (ns demo.script-port-probe)
          (def value 42)
          (assert (= value 42))
          HAL
          timeout 20s core/hara --project core --offline run /tmp/hara-script-port-probe.hal

          cat > core/private/tmp/script_port_probe_test.hal <<'HAL'
          (ns script-port-probe-test
            (:use code.test))
          (fact "native test runner terminates"
            (+ 19 23) => 42)
          (pr-str (run '[script-port-probe-test]))
          HAL
          timeout 120s ./scripts/runtime/run-lib-tests core/private/tmp/script_port_probe_test.hal
          rm core/private/tmp/script_port_probe_test.hal
