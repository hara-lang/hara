name: Foundation surface conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/test_check_foundation_surface.py
          python scripts/check_foundation_surface.py --report generated/foundation-surface-conformance.json

  complete-script-port:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/823-script-port-completion' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/823-script-port-completion
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Hara once
        run: cargo build --manifest-path core/rust/Cargo.toml --release --bin hara
      - name: Bisect portable annex namespace load
        shell: bash
        run: |
          set -euo pipefail
          HARA=core/rust/target/release/hara

          cat > /tmp/annex-a.hal <<'HAL'
          (ns lang.core.script.annex
            (:require [lang.core.runtime :as runtime]
                      [lang.core.script :as script]))
          (def +registry+ (atom {}))
          (def +runtimes+ (atom {}))
          (defn current-namespace-symbol [] (symbol (str (current-namespace))))
          (defn coordinate [namespace tag] [namespace tag])
          HAL
          echo '=== annex A: namespace + state ==='
          "$HARA" --project core --offline stdin < /tmp/annex-a.hal

          cp /tmp/annex-a.hal /tmp/annex-b.hal
          cat >> /tmp/annex-b.hal <<'HAL'
          (defn register-tag-in! [namespace tag lang config]
            (let [key (coordinate namespace tag)
                  previous (get (deref +registry+) key)
                  record {:namespace namespace :tag tag :lang lang
                          :runtime (or (get config :runtime) :default)
                          :config config}]
              (swap! +registry+ assoc key record)
              [previous record]))
          (defn deregister-tag-in! [namespace tag]
            (let [key (coordinate namespace tag)
                  previous (get (deref +registry+) key)]
              (swap! +registry+ dissoc key)
              previous))
          (defn tag-info-in [namespace tag]
            (get (deref +registry+) (coordinate namespace tag)))
          (defn runtime-in [namespace tag]
            (get (deref +runtimes+) (coordinate namespace tag)))
          (defn namespace-tags [state namespace]
            (reduce-kv (fn [out key ignored]
                         (if (= namespace (first key))
                           (conj out (second key))
                           out))
                       #{} state))
          (defn status-in [namespace]
            {:registered (namespace-tags (deref +registry+) namespace)
             :active (namespace-tags (deref +runtimes+) namespace)})
          HAL
          echo '=== annex B: registry helpers ==='
          "$HARA" --project core --offline stdin < /tmp/annex-b.hal

          cp /tmp/annex-b.hal /tmp/annex-c.hal
          cat >> /tmp/annex-c.hal <<'HAL'
          (defn start-tag-in! [namespace tag]
            (let [key (coordinate namespace tag)
                  record (tag-info-in namespace tag)]
              (if (nil? record)
                (throw (ex-info "Script annex tag is not registered"
                                {:namespace namespace :tag tag}))
                (let [previous (runtime-in namespace tag)
                      ignored (if previous (runtime/rt-stop previous) nil)
                      lang (get record :lang)
                      config (get record :config)
                      module (or (get config :module) namespace)
                      configured (script/configure-module! lang module config)
                      instance (runtime/rt-create lang (get record :runtime)
                                                  (assoc config :module module))
                      started (runtime/rt-start instance)]
                  (swap! +runtimes+ assoc key started)
                  started))))
          (defn stop-tag-in! [namespace tag]
            (let [key (coordinate namespace tag)
                  instance (runtime-in namespace tag)]
              (if instance
                (let [stopped (runtime/rt-stop instance)]
                  (swap! +runtimes+ dissoc key)
                  stopped)
                nil)))
          (defn restart-tag-in! [namespace tag]
            (do (stop-tag-in! namespace tag)
                (start-tag-in! namespace tag)))
          (defn start-all-in! [namespace]
            (reduce (fn [out tag]
                      (assoc out tag (start-tag-in! namespace tag)))
                    {} (get (status-in namespace) :registered)))
          (defn stop-all-in! [namespace]
            (reduce (fn [out tag]
                      (assoc out tag (stop-tag-in! namespace tag)))
                    {} (get (status-in namespace) :active)))
          (defn restart-all-in! [namespace]
            (do (stop-all-in! namespace)
                (start-all-in! namespace)))
          HAL
          echo '=== annex C: runtime lifecycle ==='
          "$HARA" --project core --offline stdin < /tmp/annex-c.hal

          cp /tmp/annex-c.hal /tmp/annex-d.hal
          cat >> /tmp/annex-d.hal <<'HAL'
          (defn eval-tag-in! [namespace tag form]
            (let [record (tag-info-in namespace tag)
                  instance (runtime-in namespace tag)]
              (if (nil? record)
                (throw (ex-info "Script annex tag is not registered"
                                {:namespace namespace :tag tag}))
                (if (nil? instance)
                  (throw (ex-info "Script annex tag is not started"
                                  {:namespace namespace :tag tag}))
                  (let [config (get record :config)
                        module (or (get config :module) namespace)
                        source (script/compile-form (get record :lang) module form)]
                    (runtime/rt-raw-eval instance source))))))
          HAL
          echo '=== annex D: tagged evaluation ==='
          "$HARA" --project core --offline stdin < /tmp/annex-d.hal

          cp /tmp/annex-d.hal /tmp/annex-e.hal
          cat >> /tmp/annex-e.hal <<'HAL'
          (defn script-ext-form [namespace coordinate-value config]
            (let [tag (first coordinate-value)
                  lang (second coordinate-value)
                  config (or config {})]
              (list 'do
                    (list 'lang.core.script.annex/register-tag-in!
                          (list 'quote namespace) tag lang (list 'quote config))
                    (list 'lang.core.script.annex/start-tag-in!
                          (list 'quote namespace) tag))))
          (defn script-eval-form [namespace tag body]
            (if (vector? tag)
              (list 'lang.core.script.annex/eval-tag-in!
                    (list 'quote namespace) (first tag) (list 'quote body))
              nil))
          (defmacro script+ [coordinate-value & options]
            (lang.core.script.annex/script-ext-form
             (symbol (str (get &env :ns)))
             coordinate-value
             (if (empty? options) {} (first options))))
          (defmacro ! [tag body]
            (lang.core.script.annex/script-eval-form
             (symbol (str (get &env :ns))) tag body))
          HAL
          echo '=== annex E: macro surface ==='
          "$HARA" --project core --offline stdin < /tmp/annex-e.hal
