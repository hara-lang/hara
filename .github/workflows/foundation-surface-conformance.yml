name: Foundation surface conformance

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/foundation-surface-conformance.yml'
      - 'scripts/check_foundation_surface.py'
      - 'scripts/test_check_foundation_surface.py'
      - 'core/rust/standard-library.namespaces'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/lib/test/std/foundation/**'
      - 'core/spec/std/foundation-migrations.json'
      - 'core/spec/std/foundation-reference-classifications.json'
      - 'core/java/src/main/java/hara/truffle/HbxBundleLibrary.java'
      - 'core/java/src/test/java/hara/truffle/StdFoundationTest.java'
      - 'core/java/src/test/java/hara/truffle/StdPrettyTest.java'
      - 'core/lib/src/code/translate/rules.hal'
      - 'core/lib/test/code/translate_rules_test.hal'
      - 'core/rust/src/runtime/tests.rs'
      - 'core/rust/web/portable-code-test.test.mjs'
      - 'core/spec/std/foundation-architecture.md'
      - 'notes/superpowers/specs/2026-07-25-foundation-namespace-builtins-design.md'
      - 'notes/superpowers/specs/2026-07-25-wasm-foundation-parity-audit.md'
  push:
    branches: [main, testing]
    paths:
      - '.github/workflows/foundation-surface-conformance.yml'
      - 'scripts/check_foundation_surface.py'
      - 'scripts/test_check_foundation_surface.py'
      - 'core/rust/standard-library.namespaces'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/lib/test/std/foundation/**'
      - 'core/spec/std/foundation-migrations.json'
      - 'core/spec/std/foundation-reference-classifications.json'
      - 'core/java/src/main/java/hara/truffle/HbxBundleLibrary.java'
      - 'core/java/src/test/java/hara/truffle/StdFoundationTest.java'
      - 'core/java/src/test/java/hara/truffle/StdPrettyTest.java'
      - 'core/lib/src/code/translate/rules.hal'
      - 'core/lib/test/code/translate_rules_test.hal'
      - 'core/rust/src/runtime/tests.rs'
      - 'core/rust/web/portable-code-test.test.mjs'
      - 'core/spec/std/foundation-architecture.md'
      - 'notes/superpowers/specs/2026-07-25-foundation-namespace-builtins-design.md'
      - 'notes/superpowers/specs/2026-07-25-wasm-foundation-parity-audit.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the Foundation surface checker
        run: |
          python scripts/test_check_foundation_surface.py
          python -m py_compile \
            scripts/check_foundation_surface.py \
            scripts/test_check_foundation_surface.py

      - name: Validate source, tests, and retired-name evidence
        run: |
          python scripts/check_foundation_surface.py \
            --report generated/foundation-surface-conformance.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-surface-conformance
          path: generated/foundation-surface-conformance.json
          if-no-files-found: warn
          retention-days: 30
