name: Agent runtime export

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-runtime-export.yml

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Build Truffle runtime
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml
      - name: Upload Truffle runtime
        uses: actions/upload-artifact@v4
        with:
          name: hara-truffle-runtime
          path: core/java/target/hara-truffle.jar
          if-no-files-found: error
          retention-days: 1
