name: Agent 838 pinned specs snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - .agent-838-specs-trigger

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish run identifier
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .agent-838-specs-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-838-specs-run
          git commit -m 'chore: publish pinned specs snapshot run [skip ci]'
          git push
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: 64d81ebe5fded2809c6fc4414796a3feddf98a33
          path: hara-specs-registry
          fetch-depth: 1
      - name: Archive authoritative specs checkout
        run: zip -qr hara-specs-registry.zip hara-specs-registry
      - uses: actions/upload-artifact@v4
        with:
          name: hara-specs-registry-64d81ebe
          path: hara-specs-registry.zip
          retention-days: 1
          compression-level: 0
