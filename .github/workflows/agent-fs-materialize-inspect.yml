name: Validate materialized filesystem implementation

on:
  push:
    branches:
      - agent/fs-materialize-inspect

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout materialized filesystem snapshot
        uses: actions/checkout@v4
        with:
          ref: agent/fs-materialized-snapshot
          path: hara
          fetch-depth: 0

      - name: Checkout specification fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: main
          path: hara-specs-registry
          fetch-depth: 1

      - name: Prepare embedded HAL sources
        shell: bash
        run: |
          set -euo pipefail
          ln -s ../hara-specs-registry hara/hara-specs-registry
          mkdir -p hara/core/rust/hal-src/std/fs
          cp hara/core/lib/src/std/fs.hal hara/core/rust/hal-src/std/fs.hal
          cp hara/core/lib/src/std/fs/path.hal hara/core/rust/hal-src/std/fs/path.hal
          cp hara/core/lib/src/std/fs/walk.hal hara/core/rust/hal-src/std/fs/walk.hal
          cmp hara/core/lib/src/std/fs.hal hara/core/rust/hal-src/std/fs.hal
          cmp hara/core/lib/src/std/fs/path.hal hara/core/rust/hal-src/std/fs/path.hal
          cmp hara/core/lib/src/std/fs/walk.hal hara/core/rust/hal-src/std/fs/walk.hal

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust providers
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          rustfmt --edition 2021 --check core/rust/src/file.rs core/rust/src/fiber.rs
          cargo check --manifest-path core/rust/Cargo.toml --lib
          cargo test --manifest-path core/rust/Cargo.toml file::tests --lib -- --nocapture
          for test_name in \
            session_kernel_mounts_preserve_state_and_enforce_lifetime \
            runtime_routes_file_operations_through_provider_registry \
            hara_file_operations_use_capability_providers \
            memory_file_provider_exposes_one_logical_root_and_preserves_bytes \
            unsupported_capabilities_fail_stably \
            read_forms_uses_the_capability_gated_file_provider; do
            cargo test --manifest-path core/rust/Cargo.toml "$test_name" --lib -- --exact --nocapture
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: hara/core/java/pom.xml

      - name: Validate JVM provider and portable facade
        shell: bash
        run: |
          set -euo pipefail
          cd hara/core
          mvn -B -Ptruffle --file java/pom.xml \
            -Dtest=HaraLogicalPathTest,HaraFileProviderTest,StdFsTest \
            test

      - name: Validate portable path API
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          ./scripts/runtime/run-lib-tests core/lib/test/std/fs/path_test.hal
