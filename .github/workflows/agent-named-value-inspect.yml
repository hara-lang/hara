name: Named-value parity source inspection

on:
  push:
    branches:
      - agent/named-value-spec-validation

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print Rust set! and struct collection paths
        shell: bash
        run: |
          echo '=== Rust set! diagnostic ==='
          grep -R -n -B35 -A55 'set! name must be a symbol' core/rust/src || true
          echo '=== Rust struct assoc helpers ==='
          grep -R -n -B25 -A65 'assoc.*Struct\|Struct.*assoc\|struct_assoc\|dissoc.*Struct' core/rust/src | head -n 500 || true
          echo '=== Rust mutable field helpers ==='
          grep -R -n -B30 -A60 'mutable_field_set\|MutableFieldSet\|set_field' core/rust/src | head -n 600 || true
      - name: Print Java assoc and named-value paths
        shell: bash
        run: |
          echo '=== Java assoc diagnostic ==='
          grep -R -n -B45 -A80 'assoc expects a map' core/java/src/main/java || true
          echo '=== Java named value classes ==='
          grep -R -n -B15 -A100 'class HaraStruct\|record HaraStruct\|class HaraMutable\|record HaraMutable' core/java/src/main/java | head -n 900 || true
          echo '=== Java get/dissoc named value dispatch ==='
          grep -R -n -B35 -A75 'instanceof HaraStruct\|HaraStruct instance\|HaraMutable instance' core/java/src/main/java | head -n 1200 || true
      - name: Print focused tests
        shell: bash
        run: |
          grep -R -n -B20 -A100 'defstruct.*assoc\|assoc.*defstruct\|dissoc.*Point\|set!.*field' core/java/src/test core/rust/src | head -n 1200 || true
