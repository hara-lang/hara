name: Implement issue 645 source-only runtime slice

on:
  push:
    branches:
      - codex/645-source-only-runtime

permissions:
  contents: write

concurrency:
  group: implement-645-source-only-runtime
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: f336c05d4e147a217b3f650bf31fc0ebc23cd208
      BRANCH_NAME: codex/645-source-only-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/645-source-only-runtime
          fetch-depth: 0
      - name: Apply source-only runtime slice
        run: |
          python3 .github/scripts/codex_645_apply.py
          rm core/rust/tests/source_only_foundation.rs
          python3 - <<'PY'
          from pathlib import Path

          rust_path = Path("core/rust/src/lib.rs")
          source = rust_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "                {\n            let foundation = self\n",
                  "        {\n            let foundation = self\n",
                  "source fallback indentation",
              ),
              (
                  "    #[cfg(not(feature = \"bytecode-vm\"))]\n"
                  "    fn install_structural_primitives(&mut self) {\n",
                  "    fn install_structural_primitives(&mut self) {\n",
                  "shared structural primitive installer",
              ),
              (
                  "use crate::kernel::Form;\n",
                  "#[cfg(test)]\nmod source_only_foundation_tests;\nuse crate::kernel::Form;\n",
                  "library-only source startup test module",
              ),
          )
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected one {label} marker, found {source.count(old)}")
              source = source.replace(old, new)
          rust_path.write_text(source, encoding="utf-8")

          workflow_path = Path(".github/workflows/lang-runtime.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_test_path = "core/rust/tests/source_only_foundation.rs"
          new_test_path = "core/rust/src/source_only_foundation_tests.rs"
          if workflow.count(old_test_path) != 2:
              raise SystemExit(
                  f"expected two focused runtime path filters, found {workflow.count(old_test_path)}"
              )
          workflow_path.write_text(
              workflow.replace(old_test_path, new_test_path), encoding="utf-8"
          )
          PY
          git add -A
      - name: Run permanent audit tests
        run: |
          python3 scripts/runtime/source_only_foundation_test.py
          python3 scripts/runtime/source_only_foundation.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Check focused Rust formatting
        run: rustfmt --edition 2021 --check core/rust/src/source_only_foundation_tests.rs
      - name: Probe Rust source-only startup
        run: cargo test --manifest-path core/rust/Cargo.toml --lib fresh_runtime_loads_foundation_from_embedded_hal_sources
      - name: Preserve generic Rust bundle coverage
        run: cargo test --manifest-path core/rust/Cargo.toml --lib vm::bundle
      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Probe JVM source-only startup and generic bytecode tools
        run: mvn -B -Ptruffle -Dtest=HbcCodecTest,HaraBytecodeToolTest test --file core/java/pom.xml
      - name: Audit built classpath and final diff
        run: |
          python3 scripts/runtime/source_only_foundation.py
          git diff --check
      - name: Publish one verified implementation commit
        run: |
          rm -rf hara-specs-registry
          if [ -L "$GITHUB_WORKSPACE/../hara-specs-registry" ]; then
            rm "$GITHUB_WORKSPACE/../hara-specs-registry"
          fi
          rm .github/workflows/codex-645-source-only-runtime.yml
          rm .github/scripts/codex_645_apply.py
          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/scripts/codex_645_apply.py",
              ".github/workflows/codex-645-source-only-runtime.yml",
              ".github/workflows/lang-runtime.yml",
              ".github/workflows/main.yml",
              ".github/workflows/source-only-foundation.yml",
              "core/java/pom.xml",
              "core/java/src/main/java/hara/truffle/HaraContext.java",
              "core/java/src/main/java/hara/truffle/HbxBundleLibrary.java",
              "core/java/src/test/java/hara/truffle/HaraBytecodeToolTest.java",
              "core/java/src/test/java/hara/truffle/bytecode/HbcCodecTest.java",
              "core/rust/Cargo.toml",
              "core/rust/assets/std.foundation.hbx",
              "core/rust/src/bin/hara-foundation-artifact.rs",
              "core/rust/src/lib.rs",
              "core/rust/src/source_only_foundation_tests.rs",
              "core/rust/tests/source_only_foundation.rs",
              "scripts/runtime/source_only_foundation.py",
              "scripts/runtime/source_only_foundation_test.py",
          }
          entries = (
              subprocess.check_output(["git", "status", "--porcelain=v1", "-z"])
              .decode()
              .split("\0")
          )
          paths = set()
          for entry in entries:
              if not entry:
                  continue
              path = entry[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)
          unexpected = sorted(paths - allowed)
          required = {
              "core/rust/assets/std.foundation.hbx",
              "core/rust/src/lib.rs",
              "core/java/src/main/java/hara/truffle/HaraContext.java",
              "scripts/runtime/source_only_foundation.py",
          }
          missing = sorted(required - paths)
          if unexpected or missing:
              raise SystemExit(
                  f"unexpected={unexpected} missing-required={missing} changed={sorted(paths)}"
              )
          print("\n".join(sorted(paths)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "$BASE_SHA"
          git add -A
          git diff --cached --check
          git commit -m "feat: make Foundation development runtimes source-only"
          git push --force-with-lease origin "HEAD:$BRANCH_NAME"
