name: Inspect named-value compiler fixture

on:
  push:
    branches: [agent/fix-production-build-manifest-558]
    paths: [.github/workflows/inspect-named-value-fixture.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-build-manifest-558
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce and inspect generated fixture
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/.fixture-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/.fixture-tmp"
          cargo test --manifest-path core/rust/Cargo.toml \
            compile_named_value_cases_remain_evaluable_in_hal -- --nocapture
          status=$?
          set -e
          echo "focused_status=$status"
          echo "::group::matching source and generated files"
          grep -R -n -E 'shape/user\?|named.value|named_value' \
            core/rust core/lib "$GITHUB_WORKSPACE/.fixture-tmp" target 2>/dev/null \
            | head -n 400 || true
          echo "::endgroup::"
          echo "::group::generated HAL files"
          find "$GITHUB_WORKSPACE/.fixture-tmp" target /tmp \
            -type f -name '*.hal' -print 2>/dev/null | sort | while read -r file; do
              if grep -q -E 'shape/user\?|defstruct|defmutable|defenum' "$file"; then
                echo "FILE=$file"
                nl -ba "$file" | sed -n '1,260p'
              fi
            done
          echo "::endgroup::"
          exit "$status"
