name: Inspect named-value compiler fixture

on:
  push:
    branches: [agent/fix-production-build-manifest-558]
    paths: [.github/workflows/inspect-named-value-fixture.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-build-manifest-558
      - name: Locate Java test and fixture source
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::test definition"
          grep -R -n -E 'compile_named_value_cases_remain_evaluable_in_hal|compiler_named_values|shape/user\?' core/java core/lib core/rust || true
          echo "::endgroup::"
          echo "::group::matching files"
          grep -R -l -E 'compile_named_value_cases_remain_evaluable_in_hal|compiler_named_values|shape/user\?' core/java core/lib core/rust | while read -r file; do
            echo "FILE=$file"
            nl -ba "$file" | sed -n '1,280p'
          done
          echo "::endgroup::"
