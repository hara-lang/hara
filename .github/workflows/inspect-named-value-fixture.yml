name: Inspect named-value compiler fixture

on:
  push:
    branches: [agent/fix-production-build-manifest-558]
    paths: [.github/workflows/inspect-named-value-fixture.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-build-manifest-558
      - name: Locate failing fixture
        shell: bash
        run: |
          set -euxo pipefail
          grep -R -n -E 'compile_named_value_cases_remain_evaluable_in_hal|shape/user\?' core/rust core/lib || true
          file="$(grep -R -l 'compile_named_value_cases_remain_evaluable_in_hal' core/rust core/lib | head -n 1)"
          test -n "$file"
          echo "FILE=$file"
          nl -ba "$file" | sed -n '1,260p'
