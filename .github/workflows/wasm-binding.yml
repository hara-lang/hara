name: Wasm binding contract

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/lib/src/tool/cli/extension.hal'
      - 'core/lib/src/tool/cli/handlers.hal'
      - 'core/lib/test/tool/cli/extension_test.hal'
      - 'core/lib/test/tool/cli/handlers_test.hal'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/resources/hara-cli-extension-*.edn'
      - 'core/rust/src/bin/hara/cli/hara.rs'
      - 'core/rust/src/cli_app.rs'
      - 'core/rust/src/cli_app/**'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/direct_wasm.rs'
      - 'core/rust/src/extension.rs'
      - 'core/rust/src/wasmtime_provider.rs'
      - 'core/rust/src/wasm_binding.rs'
      - 'core/rust/src/wasm_binding/**'
      - 'scripts/runtime/check-wasm-binding'
      - '.github/workflows/wasm-binding.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/tool/cli/extension.hal'
      - 'core/lib/src/tool/cli/handlers.hal'
      - 'core/lib/test/tool/cli/extension_test.hal'
      - 'core/lib/test/tool/cli/handlers_test.hal'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/resources/hara-cli-extension-*.edn'
      - 'core/rust/src/bin/hara/cli/hara.rs'
      - 'core/rust/src/cli_app.rs'
      - 'core/rust/src/cli_app/**'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/direct_wasm.rs'
      - 'core/rust/src/extension.rs'
      - 'core/rust/src/wasmtime_provider.rs'
      - 'core/rust/src/wasm_binding.rs'
      - 'core/rust/src/wasm_binding/**'
      - 'scripts/runtime/check-wasm-binding'
      - '.github/workflows/wasm-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check formatting and module bounds
        run: ./scripts/runtime/check-wasm-binding format

      - name: Run focused Rust binding tests
        run: ./scripts/runtime/check-wasm-binding rust-tests

      - name: Run focused Hara command tests
        run: ./scripts/runtime/check-wasm-binding hara-tests

      - name: Check native and browser targets
        run: ./scripts/runtime/check-wasm-binding targets

      - name: Confirm validation did not modify source
        run: ./scripts/runtime/check-wasm-binding drift
