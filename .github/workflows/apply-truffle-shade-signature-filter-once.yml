name: Apply Truffle shaded JAR signature fix once

on:
  push:
    branches:
      - agent/isolate-foundation-runtime-smoke
    paths:
      - '.github/workflows/apply-truffle-shade-signature-filter-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact working branch
        uses: actions/checkout@v4
        with:
          ref: agent/isolate-foundation-runtime-smoke
          fetch-depth: 0
      - name: Check out the Hara specs registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Remove invalidated dependency signatures from the shaded JAR
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pom_path = Path('core/java/pom.xml')
          pom = pom_path.read_text()
          old = '''\t\t\t\t\t\t\t\t\t<createDependencyReducedPom>false</createDependencyReducedPom>
\t\t\t\t\t\t\t\t\t<transformers>'''
          new = '''\t\t\t\t\t\t\t\t\t<createDependencyReducedPom>false</createDependencyReducedPom>
\t\t\t\t\t\t\t\t\t<filters>
\t\t\t\t\t\t\t\t\t\t<filter>
\t\t\t\t\t\t\t\t\t\t\t<artifact>*:*</artifact>
\t\t\t\t\t\t\t\t\t\t\t<excludes>
\t\t\t\t\t\t\t\t\t\t\t\t<exclude>META-INF/*.SF</exclude>
\t\t\t\t\t\t\t\t\t\t\t\t<exclude>META-INF/*.DSA</exclude>
\t\t\t\t\t\t\t\t\t\t\t\t<exclude>META-INF/*.RSA</exclude>
\t\t\t\t\t\t\t\t\t\t\t</excludes>
\t\t\t\t\t\t\t\t\t\t</filter>
\t\t\t\t\t\t\t\t\t</filters>
\t\t\t\t\t\t\t\t\t<transformers>'''
          if pom.count(old) != 1:
              raise SystemExit(f'expected one shade configuration anchor, found {pom.count(old)}')
          pom_path.write_text(pom.replace(old, new, 1))

          workflow_path = Path('.github/workflows/lang-runtime.yml')
          workflow = workflow_path.read_text()
          anchor = "      - 'core/rust/src/numeric.rs'\n"
          addition = anchor + "      - 'core/java/pom.xml'\n"
          if workflow.count(anchor) != 2:
              raise SystemExit(f'expected two runtime path-filter anchors, found {workflow.count(anchor)}')
          workflow_path.write_text(workflow.replace(anchor, addition))
          PY
      - name: Build the Truffle distribution
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml
      - name: Verify the shaded JAR has no stale signatures
        run: |
          if jar tf core/java/target/hara-truffle.jar \
            | grep -E '^META-INF/[^/]+\.(SF|DSA|RSA)$'; then
            echo 'stale dependency signature metadata remains in hara-truffle.jar' >&2
            exit 1
          fi
      - name: Execute the packaged Hara bootstrap probe
        run: core/hara run core/lib/integration/hara/lang_bootstrap_probe.hal
      - name: Commit the validated packaging fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/java/pom.xml .github/workflows/lang-runtime.yml
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'Strip invalid signatures from the Truffle distribution'
          git push origin HEAD:agent/isolate-foundation-runtime-smoke
