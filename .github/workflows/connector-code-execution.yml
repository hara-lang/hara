name: Connector code execution

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/rust/**'
      - '!core/rust/web/**'
      - 'core/java/**'
      - 'scripts/runtime/detect-connector-code-scope'
      - 'scripts/runtime/run-connector-code'
      - '.github/workflows/connector-code-execution.yml'
      - '.github/CHATGPT_PROJECT_WORKFLOW.md'
      - '.github/WORKFLOW.md'
      - 'AGENTS.md'
  push:
    branches:
      - 'agent/**'
      - 'chat/**'
      - 'codex/**'
    paths:
      - 'core/rust/**'
      - '!core/rust/web/**'
      - 'core/java/**'
      - 'scripts/runtime/detect-connector-code-scope'
      - 'scripts/runtime/run-connector-code'
      - '.github/workflows/connector-code-execution.yml'
      - '.github/CHATGPT_PROJECT_WORKFLOW.md'
      - '.github/WORKFLOW.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used to classify a manually dispatched ref
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: connector-code-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Resolve committed language scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      java: ${{ steps.scope.outputs.java }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate connector execution scripts
        shell: bash
        run: |
          bash -n scripts/runtime/detect-connector-code-scope
          bash -n scripts/runtime/run-connector-code
          bash scripts/runtime/detect-connector-code-scope --self-test

      - name: Detect committed Rust and Java scope
        id: scope
        shell: bash
        env:
          CONNECTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONNECTOR_BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref || 'main' }}
          CONNECTOR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/runtime/detect-connector-code-scope

  rust:
    name: Execute committed Rust
    needs: contract
    if: ${{ needs.contract.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.head_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run committed Rust validation
        shell: bash
        run: bash scripts/runtime/run-connector-code rust

  java:
    name: Execute committed Java
    needs: contract
    if: ${{ needs.contract.outputs.java == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run committed Java validation
        shell: bash
        run: bash scripts/runtime/run-connector-code java

  evidence:
    name: Record committed execution result
    needs: [contract, rust, java]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected language job to pass
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          RUST_SELECTED: ${{ needs.contract.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          JAVA_SELECTED: ${{ needs.contract.outputs.java }}
          JAVA_RESULT: ${{ needs.java.result }}
          BASE_SHA: ${{ needs.contract.outputs.base_sha }}
          HEAD_SHA: ${{ needs.contract.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success

          if [[ "$RUST_SELECTED" = true ]]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi

          if [[ "$JAVA_SELECTED" = true ]]; then
            test "$JAVA_RESULT" = success
          else
            test "$JAVA_RESULT" = skipped
          fi

          {
            printf '### Connector code execution\n\n'
            printf -- '- Base: `%s`\n' "$BASE_SHA"
            printf -- '- Head: `%s`\n' "$HEAD_SHA"
            printf -- '- Rust selected: `%s` (`%s`)\n' "$RUST_SELECTED" "$RUST_RESULT"
            printf -- '- Java selected: `%s` (`%s`)\n' "$JAVA_SELECTED" "$JAVA_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
