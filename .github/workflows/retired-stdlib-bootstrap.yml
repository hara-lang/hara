name: Retired stdlib migration bootstrap

on:
  push:
    branches:
      - codex/remove-retired-stdlib-modules
    paths:
      - .github/workflows/retired-stdlib-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: retired-stdlib-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/remove-retired-stdlib-modules
          fetch-depth: 0

      - name: Materialize checksum-verified migration tooling
        run: |
          python3 - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path(".github/hard-cut-payload")
          expected = {
              "script.00.b64": "aec21788c8f975c2d7fd962db6d8d9f2aca96eb758a57f71c3c82bc5fec73669",
              "script.01.b64": "d383c6b1ee1b666c4bbb2ddac16f2a2993b0aed694db045b8070fed13fbcd53e",
              "script.02a.b64": "bae587134bd600d9a4f99cd623c93ca2298de70be8adf1ec0c714a69ef041898",
              "script.02b.b64": "a2edbb956b7da849d44a8fd042be039a0cdfb6ec09664f671783691ff0d4f122",
              "script.03.b64": "6c80ae8d2b03689ea37ee846cfbc859f335c19d879bb53aeeb6f470bfa9c8dbe",
              "script.04.b64": "4ceeefb1cc357ec954650a967020c240493d98d2c4f4e598a588516d5d7fe6ff",
              "test.00.b64": "7c5a7dd33110168e54af7e07cc3476df77fb6efae3c75c23328ed22cca96683b",
          }
          payloads = {}
          for name, digest in expected.items():
              payload = (root / name).read_text().strip()
              actual = hashlib.sha256(payload.encode()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"payload checksum mismatch for {name}: {actual}")
              payloads[name] = payload

          outputs = {
              Path("scripts/runtime/retired_stdlib_hard_cut.py"): "".join(
                  payloads[name]
                  for name in (
                      "script.00.b64",
                      "script.01.b64",
                      "script.02a.b64",
                      "script.02b.b64",
                      "script.03.b64",
                      "script.04.b64",
                  )
              ),
              Path("scripts/runtime/retired_stdlib_hard_cut_test.py"): payloads[
                  "test.00.b64"
              ],
          }
          for path, payload in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PYCODE
          chmod +x scripts/runtime/retired_stdlib_hard_cut.py
          chmod +x scripts/runtime/retired_stdlib_hard_cut_test.py
          rm -rf .github/hard-cut-payload
          rm .github/workflows/retired-stdlib-bootstrap.yml

      - name: Verify transformer
        run: python3 scripts/runtime/retired_stdlib_hard_cut_test.py

      - name: Apply hard cut
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py --write --defer-audit

      - name: Synchronize Rust HAL mirror
        run: scripts/runtime/sync-rust-hal-src

      - name: Audit source and mirrors before artifact regeneration
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py --skip-hbx

      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove retired std.lib.walk and std.lib.test modules"
          git push origin HEAD:codex/remove-retired-stdlib-modules

      - name: Regenerate embedded Foundation artifact
        run: >-
          cargo run --quiet
          --manifest-path core/rust/Cargo.toml
          --features bytecode-vm
          --bin hara-foundation-artifact -- generate

      - name: Commit Foundation artifact
        run: |
          if git diff --quiet -- core/rust/assets/std.foundation.hbx; then
            echo "Foundation artifact is already current"
          else
            git add core/rust/assets/std.foundation.hbx
            git commit -m "Regenerate embedded Foundation artifact"
            git push origin HEAD:codex/remove-retired-stdlib-modules
          fi

      - name: Run hard-cut audit
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py

      - name: Check Rust HAL mirror
        run: scripts/runtime/sync-rust-hal-src --check

      - name: Test Rust result compatibility
        run: >-
          cargo test --manifest-path core/rust/Cargo.toml
          test_result_compatibility_tests -- --nocapture

      - name: Run focused HAL tests
        run: |
          scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal
