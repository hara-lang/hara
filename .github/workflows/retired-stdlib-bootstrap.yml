name: Retired stdlib migration bootstrap

on:
  push:
    branches:
      - codex/remove-retired-stdlib-modules
    paths:
      - .github/workflows/retired-stdlib-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: retired-stdlib-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/remove-retired-stdlib-modules
          fetch-depth: 0

      - name: Materialize checksum-verified migration tooling
        run: |
          python3 - <<'PYCODE'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path(".github/hard-cut-payload")
          expected = {
              "script.00.b64": "3d8ba3f1b2055c0184651023c868964638771113b02c1e62bdf0d4052fc0c37a",
              "script.01.b64": "bb081edb97c2e8b03b67d1de9d52c2bde00eadf56d925edaaaa272d6ecd2c6d5",
              "script.02.b64": "05a0cba4aa7d44954bf58d8cd62a481cdde3f1c8a5e3acdbaf0e14910049518a",
              "script.03.b64": "73f5d9a99dd8ba096f8e725a62af6e4f85f999a8a48549c26a5aae1136f68dac",
              "script.04.b64": "f1ef5ba1833830d930984fd01d8c37a0fde86530f8a0aa5dc0785d42449f2ef4",
              "script.05.b64": "218674f5f50886dc430970b0814473c5064d9423fb238ae16aa80ac722c3bcb4",
              "script.06.b64": "89c7c7cce77b8139c9125f6da2531451a4deac303b9bbec496633d0462e4e84d",
              "test.00.b64": "451f7eca7b823aa2810fb073f2aa228b5e89798cef6f9a8ecc577a3e15d70c55",
          }
          payloads = {}
          for name, digest in expected.items():
              payload = (root / name).read_text().strip()
              actual = hashlib.sha256(payload.encode()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"payload checksum mismatch for {name}: {actual}")
              payloads[name] = payload

          outputs = {
              Path("scripts/runtime/retired_stdlib_hard_cut.py"): "".join(
                  payloads[f"script.{index:02d}.b64"] for index in range(7)
              ),
              Path("scripts/runtime/retired_stdlib_hard_cut_test.py"): payloads[
                  "test.00.b64"
              ],
          }
          for path, payload in outputs.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(payload)))

          script_path = Path("scripts/runtime/retired_stdlib_hard_cut.py")
          script_source = script_path.read_text()
          script_start = script_source.index("def update_run_lib_tests")
          script_end = script_source.index("\n\ndef tracked_files", script_start)
          runner_rewrite = '''def update_run_lib_tests(source: str) -> str:
              retired_path = "core/lib/test/std/lib/test.hal"
              lines = source.splitlines(keepends=True)
              exclusion_count = sum(
                  1 for line in lines if "! -path" in line and retired_path in line
              )
              if exclusion_count != 2:
                  raise MigrationError(
                      f"{RUN_LIB_TESTS}: expected two retired path exclusions, "
                      f"found {exclusion_count}"
                  )
              lines = [
                  line
                  for line in lines
                  if not ("! -path" in line and retired_path in line)
              ]

              condition = f"if [ \\"$target\\" != '{retired_path}' ]; then"
              rewritten: list[str] = []
              condition_count = 0
              index = 0
              while index < len(lines):
                  if lines[index].strip() != condition:
                      rewritten.append(lines[index])
                      index += 1
                      continue
                  condition_count += 1
                  indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
                  if index + 2 >= len(lines):
                      raise MigrationError(f"{RUN_LIB_TESTS}: truncated retired file guard")
                  body = lines[index + 1]
                  closing = lines[index + 2]
                  if not body.strip().startswith("printf '%s\\\\n' \\"$target\\""):
                      raise MigrationError(f"{RUN_LIB_TESTS}: unexpected retired file guard body")
                  if closing.strip() != "fi" or not closing.startswith(indent):
                      raise MigrationError(f"{RUN_LIB_TESTS}: unexpected retired file guard close")
                  rewritten.append(body)
                  index += 3

              if condition_count != 1:
                  raise MigrationError(
                      f"{RUN_LIB_TESTS}: expected one retired file guard, found {condition_count}"
                  )
              source = "".join(rewritten)
              if retired_path in source:
                  raise MigrationError(f"{RUN_LIB_TESTS}: retired exclusion remains")
              return source
          '''
          runner_rewrite = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in runner_rewrite.splitlines()
          )
          script_path.write_text(
              script_source[:script_start] + runner_rewrite + script_source[script_end:]
          )

          test_path = Path("scripts/runtime/retired_stdlib_hard_cut_test.py")
          test_source = test_path.read_text()
          test_marker = '\n\nif __name__ == "__main__":\n'
          runner_test = r'''
              def test_removes_all_runner_exclusions(self) -> None:
                  source = """collect_root() {
              find "$1" -name '*.hal' \\
                      ! -path 'core/lib/test/std/lib/test.hal' \\
                      -print
          }
          collect_files() {
              find "$1" -name '*.hal' \\
                          ! -path 'core/lib/test/std/lib/test.hal' \\
                          -print
              elif [ -f "$target" ]; then
                  if [ "$target" != 'core/lib/test/std/lib/test.hal' ]; then
                      printf '%s\\n' "$target"
                  fi
              fi
          }
          """
                  migrated = MODULE.update_run_lib_tests(source)
                  self.assertNotIn("std/lib/test.hal", migrated)
                  self.assertEqual(migrated.count("-print"), 2)
                  self.assertIn("printf '%s\\n' \"$target\"", migrated)
          '''
          runner_test = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in runner_test.splitlines()
          )
          if "def test_removes_all_runner_exclusions" not in test_source:
              test_source = test_source.replace(test_marker, runner_test + test_marker, 1)
          test_path.write_text(test_source)
          PYCODE
          chmod +x scripts/runtime/retired_stdlib_hard_cut.py
          chmod +x scripts/runtime/retired_stdlib_hard_cut_test.py
          rm -rf .github/hard-cut-payload
          rm .github/workflows/retired-stdlib-bootstrap.yml

      - name: Verify transformer
        run: python3 scripts/runtime/retired_stdlib_hard_cut_test.py

      - name: Apply hard cut
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py --write --skip-hbx

      - name: Synchronize Rust HAL mirror
        run: scripts/runtime/sync-rust-hal-src

      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove retired std.lib.walk and std.lib.test modules"
          git push origin HEAD:codex/remove-retired-stdlib-modules

      - name: Regenerate embedded Foundation artifact
        run: >-
          cargo run --quiet
          --manifest-path core/rust/Cargo.toml
          --features bytecode-vm
          --bin hara-foundation-artifact -- generate

      - name: Commit Foundation artifact
        run: |
          if git diff --quiet -- core/rust/assets/std.foundation.hbx; then
            echo "Foundation artifact is already current"
          else
            git add core/rust/assets/std.foundation.hbx
            git commit -m "Regenerate embedded Foundation artifact"
            git push origin HEAD:codex/remove-retired-stdlib-modules
          fi

      - name: Run hard-cut audit
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py

      - name: Check Rust HAL mirror
        run: scripts/runtime/sync-rust-hal-src --check

      - name: Test Rust result compatibility
        run: >-
          cargo test --manifest-path core/rust/Cargo.toml
          test_result_compatibility_tests -- --nocapture

      - name: Run focused HAL tests
        run: |
          scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal
