name: Survey Foundation external routes

on:
  push:
    branches:
      - agent/554-external-clojure-mappings
    paths:
      - '.github/workflows/survey-external-routes.yml'
  pull_request:
    branches:
      - agent/524-code-migrate-substrate
    paths:
      - '.github/workflows/survey-external-routes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/554-external-clojure-mappings
          fetch-depth: 0

      - name: Print the exact external namespace inventory
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          source = Path(
              'core/spec/code-migrate/foundation-baa75a.edn'
          ).read_text(encoding='utf-8')
          route_segment = source.split(':external/routes [', 1)[1].split(
              '] :foundation/rank-base', 1
          )[0]
          names = re.findall(r':external/namespace "([^"]+)"', route_segment)
          counts = Counter(names)
          print(f'route occurrences: {len(names)}')
          print(f'unique namespaces: {len(counts)}')
          for name in sorted(counts):
              print(f'{counts[name]:4d}\t{name}')
          PY
