name: Apply work store model

on:
  push:
    branches:
      - agent/std-work-sqlite-operational-store-459

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Route MemoryStore rules through the pure model
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          path = Path('core/lib/src/std/work/provider/memory.hal')
          text = path.read_text()
          old_require = '[std.work.runtime.base :as base]\n            [std.work.runtime.store :as store]))'
          new_require = '[std.work.runtime.base :as base]\n            [std.work.runtime.store :as store]\n            [std.work.provider.model :as model]))'
          if text.count(old_require) != 1:
              raise SystemExit('unexpected MemoryStore require block')
          text = text.replace(old_require, new_require)

          replacements = {
          '''(def status-transitions
  {:created #{:created :queued :running :cancelled}
   :queued #{:queued :running :cancelled}
   :running #{:running :completed :failed :cancelled}
   :failed #{:failed :running :cancelled}
   :completed #{:completed}
   :cancelled #{:cancelled}})''':
          '''(def status-transitions model/status-transitions)''',
          '''(defn contains-value?
  [values value]
  (reduce
   (fn [found candidate]
     (or found (= value candidate)))
   false
   (or values [])))''':
          '''(defn contains-value?
  [values value]
  (model/contains-value? values value))''',
          '''(defn memory-validate-run-id
  [id]
  (if (nil? id)
    (throw (ex-info "Work run identity cannot be nil" {})))
  id)''':
          '''(defn memory-validate-run-id
  [id]
  (model/validate-run-id id))''',
          '''(defn normalise-run
  [run]
  (let [status (or (:run/status run) :created)]
    (merge
     {:run/revision 0
      :run/status status
      :run/execution-status status
      :run/receipt-status :pending
      :run/acceptance-status :pending}
     run
     {:run/revision (or (:run/revision run) 0)
      :run/status status
      :run/execution-status status})))''':
          '''(defn normalise-run
  [run]
  (model/normalise-run run))''',
          '''(defn assert-transition-revision!
  [run transition]
  (let [expected (:transition/expected-revision transition)
        actual (or (:run/revision run) 0)]
    (if (not= expected actual)
      (throw
       (ex-info "Work store revision conflict"
                {:run/id (:run/id run)
                 :expected/revision expected
                 :actual/revision actual}))))
  run)''':
          '''(defn assert-transition-revision!
  [run transition]
  (model/assert-transition-revision! run transition))''',
          '''(defn assert-status-transition!
  [run updates]
  (let [current (:run/status run)
        proposed (or (:run/status updates) current)
        allowed (get status-transitions current)]
    (if (not (contains-value? allowed proposed))
      (throw
       (ex-info "Work run status transition is not allowed"
                {:run/id (:run/id run)
                 :run/status current
                 :run/proposed-status proposed}))))
  run)''':
          '''(defn assert-status-transition!
  [run updates]
  (model/assert-status-transition! run updates))''',
          '''(defn canonical-run-updates
  [updates]
  (let [updates (or updates {})]
    (if (has? updates :run/status)
      (assoc updates :run/execution-status (:run/status updates))
      updates)))''':
          '''(defn canonical-run-updates
  [updates]
  (model/canonical-run-updates updates))''',
          '''(defn same-checkpoint?
  [existing proposed]
  (= (dissoc existing :checkpoint/sequence)
     (dissoc proposed :checkpoint/sequence)))''':
          '''(defn same-checkpoint?
  [existing proposed]
  (model/same-checkpoint? existing proposed))''',
          '''(defn assert-checkpoint-run!
  [run-id checkpoint]
  (let [checkpoint-run (:checkpoint/run checkpoint)]
    (if (and checkpoint-run (not= checkpoint-run run-id))
      (throw
       (ex-info "Checkpoint belongs to another work run"
                {:run/id run-id
                 :checkpoint/run checkpoint-run
                 :checkpoint/key (:checkpoint/key checkpoint)}))))
  checkpoint)''':
          '''(defn assert-checkpoint-run!
  [run-id checkpoint]
  (model/assert-checkpoint-run! run-id checkpoint))''',
          '''(defn strip-outbox-state
  [entry]
  (dissoc
   (dissoc
    (dissoc
     (dissoc
      (dissoc
       (dissoc entry :outbox/id)
       :outbox/sequence)
      :outbox/status)
     :outbox/claim-id)
    :outbox/claim)
   :outbox/ack))''':
          '''(defn strip-outbox-state
  [entry]
  (model/strip-outbox-state entry))''',
          '''(defn same-outbox-intent?
  [existing proposed]
  (= (strip-outbox-state existing)
     (strip-outbox-state proposed)))''':
          '''(defn same-outbox-intent?
  [existing proposed]
  (model/same-outbox-intent? existing proposed))''',
          '''(defn outbox-selected?
  [entry query]
  (and
   (or (nil? (:run/id query))
       (= (:run/id query) (:outbox/run entry)))
   (or (nil? (:status query))
       (= (:status query) (:outbox/status entry)))))''':
          '''(defn outbox-selected?
  [entry query]
  (model/outbox-selected? entry query))''',
          '''(defn claimable?
  [entry options]
  (and (= :pending (:outbox/status entry))
       (or (nil? (:run/id options))
           (= (:run/id options) (:outbox/run entry)))))''':
          '''(defn claimable?
  [entry options]
  (model/claimable? entry options))''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one model rule: {old.splitlines()[0]}')
              text = text.replace(old, new)

          path.write_text(text)
          Path('core/rust/hal-src/std/work/provider/memory.hal').write_text(text)
          Path('.github/workflows/apply-work-store-model.yml').unlink()
          PY
          python3 /tmp/apply.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Share pure store rules with MemoryStore"
          git push
