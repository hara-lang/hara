name: Collection protocol test slices

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/java/src/main/java/hara/lang/data/**'
      - 'core/java/src/main/java/hara/lang/protocol/**'
      - 'core/java/src/main/java/hara/kernel/builtin/**'
      - 'core/java/src/main/java/hara/truffle/**'
      - 'core/java/src/test/java/hara/lang/data/**'
      - 'core/java/src/test/java/hara/lang/protocol/**'
      - 'core/java/src/test/java/hara/kernel/builtin/**'
      - 'core/java/src/test/java/hara/truffle/**'
      - 'core/java/pom.xml'
      - 'core/rust/Cargo.toml'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/work.rs'
      - 'core/rust/src/work/**'
      - '.github/workflows/collection-protocol-slices.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collection-slices-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collection-slice:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: core-collections
            name: Core collection behavior
            tests: hara.lang.data.CollectionsTest,hara.lang.data.ListTest,hara.lang.data.VectorTest,hara.lang.data.QueueTest,hara.lang.data.TupleTest,hara.lang.data.OrderedCollectionsTest,hara.lang.data.SortedCollectionsTest,hara.truffle.CollectionProtocolConformanceTest
          - id: protocol-dispatch
            name: Protocol dispatch and extension
            tests: hara.lang.protocol.ProtocolTest,hara.truffle.HaraProtocolTest,hara.truffle.HaraWorkProtocolTest,hara.truffle.HaraWorkHostTest
          - id: java-truffle-interop
            name: Java-backed and Truffle interop
            tests: hara.truffle.HaraInteropTest,hara.truffle.HaraJavaAdaptersTest,hara.kernel.builtin.BuiltinInteropTest,hara.kernel.builtin.BuiltinCollectionTest
          - id: iterator-laziness
            name: Iterator and lazy operations
            tests: hara.lang.base.IterTest,hara.lang.base.CloseableIteratorTest,hara.lang.data.ConsTest,hara.core.zip.ZipTest
          - id: struct-callability
            name: HaraStruct and IFn behavior
            tests: hara.kernel.builtin.BuiltinStructTest,hara.truffle.FoundationFallbackDemandTest,hara.truffle.HaraLanguageTest
          - id: differential-boundaries
            name: Differential semantics and unsupported boundaries
            tests: hara.truffle.CollectionProtocolDifferentialTest,hara.truffle.HaraProtocolTest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run test slice
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest="${{ matrix.tests }}" test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.id }}
          path: core/java/target/surefire-reports/
          if-no-files-found: ignore

  rust-work-lifecycle:
    name: Rust native work lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format focused Rust sources
        run: rustfmt --edition 2021 core/rust/src/work.rs core/rust/src/work/session.rs

      - name: Commit exact formatter output
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- core/rust/src/work.rs core/rust/src/work/session.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/rust/src/work.rs core/rust/src/work/session.rs
          git commit -m 'Format Rust work lifecycle'
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Run focused lifecycle tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path core/rust/Cargo.toml --lib 'work::' -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/rust-work-test.log"

      - name: Upload Rust lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-work-test-log
          path: ${{ runner.temp }}/rust-work-test.log
          if-no-files-found: ignore
