name: Build portable std.fs tranche v2

on:
  push:
    branches:
      - agent/650-portable-fs-build

permissions:
  contents: write

concurrency:
  group: agent-650-portable-fs-build-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: 28bb0a83083b922344d478b2f5777ea1a8b1cbf1
          path: hara
          fetch-depth: 0

      - name: Checkout build materializer
        uses: actions/checkout@v4
        with:
          ref: agent/650-portable-fs-build
          path: builder
          fetch-depth: 1

      - name: Checkout specification fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: main
          path: hara-specs-registry
          fetch-depth: 1

      - name: Materialize portable std.fs sources and tests
        shell: bash
        run: |
          set -euo pipefail
          ln -s ../hara-specs-registry hara/hara-specs-registry
          cd hara
          git fetch origin agent/fs-materialized-snapshot
          git checkout origin/agent/fs-materialized-snapshot -- \
            core/lib/src/std/fs.hal \
            core/lib/src/std/fs/walk.hal \
            core/java/src/test/java/hara/truffle/StdFsTest.java
          python3 ../builder/scripts/agent-650-materialize-portable-fs.py
          python3 ../builder/scripts/agent-650-repair-jvm-std-fs-test.py
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          git diff --check
          git status --short

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust packaging and native providers
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          cargo check --manifest-path core/rust/Cargo.toml --lib
          cargo test --manifest-path core/rust/Cargo.toml file::tests --lib -- --nocapture

      - name: Evaluate portable facade test in a fresh process
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          ./scripts/runtime/run-lib-tests core/lib/test/std/fs/facade_test.hal

      - name: Evaluate portable path test in a fresh process
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          ./scripts/runtime/run-lib-tests core/lib/test/std/fs/path_test.hal

      - name: Run focused portable filesystem library harness
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          ./scripts/runtime/run-lib-tests \
            core/lib/test/std/fs/facade_test.hal \
            core/lib/test/std/fs/path_test.hal

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: hara/core/java/pom.xml

      - name: Validate JVM provider and portable facade
        shell: bash
        run: |
          set -euo pipefail
          cd hara/core
          mvn -B -Ptruffle --file java/pom.xml process-test-resources
          for resource in \
            java/target/classes/std/fs.hal \
            java/target/classes/std/fs/path.hal \
            java/target/classes/std/fs/walk.hal; do
            test -s "$resource"
          done

          set +e
          log="$RUNNER_TEMP/std-fs-maven.log"
          mvn -B -Ptruffle --file java/pom.xml \
            -Dtest=HaraLogicalPathTest,HaraFileProviderTest,StdFsTest \
            test >"$log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::group::Focused JVM filesystem failure summary"
            grep -E 'Tests run:|Failures:|Errors:|<<< FAILURE!|Cannot load namespace|No source found|Caused by:|AssertionFailedError|BUILD FAILURE|\[ERROR\]' "$log" \
              | tail -n 260 || true
            echo "::endgroup::"
            echo "::group::Surefire reports"
            find java/target/surefire-reports -maxdepth 1 -type f \
              \( -name 'TEST-*.xml' -o -name '*.txt' \) \
              -print -exec tail -n 240 {} \; || true
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 100 "$log"

      - name: Publish clean portable std.fs branch
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          rm hara-specs-registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/650-portable-std-fs-current-main \
            28bb0a83083b922344d478b2f5777ea1a8b1cbf1
          git add \
            core/lib/src/std/fs.hal \
            core/lib/src/std/fs/walk.hal \
            core/lib/test/std/fs/facade_test.hal \
            core/lib/test/std/fs/path_test.hal \
            core/java/src/main/java/hara/truffle/HaraContext.java \
            core/java/src/main/java/hara/truffle/HaraFileProvider.java \
            core/java/src/test/java/hara/truffle/HaraFileProviderTest.java \
            core/java/src/test/java/hara/truffle/StdFsTest.java \
            core/rust/standard-library.namespaces
          git diff --cached --check
          git commit -m "Add portable promise-based std.fs core"
          git push --force origin HEAD:refs/heads/agent/650-portable-std-fs-current-main
