name: Restore Rust layout boundaries

on:
  push:
    branches: [agent/fix-production-build-manifest-558]
    paths: [.github/workflows/restore-rust-layout.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-build-manifest-558
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Extract oversized test modules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('core/rust/src/hta.rs')
          text = path.read_text()
          marker = '\n#[cfg(test)]\nmod tests {\n'
          start = text.index(marker)
          body, tail = text[start + len(marker):].rsplit('\n}', 1)
          assert not tail.strip()
          path.write_text(text[:start] + '\n#[cfg(test)]\n#[path = "hta/tests.rs"]\nmod tests;\n')
          target = Path('core/rust/src/hta/tests.rs')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(textwrap.dedent(body).lstrip('\n') + '\n')

          path = Path('core/rust/src/vm/execution_tests.rs')
          text = path.read_text()
          marker = '// ------------------------------------------------------------------\n// Exceptions (issue #203): try/catch/finally and guest throw.\n// ------------------------------------------------------------------\n'
          start = text.index(marker)
          path.write_text(text[:start] + '#[path = "execution_tests/exceptions.rs"]\nmod exceptions;\n')
          target = Path('core/rust/src/vm/execution_tests/exceptions.rs')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('use super::*;\n\n' + text[start:])
          PY
      - name: Format and verify extracted slices
        run: |
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          bash core/rust/scripts/check-layout.test.sh
          bash core/rust/scripts/check-layout.sh || true
      - name: Publish intermediate extraction
        run: |
          rm .github/workflows/restore-rust-layout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Extract oversized Rust test modules"
          git push origin HEAD:agent/fix-production-build-manifest-558
