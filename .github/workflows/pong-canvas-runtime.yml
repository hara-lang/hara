name: Pong canvas runtime

on:
  pull_request:
    branches: [main, testing]
    paths:
      - "core/rust/web/**"
      - "core/lib/src/std/substrate.hal"
      - "core/lib/src/std/substrate/**"
      - ".github/workflows/pong-canvas-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pong-canvas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Build raw Hara browser runtime
        run: >-
          cargo build
          --manifest-path core/rust/raw/Cargo.toml
          --target wasm32-unknown-unknown
          --release

      - name: Install browser runtime dependencies
        working-directory: core/rust/web
        run: npm ci

      - name: Start Pong and require its first Canvas2D frame
        working-directory: core/rust/web
        run: npm run test:pong
