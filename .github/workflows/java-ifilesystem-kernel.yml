name: Java IFilesystem Kernel CI

on:
  push:
    paths:
      - ".github/workflows/java-ifilesystem-kernel.yml"
      - "core/java/src/main/java/hara/truffle/FilesystemMountTable.java"
      - "core/java/src/main/java/hara/truffle/FilesystemProviderRegistry.java"
      - "core/java/src/main/java/hara/truffle/IFilesystem*.java"
      - "core/java/src/main/java/hara/truffle/NativeFilesystem.java"
      - "core/java/src/main/java/hara/truffle/HaraMountedFileSystem.java"
      - "core/java/src/main/java/hara/truffle/SessionModel.java"
      - "core/java/src/test/java/hara/truffle/FilesystemMountTableTest.java"
  pull_request:
    paths:
      - ".github/workflows/java-ifilesystem-kernel.yml"
      - "core/java/src/main/java/hara/truffle/FilesystemMountTable.java"
      - "core/java/src/main/java/hara/truffle/FilesystemProviderRegistry.java"
      - "core/java/src/main/java/hara/truffle/IFilesystem*.java"
      - "core/java/src/main/java/hara/truffle/NativeFilesystem.java"
      - "core/java/src/main/java/hara/truffle/HaraMountedFileSystem.java"
      - "core/java/src/main/java/hara/truffle/SessionModel.java"
      - "core/java/src/test/java/hara/truffle/FilesystemMountTableTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ifilesystem-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mount-lifecycle:
    name: Provider-neutral mount lifecycle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run focused mount lifecycle conformance
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -Dtest=FilesystemMountTableTest test
