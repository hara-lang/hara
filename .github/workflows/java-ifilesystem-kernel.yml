name: Java IFilesystem Kernel CI

on:
  push:
    paths:
      - ".github/workflows/java-ifilesystem-kernel.yml"
      - "core/java/src/main/java/hara/truffle/FilesystemEffects.java"
      - "core/java/src/main/java/hara/truffle/FilesystemMountTable.java"
      - "core/java/src/main/java/hara/truffle/FilesystemPromiseBridge.java"
      - "core/java/src/main/java/hara/truffle/FilesystemProviderRegistry.java"
      - "core/java/src/main/java/hara/truffle/FilesystemRuntimeBinding.java"
      - "core/java/src/main/java/hara/truffle/IFilesystem*.java"
      - "core/java/src/main/java/hara/truffle/NativeFilesystem.java"
      - "core/java/src/main/java/hara/truffle/HaraContext.java"
      - "core/java/src/main/java/hara/truffle/HaraLogicalPath.java"
      - "core/java/src/main/java/hara/truffle/HaraMountedFileSystem.java"
      - "core/java/src/main/java/hara/truffle/InProcessSandboxProvider.java"
      - "core/java/src/main/java/hara/truffle/SandboxProvider.java"
      - "core/java/src/main/java/hara/truffle/SessionKernel.java"
      - "core/java/src/main/java/hara/truffle/SessionModel.java"
      - "core/java/src/test/java/hara/truffle/FilesystemDescriptorAuthorityTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemEffectsTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemMountTableTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemPromiseBridgeTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemRuntimeBindingTest.java"
      - "core/java/src/test/java/hara/truffle/SessionKernelFilesystemMountTest.java"
      - "core/java/src/test/java/hara/truffle/SessionKernelTest.java"
  pull_request:
    paths:
      - ".github/workflows/java-ifilesystem-kernel.yml"
      - "core/java/src/main/java/hara/truffle/FilesystemEffects.java"
      - "core/java/src/main/java/hara/truffle/FilesystemMountTable.java"
      - "core/java/src/main/java/hara/truffle/FilesystemPromiseBridge.java"
      - "core/java/src/main/java/hara/truffle/FilesystemProviderRegistry.java"
      - "core/java/src/main/java/hara/truffle/FilesystemRuntimeBinding.java"
      - "core/java/src/main/java/hara/truffle/IFilesystem*.java"
      - "core/java/src/main/java/hara/truffle/NativeFilesystem.java"
      - "core/java/src/main/java/hara/truffle/HaraContext.java"
      - "core/java/src/main/java/hara/truffle/HaraLogicalPath.java"
      - "core/java/src/main/java/hara/truffle/HaraMountedFileSystem.java"
      - "core/java/src/main/java/hara/truffle/InProcessSandboxProvider.java"
      - "core/java/src/main/java/hara/truffle/SandboxProvider.java"
      - "core/java/src/main/java/hara/truffle/SessionKernel.java"
      - "core/java/src/main/java/hara/truffle/SessionModel.java"
      - "core/java/src/test/java/hara/truffle/FilesystemDescriptorAuthorityTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemEffectsTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemMountTableTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemPromiseBridgeTest.java"
      - "core/java/src/test/java/hara/truffle/FilesystemRuntimeBindingTest.java"
      - "core/java/src/test/java/hara/truffle/SessionKernelFilesystemMountTest.java"
      - "core/java/src/test/java/hara/truffle/SessionKernelTest.java"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ifilesystem-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mount-lifecycle:
    name: Provider-neutral Kernel and runtime conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run focused provider-neutral conformance
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -Dtest=FilesystemDescriptorAuthorityTest,FilesystemMountTableTest,FilesystemEffectsTest,FilesystemRuntimeBindingTest,FilesystemPromiseBridgeTest,SessionKernelFilesystemMountTest,SessionKernelTest test
