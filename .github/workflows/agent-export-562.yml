name: Export clean worktree for issue 562

on:
  push:
    branches:
      - agent/562-split-vm-layout

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the checked-out source tree
        run: tar --exclude=.git -czf /tmp/hara-562-worktree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: hara-562-worktree
          path: /tmp/hara-562-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
