name: Export validated issue 562 product branch

on:
  pull_request:
    paths:
      - '.github/workflows/agent-export-562.yml'
      - '.github/agent-patches/562-split-layout.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-562-layout-product
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: agent/562-rust-vm-layout-product
  TRANSPORT_BRANCH: agent/562-split-vm-layout

jobs:
  export-product:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main without transport files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Rust formatting and linting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Load and apply the fail-closed transport patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TRANSPORT_BRANCH:refs/remotes/origin/$TRANSPORT_BRANCH"
          mkdir -p .github/agent-patches
          git show "origin/$TRANSPORT_BRANCH:.github/agent-patches/562-split-layout.py" > .github/agent-patches/562-split-layout.py
          python3 .github/agent-patches/562-split-layout.py

      - name: Format and synchronize exact layout baselines
        shell: bash
        run: |
          set -euo pipefail
          rust_files=(
            core/rust/src/vm/compiler.rs
            core/rust/src/vm/compiler/globals.rs
            core/rust/src/vm/compiler/bindings.rs
            core/rust/src/vm/machine.rs
            core/rust/src/vm/machine/constants.rs
            core/rust/src/vm/machine/dispatch.rs
          )
          rustfmt --edition 2021 "${rust_files[@]}"
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('core/rust')
          parents = {
              'src/vm/compiler/globals.rs': sum(1 for _ in (root / 'src/vm/compiler/globals.rs').open()),
              'src/vm/machine.rs': sum(1 for _ in (root / 'src/vm/machine.rs').open()),
          }
          children = {
              'src/vm/compiler/bindings.rs': sum(1 for _ in (root / 'src/vm/compiler/bindings.rs').open()),
              'src/vm/machine/constants.rs': sum(1 for _ in (root / 'src/vm/machine/constants.rs').open()),
              'src/vm/machine/dispatch.rs': sum(1 for _ in (root / 'src/vm/machine/dispatch.rs').open()),
          }

          globals_lines = parents['src/vm/compiler/globals.rs']
          machine_lines = parents['src/vm/machine.rs']
          if globals_lines > 700:
              raise RuntimeError(f'compiler globals remains above the default ceiling: {parents}')
          if not 900 <= machine_lines <= 1000:
              raise RuntimeError(f'machine missed the validated approximately-942-line target: {parents}')
          oversized = {path: lines for path, lines in children.items() if lines > 700}
          if oversized:
              raise RuntimeError(f'new child exceeds the 700-line ceiling: {oversized}')

          baseline_path = root / 'scripts/layout-baseline.txt'
          baseline = baseline_path.read_text()
          baseline, globals_removed = re.subn(
              r'^lines src/vm/compiler/globals\.rs [0-9]+\n?',
              '',
              baseline,
              count=1,
              flags=re.MULTILINE,
          )
          if globals_removed != 1:
              raise RuntimeError('missing compiler globals layout baseline entry')
          baseline, machine_updated = re.subn(
              r'^lines src/vm/machine\.rs [0-9]+$',
              f'lines src/vm/machine.rs {machine_lines}',
              baseline,
              count=1,
              flags=re.MULTILINE,
          )
          if machine_updated != 1:
              raise RuntimeError('missing machine layout baseline entry')
          baseline_path.write_text(baseline)

          if 'lines src/vm/compiler/globals.rs ' in baseline:
              raise RuntimeError('resolved compiler globals debt remains in the baseline')
          if f'lines src/vm/machine.rs {machine_lines}' not in baseline:
              raise RuntimeError('machine baseline does not equal the exact final count')

          summary = {'parents': parents, 'children': children}
          Path('/tmp/layout-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          rustfmt --edition 2021 --check "${rust_files[@]}"
          git diff --check

      - name: Compare the layout gate with current main
        shell: bash
        run: |
          set -euo pipefail
          bash core/rust/scripts/check-layout.test.sh
          BASE_SHA=$(git rev-parse HEAD)
          git worktree add --detach /tmp/hara-layout-base "$BASE_SHA"

          set +e
          (
            cd /tmp/hara-layout-base
            bash core/rust/scripts/check-layout.sh
          ) > /tmp/base-layout.out 2>&1
          base_status=$?
          bash core/rust/scripts/check-layout.sh > /tmp/candidate-layout.out 2>&1
          candidate_status=$?
          set -e

          printf '%s\n' "$base_status" > /tmp/base-layout.status
          printf '%s\n' "$candidate_status" > /tmp/candidate-layout.status
          echo '--- base layout gate ---'
          cat /tmp/base-layout.out
          echo '--- candidate layout gate ---'
          cat /tmp/candidate-layout.out

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          path_pattern = re.compile(r'(src/[A-Za-z0-9_.\-/]+)')

          def failure_paths(path):
              return {
                  match.group(1)
                  for line in Path(path).read_text().splitlines()
                  if (match := path_pattern.search(line))
              }

          base_status = int(Path('/tmp/base-layout.status').read_text().strip())
          candidate_status = int(Path('/tmp/candidate-layout.status').read_text().strip())
          base_paths = failure_paths('/tmp/base-layout.out')
          candidate_paths = failure_paths('/tmp/candidate-layout.out')
          targeted = {
              'src/vm/compiler/globals.rs',
              'src/vm/machine.rs',
              'src/vm/compiler/bindings.rs',
              'src/vm/machine/constants.rs',
              'src/vm/machine/dispatch.rs',
          }
          targeted_failures = sorted(candidate_paths & targeted)
          new_failures = sorted(candidate_paths - base_paths)
          if targeted_failures:
              raise SystemExit(f'targeted layout failures remain: {targeted_failures}')
          if new_failures:
              raise SystemExit(f'candidate introduced unrelated layout failures: {new_failures}')
          if base_status == 0 and candidate_status != 0:
              raise SystemExit('candidate made a green base layout gate fail')
          if candidate_status != 0 and not candidate_paths:
              raise SystemExit('candidate layout gate failed without a classified source path')

          summary = {
              'base_status': base_status,
              'candidate_status': candidate_status,
              'base_failures': sorted(base_paths),
              'candidate_failures': sorted(candidate_paths),
              'new_failures': new_failures,
              'targeted_failures': targeted_failures,
          }
          Path('/tmp/layout-gate-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Compare repository-wide Clippy diagnostics with current main
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)
          if [ ! -d /tmp/hara-layout-base ]; then
            git worktree add --detach /tmp/hara-layout-base "$BASE_SHA"
          fi

          run_clippy() {
            local worktree=$1
            local target=$2
            local output=$3
            (
              cd "$worktree"
              CARGO_TARGET_DIR="$target" \
                cargo clippy --manifest-path core/rust/Cargo.toml --all-targets --message-format=json
            ) > "$output" 2> "${output%.json}.stderr"
          }

          run_clippy /tmp/hara-layout-base /tmp/target-clippy-base /tmp/clippy-base.json
          run_clippy "$GITHUB_WORKSPACE" /tmp/target-clippy-candidate /tmp/clippy-candidate.json

          python3 <<'PY'
          from collections import Counter
          from pathlib import Path
          import json

          def diagnostics(path):
              values = []
              for line in Path(path).read_text().splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('reason') != 'compiler-message':
                      continue
                  message = event.get('message') or {}
                  if message.get('level') != 'warning':
                      continue
                  code = (message.get('code') or {}).get('code') or '<uncoded>'
                  values.append((code, message.get('message') or ''))
              return Counter(values)

          base = diagnostics('/tmp/clippy-base.json')
          candidate = diagnostics('/tmp/clippy-candidate.json')
          added = candidate - base
          removed = base - candidate
          if added:
              raise SystemExit('candidate introduced Clippy warnings: ' + json.dumps([
                  {'code': code, 'message': message, 'count': count}
                  for (code, message), count in sorted(added.items())
              ], indent=2))

          summary = {
              'base_warning_count': sum(base.values()),
              'candidate_warning_count': sum(candidate.values()),
              'new_warning_count': sum(added.values()),
              'removed_warning_count': sum(removed.values()),
          }
          Path('/tmp/clippy-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Deny warnings in the touched VM and compiler slice
        shell: bash
        run: |
          set -euo pipefail
          set +e
          CARGO_TARGET_DIR=/tmp/target-clippy-slice \
            cargo clippy \
              --manifest-path core/rust/Cargo.toml \
              --lib \
              --no-default-features \
              --features bytecode-vm \
              --message-format=json \
              -- -D warnings \
              > /tmp/clippy-slice.json \
              2> /tmp/clippy-slice.stderr
          slice_status=$?
          set -e
          printf '%s\n' "$slice_status" > /tmp/clippy-slice.status

          python3 <<'PY'
          from pathlib import Path
          import json

          touched = {
              'src/vm/compiler.rs',
              'src/vm/compiler/globals.rs',
              'src/vm/compiler/bindings.rs',
              'src/vm/machine.rs',
              'src/vm/machine/constants.rs',
              'src/vm/machine/dispatch.rs',
          }
          failures = []
          for line in Path('/tmp/clippy-slice.json').read_text().splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get('reason') != 'compiler-message':
                  continue
              message = event.get('message') or {}
              primary = [
                  span for span in message.get('spans') or []
                  if span.get('is_primary')
                  and any((span.get('file_name') or '').endswith(path) for path in touched)
              ]
              if primary and message.get('level') in {'warning', 'error'}:
                  failures.append({
                      'code': (message.get('code') or {}).get('code'),
                      'message': message.get('message'),
                      'spans': primary,
                  })
          if failures:
              raise SystemExit('warnings-denied touched-slice failures: ' + json.dumps(failures, indent=2))

          summary = {
              'command_status': int(Path('/tmp/clippy-slice.status').read_text().strip()),
              'touched_diagnostic_count': len(failures),
              'scope': sorted(touched),
          }
          Path('/tmp/clippy-slice-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Run native VM validation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml
          cargo test --manifest-path core/rust/raw/Cargo.toml

      - name: Commit only the clean product changes
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$PRODUCT_BRANCH"
          git add core/rust/src/vm/compiler.rs \
                  core/rust/src/vm/compiler/globals.rs \
                  core/rust/src/vm/compiler/bindings.rs \
                  core/rust/src/vm/machine.rs \
                  core/rust/src/vm/machine/constants.rs \
                  core/rust/src/vm/machine/dispatch.rs \
                  core/rust/scripts/layout-baseline.txt
          git diff --cached --check
          git config user.name 'hara-issue-agent'
          git config user.email 'hara-issue-agent@users.noreply.github.com'
          git commit -m 'Split Rust compiler and machine layout debt (#562)'
          git push --force origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          git rev-parse HEAD > /tmp/product-head.sha

      - name: Publish validation evidence to the superseded draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import os

          layout = json.loads(Path('/tmp/layout-summary.json').read_text())
          layout_gate = json.loads(Path('/tmp/layout-gate-summary.json').read_text())
          clippy = json.loads(Path('/tmp/clippy-summary.json').read_text())
          clippy_slice = json.loads(Path('/tmp/clippy-slice-summary.json').read_text())
          head = Path('/tmp/product-head.sha').read_text().strip()
          branch = os.environ['PRODUCT_BRANCH']

          body = f'''## Product export complete

          Clean branch: `{branch}`
          Product head: `{head}`

          ### Measured layout

          - `compiler/globals.rs`: {layout['parents']['src/vm/compiler/globals.rs']} lines; legacy baseline removed.
          - `machine.rs`: {layout['parents']['src/vm/machine.rs']} lines; baseline set to that exact count.
          - `compiler/bindings.rs`: {layout['children']['src/vm/compiler/bindings.rs']} lines.
          - `machine/constants.rs`: {layout['children']['src/vm/machine/constants.rs']} lines.
          - `machine/dispatch.rs`: {layout['children']['src/vm/machine/dispatch.rs']} lines.

          ### Validation

          - Layout gate: base status {layout_gate['base_status']}, candidate status {layout_gate['candidate_status']}, no new failures.
          - Repository-wide Clippy diagnostic comparison: {clippy['base_warning_count']} base warnings, {clippy['candidate_warning_count']} candidate warnings, {clippy['new_warning_count']} new warnings.
          - Warnings-denied touched VM/compiler slice: {clippy_slice['touched_diagnostic_count']} touched diagnostics.
          - Native `hara-wasm` and raw-crate tests passed.

          The diagnostic comparison plus touched-slice warnings-denied gate supersedes the obsolete repository-wide Clippy checkbox while inherited warnings remain on `main`.
          '''
          Path('/tmp/validation-comment.md').write_text('\n'.join(line.strip() for line in body.splitlines()).strip() + '\n')
          PY
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="$(cat /tmp/validation-comment.md)"
