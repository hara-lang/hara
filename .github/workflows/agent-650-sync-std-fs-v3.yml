name: Build synchronous std.fs tranche v3

on:
  push:
    branches:
      - agent/650-sync-std-fs-build-v3

permissions:
  contents: write

concurrency:
  group: agent-650-sync-std-fs-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          path: hara
          fetch-depth: 0

      - name: Checkout validation driver
        uses: actions/checkout@v4
        with:
          ref: agent/650-sync-std-fs-build-v3
          path: builder
          fetch-depth: 1

      - name: Checkout specification fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: main
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hara/core/rust/web/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: hara/core/java/pom.xml

      - name: Adapt validation driver to the current HAL test entrypoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("builder/scripts/agent-650-run-sync-std-fs-v3.sh")
          source = path.read_text()
          old = '''cargo build --manifest-path core/rust/Cargo.toml --bin hara --bin hara-test
          HARA=core/rust/target/debug/hara
          HARA_TEST=core/rust/target/debug/hara-test
          "$HARA" --version
          '''
          new = '''cargo build --manifest-path core/rust/Cargo.toml --bin hara-test
          HARA_TEST="$REPO/core/rust/target/debug/hara-test"
          HAL_SCRATCH="$REPO/core/.agent-650-hal"

          run_hal() {
            local selected
            local copied
            local index=0
            local files=()
            rm -rf "$HAL_SCRATCH"
            mkdir -p "$HAL_SCRATCH"
            for selected in "$@"; do
              if [[ "$selected" = /* ]]; then
                copied="$HAL_SCRATCH/$index-$(basename "$selected")"
                cp "$selected" "$copied"
                files+=("$copied")
              else
                files+=("$REPO/$selected")
              fi
              index=$((index + 1))
            done
            "$HARA_TEST" --root "$REPO/core" "${files[@]}"
            rm -rf "$HAL_SCRATCH"
          }
          '''
          if old not in source:
              raise SystemExit("current runner bootstrap block not found")
          source = source.replace(old, new, 1)
          source = re.sub(
              r'"\$HARA" --project core --offline stdin < "([^\n]+)"',
              r'run_hal "\1"',
              source,
          )
          source = re.sub(
              r'"\$HARA" --offline run ([^\n]+)',
              r'run_hal \1',
              source,
          )
          source = source.replace('"$HARA_TEST" --root core', 'run_hal')

          for marker in (
              ":walk-candidate-ok",
              ":walk-written-ok",
              ":fs-candidate-ok",
              ":fs-written-ok",
              ":foundation-candidate-ok",
              ":foundation-written-ok",
          ):
              if marker not in source:
                  raise SystemExit(f"assertion marker not found: {marker}")
              source = source.replace(marker, "[{:pass true}]", 1)

          source = source.replace(
              'git diff --check\n',
              'rm -rf "$HAL_SCRATCH"\ngit diff --check\n',
              1,
          )
          if '"$HARA"' in source:
              raise SystemExit("stale Hara CLI invocation remains")
          path.write_text(source)
          PY
          bash -n builder/scripts/agent-650-run-sync-std-fs-v3.sh

      - name: Build, verify, and publish synchronous std.fs
        shell: bash
        run: bash builder/scripts/agent-650-run-sync-std-fs-v3.sh hara hara-specs-registry
