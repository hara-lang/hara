name: Rebase verified live semantic events

on:
  push:
    branches:
      - agent/code-vm-semantic-events

permissions:
  contents: write

concurrency:
  group: agent-code-vm-semantic-events-rebase
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/code-vm-semantic-events
          fetch-depth: 0

      - name: Rebase onto current main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Verify event stream
        run: |
          rustfmt --edition 2021 --check \
            core/rust/src/fiber.rs \
            core/rust/src/fiber/coroutine.rs \
            core/rust/src/fiber/coroutine/observation.rs \
            core/rust/src/fiber/coroutine/semantic.rs \
            core/rust/src/fiber/coroutine/snapshot.rs
          cargo test --manifest-path core/rust/Cargo.toml \
            core::fiber::coroutine --lib
          cargo check --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown --lib

      - name: Push rebased verified branch
        run: git push --force-with-lease origin HEAD:agent/code-vm-semantic-events
