name: Fix extracted VM tests
on:
  push:
    branches: [agent/fix-production-build-manifest-558]
    paths: [.github/workflows/fix-extracted-vm-tests.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-production-build-manifest-558
          fetch-depth: 0
      - name: Correct parent-module references
        run: |
          sed -i 's/super::Instruction/crate::vm::Instruction/g' core/rust/src/vm/execution_tests/exceptions.rs
          sed -i 's/super::VmFiberState/crate::vm::VmFiberState/g' core/rust/src/vm/execution_tests/exceptions.rs
          sed -i 's/super::VmFiber/crate::vm::VmFiber/g' core/rust/src/vm/execution_tests/exceptions.rs
      - name: Commit correction
        run: |
          rm .github/workflows/fix-extracted-vm-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix extracted VM test paths'
          git push origin HEAD:agent/fix-production-build-manifest-558
