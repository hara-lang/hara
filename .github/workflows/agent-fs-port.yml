name: Bundle portable filesystem sources

on:
  push:
    branches:
      - agent/std-native-file-portable-fs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/std-native-file-portable-fs
      - name: Collect implementation context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hara-fs-tree
          cp -a core/lib core/rust/src core/rust/tests core/rust/Cargo.toml core/rust/build.rs core/rust/standard-library.namespaces core/java/src core/java/pom.xml core/Makefile scripts/runtime /tmp/hara-fs-tree/
          if [[ -d specs ]]; then cp -a specs /tmp/hara-fs-tree/; fi
          if [[ -d .github/workflows ]]; then mkdir -p /tmp/hara-fs-tree/.github && cp -a .github/workflows /tmp/hara-fs-tree/.github/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hara-fs-tree
          path: /tmp/hara-fs-tree
          if-no-files-found: error
          retention-days: 1
