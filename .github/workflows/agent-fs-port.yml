name: Bundle portable filesystem sources

on:
  push:
    branches:
      - agent/std-native-file-portable-fs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/std-native-file-portable-fs
      - name: Collect implementation context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hara-fs-context
          cp --parents \
            core/rust/src/core.rs \
            core/rust/src/lib.rs \
            core/rust/Cargo.toml \
            core/rust/build.rs \
            core/rust/standard-library.namespaces \
            core/java/pom.xml \
            core/java/src/main/java/hara/truffle/HaraContext.java \
            core/java/src/main/java/hara/truffle/NativeFileLibraryProvider.java \
            core/lib/src/std/foundation.hal \
            core/lib/src/std/foundation/promise.hal \
            core/lib/src/std/foundation/string.hal \
            core/lib/src/std/config/common.hal \
            core/lib/test/std/foundation/file_test.hal \
            core/Makefile \
            /tmp/hara-fs-context
          find core/java/src/test core/rust/tests core/lib/test -type f \( -iname '*file*' -o -iname '*promise*' -o -iname '*native*' \) -print0 2>/dev/null | xargs -0 -r cp --parents -t /tmp/hara-fs-context
          find .github/workflows -maxdepth 1 -type f -print0 | xargs -0 cp --parents -t /tmp/hara-fs-context
      - uses: actions/upload-artifact@v4
        with:
          name: hara-fs-context
          path: /tmp/hara-fs-context
          if-no-files-found: error
          retention-days: 1
