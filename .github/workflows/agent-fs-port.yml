name: Export current filesystem development tree

on:
  push:
    branches:
      - agent/std-native-file-portable-fs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Collect current implementation tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hara-current
          cp -a \
            core/lib \
            core/rust \
            core/java \
            core/Makefile \
            scripts/runtime \
            .github/workflows/core-ci.yml \
            .github/workflows/hal-source-mirror.yml \
            /tmp/hara-current/
          git rev-parse HEAD > /tmp/hara-current/MAIN_HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hara-current-main-fs-tree
          path: /tmp/hara-current
          if-no-files-found: error
          retention-days: 1
