name: Validate and publish stacked filesystem implementation

on:
  push:
    branches:
      - agent/std-native-file-portable-fs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-fs-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout patch control branch
        uses: actions/checkout@v4
        with:
          ref: agent/std-native-file-portable-fs
          path: control
          fetch-depth: 1

      - name: Checkout current Hara main
        uses: actions/checkout@v4
        with:
          ref: main
          path: hara
          fetch-depth: 0

      - name: Checkout specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: main
          path: hara-specs-registry
          fetch-depth: 1

      - name: Place specification fixtures where Rust tests expect them
        shell: bash
        run: |
          set -euo pipefail
          ln -s ../hara-specs-registry hara/hara-specs-registry

      - name: Materialize implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat control/.github/patches/fs-current-main-dev.part-* \
            | base64 -d \
            | gzip -d \
            > "$RUNNER_TEMP/fs-current-main.patch"
          cat control/.github/patches/fs-current-main-overlay.part-* \
            | base64 -d \
            | gzip -d \
            > "$RUNNER_TEMP/fs-current-main-overlay.patch"
          base64 -d control/.github/patches/fs-current-main-fix-03.patch.gz.b64 \
            | gzip -d \
            > "$RUNNER_TEMP/fs-current-main-fix-03.patch"

          cd hara
          git apply --check "$RUNNER_TEMP/fs-current-main.patch"
          git apply "$RUNNER_TEMP/fs-current-main.patch"
          git apply --check ../control/.github/patches/fs-current-main-fix-01.patch
          git apply ../control/.github/patches/fs-current-main-fix-01.patch
          git apply --check "$RUNNER_TEMP/fs-current-main-overlay.patch"
          git apply "$RUNNER_TEMP/fs-current-main-overlay.patch"
          git apply --check "$RUNNER_TEMP/fs-current-main-fix-03.patch"
          git apply "$RUNNER_TEMP/fs-current-main-fix-03.patch"
          git diff --check
          git diff --stat

      - name: Verify HAL source mirrors
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          cmp core/lib/src/std/fs.hal core/rust/hal-src/std/fs.hal
          cmp core/lib/src/std/fs/path.hal core/rust/hal-src/std/fs/path.hal
          cmp core/lib/src/std/fs/walk.hal core/rust/hal-src/std/fs/walk.hal

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check and test Rust filesystem provider
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          rustfmt --edition 2021 --check core/rust/src/file.rs core/rust/src/fiber.rs
          cargo check --manifest-path core/rust/Cargo.toml --lib
          cargo test --manifest-path core/rust/Cargo.toml file::tests --lib -- --nocapture
          for test_name in \
            session_kernel_mounts_preserve_state_and_enforce_lifetime \
            runtime_routes_file_operations_through_provider_registry \
            hara_file_operations_use_capability_providers \
            memory_file_provider_exposes_one_logical_root_and_preserves_bytes \
            unsupported_capabilities_fail_stably \
            read_forms_uses_the_capability_gated_file_provider; do
            cargo test --manifest-path core/rust/Cargo.toml "$test_name" --lib -- --exact --nocapture
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: hara/core/java/pom.xml

      - name: Test JVM filesystem provider and portable facade
        shell: bash
        run: |
          set -euo pipefail
          cd hara/core
          mvn -B -Ptruffle --file java/pom.xml \
            -Dtest=HaraLogicalPathTest,HaraFileProviderTest,StdFsTest,MainTest \
            test

      - name: Run focused portable path tests
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          ./scripts/runtime/run-lib-tests core/lib/test/std/fs/path_test.hal

      - name: Publish Rust native boundary branch
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          rm hara-specs-registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B agent/std-native-file-rust
          git add \
            core/rust/src/core.rs \
            core/rust/src/file.rs \
            core/rust/src/fiber.rs \
            core/rust/src/lib.rs
          git diff --cached --check
          git commit -m "Implement capability-backed std.native.File in Rust"
          git push --force origin HEAD:refs/heads/agent/std-native-file-rust

      - name: Publish portable std.fs branch
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          git checkout -B agent/std-fs-portable-hal
          git add \
            core/lib/src/std/fs.hal \
            core/lib/src/std/fs/path.hal \
            core/lib/src/std/fs/walk.hal \
            core/lib/test/std/fs/path_test.hal \
            core/rust/hal-src/std/fs.hal \
            core/rust/hal-src/std/fs/path.hal \
            core/rust/hal-src/std/fs/walk.hal \
            core/rust/standard-library.namespaces
          git diff --cached --check
          git commit -m "Port the portable std.fs core"
          git push --force origin HEAD:refs/heads/agent/std-fs-portable-hal

      - name: Publish JVM provider parity branch
        shell: bash
        run: |
          set -euo pipefail
          cd hara
          git checkout -B agent/std-native-file-jvm
          git add \
            core/java/src/main/java/hara/truffle/HaraContext.java \
            core/java/src/main/java/hara/truffle/HaraFileProvider.java \
            core/java/src/main/java/hara/truffle/HaraLogicalPath.java \
            core/java/src/main/java/hara/truffle/HaraMountedFileSystem.java \
            core/java/src/test/java/hara/truffle/HaraFileProviderTest.java \
            core/java/src/test/java/hara/truffle/HaraLogicalPathTest.java \
            core/java/src/test/java/hara/truffle/MainTest.java \
            core/java/src/test/java/hara/truffle/StdFsTest.java
          git diff --cached --check
          git commit -m "Implement std.native.File provider parity on the JVM"
          test -z "$(git status --porcelain)"
          git push --force origin HEAD:refs/heads/agent/std-native-file-jvm
