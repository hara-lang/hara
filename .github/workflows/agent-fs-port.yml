name: Validate portable filesystem port

on:
  push:
    branches:
      - agent/std-native-file-portable-fs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/std-native-file-portable-fs
          fetch-depth: 0
      - name: Apply staged Rust filesystem patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/fs-rust.patch.gz.b64 | gzip -d > /tmp/fs-rust.patch
          git apply --check /tmp/fs-rust.patch
          git apply /tmp/fs-rust.patch
          git diff --stat
      - name: Format and compile Rust library
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path core/rust/Cargo.toml
          cargo check --manifest-path core/rust/Cargo.toml --lib
      - name: Test filesystem providers
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml file::tests --lib -- --nocapture
