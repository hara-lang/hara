name: Apply component/context hard cut

on:
  push:
    branches:
      - agent/component-context-hard-cut-501-502

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical namespace hard cut
        shell: bash
        run: |
          if [[ ! -f scripts/runtime/apply-component-context-hard-cut ]]; then
            echo "The component/context hard cut is already applied."
            exit 0
          fi
          cp .github/workflows/_apply-component-context-hard-cut.yml \
             "$RUNNER_TEMP/apply-component-context-hard-cut.yml"
          python3 scripts/runtime/apply-component-context-hard-cut
          cp "$RUNNER_TEMP/apply-component-context-hard-cut.yml" \
             .github/workflows/_apply-component-context-hard-cut.yml
          git checkout -- .github/workflows/core-ci.yml

      - name: Validate the reviewable source cut
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/runtime/check-component-context-hard-cut")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          python3 scripts/runtime/check-component-context-hard-cut
          python3 scripts/runtime/sync-rust-hal-src --check
          diff -u core/lib/src/lib/postgres.hal core/rust/hal-src/lib/postgres.hal
          diff -u core/lib/src/lang/core/runtime.hal core/rust/hal-src/lang/core/runtime.hal

      - name: Commit the atomic hard cut
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No component/context hard-cut changes remain to commit."
            exit 0
          fi
          git commit -m "Remove legacy component and context facades"
          git push origin "HEAD:${GITHUB_REF_NAME}"
