name: Resolve PR 589 conflicts

on:
  push:
    branches:
      - codex/remove-retired-stdlib-modules
    paths:
      - .github/workflows/_resolve-pr-589.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-retired-stdlib-modules
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        shell: bash
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable

      - name: Merge current main and resolve conflicts by ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          actual_conflicts="$(git diff --name-only --diff-filter=U | sort)"
          known_conflicts="$(cat <<'EOF' | sort
          core/lib/test/std/block_navigation_test.hal
          core/lib/test/std/block_test.hal
          core/lib/test/std/work_command_test.hal
          core/lib/test/std/work_receipt_test.hal
          core/lib/test/std/work_report_renderer_test.hal
          core/rust/assets/std.foundation.hbx
          core/rust/src/bin/hara/cli/project.rs
          core/rust/standard-library.namespaces
          EOF
          )"
          unexpected="$(comm -13 <(printf '%s\n' "$known_conflicts") <(printf '%s\n' "$actual_conflicts"))"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if [[ "$merge_status" -ne 0 && -z "$actual_conflicts" ]]; then
            echo "Merge failed without producing resolvable index conflicts" >&2
            exit 1
          fi

          main_owned_tests=(
            core/lib/test/std/block_navigation_test.hal
            core/lib/test/std/block_test.hal
            core/lib/test/std/work_command_test.hal
            core/lib/test/std/work_receipt_test.hal
            core/lib/test/std/work_report_renderer_test.hal
          )
          for path in "${main_owned_tests[@]}"; do
            if git ls-files -u -- "$path" | grep -q .; then
              git checkout --theirs -- "$path"
              git add "$path"
            fi
          done

          if git ls-files -u -- core/rust/src/bin/hara/cli/project.rs | grep -q .; then
            git checkout --ours -- core/rust/src/bin/hara/cli/project.rs
            git add core/rust/src/bin/hara/cli/project.rs
          fi

          if git ls-files -u -- core/rust/standard-library.namespaces | grep -q .; then
            git checkout --theirs -- core/rust/standard-library.namespaces
          fi
          python3 - <<'PY'
          from pathlib import Path

          inventory_path = Path('core/rust/standard-library.namespaces')
          retired = {'std.lib.test', 'std.lib.walk'}
          lines = inventory_path.read_text().splitlines()
          lines = [line for line in lines if line not in retired]
          inventory_path.write_text('\n'.join(lines) + '\n')

          required = {'code.vm.conformance', 'std.substrate.protocol'}
          missing = required - set(lines)
          if missing:
              raise SystemExit(f'missing current-main namespaces: {sorted(missing)}')

          forbidden = retired | {
              'std.lib.substrate',
              'std.lib.substrate.frame',
              'std.lib.substrate.protocol',
              'std.context',
          }
          present = forbidden & set(lines)
          if present:
              raise SystemExit(f'forbidden namespaces remain: {sorted(present)}')

          test_path = Path('core/lib/test/std/foundation_test_primitives_test.hal')
          test_source = test_path.read_text()
          old_test = '[true :passed false 1 2])'
          new_test = '[true nil false 1 2])'
          if old_test in test_source:
              if test_source.count(old_test) != 1:
                  raise SystemExit('portable Test/result status expectation is ambiguous')
              test_source = test_source.replace(old_test, new_test)
          elif new_test not in test_source:
              raise SystemExit('portable Test/result status expectation is missing')
          test_path.write_text(test_source)

          production_path = Path('core/rust/src/project/production.rs')
          production_source = production_path.read_text()
          old_initializer = (
              '        namespace_edges: BTreeSet::new(),\n'
              '        native_primitives: BTreeSet::new(),'
          )
          new_initializer = (
              '        namespace_edges: BTreeSet::new(),\n'
              '        native_roots: Default::default(),\n'
              '        native_primitives: BTreeSet::new(),'
          )
          if old_initializer in production_source:
              if production_source.count(old_initializer) != 1:
                  raise SystemExit('failed-expansion UnitAnalysis initializer is ambiguous')
              production_source = production_source.replace(old_initializer, new_initializer)
          elif new_initializer not in production_source:
              raise SystemExit('failed-expansion UnitAnalysis initializer shape is unsupported')
          production_path.write_text(production_source)

          java_test_path = Path(
              'core/java/src/test/java/hara/truffle/HaraNativeTestRunnerTest.java'
          )
          java_source = java_test_path.read_text()
          if 'import java.nio.file.Files;' not in java_source:
              import_marker = 'import java.nio.file.Path;'
              if java_source.count(import_marker) != 1:
                  raise SystemExit('Java Path import is missing or ambiguous')
              java_source = java_source.replace(
                  import_marker,
                  'import java.nio.file.Files;\nimport java.nio.file.Path;',
              )

          method_name = 'classifiesDirectFoundationResultVectors'
          if method_name not in java_source:
              insertion = r'''

  @Test
  public void classifiesDirectFoundationResultVectors() throws Exception {
    Path file = Files.createTempFile("hara-direct-test-result-", ".hal");
    try {
      Files.writeString(file, "[(test-check \"direct result\" true true)]");
      HaraNativeTestRunner.Result direct = HaraNativeTestRunner.runFile(ROOT, file);
      assertTrue(direct.passed());
      assertEquals(1, direct.facts());
      assertEquals(1, direct.checks());
      assertEquals(1, direct.passedChecks());
      assertEquals(0, direct.failedChecks());

      HaraNativeTestRunner.Result encoded =
          HaraNativeTestRunner.parseResult(
              file,
              "\"[{:name \\\"encoded\\\" :actual true :expected true :pass true}]\"");
      assertTrue(encoded.passed());
      assertEquals(1, encoded.facts());
      assertEquals(1, encoded.passedChecks());
      assertEquals(0, encoded.failedChecks());
    } finally {
      Files.deleteIfExists(file);
    }
  }
'''
              closing = java_source.rfind('\n}')
              if closing < 0:
                  raise SystemExit('Java test class closing brace was not found')
              java_source = java_source[:closing] + insertion + java_source[closing:]
          java_test_path.write_text(java_source)
          PY
          git add core/rust/standard-library.namespaces
          git add core/lib/test/std/foundation_test_primitives_test.hal
          git add core/rust/src/project/production.rs
          git add core/java/src/test/java/hara/truffle/HaraNativeTestRunnerTest.java

          if git ls-files -u -- core/rust/assets/std.foundation.hbx | grep -q .; then
            git checkout --theirs -- core/rust/assets/std.foundation.hbx
            git add core/rust/assets/std.foundation.hbx
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          for path in "${main_owned_tests[@]}"; do
            git diff --exit-code origin/main -- "$path"
          done

          git rm .github/workflows/_resolve-pr-589.yml
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Regenerate and verify the Foundation HBX
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm \
            --bin hara-foundation-artifact -- generate
          cargo run --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm \
            --bin hara-foundation-artifact -- check

      - name: Run retired-module audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime/retired_stdlib_hard_cut_test.py
          python3 scripts/runtime/retired_stdlib_hard_cut.py
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Run focused Rust and HAL tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml --bin hara cli::project
          bash scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_receipt_test.hal \
            core/lib/test/std/work_report_renderer_test.hal \
            core/lib/test/std/work_task_redirection_test.hal

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run the focused Java direct-result compatibility test
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          mvn -q --file java/pom.xml \
            '-Dtest=HaraNativeTestRunnerTest#classifiesDirectFoundationResultVectors' test

      - name: Commit and push the reconciled merge
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/retired_stdlib_hard_cut.py
          git add -A -- . ':(exclude)hara-specs-registry'
          git status --short --untracked-files=no
          git commit -m "Merge main and resolve retired stdlib conflicts"
          git push origin HEAD:codex/remove-retired-stdlib-modules
