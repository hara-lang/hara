name: Publish canonical std.typed AST from PR validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/agent-patches/std-typed-canonical-ast/**'
      - '.github/workflows/std-typed-canonical-ast-publish-pr.yml'

permissions:
  contents: write

concurrency:
  group: std-typed-canonical-ast-publish-pr
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/std-typed-canonical-ast
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Apply and verify the product patch
        run: |
          python3 .github/agent-patches/std-typed-canonical-ast/apply.py
          bash scripts/audit-std-typed-boundary.sh
          mvn -q -Ptruffle \
            -Dtest=hara.truffle.StdTypedSchemaTest \
            test --file core/java/pom.xml
          cargo test --manifest-path core/rust/Cargo.toml --test std_typed_schema
          git diff --check

      - name: Publish one clean commit on current main
        run: |
          product_dir="$(mktemp -d)"
          product_files=(
            .github/workflows/std-typed-schema.yml
            core/lib/src/std/typed/schema.hal
            core/lib/test/std/typed/schema_native_test.hal
            core/rust/src/core/protocol.rs
            core/rust/src/kernel/schema.rs
            core/rust/tests/std_typed_schema.rs
            core/java/src/main/java/hara/truffle/HalcSchema.java
            core/java/src/main/java/hara/truffle/HaraContext.java
            core/java/src/test/java/hara/truffle/StdTypedSchemaTest.java
            core/spec/std/foundation-base-runtime-schema.md
          )
          for path in "${product_files[@]}"; do
            mkdir -p "$product_dir/$(dirname "$path")"
            cp "$path" "$product_dir/$path"
          done

          git fetch origin main
          git reset --hard origin/main
          cp -a "$product_dir/." .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${product_files[@]}"
          git diff --cached --check
          git commit -m "Canonicalize std.typed schema AST"
          git push --force-with-lease \
            origin HEAD:refs/heads/agent/std-typed-canonical-ast
