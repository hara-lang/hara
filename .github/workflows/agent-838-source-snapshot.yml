name: Agent 838 current-main snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.github/workflows/agent-838-source-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 408c2fdcdc9531f7cb6799d041bceca03514fbc3
          path: source
          fetch-depth: 1

      - name: Archive current main
        working-directory: source
        run: git archive --format=tar.gz --output=../hara-main-408c2fd.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: hara-main-408c2fd
          path: hara-main-408c2fd.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-direct-callable-catalog
          path: control
          fetch-depth: 1

      - name: Record workflow run
        working-directory: control
        run: |
          printf 'run=%s\nsha=%s\n' '${{ github.run_id }}' '408c2fdcdc9531f7cb6799d041bceca03514fbc3' > .agent-838-current-main-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-838-current-main-run
          git commit -m 'Record #838 current-main snapshot run'
          git push origin HEAD:agent/838-direct-callable-catalog
