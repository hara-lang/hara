name: Agent 838 code-and-specs snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.github/workflows/agent-838-source-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Hara main
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: e48e93d7eed95b5ce2bbbf3b150980105c5a7d36
          path: hara
          fetch-depth: 1

      - name: Archive Hara source
        working-directory: hara
        run: git archive --format=tar.gz --output=../hara-e48e93d.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: hara-e48e93d
          path: hara-e48e93d.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Checkout specs repair branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: aae63f735b312e29f18e041de6925ec0ae6baaa5
          path: specs
          fetch-depth: 1

      - name: Archive specs source
        working-directory: specs
        run: git archive --format=tar.gz --output=../specs-aae63f7.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: specs-aae63f7
          path: specs-aae63f7.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-direct-callable-catalog
          path: control
          fetch-depth: 1

      - name: Record workflow run
        working-directory: control
        run: |
          printf 'run=%s\nhara=%s\nspecs=%s\n' \
            '${{ github.run_id }}' \
            'e48e93d7eed95b5ce2bbbf3b150980105c5a7d36' \
            'aae63f735b312e29f18e041de6925ec0ae6baaa5' \
            > .agent-838-code-specs-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-838-code-specs-run
          git commit -m 'Record #838 code-and-specs snapshot run'
          git push origin HEAD:agent/838-direct-callable-catalog
