name: Agent 838 trusted-workflow snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.github/workflows/agent-838-source-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted pre-merge workflow
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 5a2771ed22230e7d6d0c5e80994661182e3ff7a2
          path: source
          fetch-depth: 1

      - uses: actions/upload-artifact@v4
        with:
          name: std-typed-schema-trusted
          path: source/.github/workflows/std-typed-schema.yml
          retention-days: 1

      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-direct-callable-catalog
          path: control
          fetch-depth: 1

      - name: Record workflow run
        working-directory: control
        run: |
          printf 'run=%s\n' '${{ github.run_id }}' > .agent-838-trusted-workflow-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-838-trusted-workflow-run
          git commit -m 'Record #838 trusted-workflow snapshot run'
          git push origin HEAD:agent/838-direct-callable-catalog
