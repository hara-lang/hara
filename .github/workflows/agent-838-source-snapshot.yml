name: Agent 838 source snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.agent-838-source-trigger'
      - '.github/workflows/agent-838-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 48c70205a4ae550100545a5ba870ac73a7c8f848
          path: source
          fetch-depth: 1

      - name: Archive tracked current-main source
        working-directory: source
        run: git archive --format=tar.gz --output=../hara-main-48c70205.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: hara-main-48c70205
          path: hara-main-48c70205.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-direct-callable-catalog
          path: control
          fetch-depth: 1

      - name: Record workflow run
        working-directory: control
        run: |
          printf '%s\n' '${{ github.run_id }}' > .agent-838-source-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-838-source-run
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record #838 source snapshot run'
          git push origin HEAD:agent/838-direct-callable-catalog
