name: Agent 838 source snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=hara-source.tar.gz "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: hara-source-${{ github.sha }}
          path: hara-source.tar.gz
          retention-days: 1
          compression-level: 0
