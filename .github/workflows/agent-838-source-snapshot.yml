name: Agent 838 source snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=hara-source.tar.gz "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: hara-source-${{ github.sha }}
          path: hara-source.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Publish run identifier
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .agent-838-source-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-838-source-run
          git commit -m 'chore: publish isolated source snapshot run'
          git push
