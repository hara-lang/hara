name: Agent 838 current-main source snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.github/workflows/agent-838-source-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: adc947fefc45dafe8ca09e9789cf320875354cb5
          path: source
          fetch-depth: 1

      - name: Archive tracked current-main source
        working-directory: source
        run: git archive --format=tar.gz --output=../hara-main-adc947f.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: hara-main-adc947f
          path: hara-main-adc947f.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-direct-callable-catalog
          path: control
          fetch-depth: 1

      - name: Record exact workflow run
        working-directory: control
        run: |
          printf 'run=%s\nsha=%s\n' \
            '${{ github.run_id }}' \
            'adc947fefc45dafe8ca09e9789cf320875354cb5' \
            > .agent-838-current-source-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-838-current-source-run
          git commit -m 'Record #838 current-source snapshot run'
          git push origin HEAD:agent/838-direct-callable-catalog
