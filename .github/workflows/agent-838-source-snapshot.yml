name: Agent 838 source snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.agent-838-source-trigger'
      - '.github/workflows/agent-838-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: 48c70205a4ae550100545a5ba870ac73a7c8f848
          fetch-depth: 1
      - name: Archive tracked current-main source
        run: git archive --format=tar.gz --output=hara-main-48c70205.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hara-main-48c70205
          path: hara-main-48c70205.tar.gz
          retention-days: 1
          compression-level: 0
