name: Agent 838 iteration snapshot

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - '.github/workflows/agent-838-source-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout iteration branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-runtime-callable-catalog
          path: source
          fetch-depth: 1

      - name: Archive iteration branch
        working-directory: source
        run: git archive --format=tar.gz --output=../hara-838-iteration.tar.gz HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: hara-838-iteration
          path: hara-838-iteration.tar.gz
          retention-days: 1
          compression-level: 0

      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara
          ref: agent/838-direct-callable-catalog
          path: control
          fetch-depth: 1

      - name: Record workflow run
        working-directory: control
        run: |
          printf 'run=%s\n' '${{ github.run_id }}' > .agent-838-iteration-snapshot-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .agent-838-iteration-snapshot-run
          git commit -m 'Record #838 iteration snapshot run'
          git push origin HEAD:agent/838-direct-callable-catalog
