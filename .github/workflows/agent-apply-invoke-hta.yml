name: Apply invoke HTA implementation

on:
  push:
    branches:
      - agent/invoke-hta-557
    paths:
      - scripts/agent-apply-invoke-hta.py
      - scripts/agent-adjust-invoke-hta-core.py
      - .github/workflows/agent-apply-invoke-hta.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invoke-hta-557
          fetch-depth: 0
      - name: Integrate current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Apply reviewed source patch
        run: |
          python3 scripts/agent-apply-invoke-hta.py
          python3 scripts/agent-adjust-invoke-hta-core.py
      - name: Format
        run: cargo +1.85.1 fmt --manifest-path core/rust/Cargo.toml --all
      - name: Test the public embedding boundary
        run: cargo +1.85.1 test --manifest-path core/rust/Cargo.toml --test invoke_hta
      - name: Check invoke-only benchmark
        run: cargo +1.85.1 check --manifest-path core/rust/Cargo.toml --bin hara-invoke-hta-benchmark
      - name: Lint changed native targets
        run: cargo +1.85.1 clippy --manifest-path core/rust/Cargo.toml --lib --test invoke_hta --bin hara-invoke-hta-benchmark -- -D warnings -A dead-code -A unused-mut -A unused-variables
      - name: Publish implementation commit
        run: |
          git add core/rust notes
          git diff --cached --check
          git commit -m "Add binary-safe qualified Var HTA invocation"
          git push origin HEAD:agent/invoke-hta-557
