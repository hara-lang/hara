name: Materialize shape-preserving Foundation collections

on:
  push:
    branches:
      - agent/666-foundation-shape-materialization
    paths:
      - .github/workflows/agent-runtime-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: foundation-shape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Hara
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Link sibling specs registry
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Apply reviewed Foundation candidate
        shell: bash
        run: |
          set -euo pipefail
          apply_payload() {
            local source=$1 compressed_sha=$2 patch_sha=$3 target=$4
            echo "$compressed_sha  $source" | sha256sum -c -
            base64 --decode "$source" | gzip --decompress > "$target"
            echo "$patch_sha  $target" | sha256sum -c -
            git apply --check "$target"
            git apply "$target"
          }

          shopt -s nullglob
          parts=(.github/agent-foundation.patch.part-*)
          test "${#parts[@]}" -eq 6
          cat > /tmp/foundation-parts.sha256 <<'SUMS'
          565e10e3d6e07a9900090072bad74315018e2dfae9d8c1860dc6a451f7f4895f  .github/agent-foundation.patch.part-00
          48b35985e88ef95353fbe672cfb0746258ef504d7141983fee84b2f5e165513f  .github/agent-foundation.patch.part-01
          2e8c971fbd9db71948531eab0f428c34af39a3c41fed2968d5cb727a5850873f  .github/agent-foundation.patch.part-02
          46e1bd7fa84825a80aa14e93aaf63fae2c8d94466b1c421bc84ac2a32b5eea49  .github/agent-foundation.patch.part-03
          8a62de230972d9fc48f05f55b4cb67a038d56ac60ad5387353d4d632d5495044  .github/agent-foundation.patch.part-04
          4f9d37fc321c93aff758ddcba8aae4d57595d79a5574015b98e114d7a8327380  .github/agent-foundation.patch.part-05
          SUMS
          sha256sum -c /tmp/foundation-parts.sha256
          cat "${parts[@]}" > /tmp/agent-foundation.patch.gz.b64
          apply_payload /tmp/agent-foundation.patch.gz.b64 \
            082536e59d758abe012d697aa81c52b8c1a8e9114e9500c2e8875230e972bff1 \
            4ec4ad5730d9a96c76b64cd2f10742e94a4ec2875ba9f9627c255804fc79370e \
            /tmp/agent-foundation.patch
          apply_payload .github/agent-foundation-corrections.patch.gz.b64 \
            f193b92d8e729f9f1c21f1eb6b24e9047b033de4af105720339f9994f6f694de \
            4126d3f507d0ef17709a41639b7b6ce227e260d6481b80d5f7fc164f30cfa2ca \
            /tmp/agent-foundation-corrections.patch
          apply_payload .github/agent-foundation-private-names.patch.gz.b64 \
            f5ca5ce3025fdc8cf5f09633dc6408b722fac580c387a229c6477e7af77563e5 \
            2b7bc571911dd74010fc381254dc5e9ad2b278f6c9cf808f7513b9719e2ab229 \
            /tmp/agent-foundation-private-names.patch
          apply_payload .github/agent-foundation-surface-mirror.patch.gz.b64 \
            5b7600b5c1fb221b435246249edf06eacf81d229e2db6aa907f6cb4d0ea23ae3 \
            7c2641d741525e41ccf534d62dc975f3e4838e9e65db22e1465744d82180e4f9 \
            /tmp/agent-foundation-surface-mirror.patch
          apply_payload .github/agent-foundation-nested-checkout.patch.gz.b64 \
            268fe86cc35776fe6887ecbf06f7b3c88a33207a33afe8564abb4738a3f80a3c \
            ea7895db1610e7648a12f3e90b274bab660ac9e0537e890baa79d042d16e8411 \
            /tmp/agent-foundation-nested-checkout.patch

          rm "${parts[@]}" \
            .github/agent-foundation-corrections.patch.gz.b64 \
            .github/agent-foundation-private-names.patch.gz.b64 \
            .github/agent-foundation-surface-mirror.patch.gz.b64 \
            .github/agent-foundation-nested-checkout.patch.gz.b64 \
            .github/workflows/agent-source-snapshot.yml \
            .github/workflows/agent-runtime-bootstrap.yml
          rustfmt --edition 2021 core/rust/src/core.rs core/rust/src/fiber.rs
          git diff --check

      - name: Regenerate and verify the Foundation HBX bundle
        shell: bash
        run: |
          set -o pipefail
          cargo run --quiet --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm --bin hara-foundation-artifact -- generate \
            2>&1 | tee /tmp/foundation-generate.log
          cargo run --quiet --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm --bin hara-foundation-artifact -- check \
            2>&1 | tee /tmp/foundation-check.log

      - name: Validate Foundation source surfaces
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/test_check_foundation_surface.py \
            2>&1 | tee /tmp/foundation-surface-tests.log
          python3 scripts/check_foundation_surface.py \
            --report /tmp/foundation-surface.json \
            2>&1 | tee /tmp/foundation-surface.log
          python3 scripts/test_generate_foundation_api_manifest.py \
            2>&1 | tee /tmp/foundation-api-manifest.log

      - name: Build Rust runtime and CLI
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path core/rust/Cargo.toml --lib \
            2>&1 | tee /tmp/cargo-check.log
          cargo build --manifest-path core/rust/Cargo.toml --release --bin hara \
            2>&1 | tee /tmp/cargo-build.log

      - name: Run focused Foundation HAL tests
        shell: bash
        run: |
          set -o pipefail
          ./scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_shape_test.hal \
            core/lib/test/std/foundation_test.hal \
            2>&1 | tee /tmp/foundation-hal-tests.log

      - name: Build Truffle runtime
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml \
            2>&1 | tee /tmp/truffle-build.log

      - name: Run focused Truffle Foundation test
        shell: bash
        run: |
          set -o pipefail
          HARA_RUNTIME=truffle core/hara run core/lib/test/std/foundation_shape_test.hal \
            2>&1 | tee /tmp/truffle-foundation-shape.log

      - name: Publish validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hara-specs-registry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Implement shape-preserving Foundation materialization'
          git push origin HEAD:agent/666-foundation-shape-materialization

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-shape-validation-${{ github.sha }}
          path: |
            /tmp/foundation-generate.log
            /tmp/foundation-check.log
            /tmp/foundation-surface.json
            /tmp/foundation-surface.log
            /tmp/foundation-surface-tests.log
            /tmp/foundation-api-manifest.log
            /tmp/cargo-check.log
            /tmp/cargo-build.log
            /tmp/foundation-hal-tests.log
            /tmp/truffle-build.log
            /tmp/truffle-foundation-shape.log
          if-no-files-found: warn
          retention-days: 2
