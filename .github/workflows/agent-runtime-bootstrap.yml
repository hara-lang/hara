name: Agent runtime bootstrap

on:
  push:
    branches:
      - agent/shape-preserving-foundation-collections
  pull_request:
    branches:
      - agent/shape-preserving-foundation-collections

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply pending runtime transformation
        shell: bash
        run: |
          set -euo pipefail
          patch_payload=.github/agent-runtime.patch.gz.b64
          if [[ ! -f "$patch_payload" ]]; then
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}, found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "core/rust/src/core/value.rs",
              "    Keep(Rc<Function>, Value),",
              "    Keep(Value, Value),",
          )
          replace_once(
              "core/rust/src/core/value.rs",
              """                IteratorGenerator::Keep(function, source) => loop {
                    let Some(value) = iterator_try_next(source)? else {
                        close_iterator_source(source);
                        self.closed = true;
                        break Ok(None);
                    };
                    let mapped = call_function(function, vec![value])?;
                    if !matches!(mapped, Value::Nil) {
                        break Ok(Some(mapped));
                    }
                },""",
              """                IteratorGenerator::Keep(function, source) => loop {
                    let Some(value) = iterator_try_next(source)? else {
                        close_iterator_source(source);
                        self.closed = true;
                        break Ok(None);
                    };
                    let mapped = call_value(function.clone(), vec![value])?;
                    if !matches!(mapped, Value::Nil) {
                        break Ok(Some(mapped));
                    }
                },""",
          )
          replace_once(
              "core/rust/src/core/operation.rs",
              "fn iterator_keep(function: Rc<Function>, value: Value) -> Result<Value, String> {",
              "fn iterator_keep(function: Value, value: Value) -> Result<Value, String> {",
          )

          callable_helper = """pub(crate) fn is_callable_value(value: &Value) -> bool {
    matches!(
        value,
        Value::Function(_)
            | Value::StructType(_)
            | Value::MutableType(_)
            | Value::Struct(_)
            | Value::Mutable(_)
            | Value::Pointer(_)
            | Value::Keyword(_)
            | Value::Map(_)
            | Value::OrderedMap(_)
            | Value::SortedMap(_)
            | Value::Trie(_)
            | Value::PriorityMap(_)
            | Value::Set(_)
            | Value::OrderedSet(_)
            | Value::SortedSet(_)
    )
}

"""
          replace_once(
              "core/rust/src/core/form.rs",
              "pub(crate) fn call_value(callable: Value, arguments: Vec<Value>) -> Result<Value, String> {",
              callable_helper
              + "pub(crate) fn call_value(callable: Value, arguments: Vec<Value>) -> Result<Value, String> {",
          )
          replace_once(
              "core/rust/src/core/evaluator.rs",
              """                        \"iter-keep\" => match parameter {
                            Value::Function(function) => {
                                let result = iterator_keep(function, source.clone())?;
                                transform_like(&source, result)
                            }
                            _ => Err(\"keep expects a function\".into()),
                        },""",
              """                        \"iter-keep\" => {
                            if !is_callable_value(&parameter) {
                                Err(\"keep expects a callable value\".into())
                            } else {
                                let result = iterator_keep(parameter, source.clone())?;
                                transform_like(&source, result)
                            }
                        }""",
          )
          PY

          cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check
          cargo check --locked --manifest-path core/rust/Cargo.toml --lib

          rm "$patch_payload"
          rm -f .github/agent-runtime-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'Accept Hara callables in native keep'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Link sibling specs registry
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Truffle runtime
        run: mvn -f core/java/pom.xml -Ptruffle -DskipTests package

      - name: Capture Rust test diagnostics
        id: rust-tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path core/rust/Cargo.toml --lib > /tmp/cargo-test.log 2>&1
          status=$?
          set -e
          cat /tmp/cargo-test.log
          printf '%s\n' "$status" > /tmp/cargo-test.status

      - name: Upload Rust test diagnostics
        if: always() && steps.rust-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: hara-rust-diagnostics-${{ github.sha }}
          path: |
            /tmp/cargo-test.log
            /tmp/cargo-test.status
          if-no-files-found: error
          retention-days: 1

      - name: Require Rust tests
        shell: bash
        run: test "$(cat /tmp/cargo-test.status)" -eq 0

      - name: Build Rust CLI
        run: cargo build --manifest-path core/rust/Cargo.toml --release --bin hara

      - name: Upload runtime bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: hara-runtime-bootstrap-${{ github.sha }}
          path: |
            core/java/target/hara-truffle.jar
            core/rust/target/release/hara
          if-no-files-found: error
          retention-days: 1
