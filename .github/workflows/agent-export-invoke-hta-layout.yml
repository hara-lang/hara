name: Export invoke HTA layout sources

on:
  push:
    branches:
      - agent/invoke-hta-557
    paths:
      - .github/workflows/agent-export-invoke-hta-layout.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/invoke-hta-557
      - uses: actions/upload-artifact@v4
        with:
          name: invoke-hta-layout-sources
          path: |
            core/rust/src/native_cli.rs
            core/rust/src/hta.rs
            core/rust/src/vm/artifact.rs
            core/rust/src/vm/compiler.rs
            core/rust/src/vm/machine.rs
            core/rust/scripts/layout-baseline.txt
          if-no-files-found: error
