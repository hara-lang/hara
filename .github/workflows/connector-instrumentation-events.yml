name: Connector instrumentation event gateway

run-name: >-
  ${{ github.event_name == 'issue_comment'
      && format('Connector event · issue #{0} · comment {1}', github.event.issue.number, github.event.comment.id)
      || github.event_name == 'workflow_dispatch'
      && format('Connector event · {0} · {1}', inputs.event, inputs.ref)
      || format('Connector event contracts · {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/connector-instrumentation-events.yml'
      - '.github/workflows/instrumentation-java.yml'
      - '.github/workflows/instrumentation-native.yml'
      - '.github/workflows/instrumentation-rust.yml'
      - '.github/workflows/instrumentation-code-vm.yml'
      - 'scripts/runtime/connector_event_gateway.py'
      - 'scripts/runtime/connector_event_gateway_test.py'
      - 'scripts/runtime/check_connector_event_workflows.py'
  push:
    branches: [main, testing]
    paths:
      - '.github/workflows/connector-instrumentation-events.yml'
      - '.github/workflows/instrumentation-java.yml'
      - '.github/workflows/instrumentation-native.yml'
      - '.github/workflows/instrumentation-rust.yml'
      - '.github/workflows/instrumentation-code-vm.yml'
      - 'scripts/runtime/connector_event_gateway.py'
      - 'scripts/runtime/connector_event_gateway_test.py'
      - 'scripts/runtime/check_connector_event_workflows.py'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      event:
        description: Allow-listed instrumentation event
        required: true
        type: choice
        options:
          - instrumentation.java.validate
          - instrumentation.native.validate
          - instrumentation.rust.validate
          - instrumentation.code-vm.validate
      ref:
        description: Same-repository branch, tag, or full commit SHA
        required: true
        default: main
        type: string
      issue_number:
        description: Optional issue or pull request to receive status comments
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: connector-instrumentation-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  contracts:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test the pure connector command router
        run: python3 scripts/runtime/connector_event_gateway_test.py

      - name: Check connector workflow contracts
        run: python3 scripts/runtime/check_connector_event_workflows.py

      - name: Parse workflow YAML
        run: >-
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }'
          .github/workflows/connector-instrumentation-events.yml
          .github/workflows/instrumentation-java.yml
          .github/workflows/instrumentation-native.yml
          .github/workflows/instrumentation-rust.yml
          .github/workflows/instrumentation-code-vm.yml

      - name: Compile the gateway module
        run: python3 -m py_compile scripts/runtime/connector_event_gateway.py

      - name: Check patch whitespace
        run: git diff --check

  route:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event_name == 'issue_comment'
              && startsWith(github.event.comment.body, '/hara-event')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out the trusted gateway implementation
        uses: actions/checkout@v4

      - name: Parse the connector request without evaluating comment text
        id: parse
        run: >-
          python3 scripts/runtime/connector_event_gateway.py
          --event-name '${{ github.event_name }}'
          --event-path "$GITHUB_EVENT_PATH"
          --output "$GITHUB_OUTPUT"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Authorize, resolve, and dispatch the request
        if: ${{ steps.parse.outputs.command == 'true' }}
        id: dispatch
        uses: actions/github-script@v7
        env:
          VALID: ${{ steps.parse.outputs.valid }}
          ERROR: ${{ steps.parse.outputs.error }}
          EVENT: ${{ steps.parse.outputs.event }}
          DISPATCH_TYPE: ${{ steps.parse.outputs.dispatch_type }}
          WORKFLOW: ${{ steps.parse.outputs.workflow }}
          REQUESTED_REF: ${{ steps.parse.outputs.requested_ref }}
          REQUEST_ID: ${{ steps.parse.outputs.request_id }}
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          COMMENT_ID: ${{ steps.parse.outputs.comment_id }}
          PARSED_ACTOR: ${{ steps.parse.outputs.actor }}
          SOURCE_APP: ${{ steps.parse.outputs.source_app }}
          SOURCE_URL: ${{ steps.parse.outputs.source_url }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const allowedPermissions = new Set(['write', 'maintain', 'admin']);
            const routes = new Map([
              ['instrumentation.java.validate', {
                dispatch: 'hara-instrumentation-java',
                workflow: '.github/workflows/instrumentation-java.yml',
              }],
              ['instrumentation.native.validate', {
                dispatch: 'hara-instrumentation-native',
                workflow: '.github/workflows/instrumentation-native.yml',
              }],
              ['instrumentation.rust.validate', {
                dispatch: 'hara-instrumentation-rust',
                workflow: '.github/workflows/instrumentation-rust.yml',
              }],
              ['instrumentation.code-vm.validate', {
                dispatch: 'hara-instrumentation-code-vm',
                workflow: '.github/workflows/instrumentation-code-vm.yml',
              }],
            ]);

            const rawIssue = process.env.ISSUE_NUMBER
              || String(context.payload.issue?.number || context.payload.inputs?.issue_number || '0');
            const issueNumber = Number(rawIssue || 0);
            const rawComment = process.env.COMMENT_ID
              || String(context.payload.comment?.id || '0');
            const commentId = Number(rawComment || 0);
            const requestId = process.env.REQUEST_ID
              || (commentId > 0
                ? `comment-${commentId}`
                : `manual-${process.env.GITHUB_RUN_ID}`);

            const candidates = [...new Set([
              process.env.PARSED_ACTOR,
              context.payload.comment?.user?.login,
              context.payload.sender?.login,
              context.actor,
            ].filter(Boolean))];
            let actor = null;
            let permission = null;
            for (const username of candidates) {
              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username,
                });
                const reported = response.data.permission === 'push'
                  ? 'write'
                  : response.data.permission;
                if (allowedPermissions.has(reported)) {
                  actor = username;
                  permission = reported;
                  break;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!actor) {
              core.warning('Ignoring connector event from an actor without write permission.');
              return;
            }

            const marker = `<!-- hara-connector-request:${requestId} -->`;
            const rejectionMarker = `<!-- hara-connector-rejection:${requestId} -->`;
            let existingComments = [];
            if (issueNumber > 0) {
              existingComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = existingComments.find((comment) =>
                comment.body?.includes(marker) || comment.body?.includes(rejectionMarker));
              if (existing) {
                core.notice(`Request ${requestId} was already handled by comment ${existing.id}.`);
                core.setOutput('deduplicated', 'true');
                return;
              }
            }

            const cleanText = (value, limit = 300) => String(value || '')
              .replace(/[\r\n`]/g, '')
              .slice(0, limit);
            const reject = async (reason) => {
              const safeReason = cleanText(reason);
              if (issueNumber > 0) {
                const body = [
                  rejectionMarker,
                  '### Connector event rejected',
                  '',
                  `- Request: \`${cleanText(requestId)}\``,
                  `- Reason: ${safeReason}`,
                  `- Gateway run: https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                ].join('\n');
                await github.rest.issues.createComment({owner, repo, issue_number: issueNumber, body});
              }
              core.setFailed(safeReason);
            };

            if (process.env.VALID !== 'true') {
              await reject(process.env.ERROR || 'Malformed connector command.');
              return;
            }

            const route = routes.get(process.env.EVENT);
            if (!route
                || route.dispatch !== process.env.DISPATCH_TYPE
                || route.workflow !== process.env.WORKFLOW) {
              await reject('The parsed event does not match the closed workflow route table.');
              return;
            }

            let requestedRef = process.env.REQUESTED_REF;
            if (!requestedRef && context.eventName === 'issue_comment'
                && context.payload.issue?.pull_request) {
              const pull = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.issue.number,
              });
              if (pull.data.head.repo?.full_name !== `${owner}/${repo}`) {
                await reject('Fork pull requests require an explicit same-repository ref.');
                return;
              }
              requestedRef = pull.data.head.ref;
            }
            requestedRef ||= context.payload.repository?.default_branch || 'main';

            const safeRef = /^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/.test(requestedRef)
              && !requestedRef.startsWith('refs/')
              && !requestedRef.includes('..')
              && !requestedRef.includes('@{')
              && !requestedRef.includes('//')
              && !requestedRef.endsWith('/')
              && !requestedRef.endsWith('.')
              && requestedRef !== 'HEAD'
              && requestedRef.split('/').every((part) =>
                part && !part.startsWith('.') && !part.endsWith('.lock'));
            const fullSha = /^[0-9a-fA-F]{40}$/.test(requestedRef);
            if (!safeRef && !fullSha) {
              await reject('The requested ref does not satisfy the safe same-repository grammar.');
              return;
            }

            let commit;
            try {
              commit = await github.rest.repos.getCommit({owner, repo, ref: requestedRef});
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                await reject(`The requested ref could not be resolved in ${owner}/${repo}.`);
                return;
              }
              throw error;
            }
            const resolvedRef = commit.data.sha;
            const sourceApp = process.env.SOURCE_APP
              || context.payload.comment?.performed_via_github_app?.slug
              || 'direct';
            const sourceUrl = process.env.SOURCE_URL
              || context.payload.comment?.html_url
              || context.payload.issue?.html_url
              || '';
            const clientPayload = {
              schema: 'hara.connector.event/0-alpha',
              request_id: requestId,
              event: process.env.EVENT,
              issue_number: issueNumber,
              comment_id: commentId,
              actor,
              ref: resolvedRef,
              source_app: sourceApp,
              source_url: sourceUrl,
              gateway_run_id: Number(process.env.GITHUB_RUN_ID),
            };
            if (Object.keys(clientPayload).length > 10) {
              throw new Error('repository_dispatch payload exceeds GitHub\'s ten-key limit');
            }

            let reservationCommentId = null;
            if (issueNumber > 0) {
              const workflowName = route.workflow.split('/').pop();
              const reservationBody = [
                marker,
                '### Connector event dispatching',
                '',
                `- Event: \`${cleanText(process.env.EVENT)}\``,
                `- Requested ref: \`${cleanText(requestedRef)}\``,
                `- Resolved commit: \`${resolvedRef}\``,
                `- Workflow: [${workflowName}](https://github.com/${owner}/${repo}/actions/workflows/${workflowName})`,
                `- Actor: \`${cleanText(actor)}\` (${permission})`,
                `- Source: \`${cleanText(sourceApp)}\``,
                `- Request: \`${cleanText(requestId)}\``,
                `- Gateway run: https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              ].join('\n');
              const reservation = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: reservationBody,
              });
              reservationCommentId = reservation.data.id;
            }

            if (commentId > 0) {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner,
                  repo,
                  comment_id: commentId,
                  content: 'rocket',
                });
              } catch (error) {
                core.warning(`Unable to add connector acknowledgement reaction: ${error.message}`);
              }
            }

            try {
              await github.rest.repos.createDispatchEvent({
                owner,
                repo,
                event_type: route.dispatch,
                client_payload: clientPayload,
              });
            } catch (error) {
              if (reservationCommentId) {
                const failedBody = [
                  marker,
                  '### ❌ Connector event dispatch failed',
                  '',
                  `- Event: \`${cleanText(process.env.EVENT)}\``,
                  `- Ref: \`${resolvedRef}\``,
                  `- Request: \`${cleanText(requestId)}\``,
                  `- Gateway run: https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                  '',
                  'Post a new command comment to retry this request.',
                ].join('\n');
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: reservationCommentId,
                  body: failedBody,
                });
              }
              throw error;
            }

            if (reservationCommentId) {
              const workflowName = route.workflow.split('/').pop();
              const acceptedBody = [
                marker,
                '### Connector event accepted',
                '',
                `- Event: \`${cleanText(process.env.EVENT)}\``,
                `- Requested ref: \`${cleanText(requestedRef)}\``,
                `- Resolved commit: \`${resolvedRef}\``,
                `- Workflow: [${workflowName}](https://github.com/${owner}/${repo}/actions/workflows/${workflowName})`,
                `- Actor: \`${cleanText(actor)}\` (${permission})`,
                `- Source: \`${cleanText(sourceApp)}\``,
                `- Request: \`${cleanText(requestId)}\``,
                `- Gateway run: https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                '',
                'The target workflow will post its final result to this conversation.',
              ].join('\n');
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: reservationCommentId,
                body: acceptedBody,
              });
            }

            core.setOutput('request_id', requestId);
            core.setOutput('resolved_ref', resolvedRef);
            core.setOutput('dispatch_type', route.dispatch);