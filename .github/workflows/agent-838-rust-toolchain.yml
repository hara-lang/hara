name: Agent 838 pinned Rust toolchain

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - .agent-838-rust-trigger

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository minimum Rust toolchain
        run: rustup toolchain install 1.78.0 --profile minimal --component rustfmt
      - name: Archive the installed toolchain
        run: |
          cd "$HOME/.rustup/toolchains"
          zip -qr "$GITHUB_WORKSPACE/rust-1.78.0.zip" 1.78.0-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: rust-1.78.0-x86_64-unknown-linux-gnu
          path: rust-1.78.0.zip
          retention-days: 1
          compression-level: 0
      - name: Publish run identifier
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .agent-838-rust-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-838-rust-run
          git commit -m 'chore: publish pinned Rust toolchain run [skip ci]'
          git push
