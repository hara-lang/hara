name: Apply Foundation bundle and code.test.task hard cut

on:
  push:
    branches:
      - agent/foundation-bundle-code-test-task-hard-cut

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Merge current main into validation branch
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Reconstruct and apply focused patches
        run: |
          base64 --decode scripts/runtime/foundation-task-hard-cut.patch.gz.b64 | gzip --decompress > /tmp/foundation-task-hard-cut.patch
          echo 'c17d224afb2ce10dd1d235895556a7e19d8cad620567505fad7da46d8e86d9fa  /tmp/foundation-task-hard-cut.patch' | sha256sum -c -
          git apply --check /tmp/foundation-task-hard-cut.patch
          git apply /tmp/foundation-task-hard-cut.patch

          base64 --decode scripts/runtime/function-metadata-support.patch.gz.b64 | gzip --decompress > /tmp/function-metadata-support.patch
          echo '699e1920af688f421316365051c89a77bb8ea335e3dae869ab1be63d88d3beef  /tmp/function-metadata-support.patch' | sha256sum -c -
          git apply --check /tmp/function-metadata-support.patch
          git apply /tmp/function-metadata-support.patch

          base64 --decode scripts/runtime/bytecode-field-set-closure.patch.gz.b64 | gzip --decompress > /tmp/bytecode-field-set-closure.patch
          echo 'bdf841454447cbb5fe15a954180ee1d8427bdf9c5a8ef4e6067bb6a07fbba67a  /tmp/bytecode-field-set-closure.patch' | sha256sum -c -
          git apply --check /tmp/bytecode-field-set-closure.patch
          git apply /tmp/bytecode-field-set-closure.patch

          base64 --decode scripts/runtime/code-test-compatibility-integration.patch.gz.b64 | gzip --decompress > /tmp/code-test-compatibility-integration.patch
          echo 'f27fe8fb318286041c18496f7000a25aaa7045668df91aec5553afa60fa09dbd  /tmp/code-test-compatibility-integration.patch' | sha256sum -c -
          git apply --check /tmp/code-test-compatibility-integration.patch
          git apply /tmp/code-test-compatibility-integration.patch

          sed -i '/^std\.lib\.simple$/d;/^std\.test-helper$/d' core/rust/standard-library.namespaces

          python3 scripts/runtime/sync-rust-hal-src

      - name: Check out specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose sibling specifications path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Validate source ownership and mirrors
        run: |
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/check-code-test-work-events
          git diff --check

      - name: Verify mutable field assignment inside bytecode closures
        run: >-
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm
          vm::execution_tests::mutable_field_set_inside_function_preserves_order_identity_and_result -- --exact

      - name: Build bootstrap JVM and Truffle runner
        run: mvn -B -f core/java/pom.xml -Ptruffle -DskipTests package

      - name: Probe data-only CLI handler metadata in native Hara
        run: |
          cat > /tmp/tool-cli-template-probe.hal <<'HAL'
          (ns tool.cli.template-probe
            (:require [tool.cli.model :as model]
                      [tool.cli.template :as template]))

          (let [handler
                (template/handler
                 {:id :probe/handler
                  :version 7
                  :template :probe
                  :main {:argcount 1
                         :fn (fn [request]
                               (model/success request))}})
                metadata (meta handler)
                result (handler {:value 42})]
            (pr-str [(= metadata
                        {:tool.cli.template/schema "tool.cli.template/0-alpha"
                         :tool.cli.template/id :probe/handler
                         :tool.cli.template/version 7
                         :tool.cli.template/type :probe})
                     (template/handler? handler)
                     (= (:result/data result) {:value 42})]))
          HAL
          actual="$(./core/hara --project core --offline run /tmp/tool-cli-template-probe.hal)"
          printf 'handler metadata probe: %s\n' "$actual"
          test "$actual" = '"[true true true]"'

      - name: Regenerate and verify Foundation HBX
        run: |
          cargo run --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- generate
          cargo run --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- check

      - name: Rebuild JVM and Truffle runner with regenerated Foundation HBX
        run: mvn -B -f core/java/pom.xml -Ptruffle -DskipTests package

      - name: Prove canonical code.test owners load without cycles
        run: |
          cat > /tmp/code-test-owner-probe.hal <<'HAL'
          (ns code.test-owner-probe
            (:require [code.test :as test]
                      [code.test.base.executive :as executive]
                      [code.test.cli :as cli]
                      [code.test.work :as test-work]))

          (pr-str
           [(fn? test/process-test-args)
            (fn? cli/process-run-args)
            (fn? executive/main)
            (fn? test-work/run)
            (test/process-test-args [":only" "std" "code"])])
          HAL
          actual="$(./core/hara --project core --offline run /tmp/code-test-owner-probe.hal)"
          printf 'code.test owner probe: %s\n' "$actual"
          test "$actual" = '"[true true true true {:namespace [std code]}]"'

      - name: Run internal code.test module probe
        run: >-
          cargo run --quiet --manifest-path core/rust/Cargo.toml --bin hara --
          --root core run lib/test/code/test_internal_modules_test.hal

      - name: Run focused Hara library tests
        run: |
          ./scripts/runtime/run-lib-tests \
            core/lib/test/tool/cli/template_test.hal \
            core/lib/test/code/test_support_test.hal \
            core/lib/test/code/test_compatibility_test.hal \
            core/lib/test/code/test_facade_test.hal \
            core/lib/test/code/deploy/cli_test.hal

      - name: Disassemble Foundation HBX and inspect code.test
        run: |
          ./core/hara bytecode disassemble core/rust/assets/std.foundation.hbx > /tmp/std.foundation.disassembly
          grep -F 'code.test' /tmp/std.foundation.disassembly
          grep -F 'process-test-args' /tmp/std.foundation.disassembly
          if grep -F 'code.test.task' /tmp/std.foundation.disassembly; then
            echo 'retired code.test.task remains in Foundation HBX' >&2
            exit 1
          fi

      - name: Run Rust embedded-library, metadata, and bundle tests
        run: |
          cargo test --manifest-path core/rust/Cargo.toml foundation_code_test_compatibility_namespaces_are_embedded
          cargo test --manifest-path core/rust/Cargo.toml runtime_metadata_round_trips_through_protocols_and_reader_literals
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm vm::bundle

      - name: Run Java code.test and HBX codec tests
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -DfailIfNoTests=true
          -Dtest=hara.truffle.CodeTestLibraryTest,hara.truffle.HaraBytecodeToolTest,hara.truffle.bytecode.HbcCodecTest
          test

      - name: Prepare and audit final tree
        run: |
          rm -rf hara-specs-registry
          rm .github/workflows/agent-foundation-task-hard-cut.yml
          rm scripts/runtime/foundation-task-hard-cut.patch.gz.b64
          rm scripts/runtime/function-metadata-support.patch.gz.b64
          rm scripts/runtime/bytecode-field-set-closure.patch.gz.b64
          rm scripts/runtime/code-test-compatibility-integration.patch.gz.b64
          rm scripts/runtime/foundation-task-hard-cut.part00
          rm scripts/runtime/foundation-task-hard-cut.part01
          rm scripts/runtime/foundation-task-hard-cut.part02
          rm scripts/runtime/foundation-task-hard-cut.part03
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/check-code-test-work-events
          git diff --check
          unexpected="$(rg -n 'code\.test\.task|task/process-test-args' core scripts notes plans \
            | grep -v 'core/spec/foundation-workflow-parity.edn' \
            | grep -v 'scripts/runtime/check-code-test-work-events' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          grep -F 'src/code/test/task.clj' core/spec/foundation-workflow-parity.edn

      - name: Commit verified hard cut
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "Repair Foundation bundle generation and retire code.test.task"
          git push origin HEAD:${{ github.ref_name }}
