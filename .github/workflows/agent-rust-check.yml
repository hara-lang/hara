name: Agent persistent named-value check

on:
  push:
    branches:
      - agent/persistent-defstruct-defmutable
    paths:
      - .github/agent/full2-00
      - .github/agent/full2-01
      - .github/agent/full2-02
      - .github/agent/full2-03
      - .github/agent/full2-04
      - .github/agent/full2-05
      - .github/workflows/agent-rust-check.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reconstruct and apply implementation
        run: |
          cat .github/agent/full2-* | base64 --decode | gzip --decompress > /tmp/full2.patch
          echo '5ae8bfe82c6bb4ea27c441aa01ffddf3c0c062e20068c3b057223f6d51ad1a49  /tmp/full2.patch' | sha256sum --check
          git apply --check /tmp/full2.patch
          git apply /tmp/full2.patch
      - name: Verify generated HAL mirror
        run: python3 scripts/runtime/sync-rust-hal-src --check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check
      - name: Check native and bytecode runtimes
        run: cargo check --manifest-path core/rust/Cargo.toml --features bytecode-vm
      - name: Compile Java and Truffle runtime
        run: mvn -B -f core/java/pom.xml -DskipTests compile
      - name: Capture applied source patch
        if: always()
        run: |
          git diff --binary -- core > /tmp/validated.patch
          gzip -9 -c /tmp/validated.patch > /tmp/validated.patch.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-validated-patch
          path: /tmp/validated.patch.gz
          if-no-files-found: error
          retention-days: 1
