name: Agent persistent named-value check

on:
  push:
    branches:
      - agent/persistent-defstruct-defmutable
    paths:
      - .github/agent/full2-00
      - .github/agent/full2-01
      - .github/agent/full2-02a
      - .github/agent/full2-02b
      - .github/agent/full2-03
      - .github/agent/full2-04
      - .github/agent/full2-05a0
      - .github/agent/full2-05a1
      - .github/agent/full2-05a2
      - .github/agent/full2-05b
      - .github/agent/java-fix-1.patch.gz.b64
      - .github/workflows/agent-rust-check.yml

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reconstruct and apply implementation
        run: |
          cat \
            .github/agent/full2-00 \
            .github/agent/full2-01 \
            .github/agent/full2-02a \
            .github/agent/full2-02b \
            .github/agent/full2-03 \
            .github/agent/full2-04 \
            .github/agent/full2-05a0 \
            .github/agent/full2-05a1 \
            .github/agent/full2-05a2 \
            .github/agent/full2-05b \
            | base64 --decode | gzip --decompress > /tmp/full2.patch
          echo '5ae8bfe82c6bb4ea27c441aa01ffddf3c0c062e20068c3b057223f6d51ad1a49  /tmp/full2.patch' | sha256sum --check
          git apply --check /tmp/full2.patch
          git apply /tmp/full2.patch
          base64 --decode .github/agent/java-fix-1.patch.gz.b64 | gzip --decompress > /tmp/java-fix-1.patch
          echo '72776a5c5349af694e9a7f770d492176756716036eec47e666fd877cdc67eff7  /tmp/java-fix-1.patch' | sha256sum --check
          git apply --check /tmp/java-fix-1.patch
          git apply /tmp/java-fix-1.patch
          cargo fmt --manifest-path core/rust/Cargo.toml --all
      - name: Verify generated HAL mirror and formatting
        run: |
          python3 scripts/runtime/sync-rust-hal-src --check
          cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check
      - name: Test Rust named-value runtime and HBC behavior
        run: |
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm defstruct_forms_issue_223 -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm defmutable_forms_use_reference_identity_and_settable_fields -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm guest_struct_protocols_dispatch_like_truffle -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm guest_mutables_share_storage_and_reject_persistent_updates -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm structs_preserve_wire_shape_and_mutables_are_rejected -- --nocapture
      - name: Test Java and Truffle named-value behavior
        run: |
          grep -n -A8 -B8 'isMemberInsertable' core/java/src/main/java/hara/truffle/HaraMutable.java
          mvn -B -f core/java/pom.xml -Ptruffle -Dtest=HaraMutableTest,HtaValueCodecTest clean test
      - name: Test canonical HAL struct and mutable contracts
        run: scripts/runtime/run-lib-tests core/lib/test/std/struct_test.hal core/lib/test/std/mutable_test.hal
