name: Site CI

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "core/lib/bench/**"
      - "packages/visual-language/**"
      - "packaging/scripts/build-www"
      - "packaging/scripts/install-benchmark-site"
      - ".github/scripts/verify-benchmark-observatory.sh"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/pages-www.yml"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout validated benchmark evidence
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: benchmark-site
          path: .benchmark-site
          fetch-depth: 1
      - name: Checkout reviewed hara-docs release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-docs
          ref: 563edc868ebd3bca018f6102f706a6600b5d0722
          path: website/docs
          fetch-depth: 1
      - name: Checkout reviewed visual-language release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/visual-language
          ref: a4db9548bdcad7887824890b0bb259da26e402c7
          path: packages/visual-language
          fetch-depth: 1
          persist-credentials: false
      - name: Remove the vendored hara-www snapshot
        run: rm -rf website/hara-www
      - name: Checkout reviewed hara-www unified live-surface release
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          ref: ce487593f3ea603b5e2d232431ca8b7f84061b42
          path: website/hara-www
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Link reviewed dependencies into the nested www workspace
        run: |
          mkdir -p website/packages
          rm -rf website/packages/visual-language
          ln -s ../../packages/visual-language website/packages/visual-language
          rm -rf website/rust
          ln -s ../core/rust website/rust
          mkdir -p website/lib
          rm -rf website/lib/bench
          ln -s ../../core/lib/bench website/lib/bench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/hara-www/package-lock.json
            benchmarks/package-lock.json
      - name: Install site dependencies
        run: |
          npm ci --prefix website/hara-www
          npm ci --prefix benchmarks
      - name: Prepare canonical evidence for Astro
        run: bash packaging/scripts/install-benchmark-site prepare
      - name: Validate benchmark publication
        run: |
          npm test --prefix benchmarks
          npm run build --prefix benchmarks
          test -s core/target/benchmarks/index.html
          grep -F '<title>Hara Benchmarks</title>' core/target/benchmarks/index.html
          grep -F 'id="class-comparison"' core/target/benchmarks/index.html
          grep -F 'id="language-shootout"' core/target/benchmarks/index.html
          grep -F 'rust-prepared' core/target/benchmarks/index.html
      - name: Test reviewed main Hara site
        run: npm test --prefix website/hara-www
      - name: Build reviewed main Hara site
        run: npm run build --prefix website/hara-www
      - name: Validate website and Starlight identity metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          function escapePattern(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          }

          function requireMeta(path, name, content) {
            const html = readFileSync(path, "utf8");
            const tags = html.match(/<meta\b[^>]*>/gi) || [];
            const namePattern = new RegExp(`\\bname=["']${escapePattern(name)}["']`, "i");
            const contentPattern = new RegExp(`\\bcontent=["']${escapePattern(content)}["']`, "i");
            if (!tags.some((tag) => namePattern.test(tag) && contentPattern.test(tag))) {
              throw new Error(`${path} is missing <meta name="${name}" content="${content}">`);
            }
          }

          requireMeta("website/target/www-astro/index.html", "hara-identity-mode", "popup");
          requireMeta(
            "website/target/www-astro/docs/start/orientation/index.html",
            "hara-identity-auto",
            "starlight",
          );
          NODE
      - name: Validate the unified website and documentation live surface
        run: |
          test -s website/target/www-astro/assets/live-surface.css
          grep -F '/assets/live-surface.css' website/target/www-astro/index.html
          grep -F '/assets/live-surface.css' website/target/www-astro/docs/start/orientation/index.html
          grep -F 'mountLiveCard' website/target/www-astro/assets/docs-repl.js
          grep -F 'mountDocsRunner' website/target/www-astro/assets/docs-repl.js
          if grep -Fq 'function installRepl' website/target/www-astro/assets/docs-repl.js; then
            echo 'The built documentation runtime still contains the retired bespoke REPL.' >&2
            exit 1
          fi
