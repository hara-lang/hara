name: Apply code.test normalize declaration

on:
  push:
    branches:
      - agent/code-test-canonical-runtime-v2-498

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add the explicit forward declaration
        run: |
          if [[ -f scripts/runtime/add-code-test-normalize-declaration ]]; then
            python3 scripts/runtime/add-code-test-normalize-declaration
          fi
      - name: Validate and commit
        run: |
          git diff --check
          diff -u core/lib/src/code/test.hal core/rust/hal-src/code/test.hal
          grep -q '(declare normalize-run-options)' core/lib/src/code/test.hal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Declare canonical code.test option normalization"
          git push
