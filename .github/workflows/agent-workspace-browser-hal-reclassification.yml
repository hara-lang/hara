name: Canonicalize browser Workspace HAL resources

on:
  push:
    branches:
      - agent/workspace-browser-hal-reclassification

permissions:
  contents: write

concurrency:
  group: agent-workspace-browser-hal-reclassification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/workspace-browser-hal-reclassification
          fetch-depth: 0

      - name: Rebase onto current main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Materialize canonical Workspace resources and compatibility facades
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          studio_hal = root / "core/rust/web/studio/hal"
          workspace_hal = root / "core/rust/web/workspace/hal"
          workspace_hal.mkdir(parents=True, exist_ok=True)

          exports = {
              "boot": ["boot!"],
              "store": ["call", "get", "put!", "del!", "keys"],
              "node": [
                  "current-id", "start", "run-task", "in", "in-frame", "emit", "call",
                  "find-handler", "invoke-handler", "handle", "stop", "info",
              ],
              "program": ["install", "info", "release"],
              "graph": [
                  "spawn", "release", "connect", "disconnect", "send-frame", "call-frame",
                  "info", "list-nodes",
              ],
              "session": [
                  "register-ingress!", "unregister-ingress!", "on", "off",
                  "invoke-ingress", "deliver",
              ],
          }

          for name, public_names in exports.items():
              old_path = studio_hal / f"{name}.hal"
              source = old_path.read_text()
              old_ns = f"(ns studio.{name}"
              new_ns = f"(ns workspace.{name}"
              if source.count(old_ns) != 1:
                  raise SystemExit(f"{old_path}: namespace seam changed")
              canonical = source.replace(old_ns, new_ns, 1)
              canonical = canonical.replace(f"studio.{name}", f"workspace.{name}")
              canonical = canonical.replace("studio kernels", "workspace kernels")
              (workspace_hal / f"{name}.hal").write_text(canonical)

              facade = [
                  ";; Temporary compatibility facade for the pre-Workspace browser namespace.",
                  f";; New code should require workspace.{name} directly.",
                  f"(ns studio.{name}",
                  f"  (:require [workspace.{name} :as workspace]))",
                  "",
              ]
              facade.extend(f"(def {symbol} workspace/{symbol})" for symbol in public_names)
              old_path.write_text("\n".join(facade) + "\n")

          def replace_all(path_name: str, old: str, new: str) -> None:
              path = root / path_name
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f"{path_name}: replacement seam not found: {old}")
              path.write_text(source.replace(old, new))

          replace_all(
              "core/rust/web/studio/hal/draw.hal",
              "[studio.node :as node]",
              "[workspace.node :as node]",
          )
          replace_all(
              "core/rust/web/studio/boot.js",
              "[studio.boot :as boot]",
              "[workspace.boot :as boot]",
          )
          replace_all(
              "core/rust/web/studio/ui.js",
              "[studio.boot :as boot]",
              "[workspace.boot :as boot]",
          )
          replace_all(
              "core/rust/web/studio/document-runtime.js",
              "(studio.node/run-task",
              "(workspace.node/run-task",
          )
          replace_all(
              "core/rust/web/host/broker.js",
              "[studio.node :as node]",
              "[workspace.node :as node]",
          )
          replace_all(
              "core/rust/web/host/services.js",
              "(studio.node/invoke-handler",
              "(workspace.node/invoke-handler",
          )
          replace_all(
              "core/rust/web/studio-ui.test.mjs",
              "studio.boot",
              "workspace.boot",
          )
          replace_all(
              "core/rust/web/studio-broker.test.mjs",
              "studio.node",
              "workspace.node",
          )

          browser_path = root / "core/rust/web/studio-browser.js"
          browser = browser_path.read_text()
          start = browser.index("const resources = {};\n")
          end = browser.index("for (const name of [\n  \"core\"", start)
          browser_resources = '''const resources = {};
          const workspaceHalResources = ["store", "boot", "node", "program", "graph", "session"];
          for (const name of workspaceHalResources) {
            resources[`workspace.${name}`] = await (await fetch(`./workspace/hal/${name}.hal`)).text();
          }
          for (const name of workspaceHalResources) {
            resources[`studio.${name}`] = await (await fetch(`./studio/hal/${name}.hal`)).text();
          }
          resources["studio.draw"] = await (await fetch("./studio/hal/draw.hal")).text();
          '''
          browser_path.write_text(browser[:start] + browser_resources + browser[end:])

          hal_test_path = root / "core/rust/web/studio-hal.test.mjs"
          hal_test = hal_test_path.read_text()
          helper = 'const hal = (name) => readFile(new URL(`./studio/hal/${name}.hal`, import.meta.url), "utf8");'
          if hal_test.count(helper) != 1:
              raise SystemExit("studio-hal.test.mjs: HAL helper seam changed")
          hal_test = hal_test.replace(
              helper,
              'const studioHal = (name) => readFile(new URL(`./studio/hal/${name}.hal`, import.meta.url), "utf8");\n'
              'const workspaceHal = (name) => readFile(new URL(`./workspace/hal/${name}.hal`, import.meta.url), "utf8");',
              1,
          )
          for name in exports:
              hal_test = hal_test.replace(f"studio.{name}", f"workspace.{name}")
          hal_test = hal_test.replace(
              "// Real-wasm integration tests for the studio hara libraries\n"
              "// (rust/web/studio/hal/*.hal): store/boot and canonical file behaviour is asserted by",
              "// Real-wasm integration tests for canonical Workspace browser HAL resources and\n"
              "// their bounded studio.* compatibility facades: store/boot and canonical file behaviour is asserted by",
          )
          resources_start = hal_test.index("const resources = wasmBytes === null")
          resources_end = hal_test.index("\n\nconst LISTING_URL", resources_start)
          resource_entries = []
          for name in exports:
              resource_entries.append(f'      "workspace.{name}": await workspaceHal("{name}"),')
          for name in exports:
              resource_entries.append(f'      "studio.{name}": await studioHal("{name}"),')
          resource_entries.extend([
              '      "gw.audio.supersonic": await supersonicHal(),',
              '      ...await substrateResources()',
          ])
          resources_block = (
              "const resources = wasmBytes === null\n"
              "  ? null\n"
              "  : {\n" + "\n".join(resource_entries) + "\n    };"
          )
          facade_test = '''

          test("studio compatibility HAL resources are thin Workspace facades", async () => {
            for (const name of ["store", "boot", "node", "program", "graph", "session"]) {
              const canonical = await workspaceHal(name);
              const compatibility = await studioHal(name);
              assert.match(canonical, new RegExp(`\\(ns workspace\\.${name}`));
              assert.doesNotMatch(canonical, new RegExp(`\\(ns studio\\.${name}`));
              assert.match(compatibility, new RegExp(`\\(ns studio\\.${name}`));
              assert.match(compatibility, new RegExp(`\\[workspace\\.${name} :as workspace\\]`));
              assert.doesNotMatch(compatibility, /Host\\/call/);
            }
          });'''
          hal_test_path.write_text(
              hal_test[:resources_start] + resources_block + facade_test + hal_test[resources_end:]
          )

          readme = '''# Hara Workspace browser HAL

          This directory contains the canonical browser-facing HAL resources for portable
          Workspace services. They are registered as:

          - `workspace.boot`
          - `workspace.session`
          - `workspace.node`
          - `workspace.graph`
          - `workspace.program`
          - `workspace.store`

          These namespaces describe Hara Workspace lifecycle, isolated session ingress,
          node transport, graph/program lifecycle, and scoped storage. Their values remain
          plain HAL data; browser workers, IndexedDB, transports, and capability enforcement
          stay in the host adapters under `core/rust/web`.

          The matching `studio.*` HAL files are temporary compatibility facades that only
          re-export the canonical Workspace functions. New source, generated documents, and
          browser bootstrap code must use `workspace.*` directly.

          `studio.draw` and `studio.audio` are intentionally not renamed in this tranche.
          They bind concrete canvas/audio host services and will move with the corresponding
          `web.canvas` / media-provider contract rather than being mislabeled as portable
          Workspace state.
          '''
          (root / "core/rust/web/workspace/README.md").write_text(
              "\n".join(line.strip() for line in readme.strip().splitlines()) + "\n"
          )

          canonical_consumers = [
              "core/rust/web/studio/boot.js",
              "core/rust/web/studio/ui.js",
              "core/rust/web/studio/document-runtime.js",
              "core/rust/web/host/broker.js",
              "core/rust/web/host/services.js",
          ]
          retired = tuple(f"studio.{name}" for name in exports)
          for path_name in canonical_consumers:
              source = (root / path_name).read_text()
              leftovers = [name for name in retired if name in source]
              if leftovers:
                  raise SystemExit(f"{path_name}: retired canonical consumer references remain: {leftovers}")
          for name in exports:
              canonical = (workspace_hal / f"{name}.hal").read_text()
              facade = (studio_hal / f"{name}.hal").read_text()
              if f"(ns workspace.{name}" not in canonical or f"studio.{name}" in canonical:
                  raise SystemExit(f"workspace.{name}: canonical namespace validation failed")
              if "Host/call" in facade or f"[workspace.{name} :as workspace]" not in facade:
                  raise SystemExit(f"studio.{name}: compatibility facade validation failed")
          PY
          rm .github/workflows/agent-workspace-browser-hal-reclassification.yml

      - name: Checkout Hara specs registry fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Checkout Hara website fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-www
          path: website/hara-www
          fetch-depth: 1
          submodules: recursive

      - name: Expose website fixture at the shared-workspace path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn "$GITHUB_WORKSPACE/website/hara-www" "$GITHUB_WORKSPACE/../../website/hara-www"

      - name: Set up Rust and Node
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Build raw browser runtime
        run: cargo build --manifest-path core/rust/raw/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Run browser Workspace and Studio compatibility tests
        working-directory: core/rust/web
        run: |
          npm ci
          npm run test:studio

      - name: Commit verified Workspace migration
        run: |
          git add -A
          git commit -m "workspace: canonicalize browser HAL services"
          git push --force-with-lease origin HEAD:agent/workspace-browser-hal-reclassification
