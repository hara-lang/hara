name: Language CI

on:
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/**'
      - 'core/lib/src-lang/**'
      - 'core/lib/test/**'
      - 'core/lib/test-lang/**'
      - 'core/lib/integration/**'
      - 'core/lib/lang-port.edn'
      - 'core/java/src/**'
      - 'core/spec/fixtures/lang-metadata-v1/**'
      - 'core/project.edn'
      - 'core/lib/project.hal'
      - 'scripts/runtime/check-language-source-layout'
      - 'scripts/runtime/check-no-tahto-language-metadata'
      - 'scripts/runtime/check-code-test-work-events'
      - 'scripts/audit-std-block-hard-cut.sh'
      - 'scripts/audit-std-substrate-hard-cut.sh'
      - 'scripts/audit-std-fs-hard-cut.sh'
      - 'scripts/runtime/foundation_parity.py'
      - 'scripts/runtime/foundation_parity_test.py'
      - 'scripts/runtime/foundation_behavioral_corpus.py'
      - 'scripts/runtime/foundation_behavioral_corpus_test.py'
      - 'scripts/runtime/foundation_migration_scope_test.py'
      - 'core/spec/foundation-migration-scope.json'
      - 'core/spec/code-migrate/foundation-behavioral-corpus.json'
      - 'core/spec/foundation-parity.json'
      - 'core/spec/foundation-parity-baseline.json'
      - '.github/workflows/language-source-layout.yml'
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/lib/src/**'
      - 'core/lib/src-lang/**'
      - 'core/lib/test/**'
      - 'core/lib/test-lang/**'
      - 'core/lib/integration/**'
      - 'core/lib/lang-port.edn'
      - 'core/java/src/**'
      - 'core/spec/fixtures/lang-metadata-v1/**'
      - 'core/project.edn'
      - 'core/lib/project.hal'
      - 'scripts/runtime/check-language-source-layout'
      - 'scripts/runtime/check-no-tahto-language-metadata'
      - 'scripts/runtime/check-code-test-work-events'
      - 'scripts/audit-std-block-hard-cut.sh'
      - 'scripts/audit-std-substrate-hard-cut.sh'
      - 'scripts/audit-std-fs-hard-cut.sh'
      - 'scripts/runtime/foundation_parity.py'
      - 'scripts/runtime/foundation_parity_test.py'
      - 'scripts/runtime/foundation_behavioral_corpus.py'
      - 'scripts/runtime/foundation_behavioral_corpus_test.py'
      - 'scripts/runtime/foundation_migration_scope_test.py'
      - 'core/spec/foundation-migration-scope.json'
      - 'core/spec/code-migrate/foundation-behavioral-corpus.json'
      - 'core/spec/foundation-parity.json'
      - 'core/spec/foundation-parity-baseline.json'
      - '.github/workflows/language-source-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source roots, namespaces, model epoch, and duplicates
        run: python3 scripts/runtime/check-language-source-layout
      - name: Reserve legacy Tahto keywords for the fabric
        run: python3 scripts/runtime/check-no-tahto-language-metadata
      - name: Enforce code.test facade and graph ownership
        run: python3 scripts/runtime/check-code-test-work-events
      - name: Reject retired standard-library namespaces
        run: |
          python3 scripts/runtime/sync-rust-hal-src
          bash scripts/audit-std-block-hard-cut.sh
          bash scripts/audit-std-substrate-hard-cut.sh
          bash scripts/audit-std-fs-hard-cut.sh
          git restore core/rust/hal-src
          git clean -fdX core/rust/hal-src
      - name: Test and validate the Foundation parity ledger
        run: |
          python3 -m unittest discover -s scripts/runtime -p 'foundation*_test.py'
          python3 scripts/runtime/foundation_behavioral_corpus.py
          python3 scripts/runtime/foundation_parity.py
