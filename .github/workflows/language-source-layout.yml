name: Language source layout

on:
  push:
    paths:
      - 'core/lib/src/**'
      - 'core/lib/src-lang/**'
      - 'core/lib/test/**'
      - 'core/lib/test-lang/**'
      - 'core/lib/integration/**'
      - 'core/java/src/**'
      - 'core/rust/hal-src/lang/**'
      - 'core/spec/fixtures/lang-metadata-v1/**'
      - 'core/project.edn'
      - 'core/lib/project.hal'
      - 'scripts/runtime/check-language-source-layout'
      - 'scripts/runtime/check-no-tahto-language-metadata'
      - 'scripts/runtime/foundation_parity.py'
      - 'scripts/runtime/foundation_parity_test.py'
      - 'core/spec/foundation-parity.json'
      - 'core/spec/foundation-parity-baseline.json'
      - '.github/workflows/language-source-layout.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/lib/src/**'
      - 'core/lib/src-lang/**'
      - 'core/lib/test/**'
      - 'core/lib/test-lang/**'
      - 'core/lib/integration/**'
      - 'core/java/src/**'
      - 'core/rust/hal-src/lang/**'
      - 'core/spec/fixtures/lang-metadata-v1/**'
      - 'core/project.edn'
      - 'core/lib/project.hal'
      - 'scripts/runtime/check-language-source-layout'
      - 'scripts/runtime/check-no-tahto-language-metadata'
      - 'scripts/runtime/foundation_parity.py'
      - 'scripts/runtime/foundation_parity_test.py'
      - 'core/spec/foundation-parity.json'
      - 'core/spec/foundation-parity-baseline.json'
      - '.github/workflows/language-source-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: language-source-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source roots, namespaces, and duplicates
        run: python3 scripts/runtime/check-language-source-layout
      - name: Reserve legacy Tahto keywords for the fabric
        run: python3 scripts/runtime/check-no-tahto-language-metadata
      - name: Test and validate the Foundation parity ledger
        run: |
          python3 -m unittest discover -s scripts/runtime -p 'foundation_parity_test.py'
          python3 scripts/runtime/foundation_parity.py
