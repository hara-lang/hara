name: Inspect native grammar reference identity

on:
  push:
    branches:
      - agent/789-v1-grammar-fingerprint-parity

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/789-v1-grammar-fingerprint-parity
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native Hara test runner
        run: cargo build --locked --manifest-path core/rust/Cargo.toml --bin hara-test

      - name: Inspect reference identity paths
        shell: bash
        run: |
          mkdir -p core/lib/test/code target .agent
          cat > core/lib/test/code/agent_v1_reference_identity_test.hal <<'HAL'
          (ns code.agent-v1-reference-identity-test
            (:use code.test)
            (:require [lang.common.grammar-macro :as grammar-macro]))

          (fact "native grammar reference identity paths"
            (let [entry (first grammar-macro/+op-macro+)
                  extracted (get entry :macro)
                  pair (first
                        (filter (fn [item]
                                  (= :macro (first item)))
                                entry))
                  pair-value (second pair)
                  resolved
                  (resolve 'lang.common.grammar-macro/tf-macroexpand)]
              (println "REF-DIAG entry=" (pr-str entry))
              (println "REF-DIAG entries=" (pr-str (vec entry)))
              (println "REF-DIAG pair=" (pr-str pair))
              (println "REF-DIAG pair-value=" (pr-str pair-value))
              (println "REF-DIAG extracted=" (pr-str extracted))
              (println "REF-DIAG extracted-meta=" (pr-str (meta extracted)))
              (println "REF-DIAG pair-value-meta=" (pr-str (meta pair-value)))
              (println "REF-DIAG resolved=" (pr-str resolved))
              (println "REF-DIAG resolved-meta=" (pr-str (meta resolved)))
              (println "REF-DIAG resolved-root=" (pr-str (deref resolved)))
              (println "REF-DIAG resolved-root-meta="
                       (pr-str (meta (deref resolved))))
              (println "REF-DIAG predicates="
                       (pr-str {:extracted-fn (fn? extracted)
                                :extracted-var (var? extracted)
                                :pair-value-fn (fn? pair-value)
                                :pair-value-var (var? pair-value)
                                :resolved-fn (fn? resolved)
                                :resolved-var (var? resolved)}))
              true)
            => true)

          (pr-str
           (run {:namespace "code.agent-v1-reference-identity-test"}))
          HAL

          core/rust/target/debug/hara-test \
            --root "$GITHUB_WORKSPACE/core" \
            "$GITHUB_WORKSPACE/core/lib/test/code/agent_v1_reference_identity_test.hal" \
            > target/v1-reference-identity.log 2>&1

          {
            grep 'REF-DIAG' target/v1-reference-identity.log || true
            echo "--- runner summary ---"
            tail -n 20 target/v1-reference-identity.log
          } > .agent/v1-reference-identity.txt

      - name: Publish the report and remove temporary sources
        shell: bash
        run: |
          rm -f core/lib/test/code/agent_v1_reference_identity_test.hal
          rm -f .github/workflows/agent-789-diagnose-v3.yml
          git add -A .agent/v1-reference-identity.txt \
            .github/workflows/agent-789-diagnose-v3.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record native grammar reference identity paths"
          git push origin HEAD:agent/789-v1-grammar-fingerprint-parity
