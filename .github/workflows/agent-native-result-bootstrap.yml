name: Implement native Result bootstrap

on:
  push:
    branches:
      - agent/640-native-result-bootstrap

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/640-native-result-bootstrap
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Inspect native dereference dispatch
        run: grep -n -B 8 -A 120 'fn protocol_deref' core/rust/src/core.rs || true

      - name: Reconstruct and apply native Result bootstrap
        run: |
          cat .github/scripts/native-result-bootstrap.b64.* | base64 --decode > .github/scripts/implement_native_result_bootstrap.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/implement_native_result_bootstrap.py')
          text = path.read_text()
          old = '''    if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)'''
          new = '''    if label == "Rust Result receiver category" and count == 2:
                  return text.replace(old, new)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one replace_once guard, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/implement_native_result_bootstrap.py

      - name: Format Rust sources
        run: rustfmt --edition 2021 core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs

      - name: Validate Rust formatting
        run: cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check

      - name: Compile Rust runtime
        run: cargo check --manifest-path core/rust/Cargo.toml --lib

      - name: Run focused Rust Result tests
        run: cargo test --manifest-path core/rust/Cargo.toml native_result --lib

      - name: Run focused Java Result tests
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest=hara.truffle.HaraResultTest test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated implementation
        run: |
          rm .github/scripts/implement_native_result_bootstrap.py
          rm .github/scripts/native-result-bootstrap.b64.*
          rm .github/workflows/agent-native-result-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Introduce native Result value model"
          git push origin HEAD:agent/640-native-result-bootstrap
