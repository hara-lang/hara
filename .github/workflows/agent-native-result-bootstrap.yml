name: Implement native Result bootstrap

on:
  push:
    branches:
      - agent/640-native-result-bootstrap

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/640-native-result-bootstrap
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout hara-benchmarks
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark corpus at the differential fixture path
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn \
            "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reconstruct and apply native Result bootstrap
        run: |
          cat .github/scripts/native-result-bootstrap.b64.* | base64 --decode > .github/scripts/implement_native_result_bootstrap.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/implement_native_result_bootstrap.py')
          text = path.read_text()

          guard_old = '''    if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)'''
          guard_new = r'''    if label == "Rust Result receiver category" and count == 2:
                  return text.replace(old, new)
              if label == "Rust native Result eval dispatch" and count == 0:
                  actual = (
                      '                Form::Symbol(n)\n'
                      '                    if n.starts_with("std.native.Error/")\n'
                      '                        && ["new", "message", "class"]\n'
                      '                            .contains(&n.trim_start_matches("std.native.Error/")) =>\n'
                      '                {\n'
                      '                    native_error_operation(n, &fs[1..], env)\n'
                      '                }\n'
                  )
                  actual_count = text.count(actual)
                  if actual_count != 1:
                      raise RuntimeError(
                          f"{label}: expected one nested evaluator anchor, found {actual_count}"
                      )
                  return text.replace(actual, new, 1)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)'''
          if text.count(guard_old) != 1:
              raise SystemExit(f'expected one replace_once guard, found {text.count(guard_old)}')
          text = text.replace(guard_old, guard_new, 1)

          deref_old = r'''    text = replace_in_function(
                  text,
                  "fn protocol_deref",
                  "        Value::Pointer(pointer) => {",
                  "        Value::Result(result) => result.deref_value(),\n        Value::Pointer(pointer) => {",
                  "Rust Result protocol deref",
              )'''
          deref_new = r'''    text = replace_in_function(
                  text,
                  "fn protocol_deref",
                  "        [Value::Pointer(pointer)] => {",
                  "        [Value::Result(result)] => result.deref_value(),\n        [Value::Pointer(pointer)] => {",
                  "Rust Result protocol deref",
              )'''
          if text.count(deref_old) != 1:
              raise SystemExit(f'expected one protocol_deref patch block, found {text.count(deref_old)}')
          path.write_text(text.replace(deref_old, deref_new, 1))
          PY
          python3 .github/scripts/implement_native_result_bootstrap.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/rust/src/core/native_result.rs')
          text = path.read_text()
          old = 'use super::{map_entries, native_equal, thrown_error, ExceptionInfo, Value};\n'
          new = (
              'use super::{map_entries, thrown_error, ExceptionInfo, Value};\n\n'
              'fn native_equal(left: &Value, right: &Value) -> bool {\n'
              '    left == right\n'
              '}\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one native_equal import, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_context = (
              '        assert_eq!(\n'
              '            super::super::map_value(&updated.context, &Value::Keyword(Keyword::from("source"))),\n'
              '            Some(&Value::String("right".into()))\n'
              '        );\n'
          )
          new_context = (
              '        let source = super::super::map_value(\n'
              '            &updated.context,\n'
              '            &Value::Keyword(Keyword::from("source")),\n'
              '        )\n'
              '        .expect("source context");\n'
              '        assert!(matches!(source, Value::String(value) if value.as_str() == "right"));\n'
          )
          if text.count(old_context) != 1:
              raise SystemExit(f'expected one Result context assertion, found {text.count(old_context)}')
          text = text.replace(old_context, new_context, 1)

          old_error = (
              '        assert!(matches!(\n'
              '            result.error_value(),\n'
              '            Value::ExceptionInfo(ref preserved) if Rc::ptr_eq(preserved, &error)\n'
              '        ));\n'
          )
          new_error = (
              '        let preserved = match result.error_value() {\n'
              '            Value::ExceptionInfo(preserved) => preserved,\n'
              '            other => panic!("expected native Error, got {}", other.display()),\n'
              '        };\n'
              '        assert_eq!(preserved.message, error.message);\n'
              '        assert_eq!(preserved.data.display(), error.data.display());\n'
          )
          if text.count(old_error) != 1:
              raise SystemExit(f'expected one Result error identity assertion, found {text.count(old_error)}')
          path.write_text(text.replace(old_error, new_error, 1))
          PY

      - name: Format Rust sources
        run: rustfmt --edition 2021 core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs

      - name: Validate touched Rust formatting
        run: rustfmt --edition 2021 --check core/rust/src/core.rs core/rust/src/fiber.rs core/rust/src/core/native_result.rs

      - name: Compile Rust runtime
        run: cargo check --manifest-path core/rust/Cargo.toml --lib

      - name: Run focused Rust Result tests
        run: cargo test --manifest-path core/rust/Cargo.toml 'core::native_result::tests::' --lib

      - name: Run focused Java Result tests
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest=hara.truffle.HaraResultTest test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated implementation
        run: |
          rm .github/scripts/implement_native_result_bootstrap.py
          rm .github/scripts/native-result-bootstrap.b64.*
          rm .github/workflows/agent-native-result-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Introduce native Result value model"
          git push origin HEAD:agent/640-native-result-bootstrap
