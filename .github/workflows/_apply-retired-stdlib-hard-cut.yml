name: Apply retired standard-library hard cut

on:
  push:
    branches:
      - agent/remove-retired-stdlib-hard-cut
    paths:
      - .github/workflows/_apply-retired-stdlib-hard-cut.yml

permissions:
  contents: write

concurrency:
  group: apply-retired-stdlib-hard-cut
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-retired-stdlib-hard-cut
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the hard cut
        shell: bash
        env:
          MIGRATION_PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          source = gzip.decompress(base64.b64decode(os.environ['MIGRATION_PAYLOAD']))
          exec(compile(source, 'retired_stdlib_migration.py', 'exec'))
          PY

      - name: Synchronize Rust HAL mirrors
        run: python3 scripts/runtime/sync-rust-hal-src

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate the embedded Foundation artifact
        run: cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- generate

      - name: Validate mirrors and retired-module audit
        run: |
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/retired_stdlib_audit.py
          git diff --check

      - name: Run focused HAL validation
        run: |
          bash scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/work_task_redirection_test.hal

      - name: Run the full HAL library suite
        id: hal-suite
        continue-on-error: true
        run: bash scripts/runtime/run-lib-tests

      - name: Run Rust tests
        id: rust-suite
        continue-on-error: true
        run: cargo test --manifest-path core/rust/Cargo.toml

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run Truffle tests
        id: truffle-suite
        continue-on-error: true
        run: mvn -B -Ptruffle test --file core/java/pom.xml

      - name: Record broad-suite status
        run: |
          cat > /tmp/retired-stdlib-validation.txt <<EOF
          focused=passed
          hal-suite=${{ steps.hal-suite.outcome }}
          rust-suite=${{ steps.rust-suite.outcome }}
          truffle-suite=${{ steps.truffle-suite.outcome }}
          EOF
          cat /tmp/retired-stdlib-validation.txt

      - name: Commit the implementation
        shell: bash
        run: |
          rm .github/workflows/_apply-retired-stdlib-hard-cut.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired stdlib walk and test modules'
          git push origin HEAD:agent/remove-retired-stdlib-hard-cut
