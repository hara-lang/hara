name: Agent finish std.typed CI

on:
  push:
    branches:
      - agent/std-typed-schema-metadata

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check out specification registry
        uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry

      - name: Expose the specification registry at the sibling fixture path
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Apply the std.typed dependency-boundary repair
        shell: bash
        run: |
          python3 .github/scripts/finish_std_typed.py
          python3 .github/scripts/finish_std_typed_v2.py

      - name: Enforce the portable dependency graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          typed = Path("core/lib/src/std/typed")
          sources = {path: path.read_text() for path in typed.glob("*.hal")}
          leaks = [str(path) for path, text in sources.items()
                   if "std.block" in text or "block/" in text]
          if leaks:
              raise SystemExit("std.typed depends on std.block: " + ", ".join(leaks))

          infer = sources[typed / "infer.hal"]
          expected_infer = "(:require [std.typed.schema :as schema])"
          if expected_infer not in infer or "std.foundation" in infer:
              raise SystemExit("std.typed.infer must directly require only std.typed.schema")

          schema = sources[typed / "schema.hal"]
          if "[std.foundation :refer :all :exclude [resolve]]" not in schema:
              raise SystemExit("std.typed.schema must have exactly the portable Foundation dependency")
          PY

      - name: Create raw schema probes
        run: python3 .github/scripts/create_std_typed_probes.py

      - name: Run raw schema probes
        shell: bash
        run: |
          for probe in core/lib/test/std/typed/probes/*.hal; do
            echo "::group::${probe}"
            ./scripts/runtime/run-lib-tests "$probe"
            echo "::endgroup::"
          done

      - name: Run focused portable HAL tests
        shell: bash
        run: |
          tests=(
            core/lib/test/std/typed/schema_test.hal
            core/lib/test/std/typed/infer_test.hal
            core/lib/test/std/typed/parity_test.hal
            core/lib/test/tool/lint_schema_test.hal
            core/lib/test/tool/cli/lint_test.hal
          )
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            ./scripts/runtime/run-lib-tests "$test_file"
            echo "::endgroup::"
          done

      - name: Remove diagnostic probes
        run: rm -rf core/lib/test/std/typed/probes

      - name: Regenerate and verify the canonical Rust HAL source mirror
        shell: bash
        run: |
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Format the split Rust schema modules
        shell: bash
        run: |
          rustfmt --edition 2021 core/rust/src/kernel/schema.rs core/rust/src/kernel/schema/infer.rs core/rust/src/kernel/schema/tests.rs
          bash core/rust/scripts/check-layout.test.sh

      - name: Check and test the Rust schema implementation
        shell: bash
        run: |
          cargo check --manifest-path core/rust/Cargo.toml --lib
          cargo test --manifest-path core/rust/Cargo.toml kernel::schema::tests --lib

      - name: Run the JVM schema parity tests
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest=hara.truffle.HalcSchemaTest test

      - name: Commit validated implementation repairs
        shell: bash
        run: |
          rm -rf core/lib/test/std/typed/probes
          rm -f .github/scripts/create_std_typed_probes.py
          rm -f .github/scripts/finish_std_typed.py
          rm -f .github/scripts/finish_std_typed_v2.py
          rm -f .github/workflows/agent-repair-std-typed-ci.yml
          rm -f .github/workflows/agent-finish-std-typed-ci.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes were produced" >&2
            exit 1
          fi
          git commit -m "Decouple std.typed from source blocks"
          git push origin HEAD:${GITHUB_REF_NAME}
