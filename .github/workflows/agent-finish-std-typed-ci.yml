name: Agent finish std.typed CI

on:
  push:
    branches:
      - agent/std-typed-schema-metadata

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check out specification registry
        uses: actions/checkout@v5
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry

      - name: Expose the specification registry at the sibling path used by Rust fixtures
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/../hara-specs-registry"
          ln -s "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Apply the reviewed repair program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/agent-repair-std-typed-ci.yml").read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n"
          if workflow.count(start) != 1:
              raise SystemExit("unable to locate the reviewed repair program")
          body = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          Path("/tmp/std_typed_repair.py").write_text("\n".join(lines) + "\n")
          PY
          python3 /tmp/std_typed_repair.py

      - name: Regenerate and verify the canonical Rust HAL source mirror
        shell: bash
        run: |
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Format and verify the split Rust schema modules
        shell: bash
        run: |
          rustfmt --edition 2021 core/rust/src/kernel/schema.rs core/rust/src/kernel/schema/infer.rs core/rust/src/kernel/schema/tests.rs
          bash core/rust/scripts/check-layout.sh

      - name: Check and test the Rust schema implementation
        shell: bash
        run: |
          cargo check --manifest-path core/rust/Cargo.toml --lib
          cargo test --manifest-path core/rust/Cargo.toml kernel::schema::tests --lib

      - name: Run the affected JVM protocol tests
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest=hara.truffle.HaraLanguageTest test

      - name: Commit validated repairs
        shell: bash
        run: |
          rm .github/workflows/agent-repair-std-typed-ci.yml
          rm .github/workflows/agent-finish-std-typed-ci.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes were produced" >&2
            exit 1
          fi
          git commit -m "Fix std.typed CI integration drift"
          git push origin HEAD:${GITHUB_REF_NAME}
