name: Agent 838 stable Rust cache

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - .agent-838-cargo-trigger

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish run identifier
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .agent-838-cargo-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-838-cargo-run
          git commit -m 'chore: publish stable Rust cache run [skip ci]'
          git push
      - name: Record production stable toolchain
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path core/rust/Cargo.toml
      - name: Archive stable toolchain and Cargo registry
        run: |
          active="$(rustup show active-toolchain | awk '{print $1}')"
          cd "$HOME/.rustup/toolchains"
          zip -qr "$GITHUB_WORKSPACE/rust-stable.zip" "$active"
          cd "$HOME/.cargo"
          zip -qr "$GITHUB_WORKSPACE/cargo-cache.zip" registry git || true
      - uses: actions/upload-artifact@v4
        with:
          name: rust-stable-x86_64-unknown-linux-gnu
          path: rust-stable.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-cache-locked
          path: cargo-cache.zip
          retention-days: 1
          compression-level: 0
