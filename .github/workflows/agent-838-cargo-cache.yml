name: Agent 838 locked Cargo cache

on:
  push:
    branches:
      - agent/838-direct-callable-catalog
    paths:
      - .agent-838-cargo-trigger

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish run identifier
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .agent-838-cargo-run
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-838-cargo-run
          git commit -m 'chore: publish locked Cargo cache run [skip ci]'
          git push
      - name: Install the repository minimum Rust toolchain
        run: rustup toolchain install 1.78.0 --profile minimal
      - name: Fetch locked Rust dependencies
        run: cargo +1.78.0 fetch --locked --manifest-path core/rust/Cargo.toml
      - name: Archive the Cargo registry
        run: |
          cd "$HOME/.cargo"
          zip -qr "$GITHUB_WORKSPACE/cargo-cache.zip" registry git || true
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-cache-locked
          path: cargo-cache.zip
          retention-days: 1
          compression-level: 0
