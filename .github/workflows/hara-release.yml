name: Hara release promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hara-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-ref:
    name: release ref
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Require the reviewed release head and signed tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release
          git fetch origin main release --tags --force
          test "$(git rev-parse origin/release)" = "$GITHUB_SHA"
          version="$(sed -nE 's/^[[:space:]]*:project\/version "([^"]+)".*/\1/p' project.edn)"
          test -n "$version"
          git rev-parse -q --verify "refs/tags/${version}" >/dev/null
          git verify-tag "$version"
          test "$(git rev-list -n 1 "$version")" = "$GITHUB_SHA"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  validate:
    needs: release-ref
    uses: ./.github/workflows/hara-source.yml

  request-publication:
    name: request package publication
    needs: [release-ref, validate]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-ref.outputs.tag }}
    steps:
      - name: Dispatch the signed-tag publication request
        run: gh workflow run package-publication-request.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --field tag="$RELEASE_TAG"
