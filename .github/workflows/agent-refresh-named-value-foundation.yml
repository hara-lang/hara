name: Agent repair portable plain-report centering

on:
  push:
    branches:
      - agent/persistent-defstruct-defmutable
    paths:
      - .github/workflows/agent-refresh-named-value-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the plain-report repair
        uses: actions/checkout@v4
        with:
          ref: agent/fix-work-report-portable-center
          fetch-depth: 0

      - name: Replace evaluator-only quotient usage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("core/lib/src/std/work/report/plain.hal")
          source = source_path.read_text(encoding="utf-8")
          old = "(let [left (quot missing 2)\n            right (- missing left)]"
          new = "(let [left (long (/ missing 2))\n            right (- missing left)]"
          if source.count(old) != 1:
              raise SystemExit(f"expected one quotient anchor, found {source.count(old)}")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("core/lib/test/std/work_report_renderer_test.hal")
          test = test_path.read_text(encoding="utf-8")
          anchor = "   (test/check\n    \"plain truncation uses the portable string slice primitive\""
          addition = (
              "   (test/check\n"
              "    \"plain center alignment uses portable numeric primitives\"\n"
              "    [(plain/pad \"x\" 4 :center)\n"
              "     (plain/pad \"x\" 5 :center)]\n"
              "    [\" x  \" \"  x  \"])\n\n"
          )
          if test.count(anchor) != 1:
              raise SystemExit(f"expected one renderer test anchor, found {test.count(anchor)}")
          test_path.write_text(test.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY

      - name: Generate and validate the Rust HAL mirror
        run: |
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          git diff --check
          ./scripts/runtime/run-lib-tests core/lib/test/std/work_report_renderer_test.hal
          python3 - <<'PY'
          import subprocess

          expected = {
              "core/lib/src/std/work/report/plain.hal",
              "core/lib/test/std/work_report_renderer_test.hal",
              "core/rust/hal-src/std/work/report/plain.hal",
          }
          status = subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
          changed = {line[3:] for line in status if line.strip()}
          if changed != expected:
              raise SystemExit(f"unexpected file set: {sorted(changed)}")
          PY

      - name: Commit the repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/lib/src/std/work/report/plain.hal \
            core/lib/test/std/work_report_renderer_test.hal \
            core/rust/hal-src/std/work/report/plain.hal
          git commit -m 'Use portable arithmetic in plain report centering'
          git push origin HEAD:refs/heads/agent/fix-work-report-portable-center
