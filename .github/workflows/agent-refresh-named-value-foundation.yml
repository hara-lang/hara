name: Publish clean foundation bootstrap repair

on:
  push:
    branches:
      - agent/persistent-defstruct-defmutable
    paths:
      - .github/workflows/agent-refresh-named-value-foundation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the clean repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-foundation-bootstrap
          path: work
          fetch-depth: 0

      - name: Check out the diagnostics carrier
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-defstruct-defmutable
          path: carrier
          fetch-depth: 0

      - name: Check out specification fixtures
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: specs
          fetch-depth: 1

      - name: Expose specification fixtures
        run: |
          ln -sfn "$GITHUB_WORKSPACE/specs" "$GITHUB_WORKSPACE/hara-specs-registry"
          ln -sfn "$GITHUB_WORKSPACE/specs" "$GITHUB_WORKSPACE/work/hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build and test the clean repair
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/foundation-bootstrap.log") 2>&1

          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("core/lib/src/std/work/report/plain.hal")
          source = source_path.read_text(encoding="utf-8")
          old = "(let [left (quot missing 2)\n            right (- missing left)]"
          new = "(let [left (long (/ missing 2))\n            right (- missing left)]"
          if source.count(old) != 1:
              raise SystemExit(f"expected one quotient anchor, found {source.count(old)}")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("core/lib/test/std/work_report_renderer_test.hal")
          test = test_path.read_text(encoding="utf-8")
          anchor = "   (test/check\n    \"plain truncation uses the portable string slice primitive\""
          addition = (
              "   (test/check\n"
              "    \"plain center alignment uses portable numeric primitives\"\n"
              "    [(plain/pad \"x\" 4 :center)\n"
              "     (plain/pad \"x\" 5 :center)]\n"
              "    [\" x  \" \"  x  \"])\n\n"
          )
          if test.count(anchor) != 1:
              raise SystemExit(f"expected one renderer test anchor, found {test.count(anchor)}")
          test_path.write_text(test.replace(anchor, addition + anchor, 1), encoding="utf-8")
          PY

          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- generate
          cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- check
          git diff --check

          ./scripts/runtime/run-lib-tests core/lib/test/std/work_report_renderer_test.hal
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm defstruct_forms_issue_223 -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm defmutable_forms_use_reference_identity_and_settable_fields -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm guest_struct_protocols_dispatch_like_truffle -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm guest_mutables_share_storage_and_reject_persistent_updates -- --nocapture
          cargo test --manifest-path core/rust/Cargo.toml --features bytecode-vm structs_preserve_wire_shape_and_mutables_are_rejected -- --nocapture

          python3 - <<'PY'
          import subprocess

          expected = {
              "core/lib/src/std/work/report/plain.hal",
              "core/lib/test/std/work_report_renderer_test.hal",
              "core/rust/assets/std.foundation.hbx",
              "core/rust/hal-src/std/work/report/plain.hal",
          }
          status = subprocess.check_output(["git", "status", "--short"], text=True).splitlines()
          changed = {line[3:] for line in status if line.strip()}
          if changed != expected:
              raise SystemExit(
                  f"unexpected file set: {sorted(changed)}; expected {sorted(expected)}"
              )
          PY

      - name: Commit and publish the clean repair
        working-directory: work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/lib/src/std/work/report/plain.hal \
            core/lib/test/std/work_report_renderer_test.hal \
            core/rust/assets/std.foundation.hbx \
            core/rust/hal-src/std/work/report/plain.hal
          git commit -m 'Repair and refresh the foundation bootstrap bundle'
          git push origin HEAD:refs/heads/agent/repair-foundation-bootstrap

      - name: Preserve diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p carrier/.github/agent
          cp "$GITHUB_WORKSPACE/foundation-bootstrap.log" carrier/.github/agent/foundation-bootstrap.log || true
          cd carrier
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/agent/foundation-bootstrap.log
          git commit -m 'Record foundation bootstrap failure' || true
          git push origin HEAD:refs/heads/agent/persistent-defstruct-defmutable
