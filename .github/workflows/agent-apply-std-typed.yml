name: Agent apply std.typed schema metadata payload

on:
  push:
    branches: [agent/std-typed-schema-metadata]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[agent-payload]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/std-typed-schema-metadata
          fetch-depth: 0

      - name: Expand implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/std-typed-payload.b64.part-* | base64 --decode > /tmp/std-typed-payload.tar.xz
          echo '92bf5ca93b7cfdeb479e293f6806243d5b0ff6a3e21c9eb7e8e0ef95223a6491  /tmp/std-typed-payload.tar.xz' | sha256sum --check
          tar -xJf /tmp/std-typed-payload.tar.xz

      - name: Reconcile mirrors and inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile

          mirrors = [
              ('core/lib/src/std/typed/schema.hal', 'core/rust/hal-src/std/typed/schema.hal'),
              ('core/lib/src/std/typed/infer.hal', 'core/rust/hal-src/std/typed/infer.hal'),
              ('core/lib/src/tool/lint/schema.hal', 'core/rust/hal-src/tool/lint/schema.hal'),
              ('core/lib/src/tool/lint/analyze.hal', 'core/rust/hal-src/tool/lint/analyze.hal'),
              ('core/lib/src/tool/lint.hal', 'core/rust/hal-src/tool/lint.hal'),
              ('core/lib/src/tool/cli/lint.hal', 'core/rust/hal-src/tool/cli/lint.hal'),
          ]
          for source, target in mirrors:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              copyfile(source, target)

          for name in ['core/lib/src/std/foundation.hal', 'core/rust/hal-src/std/foundation.hal']:
              path = Path(name)
              source = path.read_text()
              updated = source.replace('[:fn [:str] [:vec :any]]', '[:fn [:str] [:vector :any]]')
              if source == updated:
                  raise SystemExit(f'expected legacy annotation in {name}')
              path.write_text(updated)

          inventory = Path('core/rust/standard-library.namespaces')
          namespaces = inventory.read_text().splitlines()
          if 'std.typed.infer' not in namespaces:
              namespaces.insert(namespaces.index('std.typed.schema'), 'std.typed.infer')
          inventory.write_text('\n'.join(namespaces) + '\n')
          PY

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent .github/workflows/agent-apply-std-typed.yml
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate schema metadata with std.typed'
          git push origin HEAD:agent/std-typed-schema-metadata
