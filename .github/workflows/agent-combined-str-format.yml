name: Agent combined strings and format layers

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-combined-str-format.yml

permissions:
  contents: write

concurrency:
  group: agent-combined-str-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.head_ref == 'codex/combined-str-std-format'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out the proposal branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build products
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/rust

      - name: Preserve candidates and stage them on current main
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1

          tar -cf /tmp/combined-str-format-candidates.tar \
            core/lib/src/std/foundation/string.hal \
            core/lib/src/std/format.hal \
            core/lib/src/std/format \
            core/lib/src/std/work/report.hal \
            core/lib/test/std/foundation/string_test.hal \
            core/lib/test/std/work_report_renderer_test.hal \
            core/rust/tests/string_to_fixed.rs

          rm -rf /tmp/combined-str-format-candidates
          mkdir -p /tmp/combined-str-format-candidates
          tar -xf /tmp/combined-str-format-candidates.tar \
            -C /tmp/combined-str-format-candidates

          git config user.name "hara-agent"
          git config user.email "hara-agent@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          tar -xf /tmp/combined-str-format-candidates.tar
          rm -f \
            core/lib/src/std/work/report/plain.hal \
            core/lib/src/std/work/report/terminal.hal

      - name: Build current-main candidate tools
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          cargo build --quiet \
            --manifest-path core/rust/Cargo.toml \
            --bin hara \
            --bin hara-test

      - name: Candidate-evaluate and focused-test every HAL change
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          HARA="$PWD/core/rust/target/debug/hara"
          HARA_TEST="$PWD/core/rust/target/debug/hara-test"
          CANDIDATE=/tmp/combined-str-format-candidates

          "$HARA" --project core --offline stdin \
            < "$CANDIDATE/core/lib/src/std/foundation/string.hal"
          "$HARA_TEST" \
            --root "$PWD/core" \
            "$PWD/core/lib/test/std/foundation/string_test.hal"

          for source in \
            core/lib/src/std/format/common.hal \
            core/lib/src/std/format/table.hal \
            core/lib/src/std/format/report.hal \
            core/lib/src/std/format/terminal.hal \
            core/lib/src/std/format.hal \
            core/lib/src/std/work/report.hal
          do
            "$HARA" --project core --offline stdin \
              < "$CANDIDATE/$source"
          done
          "$HARA_TEST" \
            --root "$PWD/core" \
            "$PWD/core/lib/test/std/work_report_renderer_test.hal"

      - name: Reapply candidates as final writes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          git reset --hard origin/main
          tar -xf /tmp/combined-str-format-candidates.tar
          rm -f \
            core/lib/src/std/work/report/plain.hal \
            core/lib/src/std/work/report/terminal.hal

      - name: Repair Rust to-fixed parity and work evidence
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path

          numeric_path = Path("core/rust/src/numeric.rs")
          numeric = numeric_path.read_text()
          if "pub(crate) fn format_fixed" not in numeric:
              marker = "fn float_value(value: &Value) -> Result<f64, String> {"
              if marker not in numeric:
                  raise SystemExit("numeric float_value insertion marker not found")
              helper = """pub(crate) fn format_fixed(
              value: &Value,
              precision: usize,
          ) -> Result<String, String> {
              let number = float_value(value)?;
              Ok(format!("{number:.precision$}"))
          }

          """
              numeric = numeric.replace(marker, helper + marker, 1)
              numeric_path.write_text(numeric)

          core_path = Path("core/rust/src/core.rs")
          core = core_path.read_text()
          if "numeric::format_fixed" not in core:
              pattern = re.compile(
                  r'        "str/to-fixed" => \{\n.*?\n'
                  r'        \}\n'
                  r'        "str/replace" => \{',
                  re.DOTALL,
              )
              replacement = """        "str/to-fixed" => {
              if values.len() != 2 || !numeric::is_numeric_value(&values[0]) {
                  return Err("str/to-fixed expects a number and precision".into());
              }
              let precision = numeric::to_i64_exact(&values[1])
                  .map_err(|_| "str/to-fixed expects a number and precision".to_string())?;
              if !(0..=100).contains(&precision) {
                  return Err(
                      "str/to-fixed precision must be in the range 0..100".into(),
                  );
              }
              Ok(Value::String(numeric::format_fixed(
                  &values[0],
                  precision as usize,
              )?))
          }
          "str/replace" => {"""
              core, count = pattern.subn(replacement, core, count=1)
              if count != 1:
                  raise SystemExit(
                      f"expected one str/to-fixed block, replaced {count}"
                  )
              core_path.write_text(core)

          parity_path = Path("core/spec/std-work-task-parity.edn")
          parity = parity_path.read_text()
          replacements = {
              "std.work.report.plain/table-lines":
                  "std.format.table/table-lines",
              "std.work.report.plain/event-lines":
                  "std.work.report/event-lines",
              "std.work.report.terminal/observer":
                  "std.work.report/observer",
              "std.work.report.terminal/replay!":
                  "std.work.report/replay!",
              "std.work.report.plain/render":
                  "std.format.report/report",
              "std.work.report.terminal/render":
                  "std.format.terminal/render",
          }
          for old, new in replacements.items():
              if old not in parity:
                  raise SystemExit(f"missing parity evidence marker: {old}")
              parity = parity.replace(old, new)
          parity_path.write_text(parity)
          PY

      - name: Synchronize Rust HAL snapshots
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Rebuild latest native tools
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          cargo build --quiet \
            --manifest-path core/rust/Cargo.toml \
            --bin hara \
            --bin hara-test

      - name: Fresh-run and focused-test every written HAL change
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          HARA="$PWD/core/rust/target/debug/hara"
          HARA_TEST="$PWD/core/rust/target/debug/hara-test"

          "$HARA" --project core --offline run \
            core/lib/src/std/foundation/string.hal
          "$HARA_TEST" \
            --root "$PWD/core" \
            "$PWD/core/lib/test/std/foundation/string_test.hal"

          for source in \
            core/lib/src/std/format/common.hal \
            core/lib/src/std/format/table.hal \
            core/lib/src/std/format/report.hal \
            core/lib/src/std/format/terminal.hal \
            core/lib/src/std/format.hal \
            core/lib/src/std/work/report.hal
          do
            "$HARA" --project core --offline run "$source"
          done
          "$HARA_TEST" \
            --root "$PWD/core" \
            "$PWD/core/lib/test/std/work_report_renderer_test.hal"

      - name: Validate hard cuts and public surface
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          test ! -e core/lib/src/std/work/report/plain.hal
          test ! -e core/lib/src/std/work/report/terminal.hal
          test ! -e core/rust/hal-src/std/work/report/plain.hal
          test ! -e core/rust/hal-src/std/work/report/terminal.hal
          ! rg -n \
            'std\.work\.report\.(plain|terminal)|terminal-observer|std\.lib\.format' \
            core/lib/src core/spec core/rust/hal-src \
            core/rust/standard-library.namespaces
          ! rg -n \
            '^\s*\(defn[- ]+\s*(joinl|truncate|lines|single-line|filter-empty)\b' \
            core/lib/src/std/foundation/string.hal
          git diff --check

      - name: Run focused Rust numeric parity tests
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          cargo fmt --manifest-path core/rust/Cargo.toml --all
          cargo fmt --manifest-path core/rust/Cargo.toml --all -- --check
          cargo test --manifest-path core/rust/Cargo.toml \
            --test string_to_fixed

      - name: Run focused and broad library tests
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          ./scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation/string_test.hal \
            core/lib/test/std/work_report_renderer_test.hal
          ./scripts/runtime/run-lib-tests

      - name: Run the broader Rust suite
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          cargo test --manifest-path core/rust/Cargo.toml
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Commit verified sources
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/combined-str-format-workflow.log) 2>&1
          git add -A
          git diff --cached --check
          git commit -m "Expand portable strings and layer report formatting"
          git push --force origin HEAD:${{ github.head_ref }}

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-str-format-workflow-${{ github.run_id }}
          path: /tmp/combined-str-format-workflow.log
          if-no-files-found: error
