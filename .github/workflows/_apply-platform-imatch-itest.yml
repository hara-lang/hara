name: Apply platform protocol hard cut

on:
  push:
    branches:
      - agent/platform-imatch-itest-hard-cut-497-498

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded source migration
        run: python3 scripts/runtime/apply-platform-imatch-itest-hard-cut
      - name: Commit the reviewable hard cut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make IMatch platform-owned and remove ITest runtime family"
          git push
