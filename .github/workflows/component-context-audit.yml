name: Component/context hard-cut audit

on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject retired component/context namespaces
        run: python3 scripts/runtime/check-component-context-hard-cut
