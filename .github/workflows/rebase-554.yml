name: Rebase #554 on canonical migration substrate

on:
  push:
    branches:
      - agent/554-external-clojure-mappings
    paths:
      - '.github/workflows/rebase-554.yml'
  pull_request:
    branches:
      - agent/524-code-migrate-substrate
    paths:
      - '.github/workflows/rebase-554.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/554-external-clojure-mappings
          fetch-depth: 0
      - name: Rebase the stack layer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            agent/524-code-migrate-substrate \
            agent/554-external-clojure-mappings
          git rebase origin/agent/524-code-migrate-substrate
          git push --force-with-lease \
            origin HEAD:agent/554-external-clojure-mappings
