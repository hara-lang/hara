name: Repair merged interpreter observation ownership

on:
  push:
    branches:
      - agent/fix-interpreter-observation-main

permissions:
  contents: write

concurrency:
  group: agent-fix-interpreter-observation-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-interpreter-observation-main
          fetch-depth: 0

      - name: Configure Git and rebase onto main
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Move session ownership into hara-wasm
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/runtime/refactor-interpreter-observation-session.py')
          script = script_path.read_text()

          wrong = "key.as_str() == Some(name)"
          right = "key.as_str() == name"
          if script.count(wrong) != 1:
              raise SystemExit('interpreter observation keyword comparison seam changed')
          script = script.replace(wrong, right, 1)

          old_dependency = 'hara-wasm = { path = "..", default-features = false }'
          new_dependency = '''hara-wasm = { path = "..", default-features = false, features = ["bytecode-vm"] }

          [patch."https://github.com/hara-lang/hara.git"]
          hara-abi = { path = "../abi" }'''
          if script.count(old_dependency) != 1:
              raise SystemExit('interpreter observation raw dependency seam changed')
          script_path.write_text(script.replace(old_dependency, new_dependency, 1))

          raw_path = Path('core/rust/interpreter-observation-raw/src/lib.rs')
          raw = raw_path.read_text()
          old_promise = '(Coroutine/await (promise/new))'
          new_promise = '(Coroutine/await (promise/new (fn [resolve reject] nil)))'
          if raw.count(old_promise) != 1:
              raise SystemExit('interpreter observation pending-promise fixture seam changed')
          raw = raw.replace(old_promise, new_promise, 1)

          old_drop = 'assert!(matches!(field(&history, "dropped"), Some(Value::Number(value)) if value > 0));'
          new_drop = 'assert_eq!(field(&history, "dropped"), Some(Value::Number(0)));'
          if raw.count(old_drop) != 1:
              raise SystemExit('interpreter observation arithmetic-retention fixture seam changed')
          raw_path.write_text(raw.replace(old_drop, new_drop, 1))
          PY
          python3 scripts/runtime/refactor-interpreter-observation-session.py
          rm scripts/runtime/refactor-interpreter-observation-session.py
          rm .github/workflows/agent-interpreter-observation-session.yml

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Format interpreter observation sources
        run: |
          rustfmt --edition 2021 \
            core/rust/src/fiber/coroutine/observation.rs \
            core/rust/src/interpreter_observation.rs
          rustfmt --edition 2021 --config skip_children=true \
            core/rust/interpreter-observation-raw/src/lib.rs

      - name: Test live evaluator and runtime-owned session
        run: |
          cargo test --manifest-path core/rust/Cargo.toml \
            core::fiber::coroutine --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            interpreter_observation --lib
          cargo test --manifest-path \
            core/rust/interpreter-observation-raw/Cargo.toml

      - name: Verify native and browser feature sets
        run: |
          cargo test --manifest-path core/rust/Cargo.toml --all-features
          cargo check --manifest-path core/rust/Cargo.toml \
            --all-features --target wasm32-unknown-unknown
          cargo check --manifest-path \
            core/rust/interpreter-observation-raw/Cargo.toml \
            --target wasm32-unknown-unknown
          bash scripts/runtime/build-interpreter-observation-wasm

      - name: Commit verified repair
        run: |
          git add -A
          git commit -m "code.vm: integrate runtime-owned interpreter observation"
          git push --force-with-lease origin HEAD:agent/fix-interpreter-observation-main
