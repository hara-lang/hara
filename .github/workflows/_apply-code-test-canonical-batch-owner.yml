name: Apply canonical code.test graph ownership

on:
  push:
    branches:
      - agent/code-test-canonical-batch-498

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the reviewed canonical graph source
        run: git fetch origin agent/code-test-canonical-work-498
      - name: Apply canonical graph ownership
        run: |
          if [[ -f scripts/runtime/apply-code-test-canonical-batch-owner ]]; then
            python3 -m py_compile scripts/runtime/apply-code-test-canonical-batch-owner
            python3 scripts/runtime/apply-code-test-canonical-batch-owner
          else
            echo "Canonical graph ownership is already applied."
          fi
      - name: Validate source ownership and mirrors
        run: |
          git diff --check
          python3 scripts/runtime/check-code-test-work-events
          diff -u core/lib/src/code/test.hal core/rust/hal-src/code/test.hal
          diff -u core/lib/src/code/test/work.hal core/rust/hal-src/code/test/work.hal
          grep -q '(def +runner-work+ (fact-batch-work))' core/lib/src/code/test.hal
          grep -q 'code.test/fact-cancel' core/lib/src/code/test.hal
          grep -q '(def run test/run)' core/lib/src/code/test/work.hal
          ! grep -q '(defn run-selected' core/lib/src/code/test.hal
      - name: Commit the reviewable canonical cut
        run: |
          if git diff --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make the fact-batch graph the sole code.test runtime"
          git push
