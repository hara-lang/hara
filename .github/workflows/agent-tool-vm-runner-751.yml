name: Verify and publish read-only tool.vm providers

on:
  pull_request:
    branches:
      - agent/tool-vm-materialization-base-751

permissions:
  contents: write

concurrency:
  group: agent-tool-vm-materialization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/tool-vm-readonly-product-751'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out product branch
        uses: actions/checkout@v4
        with:
          ref: agent/tool-vm-readonly-product-751
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout hara-benchmarks
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark corpus at the differential fixture path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn \
            "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - name: Materialize exact implementation files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/f6129a91d056703bb09a0b28b7bae8f76ca99706" \
            > /tmp/tool-vm-blob.json
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/tool-vm-blob.json").read_text())
          if value.get("encoding") != "base64":
              raise SystemExit("tool.vm implementation blob is not base64")
          Path("/tmp/tool-vm-impl.tar.gz").write_bytes(
              base64.b64decode(value["content"], validate=False)
          )
          PY
          printf '%s  %s\n' \
            'ebbb167c190de205394ace26755f5f78e21673da0659bd49a9a2735521c902ee' \
            '/tmp/tool-vm-impl.tar.gz' | sha256sum --check -
          tar --extract --gzip --file /tmp/tool-vm-impl.tar.gz --directory .

      - name: Fix focused Truffle test map typing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("core/java/src/test/java/hara/truffle/ToolVmLibraryTest.java")
          source = path.read_text()
          source, count = re.subn(
              r"\b([A-Za-z_][A-Za-z0-9_]*)\.getOrDefault\(",
              r"((Map) \1).getOrDefault(",
              source,
          )
          if count == 0:
              print(source)
              raise SystemExit("ToolVmLibraryTest getOrDefault seam changed")
          path.write_text(source)
          print(f"Updated {count} getOrDefault call(s) with raw-map test casts.")
          PY

      - name: Install the Rust provider namespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("core/rust/src/runtime/runtime.rs")
          source = runtime.read_text()
          needle = '        let work_native = namespace_registry.find_or_create("work.native");\n'
          provider = (
              '        let vm_provider = namespace_registry.find_or_create("tool.vm.provider");\n'
              '        for (name, value) in core::vm_tool_provider_values() {\n'
              '            vm_provider.intern_with_origin(\n'
              '                name,\n'
              '                value,\n'
              '                kernel::VarOrigin::RuntimePrimitive,\n'
              '            );\n'
              '        }\n'
          )
          if source.count(needle) != 1:
              raise SystemExit("runtime provider installation seam changed")
          runtime.write_text(source.replace(needle, provider + needle, 1))
          PY

      - name: Remove temporary materialization files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-tool-vm-readonly-751.yml
          rm .github/workflows/agent-tool-vm-runner-751.yml
          rm -f .github/tool-vm-materialize-trigger

      - name: Format and validate Rust
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 core/rust/src/core/vm_tool.rs
          cargo test --manifest-path core/rust/Cargo.toml vm_tool_tests --lib
          cargo test --manifest-path core/rust/vm-runtime/Cargo.toml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Validate the Truffle provider
        working-directory: core
        shell: bash
        run: mvn -B -Ptruffle -Dtest=ToolVmLibraryTest test --file java/pom.xml

      - name: Validate the public Hara facade
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/runtime/run-lib-tests \
            core/lib/test/tool/vm_test.hal \
            core/lib/test/tool/vm_provider_test.hal

      - name: Remove external fixture checkouts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hara-specs-registry hara-benchmarks
          rm -f "$GITHUB_WORKSPACE/../hara-specs-registry"
          rm -f "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - name: Verify bounded product diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"
          allowed='^(.github/workflows/agent-tool-vm-(readonly|runner)-751\.yml|core/lib/src/tool/vm\.hal|core/lib/src/tool/vm/(halc|hbc)\.hal|core/lib/test/tool/vm_provider_test\.hal|core/rust/src/core\.rs|core/rust/src/core/vm_tool\.rs|core/rust/src/runtime/runtime\.rs|core/java/src/main/java/hara/truffle/ToolVmLibrary\.java|core/java/src/main/java/hara/truffle/ToolVmLibraryProvider\.java|core/java/src/main/resources/META-INF/services/hara\.truffle\.HaraLibraryProvider|core/java/src/main/resources/META-INF/native-image/org\.hara/hara\.lang/(reflect-config|resource-config)\.json|core/java/src/test/java/hara/truffle/ToolVmLibraryTest\.java)$'
          unexpected=0
          while IFS= read -r path; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "Unexpected changed path: $path" >&2
              unexpected=1
            fi
          done < <(git diff --name-only "$BASE_SHA")
          test "$unexpected" -eq 0
          test "$(grep -c 'vm_tool_provider_values' core/rust/src/runtime/runtime.rs)" -eq 1
          grep -Fqx 'hara.truffle.ToolVmLibraryProvider' \
            core/java/src/main/resources/META-INF/services/hara.truffle.HaraLibraryProvider
          if grep -R --exclude-dir=.git -n 'std.native.Vm' \
            core/lib core/rust/src core/java/src/main; then
            echo 'Unexpected std.native.Vm surface' >&2
            exit 1
          fi
          test ! -e core/lib/src/tool/vm/provider.hal
          test ! -e .github/workflows/agent-tool-vm-readonly-751.yml
          test ! -e .github/workflows/agent-tool-vm-runner-751.yml
          test ! -e .github/tool-vm-materialize-trigger
          git status --short

      - name: Publish the verified implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "Materialize read-only tool.vm providers (#751)"
          git push --force-with-lease origin HEAD:agent/tool-vm-readonly-product-751
