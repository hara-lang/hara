name: Apply code.test work-context convergence

on:
  push:
    branches:
      - agent/platform-imatch-itest-hard-cut-497-498

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove protocol-shaped test runtime replacements
        run: |
          if [[ -f scripts/runtime/apply-code-test-work-context ]]; then
            python3 scripts/runtime/apply-code-test-work-context
          else
            echo "code.test work-context convergence already applied."
          fi
      - name: Validate generated source shape
        run: |
          git diff --check
          if [[ -x scripts/runtime/check-reserved-namespace-sources ]]; then
            scripts/runtime/check-reserved-namespace-sources
          fi
          diff -u core/lib/src/code/test.hal core/rust/hal-src/code/test.hal
          diff -u core/lib/src/code/test/work.hal core/rust/hal-src/code/test/work.hal
      - name: Commit the reviewable source cut
        run: |
          if git diff --quiet; then
            echo "No source changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use std.work observation and context in code.test"
          git push
