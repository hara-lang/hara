name: Retired stdlib follow-up validation

on:
  push:
    branches:
      - codex/remove-retired-stdlib-modules
    paths:
      - .github/workflows/retired-stdlib-followup.yml

permissions:
  contents: write

concurrency:
  group: retired-stdlib-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/remove-retired-stdlib-modules
          fetch-depth: 0

      - name: Make local form predicates explicit omissions
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          replacements = {
              Path("core/lib/src/std/block/navigation.hal"): (
                  "[std.foundation :refer :all]",
                  "[std.foundation :refer :all :exclude [form?]]",
              ),
              Path("core/lib/src/code/vm/source.hal"): (
                  "(:config {:override [resolve]})",
                  "(:config {:override [resolve form?]})",
              ),
          }
          for path, (old, new) in replacements.items():
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              path.write_text(source.replace(old, new, 1))

          Path(".github/workflows/retired-stdlib-followup.yml").unlink()
          PYCODE

      - name: Synchronize Rust HAL mirror
        run: python3 scripts/runtime/sync-rust-hal-src

      - name: Audit source and mirrors before artifact regeneration
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py --skip-hbx

      - name: Commit namespace omissions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve Foundation form predicate namespace collisions"
          git push origin HEAD:codex/remove-retired-stdlib-modules

      - name: Regenerate embedded Foundation artifact
        run: >-
          cargo run --quiet
          --manifest-path core/rust/Cargo.toml
          --features bytecode-vm
          --bin hara-foundation-artifact -- generate

      - name: Commit Foundation artifact
        run: |
          if git diff --quiet -- core/rust/assets/std.foundation.hbx; then
            echo "Foundation artifact is already current"
          else
            git add core/rust/assets/std.foundation.hbx
            git commit -m "Regenerate embedded Foundation artifact"
            git push origin HEAD:codex/remove-retired-stdlib-modules
          fi

      - name: Run hard-cut audit
        run: python3 scripts/runtime/retired_stdlib_hard_cut.py

      - name: Check Rust HAL mirror
        run: python3 scripts/runtime/sync-rust-hal-src --check

      - name: Test Rust result compatibility
        run: >-
          cargo test --manifest-path core/rust/Cargo.toml
          test_result_compatibility_tests -- --nocapture

      - name: Run focused HAL tests
        run: |
          bash scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal
