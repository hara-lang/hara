name: Java instrumentation contracts validation

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Java instrumentation · {0} · {1}', github.event.client_payload.ref, github.event.client_payload.request_id)
      || format('Java instrumentation · {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
      - testing
      - 'instrumentation-*'
    paths:
      - 'core/java/src/main/java/hara/truffle/InstrumentationException.java'
      - 'core/java/src/main/java/hara/truffle/InstrumentationHub.java'
      - 'core/java/src/main/java/hara/truffle/InstrumentationModel.java'
      - 'core/java/src/main/java/hara/truffle/NativeInstrumentation.java'
      - 'core/java/src/main/java/hara/truffle/SessionKernel.java'
      - 'core/java/src/test/java/hara/truffle/InstrumentationHubTest.java'
      - 'core/java/src/test/java/hara/truffle/InstrumentationModelTest.java'
      - 'core/java/src/test/java/hara/truffle/SessionInstrumentationTest.java'
      - 'core/java/src/test/java/hara/truffle/SessionKernelTest.java'
      - '.github/workflows/instrumentation-java.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/java/src/main/java/hara/truffle/InstrumentationException.java'
      - 'core/java/src/main/java/hara/truffle/InstrumentationHub.java'
      - 'core/java/src/main/java/hara/truffle/InstrumentationModel.java'
      - 'core/java/src/main/java/hara/truffle/NativeInstrumentation.java'
      - 'core/java/src/main/java/hara/truffle/SessionKernel.java'
      - 'core/java/src/test/java/hara/truffle/InstrumentationHubTest.java'
      - 'core/java/src/test/java/hara/truffle/InstrumentationModelTest.java'
      - 'core/java/src/test/java/hara/truffle/SessionInstrumentationTest.java'
      - 'core/java/src/test/java/hara/truffle/SessionKernelTest.java'
      - '.github/workflows/instrumentation-java.yml'
  repository_dispatch:
    types: [hara-instrumentation-java]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-instrumentation-${{ github.event.client_payload.request_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Check out specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Test Java instrumentation contracts and lifecycle
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -Dtest=InstrumentationModelTest,InstrumentationHubTest,SessionInstrumentationTest
          test

      - name: Preserve ordinary SessionKernel behavior
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -Dtest=SessionKernelTest
          test

      - name: Reject execution binding and guest authority in tranche 5A
        run: |
          production=(
            core/java/src/main/java/hara/truffle/InstrumentationException.java
            core/java/src/main/java/hara/truffle/InstrumentationHub.java
            core/java/src/main/java/hara/truffle/InstrumentationModel.java
            core/java/src/main/java/hara/truffle/NativeInstrumentation.java
          )
          if grep -nE \
            'com\.oracle\.truffle\.api\.instrumentation|ExecutionEvent(Node|Listener)|EventBinding|SourceSectionFilter|HbcMachine' \
            "${production[@]}"; then
            echo 'Java instrumentation contracts must not bind execution in tranche 5A' >&2
            exit 1
          fi
          if grep -R -nE \
            'Instrumentation/current|std\.native\.Instrumentation|instrumentationCurrent[[:space:]]*\(' \
            core/java/src/main/java/hara/truffle; then
            echo 'Java instrumentation must not expose ambient guest authority' >&2
            exit 1
          fi
          if grep -nE \
            'implements[[:space:]]+Serializable|Object(Output|Input)Stream|com\.fasterxml|gson' \
            "${production[@]}"; then
            echo 'Native instrumentation authority must remain outside portable serialization' >&2
            exit 1
          fi
          if grep -nE 'NativeInstrumentation|InstrumentationHub' \
            core/java/src/main/java/hara/truffle/Sandbox*.java \
            core/java/src/main/java/hara/truffle/InProcessSandboxProvider.java; then
            echo 'Sandbox providers must not acquire trusted instrumentation authority' >&2
            exit 1
          fi

      - name: Enforce bounded Java instrumentation modules
        run: |
          test "$(wc -l < core/java/src/main/java/hara/truffle/InstrumentationException.java)" -lt 100
          test "$(wc -l < core/java/src/main/java/hara/truffle/InstrumentationModel.java)" -lt 500
          test "$(wc -l < core/java/src/main/java/hara/truffle/InstrumentationHub.java)" -lt 650
          test "$(wc -l < core/java/src/main/java/hara/truffle/NativeInstrumentation.java)" -lt 300
          test "$(wc -l < core/java/src/test/java/hara/truffle/InstrumentationModelTest.java)" -lt 180
          test "$(wc -l < core/java/src/test/java/hara/truffle/InstrumentationHubTest.java)" -lt 350
          test "$(wc -l < core/java/src/test/java/hara/truffle/SessionInstrumentationTest.java)" -lt 250

      - name: Check patch whitespace
        run: git diff --check

  report-connector-event:
    if: ${{ always() && github.event_name == 'repository_dispatch' }}
    needs: contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report connector event completion
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.contracts.result }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          EVENT: ${{ github.event.client_payload.event }}
          REF: ${{ github.event.client_payload.ref }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          WORKFLOW: instrumentation-java.yml
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.notice('No issue was supplied for connector completion reporting.');
              return;
            }
            const clean = (value, limit = 200) => String(value || '')
              .replace(/[\r\n`]/g, '')
              .slice(0, limit);
            const requestId = clean(process.env.REQUEST_ID);
            const event = clean(process.env.EVENT);
            if (!requestId || !event) {
              core.warning('Connector completion payload is missing request identity.');
              return;
            }
            const result = clean(process.env.RESULT || 'unknown', 40);
            const ref = clean(process.env.REF);
            const actor = clean(process.env.ACTOR);
            const workflow = clean(process.env.WORKFLOW);
            const sourceUrl = String(process.env.SOURCE_URL || '').startsWith('https://github.com/')
              ? process.env.SOURCE_URL
              : '';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const marker = `<!-- hara-connector-completion:${requestId}:${event} -->`;
            const icon = result === 'success' ? '✅' : result === 'cancelled' ? '⚪' : '❌';
            const lines = [
              marker,
              `### ${icon} Connector event completed`,
              '',
              `- Event: \`${event}\``,
              `- Ref: \`${ref}\``,
              `- Workflow: \`${workflow}\``,
              `- Result: **${result}**`,
              `- Actor: \`${actor}\``,
              `- Run: ${runUrl}`,
            ];
            if (sourceUrl) lines.push(`- Source request: ${sourceUrl}`);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }
