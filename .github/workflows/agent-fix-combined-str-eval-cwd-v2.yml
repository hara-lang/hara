name: Apply combined string evaluation working directory fix

on:
  push:
    branches:
      - agent/complete-combined-str-format

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Diagnose and apply isolated HAL working directory fix'
    runs-on: ubuntu-latest

    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply regex workflow substitutions
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/combined-str-format-workflow-fix.log) 2>&1
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/agent-complete-combined-str-format.yml')
          text = path.read_text()

          substitutions = [
              (
                  r'cat "\$@" \| "\$HARA" --offline stdin',
                  'cat "$@" | (cd /tmp && "$HARA" --offline stdin)',
              ),
              (
                  r'"\$HARA" --offline run core/lib/src/std/foundation/string\.hal',
                  '(cd /tmp && "$HARA" --offline run "$GITHUB_WORKSPACE/core/lib/src/std/foundation/string.hal")',
              ),
              (
                  r'"\$HARA" --offline run "\$source"',
                  '(cd /tmp && "$HARA" --offline run "$GITHUB_WORKSPACE/$source")',
              ),
          ]

          for pattern, replacement in substitutions:
              text, count = re.subn(pattern, replacement, text, count=1)
              print(f'{pattern}: {count}')
              if count != 1:
                  raise SystemExit(f'expected one workflow marker for {pattern}')

          path.write_text(text)
          PY

          rm -f \
            .github/workflows/agent-fix-combined-str-eval-cwd.yml \
            .github/workflows/agent-fix-combined-str-eval-cwd-v2.yml
          git config user.name "hara-agent"
          git config user.email "hara-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Run format validation outside project discovery"
          git push origin HEAD:agent/complete-combined-str-format

      - name: Upload workflow-fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-str-format-workflow-fix-${{ github.run_id }}
          path: /tmp/combined-str-format-workflow-fix.log
          if-no-files-found: error
