name: Validate generic persistent source analyser

on:
  push:
    branches:
      - agent/restore-generic-hara-analyzer

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-generic-hara-analyzer
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format the analyser files
        run: |
          rustfmt --edition 2021 \
            core/rust/src/bin/hara-code-analyzer.rs \
            core/rust/src/bin/hara-code-analyzer/json.rs \
            core/rust/src/source_analyzer.rs \
            core/rust/src/source_analyzer/runtime.rs \
            core/rust/src/source_analyzer/protocol.rs \
            core/rust/src/source_analyzer/shape.rs \
            core/rust/src/source_analyzer/tree.rs \
            core/rust/src/source_analyzer/tests.rs
          git diff --check

      - name: Test persistent analyser protocol
        run: |
          cargo test \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-code-analyzer

      - name: Check the analyser target
        run: |
          cargo check \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-code-analyzer

      - name: Publish formatter corrections
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            core/rust/src/bin/hara-code-analyzer.rs \
            core/rust/src/bin/hara-code-analyzer/json.rs \
            core/rust/src/source_analyzer.rs \
            core/rust/src/source_analyzer/runtime.rs \
            core/rust/src/source_analyzer/protocol.rs \
            core/rust/src/source_analyzer/shape.rs \
            core/rust/src/source_analyzer/tree.rs \
            core/rust/src/source_analyzer/tests.rs
          git commit -m "Format the generic source analyser (#697)"
          git push origin HEAD:agent/restore-generic-hara-analyzer
