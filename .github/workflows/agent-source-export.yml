name: Agent source export

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-source-export.yml

permissions:
  contents: write

concurrency:
  group: agent-runtime-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-runtime-closeout:
    if: github.event.pull_request.head.ref == 'agent/runtime-closeout-575-493'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the isolated runtime branch
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-closeout-575-493
          fetch-depth: 0

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Detect whether closeout is already committed
        id: pending
        shell: bash
        run: |
          if grep -Fq 'if source.is_none() && standard_library_namespace(&module.resource)' core/rust/src/vm/bundle.rs; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            echo 'Runtime closeout patch is already present.'
          fi

      - name: Set up Rust
        if: steps.pending.outputs.apply == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply guarded closeout patches
        if: steps.pending.outputs.apply == 'true'
        run: |
          python3 scripts/runtime/apply-runtime-closeout.py
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          rustfmt --edition 2021 \
            core/rust/src/vm/bundle.rs \
            core/rust/src/vm/compiler/functions.rs \
            core/rust/src/vm/execution_tests.rs
          git diff --check
          git diff --stat

      - name: Run mutable-field closure regression
        if: steps.pending.outputs.apply == 'true'
        run: cargo test --manifest-path core/rust/Cargo.toml 'vm::execution_tests::defmutable_forms_use_reference_identity_and_settable_fields' --lib -- --nocapture

      - name: Run the complete Rust bytecode bundle suite
        if: steps.pending.outputs.apply == 'true'
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --manifest-path core/rust/Cargo.toml 'vm::bundle::tests::' --lib -- --nocapture

      - name: Regenerate and verify the canonical embedded HBX artifact
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          cp core/rust/assets/std.foundation.hbx "$RUNNER_TEMP/std.foundation.hbx.before"
          cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- generate
          if cmp -s "$RUNNER_TEMP/std.foundation.hbx.before" core/rust/assets/std.foundation.hbx; then
            echo 'Canonical HBX bytes are unchanged.'
          else
            echo 'Canonical HBX bytes changed and will be committed.'
          fi
          cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- check

      - name: Run retired-standard-library and substrate hard-cut audits
        if: steps.pending.outputs.apply == 'true'
        run: |
          python3 scripts/runtime/retired_stdlib_hard_cut_test.py
          python3 scripts/runtime/retired_stdlib_hard_cut.py
          bash scripts/audit-std-substrate-hard-cut.sh

      - name: Run focused direct-source HAL validation
        if: steps.pending.outputs.apply == 'true'
        run: |
          ./scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal \
            core/lib/test/tool/cli/template_test.hal \
            core/lib/test/code/deploy/cli_test.hal

      - name: Run focused embedded project validation
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_task_redirection_test.hal
          do
            cargo run --quiet --manifest-path core/rust/Cargo.toml --bin hara -- \
              --project core --offline project test "$test_file"
          done

      - name: Commit validated code and restore the export workflow
        if: steps.pending.outputs.apply == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            core/rust/src/vm/compiler/functions.rs \
            core/rust/src/vm/execution_tests.rs \
            core/lib/src/std/dom/common.hal \
            core/rust/hal-src/std/dom/common.hal \
            core/rust/hal-src/code/test/base/executive.hal
          git diff --cached --quiet || git commit -m 'fix(vm): collect mutable field special-form operands'

          git add \
            core/lib/src/tool/cli/template.hal \
            core/rust/hal-src/tool/cli/template.hal \
            core/lib/test/tool/cli/template_test.hal
          git diff --cached --quiet || git commit -m 'fix(tool.cli): keep handler provenance runtime-local'

          git add core/rust/src/vm/bundle.rs core/rust/assets/std.foundation.hbx
          git diff --cached --quiet || git commit -m 'fix(runtime): load source-free standard-library bundles'

          cat > .github/workflows/agent-source-export.yml <<'YAML'
          name: Agent source export

          on:
            pull_request:
              branches: [main]
              paths:
                - .github/workflows/agent-source-export.yml

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - name: Check out branch
                  uses: actions/checkout@v4
                - name: Package source without Git metadata
                  run: tar --exclude=.git -czf /tmp/hara-source.tar.gz .
                - name: Upload source archive
                  uses: actions/upload-artifact@v4
                  with:
                    name: hara-source
                    path: /tmp/hara-source.tar.gz
                    if-no-files-found: error
                    retention-days: 1
          YAML
          sed -i 's/^          //' .github/workflows/agent-source-export.yml
          git rm scripts/runtime/apply-runtime-closeout.py
          git add .github/workflows/agent-source-export.yml
          git commit -m 'chore(ci): restore agent source export workflow'

          git push origin HEAD:agent/runtime-closeout-575-493
