name: Agent source export

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Package source without Git metadata
        run: tar --exclude=.git -czf /tmp/hara-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hara-source
          path: /tmp/hara-source.tar.gz
          if-no-files-found: error
          retention-days: 1
