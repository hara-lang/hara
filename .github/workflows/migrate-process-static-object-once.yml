name: Migrate Process static object once

on:
  push:
    branches:
      - agent/foundation-script-ci-enforcement
    paths:
      - '.github/workflows/migrate-process-static-object-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Migrate canonical HAL process calls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "os/spawn": "Process/spawn",
              "os/process?": "Process/instance?",
              "os/process-alive?": "Process/alive?",
              "os/process-write": "Process/write",
              "os/process-close-input": "Process/close-input",
              "os/process-stdout": "Process/stdout",
              "os/process-stderr": "Process/stderr",
              "os/process-wait": "Process/wait",
              "os/process-kill": "Process/kill",
          }
          expected = {
              "core/lib/src/code/deploy/runtime.hal",
              "core/lib/src/lang/runtime/basic/transport_node.hal",
              "core/lib/src/lang/runtime/basic/type_oneshot.hal",
              "core/lib/src/lang/runtime/basic/type_verify.hal",
              "core/lib/src/lib/docker.hal",
              "core/lib/src/tool/cli/identity.hal",
              "core/lib/src/tool/runtime.hal",
              "core/lib/integration/hara/runtime_smoke.hal",
          }
          changed = set()
          count = 0
          for root in (Path("core/lib/src"), Path("core/lib/integration")):
              for path in sorted(root.rglob("*.hal")):
                  source = path.read_text(encoding="utf-8")
                  migrated = source
                  for legacy, replacement in replacements.items():
                      occurrences = migrated.count(legacy)
                      if occurrences:
                          count += occurrences
                          migrated = migrated.replace(legacy, replacement)
                  if migrated != source:
                      path.write_text(migrated, encoding="utf-8")
                      changed.add(path.as_posix())
          if changed != expected:
              missing = sorted(expected - changed)
              unexpected = sorted(changed - expected)
              raise SystemExit(
                  f"unexpected Process migration scope: missing={missing}, unexpected={unexpected}"
              )
          print(f"migrated {count} legacy process calls across {len(changed)} canonical files")
          PY
      - name: Verify canonical calls and regenerate Rust HAL mirrors
        run: |
          python3 scripts/runtime/process_static_object_audit_test.py
          python3 scripts/runtime/process_static_object_audit.py
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
      - name: Commit the generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/lib/src core/lib/integration core/rust/hal-src
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "Use canonical Process static object in HAL sources"
          git push origin HEAD:agent/foundation-script-ci-enforcement
