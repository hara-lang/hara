name: Apply direct code.test platform matcher binding

on:
  push:
    branches:
      - agent/platform-imatch-itest-hard-cut-497-498

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply matcher facade removal
        run: |
          if [[ -f scripts/runtime/apply-code-test-direct-imatch ]]; then
            python3 scripts/runtime/apply-code-test-direct-imatch
          else
            echo "Direct platform matcher binding already applied."
          fi
      - name: Validate generated source shape
        run: |
          git diff --check
          if [[ -x scripts/runtime/check-reserved-namespace-sources ]]; then
            scripts/runtime/check-reserved-namespace-sources
          fi
          diff -u core/lib/src/code/test.hal core/rust/hal-src/code/test.hal
      - name: Commit the source hard cut
        run: |
          if git diff --quiet; then
            echo "No matcher facade changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bind code.test directly to platform IMatch"
          git push
