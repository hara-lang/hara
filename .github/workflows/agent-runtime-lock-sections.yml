name: Bootstrap runtime-keyed lock reconciliation

on:
  push:
    branches:
      - agent/runtime-lock-sections

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/runtime-lock-sections

      - name: Check out specification corpus
        run: |
          git clone --depth 1 https://github.com/hara-lang/hara-specs-registry.git ../hara-specs-registry
          ln -s ../hara-specs-registry hara-specs-registry

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply runtime lock implementation
        run: python3 .github/agent/runtime-lock-sections.py

      - name: Format changed Rust sources
        run: rustfmt --edition 2021 core/rust/src/project.rs core/rust/src/project/tests.rs

      - name: Check patch hygiene
        run: git diff --check

      - name: Test runtime-aware project and lock model
        run: cargo test --manifest-path core/rust/Cargo.toml project::tests --lib

      - name: Commit validated implementation
        run: |
          rm hara-specs-registry
          rm -rf ../hara-specs-registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-runtime-lock-sections.yml
          git rm -f .github/agent/runtime-lock-sections.py
          git add -A
          git commit -m "Add runtime-keyed project lock sections"
          git push origin HEAD:agent/runtime-lock-sections
