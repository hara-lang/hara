name: Agent source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-source-snapshot.yml'
      - 'core/java/**'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package checkout
        run: |
          tar \
            --exclude=.git \
            --exclude='**/target' \
            --exclude='**/node_modules' \
            -czf /tmp/hara-source.tgz .

      - name: Upload checkout
        uses: actions/upload-artifact@v4
        with:
          name: hara-source-snapshot
          path: /tmp/hara-source.tgz
          if-no-files-found: error
