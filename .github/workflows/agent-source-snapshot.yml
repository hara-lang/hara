-        (receiver, arguments) -> ((INth<?>) receiver)
-            .nth(HaraNumericConversions.toLong(arguments[0], "INth/nth")));
+        (receiver, arguments) -> {
+          long index = HaraNumericConversions.toLong(arguments[0], "INth/nth");
+          try {
