name: Apply Truffle tuple regression repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-source-snapshot.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebase onto current main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Apply focused repair
        run: |
          cat > /tmp/truffle-tuple-repair.patch <<'PATCH'
--- a/core/java/src/main/java/hara/truffle/FoundationFallbackDefinitions.java
+++ b/core/java/src/main/java/hara/truffle/FoundationFallbackDefinitions.java
@@ -25,15 +25,7 @@
 final class FoundationFallbackDefinitions {
