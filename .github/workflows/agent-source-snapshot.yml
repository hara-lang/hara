name: Agent source snapshot

on:
  push:
    branches:
      - agent/persistent-defstruct-defmutable
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package implementation workspace
        run: |
          tar \
            --exclude=.git \
            --exclude=core/target \
            --exclude=core/java/target \
            --exclude=target \
            -czf hara-source.tar.gz \
            AGENTS.md Cargo.toml Makefile core scripts
      - uses: actions/upload-artifact@v4
        with:
          name: hara-source
          path: hara-source.tar.gz
          if-no-files-found: error
          retention-days: 1
