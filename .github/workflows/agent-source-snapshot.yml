name: Agent source snapshot

on:
  push:
    branches:
      - agent/666-foundation-shape-materialization
    paths:
      - .github/workflows/agent-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Archive working tree
        run: tar --exclude=.git -czf /tmp/hara-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hara-source-${{ github.sha }}
          path: /tmp/hara-source.tar.gz
          if-no-files-found: error
          retention-days: 1
