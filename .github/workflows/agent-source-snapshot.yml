name: Agent source snapshot

on:
  push:
    branches:
      - agent/suffixless-arbitrary-precision-numerics

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Package source tree
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./target' \
            --exclude='./node_modules' \
            --exclude='./.gradle' \
            --exclude='./.m2' \
            -czf /tmp/hara-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: hara-source-snapshot
          path: /tmp/hara-source.tar.gz
          retention-days: 1
          if-no-files-found: error
