PATCH
          git apply --check /tmp/truffle-tuple-repair.patch
          git apply /tmp/truffle-tuple-repair.patch
          rm .github/workflows/agent-source-snapshot.yml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run focused Truffle regression slice
        run: >-
          mvn -B -f core/java/pom.xml -Ptruffle
          -DfailIfNoTests=true
          -Dtest=hara.kernel.builtin.BuiltinStructTest,hara.truffle.FoundationFallbackDemandTest,hara.truffle.HaraLanguageTest
          test

      - name: Commit verified repair
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add core/java/src/main/java/hara/truffle/FoundationFallbackDefinitions.java core/java/src/main/java/hara/truffle/HaraJavaAdapters.java core/java/src/test/java/hara/truffle/FoundationFallbackDemandTest.java core/java/src/test/java/hara/truffle/HaraLanguageTest.java .github/workflows/agent-source-snapshot.yml
          git commit -m "truffle: restore compact tuple protocol semantics"
          git push --force-with-lease origin HEAD:${{ github.head_ref }}
