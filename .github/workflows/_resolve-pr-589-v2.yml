name: Resolve PR 589 conflicts

on:
  push:
    branches:
      - codex/remove-retired-stdlib-modules
    paths:
      - .github/workflows/_resolve-pr-589-v2.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-retired-stdlib-modules
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        shell: bash
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - uses: dtolnay/rust-toolchain@stable

      - name: Merge current main and resolve conflicts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime/resolve_pr_589.py
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Regenerate and verify the Foundation HBX
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm \
            --bin hara-foundation-artifact -- generate
          cargo run --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm \
            --bin hara-foundation-artifact -- check

      - name: Run retired-module audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/runtime/retired_stdlib_hard_cut_test.py
          python3 scripts/runtime/retired_stdlib_hard_cut.py
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Run focused Rust and HAL tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path core/rust/Cargo.toml --bin hara cli::project
          bash scripts/runtime/run-lib-tests \
            core/lib/test/std/foundation_walk_test.hal \
            core/lib/test/std/foundation_test_primitives_test.hal \
            core/lib/test/std/work_receipt_test.hal \
            core/lib/test/std/work_report_renderer_test.hal \
            core/lib/test/std/work_task_redirection_test.hal

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run focused Java direct-result compatibility test
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          mvn -q --file java/pom.xml \
            '-Dtest=HaraNativeTestRunnerTest#classifiesDirectFoundationResultVectors' test

      - name: Commit and push the reconciled merge
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          python3 scripts/runtime/sync-rust-hal-src --check
          python3 scripts/runtime/retired_stdlib_hard_cut.py
          git add -A -- . ':(exclude)hara-specs-registry'
          git status --short --untracked-files=no
          git commit -m "Merge main and resolve retired stdlib conflicts"
          git push origin HEAD:codex/remove-retired-stdlib-modules
