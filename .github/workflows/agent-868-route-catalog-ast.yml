name: Route catalog AST traversal

on:
  push:
    branches:
      - agent/868-schema-catalog-identity
    paths:
      - .github/workflows/agent-868-route-catalog-ast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/868-schema-catalog-identity
          fetch-depth: 0
      - name: Route catalog traversal through normalized AST helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              text = path.read_text()
              if text.count(before) != 1:
                  raise SystemExit(f"expected one match in {path}: {before!r}")
              path.write_text(text.replace(before, after, 1))

          graph = Path("core/lib/src/std/typed/catalog/graph.hal")
          replace_once(
              graph,
              "            [std.typed.catalog.codec]\n            [std.typed.schema]))",
              "            [std.typed.catalog.codec]\n            [std.typed.catalog.ast]))")
          replace_once(
              graph,
              "(std.typed.schema/reference-names (:schema/ast entry))",
              "(std.typed.catalog.ast/reference-names (:schema/ast entry))")

          base = Path("core/lib/src/std/typed/catalog/base.hal")
          replace_once(
              base,
              "  (:require [std.typed.catalog.codec]\n",
              "  (:require [std.typed.catalog.codec]\n            [std.typed.catalog.ast]\n")
          replace_once(
              base,
              "(std.typed.schema/resolve-recursive\n      (:schema/ast entry)\n      (:catalog/registry catalog))",
              "(std.typed.catalog.ast/resolve\n      (:schema/ast entry)\n      (:catalog/registry catalog))")

          bootstrap = Path("core/rust/bootstrap.namespaces")
          replace_once(
              bootstrap,
              "std.typed.catalog.codec\nstd.typed.catalog.base\n",
              "std.typed.catalog.codec\nstd.typed.catalog.ast\nstd.typed.catalog.base\n")

          standard = Path("core/rust/standard-library.namespaces")
          replace_once(
              standard,
              "std.typed.catalog\nstd.typed.catalog.base\n",
              "std.typed.catalog\nstd.typed.catalog.ast\nstd.typed.catalog.base\n")

          workflow = Path(".github/workflows/std-typed-schema.yml")
          replace_once(
              workflow,
              "            core/lib/src/std/typed/catalog/codec.hal \\\n            core/lib/src/std/typed/catalog/base.hal \\\n",
              "            core/lib/src/std/typed/catalog/codec.hal \\\n            core/lib/src/std/typed/catalog/ast.hal \\\n            core/lib/src/std/typed/catalog/base.hal \\\n")

          audit = Path("scripts/audit-std-typed-boundary.sh")
          replace_once(
              audit,
              "  'core/lib/src/std/typed/catalog.hal'\n  'core/lib/src/std/typed/catalog/base.hal'\n",
              "  'core/lib/src/std/typed/catalog.hal'\n  'core/lib/src/std/typed/catalog/ast.hal'\n  'core/lib/src/std/typed/catalog/base.hal'\n")
          replace_once(
              audit,
              "  'core/lib/src/std/typed/catalog.hal'\n  'core/lib/src/std/typed/catalog/base.hal'\n",
              "  'core/lib/src/std/typed/catalog.hal'\n  'core/lib/src/std/typed/catalog/ast.hal'\n  'core/lib/src/std/typed/catalog/base.hal'\n")
          replace_once(
              audit,
              "  std.typed.catalog\n  std.typed.catalog.base\n",
              "  std.typed.catalog\n  std.typed.catalog.ast\n  std.typed.catalog.base\n")
          replace_once(
              audit,
              "  std.typed.catalog.codec\n  std.typed.catalog.base\n",
              "  std.typed.catalog.codec\n  std.typed.catalog.ast\n  std.typed.catalog.base\n")
          replace_once(
              audit,
              "codec_line=$(inventory_line core/rust/bootstrap.namespaces std.typed.catalog.codec)\nbase_line=",
              "codec_line=$(inventory_line core/rust/bootstrap.namespaces std.typed.catalog.codec)\nast_line=$(inventory_line core/rust/bootstrap.namespaces std.typed.catalog.ast)\nbase_line=")
          replace_once(
              audit,
              "if [[ -n \"$codec_line\" && -n \"$base_line\" && \"$codec_line\" -ge \"$base_line\" ]]; then\n  echo 'std.typed.catalog.codec must bootstrap before std.typed.catalog.base.' >&2\n  failed=1\nfi\n",
              "if [[ -n \"$codec_line\" && -n \"$ast_line\" && \"$codec_line\" -ge \"$ast_line\" ]]; then\n  echo 'std.typed.catalog.codec must bootstrap before std.typed.catalog.ast.' >&2\n  failed=1\nfi\nif [[ -n \"$ast_line\" && -n \"$base_line\" && \"$ast_line\" -ge \"$base_line\" ]]; then\n  echo 'std.typed.catalog.ast must bootstrap before std.typed.catalog.base.' >&2\n  failed=1\nfi\n")

          Path(".github/workflows/agent-868-route-catalog-ast.yml").unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            core/lib/src/std/typed/catalog/base.hal \
            core/lib/src/std/typed/catalog/graph.hal \
            core/rust/bootstrap.namespaces \
            core/rust/standard-library.namespaces \
            scripts/audit-std-typed-boundary.sh \
            .github/workflows/std-typed-schema.yml \
            .github/workflows/agent-868-route-catalog-ast.yml
          git diff --cached --check
          git commit -m "Route catalog traversal through normalized AST"
          git push origin HEAD:agent/868-schema-catalog-identity
