name: Canonicalize code.migrate task names

on:
  push:
    branches:
      - agent/524-code-migrate-substrate
    paths:
      - '.github/workflows/repair-code-migrate-task-names.yml'
      - '.github/agent-patches/866-canonical-task-names.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/repair-code-migrate-task-names.yml'
      - '.github/agent-patches/866-canonical-task-names.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/524-code-migrate-substrate
          fetch-depth: 0

      - name: Apply canonical task identifiers
        run: |
          set -euo pipefail
          python3 .github/agent-patches/866-canonical-task-names.py
          test ! -e .github/agent-patches/866-canonical-task-names.py
          grep -q '(def task-id :code.migrate/clojure)' \
            core/lib/src/code/migrate/clojure.hal
          grep -q '(def task-id :code.migrate/project)' \
            core/lib/src/code/migrate/project.hal
          ! grep -q 'def clojure-to-hal' \
            core/lib/src/code/migrate/project.hal
          grep -q 'code.migrate.clojure|code.migrate.project' \
            core/spec/std/private-definition-namespace-survey.tsv
          git diff --check -- \
            core/lib/src/code/migrate/clojure.hal \
            core/lib/src/code/migrate/project.hal \
            core/lib/test/code/migrate_clojure_test.hal \
            core/lib/test/code/migrate_project_test.hal \
            core/spec/std/private-definition-namespace-survey.tsv

      - name: Commit the product-only rename
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m 'refactor(code.migrate): canonicalize migrated task names'
          git fetch origin agent/524-code-migrate-substrate
          git rebase origin/agent/524-code-migrate-substrate
          git push origin HEAD:agent/524-code-migrate-substrate
