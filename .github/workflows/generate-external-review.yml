name: Generate #554 reviewed external evidence

on:
  push:
    branches:
      - agent/554-external-clojure-mappings
    paths:
      - '.github/workflows/generate-external-review.yml'
      - '.github/agent-patches/874-generate-external.py'
  pull_request:
    branches:
      - agent/524-code-migrate-substrate
    paths:
      - '.github/workflows/generate-external-review.yml'
      - '.github/agent-patches/874-generate-external.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'hara-lang/hara'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/554-external-clojure-mappings
          fetch-depth: 0

      - name: Generate reviewed route evidence from the HAL catalog
        run: |
          set -euo pipefail
          python3 .github/agent-patches/874-generate-external.py
          test ! -e .github/agent-patches/874-generate-external.py
          grep -q ':route/count 649' core/spec/code-migrate/external-baa75a.edn
          grep -q ':name/count 83' core/spec/code-migrate/external-baa75a.edn
          grep -q ':pending/count 0' core/spec/code-migrate/external-baa75a.edn
          (
            cd core/spec/code-migrate
            sha256sum --check external-baa75a.sha256
          )
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          git diff --check -- \
            core/lib/src/code/migrate/external.hal \
            core/lib/test/code/migrate_external_test.hal \
            core/spec/code-migrate/external-baa75a.edn \
            core/spec/code-migrate/external-baa75a.md \
            core/spec/code-migrate/external-baa75a.sha256 \
            core/rust/standard-library.namespaces

      - name: Commit product evidence only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m 'docs(code.migrate): record complete external route review'
          git fetch origin agent/554-external-clojure-mappings
          git rebase origin/agent/554-external-clojure-mappings
          git push origin HEAD:agent/554-external-clojure-mappings
