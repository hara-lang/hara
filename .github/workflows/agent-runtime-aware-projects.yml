name: Bootstrap runtime-aware projects

on:
  push:
    branches:
      - agent/runtime-aware-projects

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/runtime-aware-projects

      - name: Check out specification corpus
        run: git clone --depth 1 https://github.com/hara-lang/hara-specs-registry.git ../hara-specs-registry

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Adapt patch harness to current portable loader
        run: python3 .github/agent/runtime-aware-projects-prepare.py

      - name: Apply runtime-profile implementation
        run: python3 .github/agent/runtime-aware-projects.py

      - name: Synchronize portable HAL mirror
        run: |
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check

      - name: Format changed Rust sources
        run: rustfmt --edition 2021 core/rust/src/project.rs core/rust/src/project/tests.rs

      - name: Check patch hygiene
        run: git diff --check

      - name: Test native project loader
        run: cargo test --manifest-path core/rust/Cargo.toml project::tests --lib

      - name: Test JVM project loader
        run: mvn -B -Ptruffle -Dtest=HaraProjectTest test --file core/java/pom.xml

      - name: Test portable project normalization
        run: bash scripts/runtime/run-lib-tests core/lib/test/tool/project_test.hal

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-runtime-aware-projects.yml
          git rm .github/agent/runtime-aware-projects.py
          git rm .github/agent/runtime-aware-projects-prepare.py
          git add -A
          git commit -m "Add runtime-aware project profile normalization"
          git push origin HEAD:agent/runtime-aware-projects
